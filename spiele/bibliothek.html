<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bibliothek</title>
<link rel="stylesheet" href="rahmen/seite.css">
<style>
/* Bibliothek (Spec docs/superpowers/specs/2026-11-15-bibliothek-design.md): Räume › Regale › Bücher.
   Links die Räume als Türbögen (im Bogen das flache Bild des Raums), rechts der gewählte Raum: seine Wand im Himmelston
   seiner Welt-Palette, darin die Regale untereinander, auf jedem Brett die Bücher mit Foto und Titelschild. Ein gelesenes
   Buch trägt ein Lesezeichen in Tinte, das oben herausschaut. Keine Zählung, keine Reihenfolge, nichts gesperrt; Regale
   und Räume ohne fertiges Buch fehlen. Schatten nur an drückbaren Teilen (Tür, Buch), bedienung.md 4.1.
   Diese Seite liest den Lernstand nur. */
body { -webkit-user-select: none; user-select: none; }
.bib {
  position: absolute; inset: var(--ls-leiste-hoehe) 0 0 0;
  display: grid; grid-template-columns: 24rem 1fr; gap: 3.2rem;
  padding: 0.8rem 0 0 4.4rem;
}

/* --- Räume: Türbögen ------------------------------------------------------------------------------ */
.raeume { display: flex; flex-direction: column; gap: 3.2rem; padding: 1.6rem 0 4rem; overflow-y: auto; scrollbar-width: none; }
.raeume::-webkit-scrollbar { display: none; }
.tuer {
  display: flex; flex-direction: column; align-items: center; gap: 1.2rem; padding: 0;
  background: none; border: 0; color: var(--ls-tinte); font: inherit; cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.tuer > * { pointer-events: none; }
.tuer .bogen {
  display: block; width: 20rem; height: 24rem; overflow: hidden;
  border: var(--ls-kontur) solid var(--ls-tinte); border-radius: 10rem 10rem var(--ls-radius-klein) var(--ls-radius-klein);
  background: var(--ls-papier); box-shadow: var(--ls-schatten);
}
.tuer .bogen svg { display: block; width: 100%; height: 100%; }
.tuer b { font-size: 2.6rem; line-height: 1.1; text-align: center; }
.tuer:active .bogen { transform: translateY(0.3rem); box-shadow: var(--ls-schatten-unten); }
.tuer:focus-visible .bogen { outline: 0.5rem solid var(--ls-tinte); outline-offset: 0.6rem; }
/* Gewählt: der Sonnenring um den Bogen (bewertet nichts) */
.tuer[aria-selected="true"] .bogen { outline: 0.8rem solid var(--ls-sonne); outline-offset: 0; box-shadow: 0 0 0 1.1rem var(--ls-tinte); }

/* --- Der Raum ------------------------------------------------------------------------------------- */
.raum {
  min-height: 0; display: flex; flex-direction: column;
  background: color-mix(in srgb, var(--wand, var(--ls-nebel)) 55%, var(--ls-nebel));
  border-radius: var(--ls-radius-gross) 0 0 0;
}
.raum h1 { flex: none; margin: 0; padding: 3.2rem 4rem 0; font-size: 5.2rem; line-height: 1.1; }
.regale { flex: 1; min-height: 0; overflow-y: auto; padding: 1.6rem 4rem 6rem; scrollbar-width: none; }
.regale::-webkit-scrollbar { display: none; }
.regal + .regal { margin-top: 4rem; }
.regal h2 { margin: 0; font-size: 3.4rem; line-height: 1.1; }
/* Jede Reihe steht auf einem eigenen Brett (Ahorn mit Kante, Tinte-Linien) wie im Regal „Was ich schon kann“: feste
   Reihenhöhe, das Brett wiederholt sich mit jeder Reihe; Reihen brechen um, der Raum rollt senkrecht. */
.brett {
  --buch: 22rem;
  --reihe: 28.4rem;
  --boden: 25.2rem;
  display: grid; grid-template-columns: repeat(auto-fill, var(--buch)); grid-auto-rows: var(--reihe); column-gap: 3.2rem;
  padding: 0 2.4rem;
  background: repeating-linear-gradient(to bottom,
    transparent 0 var(--boden),
    var(--ls-tinte) var(--boden) calc(var(--boden) + 0.3rem),
    var(--ls-ahorn) calc(var(--boden) + 0.3rem) calc(var(--boden) + 1.6rem),
    var(--ls-kante) calc(var(--boden) + 1.6rem) calc(var(--reihe) - 0.3rem),
    var(--ls-tinte) calc(var(--reihe) - 0.3rem) var(--reihe));
  border-radius: 0.8rem;
}

/* --- Ein Buch: Foto mit Titelschild, steht auf dem Brett ------------------------------------------- */
.buch {
  display: block; position: relative; text-decoration: none; align-self: start; margin-top: calc(var(--boden) - var(--buch) - 0.6rem);
  width: var(--buch); height: var(--buch); padding: 0;
  border: var(--ls-kontur) solid var(--ls-tinte); border-radius: 1.2rem; overflow: visible;
  background: var(--ls-papier); box-shadow: var(--ls-schatten); color: var(--ls-tinte); font: inherit; cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.buch > * { pointer-events: none; }
.buch .deckel { position: absolute; inset: 0; overflow: hidden; border-radius: 0.9rem; background: var(--toenung, var(--ls-papier)); }
.buch img { display: block; width: 100%; height: 100%; object-fit: cover; }
/* Ohne Foto (Lerngeschichte): Tönung des Fachs mit dem Fachsymbol */
.buch .zeichen { position: absolute; left: 50%; top: 38%; width: 8rem; height: 8rem; transform: translate(-50%, -50%);
  background: var(--ls-tinte); -webkit-mask: var(--bild) center / contain no-repeat; mask: var(--bild) center / contain no-repeat; }
.buch .schild {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 1rem 1rem 1.1rem;
  background: var(--ls-papier); border-top: var(--ls-kontur) solid var(--ls-tinte);
  font-size: 2.2rem; font-weight: 700; line-height: 1.12; text-align: left; hyphens: manual;
}
.buch .schild span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
/* Gelesen: ein Lesezeichen in Tinte schaut oben aus dem Buch (mit Kerbe am Ende) */
.buch .band {
  position: absolute; top: -1.6rem; right: 2.4rem; width: 2.8rem; height: 8.4rem; z-index: 1;
  background: var(--ls-tinte); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);
}
.buch:active { transform: translateY(0.3rem); box-shadow: var(--ls-schatten-unten); }
.buch:focus-visible { outline: 0.5rem solid var(--ls-tinte); outline-offset: 0.6rem; }

.leer { margin: 4rem; font-size: 3.2rem; color: var(--ls-tinte-weich); }

/* Schmale Bildschirme (4:3): Türen etwas kleiner */
@media (max-aspect-ratio: 4/3) {
  .bib { grid-template-columns: 19rem 1fr; gap: 2.4rem; padding-left: 3rem; }
  .tuer .bogen { width: 16rem; height: 19.2rem; border-radius: 8rem 8rem var(--ls-radius-klein) var(--ls-radius-klein); }
  .brett { column-gap: 2.4rem; }
}
@media (prefers-reduced-motion: reduce) { .tuer:active .bogen, .buch:active { transform: none; } }
</style>
</head>
<body>
<ls-leiste id="leiste" spiel="ansichten" titel="Bibliothek"></ls-leiste>
<main class="bib" id="bib">
  <nav class="raeume" id="raeume" role="tablist" aria-label="Räume"></nav>
  <section class="raum" id="raum" role="tabpanel"></section>
</main>

<script type="module">
import { sperreTouch, protokoll, esc, linkKlick } from "./lernspiel.js";
import { ladeLernstand } from "./lernsteuerung.js";
import { sprich } from "./kern/stimme.js";
import { sageEinmal } from "./kern/sitzung.js";
import { FACH, FACH_SYMBOLE, bild } from "./rahmen/stil.js";
import "./rahmen/leiste.js";
import { bibliothekFuerKind, waehleRaum, buchHref, raumSvg, raumWand } from "./start/bibliothek.js";

start();

async function start() {
  sperreTouch();
  const leiste = document.getElementById("leiste");
  const raeumeFeld = document.getElementById("raeume"), raumFeld = document.getElementById("raum");
  let raeume;
  try {
    const [plan, index] = await Promise.all(["bibliothek.json", "geschichten/index.json"].map((d) => fetch(d).then((r) => r.json())));
    const stand = await ladeLernstand(null, new Date().toLocaleDateString("sv"));
    raeume = bibliothekFuerKind(plan, index?.geschichten ?? [], stand?.sachthemen?.geschichten ?? {});
  } catch (e) {
    protokoll("bibliothek: " + e);
    document.getElementById("bib").innerHTML = `<p class="leer">Die Bibliothek geht gerade nicht auf.</p>`;
    return;
  }
  await leiste.bereit();
  if (!raeume.length) { document.getElementById("bib").innerHTML = `<p class="leer">Hier stehen bald Bücher.</p>`; return; }

  const sage = (wort) => { if (leiste.ton && wort) sageEinmal(wort, () => sprich(wort)); };
  let aktiv = waehleRaum(raeume, new URLSearchParams(location.search).get("raum"));

  raeumeFeld.innerHTML = raeume.map((r) => `<button class="tuer" type="button" role="tab" data-raum="${esc(r.id)}" aria-controls="raum">`
    + `<span class="bogen">${raumSvg(r.bild)}</span><b>${esc(r.name)}</b></button>`).join("");
  const tueren = [...raeumeFeld.querySelectorAll(".tuer")];
  tueren.forEach((t) => t.addEventListener("click", () => {
    const r = raeume.find((x) => x.id === t.dataset.raum);
    sage(r.name);
    if (r === aktiv) return;
    aktiv = r;
    history.replaceState(null, "", `?raum=${encodeURIComponent(r.id)}`);
    zeige();
  }));

  // Titelbild je Buch: das erste Foto der Geschichte (titelbild hat Vorrang); ohne Foto die Tönung des Fachs.
  const deckel = new Map();
  await Promise.all(raeume.flatMap((r) => r.regale.flatMap((rg) => rg.buecher)).map(async (b) => {
    try {
      const g = await fetch(`geschichten/${encodeURIComponent(b.id)}/geschichte.json`).then((x) => x.json());
      const foto = typeof g.titelbild === "string" ? g.titelbild : g.seiten?.find((s) => typeof s.bild === "string")?.bild;
      deckel.set(b.id, foto ? `geschichten/${b.id}/${foto}` : null);
    } catch (e) { protokoll("bibliothek, Titelbild " + b.id + ": " + e); }
  }));

  function buchHtml(b, regal) {
    const foto = deckel.get(b.id);
    const fach = FACH[regal.fach];
    const innen = foto ? `<img src="${esc(foto)}" alt="" loading="lazy" decoding="async">`
      : FACH_SYMBOLE.has(regal.fach) ? `<i class="zeichen" style="--bild:${bild(`symbole/${regal.fach}.svg`)}"></i>` : "";
    const stil = !foto && fach ? ` style="--toenung:${fach.toenung}"` : "";
    return `<a class="buch" href="${buchHref(b.id, aktiv.id)}" data-titel="${esc(b.titel)}" aria-label="${esc(b.titel + (b.am ? ", gelesen" : ""))}"${stil}>`
      + `<span class="deckel">${innen}</span>${b.am ? `<span class="band" aria-hidden="true"></span>` : ""}`
      + `<span class="schild"><span>${esc(b.titel)}</span></span></a>`;
  }

  function zeige() {
    tueren.forEach((t) => t.setAttribute("aria-selected", String(t.dataset.raum === aktiv.id)));
    raumFeld.style.setProperty("--wand", raumWand(aktiv.bild));
    raumFeld.setAttribute("aria-label", aktiv.name);
    raumFeld.innerHTML = `<h1>${esc(aktiv.name)}</h1><div class="regale">`
      + aktiv.regale.map((rg) => `<section class="regal" data-regal="${esc(rg.id)}" aria-label="${esc(rg.name)}"><h2>${esc(rg.name)}</h2>`
        + `<div class="brett">${rg.buecher.map((b) => buchHtml(b, rg)).join("")}</div></section>`).join("")
      + `</div>`;
    raumFeld.querySelectorAll(".buch").forEach((a) => a.addEventListener("click", (e) => { sage(a.dataset.titel); linkKlick(e); }));
  }
  zeige();
}
</script>
</body>
</html>
