<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bibliothek</title>
<link rel="stylesheet" href="rahmen/seite.css">
<style>
/* Bibliothek, Reiter „Wissen“ (Spec docs/superpowers/specs/2026-11-15-bibliothek-design.md: Halle › Raum › Regal › Buch;
   Aussehen nach der Designsprache 2026-11-15, Spec 2026-11-15-designsprache-design.md §5.4).
   Halle: Titel und die Räume als Kacheln im Querformat mit ihrem Raumbild, darunter der Name; linksbündig, sie brechen
   in Reihen um (höchstens drei je Reihe). Grundmuster Wellen. Raum: Zurück und der Name groß (ohne Raumbild); darunter
   die Regale (Themen) durch eine dezente Linie getrennt, darin die Bücher als kleine Karten (Titelbild quadratisch wie die Fotos, darunter das Thema
   kräftig und der Buchtitel klein),
   die Reihen brechen um. Gelesen: ein
   Sonnenpunkt vor dem Titel. Grundmuster Blätter. Keine Zählung, keine Reihenfolge, kein „Weiterlesen“; gesperrt nur über die Bücher-Grenze der Eltern;
   Regale und Räume ohne fertiges Buch fehlen. Schatten nur an drückbaren Teilen. Diese Seite liest den Lernstand nur. */
body { -webkit-user-select: none; user-select: none; }
.bib {
  position: absolute; top: var(--ls-leiste-hoehe); bottom: 0; left: max(0rem, calc((100vw - 192rem) / 2)); width: min(100vw, 192rem);
  z-index: 1; overflow-y: auto; scrollbar-width: none; padding: 0 var(--ls-seite-rand) 8rem;
}
.bib::-webkit-scrollbar { display: none; }
.ui { font-family: var(--ls-schrift-oberflaeche); font-feature-settings: var(--ls-schrift-merkmale); letter-spacing: -0.01em; }

/* --- Halle ---------------------------------------------------------------------------------------- */
.bib-titel { margin: 1.4rem 0 4.4rem; font-size: 7.2rem; font-weight: 750; line-height: 1; letter-spacing: -0.035em; }
.halle { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4.8rem 4.4rem; }
.tuer {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2.2rem; padding: 0;
  background: none; border: 0; color: var(--ls-tinte); font: inherit; cursor: pointer; text-decoration: none;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.tuer > * { pointer-events: none; }
.bogen {
  display: block; overflow: hidden; background: var(--ls-papier);
  border: var(--ls-kontur) solid var(--ls-tinte); border-radius: var(--ls-radius-teil);
}
.bogen img, .bogen svg { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 62%; }
/* Raumfotos sind quadratisch; der Ausschnitt quer hält Köpfe und Dinge im oberen Drittel im Bild. */
.bogen img { object-position: center 40%; }
.halle .bogen { width: 100%; aspect-ratio: 3 / 2; box-shadow: var(--ls-schatten); }
.tuer b { font-size: 3.6rem; font-weight: 700; line-height: 1.1; }
.tuer:active .bogen { transform: translateY(0.3rem); box-shadow: var(--ls-schatten-unten); }
.tuer:focus-visible .bogen { outline: 1rem solid var(--ls-sonne); outline-offset: 0.6rem; }

/* --- Raum ----------------------------------------------------------------------------------------- */
.raum-kopf { display: flex; align-items: center; gap: 2.4rem; margin: 0 0 3.2rem -1.3rem; }
.raum-kopf h1 { margin: 0 0 0 0.4rem; font-size: 7.2rem; font-weight: 750; line-height: 1; letter-spacing: -0.035em; }
/* Themen (Regale) offen auf dem Grund, getrennt durch eine dezente Linie und Luft davor und danach. */
.regal + .regal { margin-top: 4.4rem; padding-top: 4rem; border-top: 0.25rem solid var(--ls-naht); }
.regal h2 { margin: 0 0 2.6rem; font-size: 3.6rem; font-weight: 700; line-height: 1.1; }
.ebenen { display: grid; grid-template-columns: repeat(auto-fill, minmax(21rem, 1fr)); gap: 3.2rem 2.6rem; }

/* --- Ein Buch: Karte mit Titelbild (quer), Titel darunter ----------------------------------------- */
.buch {
  display: flex; flex-direction: column; gap: 1.2rem; color: var(--ls-tinte); text-decoration: none; cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.buch > * { pointer-events: none; }
.buch .deckel { position: relative; display: block; aspect-ratio: 1; overflow: hidden; border: var(--ls-kontur) solid var(--ls-tinte);
  border-radius: var(--ls-radius-teil); background: var(--toenung, var(--ls-papier)); box-shadow: var(--ls-schatten); }
.buch img { display: block; width: 100%; height: 100%; object-fit: cover; }
/* Ohne Foto (Lerngeschichte ohne Bild): Tönung des Fachs mit dem Fachsymbol */
.buch .zeichen { position: absolute; inset: 0; margin: auto; width: 34%; height: 50%;
  background: var(--ls-tinte); -webkit-mask: var(--bild) center / contain no-repeat; mask: var(--bild) center / contain no-repeat; }
.buch .schild { display: flex; align-items: flex-start; gap: 0.9rem; line-height: 1.15; }
/* Oben das Thema (Tier oder Sache) kräftig, darunter klein und leise der Titel des Buches. */
.buch .worte { display: flex; flex-direction: column; gap: 0.4rem; min-width: 0; }
.buch .worte b { font-size: 2.1rem; font-weight: 650; }
.buch .titel { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  font-size: 1.7rem; font-weight: 500; color: var(--ls-tinte-weich); }
/* Gelesen: ein Sonnenpunkt vor dem Titel (bewertet nichts) */
.buch .gelesen-punkt { flex: none; width: 2.2rem; height: 2.2rem; margin-top: 0.05rem; border-radius: 50%; background: var(--ls-sonne);
  box-shadow: inset 0 0 0 0.75rem var(--ls-sonne), inset 0 0 0 3rem var(--ls-tinte); }
.buch.zu { cursor: default; }
.buch.zu .deckel { box-shadow: none; }
.buch:active .deckel { transform: translateY(0.3rem); box-shadow: var(--ls-schatten-unten); }
.buch.zu:active .deckel { transform: none; box-shadow: none; }
.buch:focus-visible .deckel { outline: 1rem solid var(--ls-sonne); outline-offset: 0.6rem; }

.leer { margin: 2rem 0; font-size: 4.5rem; color: var(--ls-tinte-weich); }

@media (max-aspect-ratio: 3/2) {
  .halle { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { .tuer:active .bogen, .buch:active .deckel { transform: none; } }
</style>
</head>
<body>
<ls-muster id="muster" art="wellen"></ls-muster>
<ls-kopf id="leiste" reiter="wissen" spiel="ansichten"></ls-kopf>
<main class="bib" id="bib"></main>

<script type="module">
import { sperreTouch, protokoll, esc, linkKlick } from "./lernspiel.js";
import { ladeLernstand } from "./lernsteuerung.js";
import { sprich } from "./kern/stimme.js";
import { sageEinmal } from "./kern/sitzung.js";
import { FACH, FACH_SYMBOLE, bild } from "./rahmen/stil.js";
import "./rahmen/kopf.js";
import "./rahmen/knopf.js";
import "./rahmen/muster.js";
import { bibliothekFuerKind, waehleRaum, buchHref, raumSvg } from "./start/bibliothek.js";
import { buecherLage } from "./rahmen/buecherzeit.js";

start();

async function start() {
  sperreTouch();
  const leiste = document.getElementById("leiste"), feld = document.getElementById("bib"), muster = document.getElementById("muster");
  let raeume;
  try {
    const [plan, index] = await Promise.all(["bibliothek.json", "geschichten/index.json"].map((d) => fetch(d).then((r) => r.json())));
    const stand = await ladeLernstand(null, new Date().toLocaleDateString("sv"));
    raeume = bibliothekFuerKind(plan, index?.geschichten ?? [], stand?.sachthemen?.geschichten ?? {});
  } catch (e) {
    protokoll("bibliothek: " + e);
    feld.innerHTML = `<p class="leer">Die Bibliothek geht gerade nicht auf.</p>`;
    return;
  }
  await leiste.bereit();
  // Bücher-Grenze der Eltern (Spec 2026-11-16-buecherzeit): ist heute kein Modus mehr frei, bleibt das Buch sichtbar,
  // ist aber nicht drückbar (ohne Schatten). Heute schon geöffnete Bücher bleiben frei.
  const zeit = await buecherLage();
  const frei = (id) => { const e = zeit.erlaubt(id); return e.vorlesen || e.selbst; };
  if (!raeume.length) { feld.innerHTML = `<p class="leer">Hier stehen bald Bücher.</p>`; return; }
  const sage = (wort) => { if (leiste.ton && wort) sageEinmal(wort, () => sprich(wort)); };

  // Titelbild je Buch: das erste Foto der Geschichte (titelbild hat Vorrang); ohne Foto die Tönung des Fachs.
  const deckel = new Map();
  await Promise.all(raeume.flatMap((r) => r.regale.flatMap((rg) => rg.buecher)).map(async (b) => {
    try {
      const g = await fetch(`geschichten/${encodeURIComponent(b.id)}/geschichte.json`).then((x) => x.json());
      // Sachbuch: die Seiten stehen in den Kapiteln (geschichten.md §2a)
      const seiten = Array.isArray(g.seiten) ? g.seiten : (g.kapitel ?? []).flatMap((k) => k.seiten ?? []);
      const foto = (typeof g.titelbild === "string" ? g.titelbild : typeof g.titelbild?.bild === "string" ? g.titelbild.bild : null)
        ?? seiten.find((s) => typeof s.bild === "string")?.bild;
      deckel.set(b.id, foto ? `geschichten/${b.id}/${foto}` : null);
    } catch (e) { protokoll("bibliothek, Titelbild " + b.id + ": " + e); }
  }));

  const bogenHtml = (r) => `<span class="bogen">${r.foto ? `<img src="${esc(r.foto)}" alt="" decoding="async">` : raumSvg(r.bild)}</span>`;

  function halle() {
    document.title = "Bibliothek";
    muster.setAttribute("art", "wellen");
    feld.innerHTML = `<h1 class="bib-titel ui">Bibliothek</h1><nav class="halle" aria-label="Räume">` + raeume.map((r) =>
      `<a class="tuer" href="?raum=${encodeURIComponent(r.id)}" data-raum="${esc(r.id)}">${bogenHtml(r)}<b class="ui">${esc(r.name)}</b></a>`).join("") + `</nav>`;
    feld.scrollTop = 0;
    feld.querySelectorAll(".tuer").forEach((t) => t.addEventListener("click", (e) => {
      e.preventDefault();
      const r = raeume.find((x) => x.id === t.dataset.raum);
      sage(r.name);
      history.pushState({ raum: r.id }, "", `?raum=${encodeURIComponent(r.id)}`);
      raum(r);
    }));
  }

  function buchHtml(b, regal, r) {
    const foto = deckel.get(b.id);
    const innen = foto ? `<img src="${esc(foto)}" alt="" loading="lazy" decoding="async">`
      : FACH_SYMBOLE.has(regal.fach) ? `<i class="zeichen" style="--bild:${bild(`symbole/${regal.fach}.svg`)}"></i>` : "";
    const ton = !foto && FACH[regal.fach] ? `--toenung:${FACH[regal.fach].toenung};` : "";
    const label = esc((b.thema ? b.thema + ": " : "") + b.titel + (b.am ? ", gelesen" : ""));
    const auf = frei(b.id);
    return (auf ? `<a class="buch" href="${buchHref(b.id, r.id)}" data-titel="${esc(b.titel)}" aria-label="${label}" style="${ton}">`
      : `<span class="buch zu" role="img" aria-label="${label}" style="${ton}">`)
      + `<span class="deckel">${innen}</span>`
      + `<span class="schild ui">${b.am ? `<span class="gelesen-punkt" aria-hidden="true"></span>` : ""}`
      + `<span class="worte">${b.thema ? `<b>${esc(b.thema)}</b>` : ""}<span class="titel">${esc(b.titel)}</span></span></span>`
      + (auf ? `</a>` : `</span>`);
  }

  function raum(r) {
    document.title = `${r.name} – Bibliothek`;
    muster.setAttribute("art", "blaetter");
    feld.innerHTML = `<section class="raum" aria-label="${esc(r.name)}">`
      + `<div class="raum-kopf"><ls-knopf id="zurueck" symbol="zurueck.svg" name="Alle Räume" groesse="seite"></ls-knopf><h1 class="ui">${esc(r.name)}</h1></div>`
      + `<div class="regale">` + r.regale.map((rg) => `<section class="regal" data-regal="${esc(rg.id)}" aria-label="${esc(rg.name)}"><h2 class="ui">${esc(rg.name)}</h2>`
        + `<div class="ebenen">${rg.buecher.map((b) => buchHtml(b, rg, r)).join("")}</div></section>`).join("") + `</div></section>`;
    feld.scrollTop = 0;
    feld.querySelector("#zurueck").addEventListener("click", () => {
      if (history.state?.raum) history.back();
      else { history.replaceState(null, "", location.pathname); halle(); }
    });
    feld.querySelectorAll("a.buch").forEach((a) => a.addEventListener("click", (e) => { sage(a.dataset.titel); linkKlick(e); }));
  }

  const zeige = () => { const r = waehleRaum(raeume, new URLSearchParams(location.search).get("raum")); r ? raum(r) : halle(); };
  addEventListener("popstate", zeige);
  zeige();
}
</script>
</body>
</html>
