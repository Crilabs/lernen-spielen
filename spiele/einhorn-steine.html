<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Einhorn-Steine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#3B2A6B;--nacht:#3B2A6B;--paper:#FFF8FC;--bg:#D8F3FF;--lila:#B59CFF;--rosa:#FF8ACB;--mint:#7FE8C8;--sonne:#FFD95A;
  --himmel1:#CDEBFF;--himmel2:#EAF7FF;--gras:#9EDB7E;--gras2:#7CC45E;--wasser:#7CC8F2;--wasser2:#5AAFE0;--stein:#D9D2E6;--stein2:#BDB3CF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--nacht:#F6EEFF;--paper:#2F2A5A;--bg:#1F1B45;--himmel1:#2B2766;--himmel2:#3C3780;--gras:#4E8A52;--gras2:#3E7243;--wasser:#2F6FA8;--wasser2:#245C8E}}
:root[data-theme="dark"]{--nacht:#F6EEFF;--paper:#2F2A5A;--bg:#1F1B45;--himmel1:#2B2766;--himmel2:#3C3780;--gras:#4E8A52;--gras2:#3E7243;--wasser:#2F6FA8;--wasser2:#245C8E}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Baloo 2","Comic Sans MS","Arial Rounded MT Bold",sans-serif;color:var(--nacht);background:var(--bg);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.app{position:fixed;left:0;right:0;top:0;height:100%;display:flex;flex-direction:column;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 6px) calc(env(safe-area-inset-right,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 8px) calc(env(safe-area-inset-left,0px) + 8px)}
/* ---------- Bühne: Bach mit zwei Ufern ---------- */
.stage{position:relative;flex:1;min-height:150px;width:100%;max-width:900px;margin:0 auto;border-radius:18px;overflow:hidden;
  background:linear-gradient(var(--himmel1),var(--himmel2) 58%);box-shadow:0 6px 0 rgba(59,42,107,.15)}
.wasser{position:absolute;left:0;right:0;bottom:0;height:30%;background:linear-gradient(var(--wasser),var(--wasser2))}
.wasser::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:rgba(255,255,255,.35)}
.ufer{position:absolute;bottom:0;width:13%;height:36%;background:linear-gradient(var(--gras),var(--gras2));border:3px solid var(--ink);border-bottom:0}
.ufer.l{left:-3px;border-radius:0 28px 0 0}.ufer.r{right:-3px;border-radius:28px 0 0 0}
.steine{position:absolute;left:13%;right:13%;bottom:17%;display:flex;align-items:flex-end;justify-content:center;gap:var(--lücke,10px);padding:0 6px}
.stein{border:3px solid var(--ink);background:linear-gradient(var(--stein),var(--stein2));color:#3B2A6B;font:800 var(--fs,24px)/1 "Baloo 2",sans-serif;
  padding:.32em .42em .2em;border-radius:46% 46% 38% 38% / 60% 60% 40% 40%;white-space:nowrap;box-shadow:0 5px 0 rgba(30,40,80,.25);
  transform-origin:50% 100%;animation:auftauchen .35s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes auftauchen{from{transform:translateY(40%) scale(.4);opacity:0}}
.stein.kippelt{animation:kippeln .7s ease-in-out}
@keyframes kippeln{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}45%{transform:rotate(8deg)}70%{transform:rotate(-6deg)}85%{transform:rotate(3deg)}}
.stein.kaputt{transform:rotate(-5deg) translateY(6px);background:linear-gradient(#E9E2F3,#C9BEDB)}
.stein.halb-l{border-radius:46% 12% 12% 38% / 60% 20% 20% 40%;margin-right:calc(-1 * var(--lücke,10px) + 2px)}
.stein.halb-r{border-radius:12% 46% 38% 12% / 20% 60% 40% 20%}
.riss{align-self:stretch;width:22px;margin:0 -2px;border:0;background:none;position:relative}
.riss::after{content:"";position:absolute;left:50%;top:15%;bottom:0;width:4px;transform:translateX(-50%);
  background:repeating-linear-gradient(var(--ink) 0 6px,transparent 6px 10px)}
.korrektur .stein.kaputt,.korrektur .riss{cursor:pointer;animation:hinweis 1.6s ease-in-out infinite}
@keyframes hinweis{50%{filter:brightness(1.12) drop-shadow(0 0 6px #fff)}}
.uni{position:absolute;left:0;top:0;width:var(--uw,100px);pointer-events:none;z-index:2;will-change:transform}
.uni svg{width:100%;height:auto;display:block;overflow:visible}
.uni svg *{stroke-linejoin:round;stroke-linecap:round}
.leg,.tail,.head,.body,.lid{transform-box:fill-box}
.leg{transform-origin:50% 0}
.tail{transform-origin:100% 20%;animation:wedel 2.4s ease-in-out infinite}
.lid{transform-origin:50% 50%;transform:scaleY(0);animation:blink 4.5s infinite}
@keyframes wedel{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
#fig{transform-box:fill-box;transform-origin:50% 100%}
.uni.freude #fig{animation:freude .6s cubic-bezier(.3,0,.4,1) 2}
@keyframes freude{0%,100%{transform:translateY(0)}12%{transform:translateY(0) scale(1.08,.9)}45%{transform:translateY(-40%) scale(.94,1.08)}78%{transform:translateY(0) scale(1.1,.88)}}
.uni.ratlos .head{transform-origin:20% 90%;animation:ratlos .9s ease-in-out}
@keyframes ratlos{30%{transform:rotate(-10deg)}60%{transform:rotate(8deg)}}
.splash{position:absolute;left:0;top:0;font-size:40px;opacity:0;pointer-events:none;z-index:3;transform:translate(-50%,-50%)}
.splash.on{animation:platsch .9s ease-out}
@keyframes platsch{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}25%{opacity:1;transform:translate(-50%,-70%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-90%) scale(1.4)}}
.corner{position:absolute;top:8px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,248,252,.88);font-size:21px;
  display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 3px 0 rgba(59,42,107,.2);z-index:4}
.corner.l{left:8px}.corner.r{right:8px}
/* Lupe zum Teilen eines Klebesteins */
.lupe{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(31,27,69,.35);padding:12px}
.lupe.on{display:flex}
.lupe .karte{background:var(--paper);border-radius:22px;padding:18px 12px 14px;box-shadow:0 8px 0 rgba(59,42,107,.25);max-width:100%}
.lupe .buchst{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;row-gap:8px}
.lupe .bst{font:800 clamp(28px,8vw,44px)/1.1 "Baloo 2",sans-serif;color:var(--nacht);padding:0 1px}
.lupe .spalt{width:clamp(18px,5vw,26px);border:0;border-radius:8px;background:transparent;position:relative}
.lupe .spalt::after{content:"";position:absolute;left:50%;bottom:4%;width:7px;height:7px;transform:translateX(-50%);background:rgba(59,42,107,.22);border-radius:50%}
.lupe .spalt:active{background:rgba(181,156,255,.3)}
.lupe .spalt.tipp::after{top:6%;bottom:6%;height:auto;border-radius:2px;background:repeating-linear-gradient(var(--rosa) 0 6px,transparent 6px 9px);width:4px;animation:hinweis 1.2s infinite}
.lupe .buchst.wackel{animation:kippeln .6s}
.lupe .zu{display:block;margin:12px auto 0;border:0;background:none;font:800 1rem "Baloo 2",sans-serif;color:var(--nacht);opacity:.7}
/* ---------- Unten: Vorbild, Eingabe, Weiter ---------- */
.vorbild{flex:none;max-width:900px;width:100%;margin:0 auto;text-align:center;font-weight:800;font-size:1.25rem;min-height:1.6em;opacity:0;transition:opacity .4s}
.vorbild.on{opacity:1}
.eingabe{flex:none;display:flex;gap:8px;width:100%;max-width:900px;margin:0 auto;align-items:center}
.feld{flex:1;min-width:0;font:800 26px "Baloo 2",sans-serif;color:var(--nacht);background:var(--paper);border:3px solid var(--lila);border-radius:18px;
  padding:10px 14px 6px;outline:none;user-select:text;-webkit-user-select:text}
.feld:focus{border-color:var(--rosa)}
.rund{flex:none;width:56px;height:56px;border-radius:50%;border:0;font-size:26px;background:var(--paper);box-shadow:0 4px 0 rgba(59,42,107,.22);color:var(--nacht)}
.rund.ok{background:var(--mint);box-shadow:0 4px 0 #4FBF9C;font-weight:800}
.rund:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(59,42,107,.22)}
.rund.wackel{animation:kippeln .5s}
.weiterzeile{flex:none;display:flex;justify-content:center;min-height:56px}
.hidden{display:none!important}
.btn{border:0;border-radius:999px;padding:14px 32px;font:800 1.4rem "Baloo 2",sans-serif;color:#fff;background:var(--rosa);box-shadow:0 6px 0 #D45A9E;text-decoration:none;display:inline-block}
.btn:disabled{opacity:.6}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #D45A9E}
.btn.mint{background:var(--mint);color:#3B2A6B;box-shadow:0 6px 0 #4FBF9C;font-size:1.1rem;padding:12px 24px}
.start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;
  background:var(--bg);background-image:radial-gradient(circle at 15% 20%,rgba(255,138,203,.35) 0 90px,transparent 90px),radial-gradient(circle at 85% 15%,rgba(255,217,90,.45) 0 60px,transparent 60px),radial-gradient(circle at 80% 85%,rgba(181,156,255,.45) 0 110px,transparent 110px),radial-gradient(circle at 10% 90%,rgba(127,232,200,.45) 0 70px,transparent 70px)}
.start.off{display:none}
.start .big{font-size:96px;line-height:1;animation:float 3s ease-in-out infinite}
.start h1{font-size:2.2rem;line-height:1.1}
.start p{font-size:1.15rem;font-weight:600;max-width:32ch}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.pause{position:fixed;inset:0;z-index:25;background:#1F1B45;display:none;overflow:hidden;opacity:0;transition:opacity .8s}
.pause.on{display:block}.pause.show{opacity:1}
.pause .pbg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(28px) brightness(.8)}
.pause img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kenburns 26s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.12) translateY(-2%)}}
.pweiter{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);opacity:.92}
.eltern{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 32px;user-select:text;-webkit-user-select:text}
.eltern h1{font-size:1.6rem}.eltern h2{font-size:1.2rem;margin:16px 0 4px}.eltern p{margin:6px 0;font-weight:600;max-width:60ch}
.eltern ul{list-style:none}.eltern li{background:var(--paper);border-radius:10px;padding:4px 10px;margin:4px 0;font-weight:800;max-width:60ch}
.eltern small{font-weight:600;opacity:.75}
@media (prefers-reduced-motion:reduce){.start .big,.tail,.pause img{animation:none}}
</style>
</head>
<body>

          <circle cx="212" cy="62" r="15" fill="#FF9ECF"/><circle cx="202" cy="84" r="15" fill="#B49CFF"/>

         </g>
         <ellipse cx="240" cy="82" rx="8" ry="10" fill="#3B2A6B"/><circle cx="243" cy="78" r="3" fill="#fff"/>
         <g class="lid"><ellipse cx="240" cy="82" rx="11" ry="13" fill="#fff"/><path d="M230 82 Q240 92 250 82" fill="none" stroke="#3B2A6B" stroke-width="4"/></g>

      </svg>
    </div>
    <div class="splash" id="splash">💦</div>
    <a class="corner l" href="index.html" aria-label="Alle Spiele">🏠</a>
    <button class="corner r" id="snd" aria-label="Ton">🔊</button>
    <div class="lupe" id="lupe"></div>
  </div>
  <div class="vorbild" id="vorbild"></div>

    <button type="button" class="rund" id="nochmal" aria-label="Noch mal hören">🔁</button>

      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Hier schreiben">

  <div class="big">🦄</div>
  <h1>Einhorn-Steine</h1>
  <p>Hör gut zu und schreib den Satz. Jedes Wort wird ein Stein im Bach – und das Einhorn hüpft darüber.</p>
  <button class="btn" id="go" disabled>Moment …</button>
  <a class="btn mint" href="index.html">🏠 Alle Spiele</a>

<script>
// ==AUSWERTUNG-START==  (reine Funktionen, ohne Browser; getestet in docs/tests/steine-auswertung-test.mjs)
// Bewertet werden nur die Wortgrenzen. Rechtschreibung, Lautschreibung, Groß/klein und Satzzeichen zählen nicht.
const AUSWERTUNG = (() => {
  const TOL_GRENZE = 2;        // so viele (vereinfachte) Laute darf ein Leerzeichen neben der erwarteten Wortgrenze liegen
  const UNSICHER_AB = 0.35;    // ab diesem Abstand (Anteil der Ziel-Laute) nur noch die Wortzahl zählen
  const UNBEWERTET_AB = 0.6;   // ab hier gar nicht bewerten („Hör noch mal hin“)
  const VOKALE = new Set(["a","e","i","o","u","ö","ü","A","O"]);
  const AEHNLICH = [["d","t"],["g","k"],["b","p"],["s","z"],["f","w"],["S","s"],["X","k"],["m","n"]];
  const EINZELN = {"ä":"e","y":"i","c":"k","q":"k","v":"f","ß":"s"};
  const BUCHSTABE = /[a-zäöüß]/;

  // Lautnormalisierung: macht aus einem Wort eine Folge vereinfachter Laute. Jeder Laut merkt sich,
  // an welcher Stelle der Eingabe er beginnt (s) und zu welchem Stück/Wort er gehört (p).
  function lautfolge(text, base, p){
    const L=[];
    for(let i=0;i<text.length;i++){ const ch=text[i].toLowerCase(); if(BUCHSTABE.test(ch)) L.push({ch, i:base+i}); }
    const at=j=>L[j]?L[j].ch:"";
    const out=[]; const push=(c,s)=>out.push({c,s,p});
    let k=0;
    while(k<L.length){
      const c=at(k), c2=c+at(k+1), c3=c2+at(k+2), s=L[k].i;
      if(c3==="sch"){ push("S",s); k+=3; continue; }
      if(k===0 && (c2==="sp"||c2==="st")){ push("S",s); push(c2[1],L[k+1].i); k+=2; continue; }   // „schpielt“ = „spielt“
      if(c2==="ch"){ push("X",s); k+=2; continue; }
      if(c2==="ck"){ push("k",s); k+=2; continue; }
      if(c2==="tz"){ push("z",s); k+=2; continue; }
      if(c2==="ph"){ push("f",s); k+=2; continue; }
      if(c2==="qu"){ push("k",s); push("w",L[k+1].i); k+=2; continue; }
      if(c2==="dt"){ push("t",s); k+=2; continue; }
      if(c2==="ie"||c2==="ih"){ push("i",s); k+=2; continue; }
      if(c2==="äu"||c2==="eu"||c2==="oi"){ push("O",s); k+=2; continue; }
      if(c2==="ai"||c2==="ei"||c2==="ay"||c2==="ey"){ push("A",s); k+=2; continue; }
      if(c==="h" && k>0 && VOKALE.has(at(k-1)) && !VOKALE.has(at(k+1))){ k++; continue; }   // Dehnungs-h
      if(c==="x"){ push("k",s); push("s",s); k++; continue; }
      push(EINZELN[c]||c, s); k++;
    }
    const z=out;   // Doppelbuchstaben bleiben stehen (sonst verschmilzt „AmMorgen“), kosten beim Vergleich aber fast nichts
    if(z.length>=3 && z[z.length-2].c==="e" && z[z.length-1].c==="r"){ const e=z.splice(-2,2)[0]; z.push({c:"a",s:e.s,p}); }  // „Vata“ = „Vater“
    const l=z[z.length-1]; if(l){ const h={d:"t",g:"k",b:"p"}[l.c]; if(h) l.c=h; }   // Auslautverhärtung
    return z;
  }
  function kosten(a,b){
    if(a===b) return 0;
    if(VOKALE.has(a)&&VOKALE.has(b)) return .5;
    for(const [x,y] of AEHNLICH) if((a===x&&b===y)||(a===y&&b===x)) return .5;
    return 1;
  }
  const nurBuchstaben = t => t.toLowerCase().replace(/[^a-zäöüß]/g,"");

  function auswerten(ziel, eingabe){
    const woerter=(ziel.match(/\S+/g)||[]).filter(w=>BUCHSTABE.test(w.toLowerCase()));
    const B=[], grenzen=[];
    woerter.forEach((w,wi)=>{ if(wi>0) grenzen.push(B.length); B.push(...lautfolge(w,0,wi)); });
    const stuecke=[]; const re=/\S+/g; let m;
    while((m=re.exec(eingabe||""))) if(BUCHSTABE.test(m[0].toLowerCase())) stuecke.push({text:m[0], start:m.index, kleb:[]});
    const A=[], starts=[];
    stuecke.forEach((st,pi)=>{ if(pi>0) starts.push(A.length); A.push(...lautfolge(st.text, st.start, pi)); });
    const leer={status:"unbewertet", unsicher:true, abstand:1, stuecke, brueche:[], paare:[], woerter:woerter.length};
    if(!A.length || !B.length) return leer;

    const W=steineEl.clientWidth-12, n=res.stuecke.length;
    const zeichen=res.stuecke.reduce((a,s)=>a+s.text.length,0);
    const fs=Math.max(13, Math.min(42, (W-(n-1)*10)/(zeichen*.62+n*1.1)));
    steineEl.style.setProperty("--fs", fs+"px");
    steineEl.style.setProperty("--lücke", Math.max(6,Math.min(16,fs*.45))+"px");
  }
  function markiereFehler(){
    steineEl.querySelectorAll(".kaputt").forEach(e=>e.classList.remove("kaputt"));
    stage.classList.toggle("korrektur", phase==="korrektur");
    if(phase!=="korrektur"||!fehlerZiel) return;
    if(fehlerZiel.art==="kleb") steineEl.querySelector(`.stein[data-k="${fehlerZiel.k}"]`)?.classList.add("kaputt");
    else { steineEl.querySelector(`.stein[data-k="${fehlerZiel.k-1}"]`)?.classList.add("kaputt"); steineEl.querySelector(`.stein[data-k="${fehlerZiel.k}"]`)?.classList.add("kaputt"); }
  }

  // Einhorn läuft ab pos bis zum nächsten Fehler oder ans andere Ufer
  async function laufen(){
    phase="laufen"; markiereFehler();
    const n=res.stuecke.length;
    for(let k=pos+1;k<=n;k++){
      if(k<n && k>0 && res.brueche.includes(k)){
        const r=rel(steineEl.querySelector(`.riss[data-riss="${k}"]`));
        const p={x:r.x+r.w/2, y:anker(k).y};
        await hopp(anker(pos), p);
        const a=res.stuecke[k-1].text, b=res.stuecke[k].text;
        say(nurBuchstaben(a)+" … "+nurBuchstaben(b)+"?");
        await platsch(p, anker(pos));
        fehlerZiel={art:"bruch", k}; phase="korrektur"; markiereFehler(); return;
      }
      if(k<n && res.stuecke[k].kleb.length){
        const el=steineEl.querySelector(`.stein[data-k="${k}"]`);
        await hopp(anker(pos), anker(k));
        el.classList.remove("kippelt"); void el.offsetWidth; el.classList.add("kippelt");
        say(nurBuchstaben(res.stuecke[k].text)+"?");
        await wait(380);
        await platsch(anker(k), anker(pos));
        fehlerZiel={art:"kleb", k}; falschTipps=0; phase="korrektur"; markiereFehler(); return;
      }
      await hopp(anker(pos), anker(k)); pos=k;
      await wait(60);
    }
    geschafft();
  }

  steineEl.addEventListener("click", e=>{
    if(phase!=="korrektur"||!fehlerZiel) return;
    const t=e.target.closest(".stein,.riss"); if(!t) return;
    if(fehlerZiel.art==="bruch"){
      const k=fehlerZiel.k;
      const hit = t.dataset.riss ? +t.dataset.riss===k : (+t.dataset.k===k||+t.dataset.k===k-1);
      if(!hit) return;
      zusammenfuegen(k);
    } else if(+t.dataset.k===fehlerZiel.k) oeffneLupe(fehlerZiel.k);
  });
  function zusammenfuegen(k){
    const a=res.stuecke[k-1], b=res.stuecke[k];
    a.kleb.push(...b.kleb.map(x=>({...x,o:x.o+a.text.length})));
    a.text=a.text+b.text;
    res.stuecke.splice(k,1);
    res.brueche=res.brueche.filter(x=>x!==k).map(x=>x>k?x-1:x);
    sfx.plopp(); weiterNachKorrektur();
  }
  function teilen(k, g, treffer){
    const st=res.stuecke[k];
    const links={text:st.text.slice(0,g), start:st.start, kleb:[]}, rechts={text:st.text.slice(g), start:st.start+g, kleb:[]};
    for(const x of st.kleb){ if(x===treffer) continue; if(x.o<g) links.kleb.push(x); else rechts.kleb.push({...x,o:x.o-g}); }
    res.stuecke.splice(k,1,links,rechts);
    res.brueche=res.brueche.map(x=>x>k?x+1:x);
    sfx.plopp(); weiterNachKorrektur();
  }
  async function weiterNachKorrektur(){
    fehlerZiel=null; phase="laufen";
    zeichneSteine(); await wait(30); setzeUni(pos);
    await wait(250); laufen();
  }

  // Lupe: Klebestein groß, zwischen jedem Buchstaben eine antippbare Lücke
  const lupe=$("lupe");
  function oeffneLupe(k){
    const st=res.stuecke[k];
    lupe.innerHTML=""; const karte=document.createElement("div"); karte.className="karte";
    const reihe=document.createElement("div"); reihe.className="buchst";
    [...st.text].forEach((c,i)=>{
      if(i>0){ const s=document.createElement("button"); s.className="spalt"; s.dataset.g=i; s.setAttribute("aria-label","hier trennen"); reihe.appendChild(s); }
      const b=document.createElement("span"); b.className="bst"; b.textContent=c; reihe.appendChild(b);
    });
    const zu=document.createElement("button"); zu.className="zu"; zu.textContent="✕ zu";
    karte.append(reihe,zu); lupe.appendChild(karte); lupe.classList.add("on");
    if(falschTipps>=2) zeigeRiss(reihe, st);
    zu.onclick=()=>lupe.classList.remove("on");
    lupe.onclick=e=>{ if(e.target===lupe) lupe.classList.remove("on"); };
    reihe.onclick=e=>{
      const s=e.target.closest(".spalt"); if(!s) return;
      const g=+s.dataset.g, treffer=teilungPasst(st,g);
      if(treffer){ lupe.classList.remove("on"); teilen(k,g,treffer); return; }
      falschTipps++;
      reihe.classList.remove("wackel"); void reihe.offsetWidth; reihe.classList.add("wackel");
      say(nurBuchstaben(st.text.slice(0,g))+" … "+nurBuchstaben(st.text.slice(g))+"?");
      if(falschTipps>=2) zeigeRiss(reihe, st);
    };
  }
  function zeigeRiss(reihe, st){ const o=st.kleb[0]?.o; const s=o&&reihe.querySelector(`.spalt[data-g="${o}"]`); if(s) s.classList.add("tipp"); }

  // ---------- Ablauf einer Runde ----------
  let runde=[], idx=0, rundeOk=0, rundeN=0, wiederholungen=0, runden=0, satz=null, fehlerImSatz=false;
  const vorbild=$("vorbild"), weiterzeile=$("weiterzeile");
  function zeige(was){ form.classList.toggle("hidden", was!=="tippen"); weiterzeile.classList.toggle("hidden", was!=="weiter"); }
  function diktat(){ say(satz.text, DIKTAT_TEMPO); }
  function neuerSatz(){
    satz=runde[idx]; res=null; pos=-1; fehlerZiel=null; fehlerImSatz=false;
    steineEl.innerHTML=""; vorbild.classList.remove("on"); vorbild.textContent="";
    feld.value=""; letzterWert="";
    phase="tippen"; zeige("tippen"); markiereFehler();
    feld.focus();               // in derselben Berührung, damit Safari die Tastatur öffnet
    diktat();
    requestAnimationFrame(()=>{ fit(); setzeUni(-1); });
  }
  function neueRunde(){ runde=rundeZusammenstellen(); idx=0; rundeOk=0; rundeN=0; wiederholungen=0; neuerSatz(); }

  for(const b of [$("nochmal"), $("fertig")]) b.addEventListener("pointerdown", e=>e.preventDefault());   // Tastatur offen lassen
  $("nochmal").addEventListener("click", ()=>{ diktat(); feld.focus(); });

  // Leerzeichen zählen nur, wenn das Kind sie selbst getippt hat (nicht aus Wortvorschlägen, Autokorrektur, Einfügen)
  let letzterWert="";
  feld.addEventListener("input", e=>{
    const v=feld.value, alt=letzterWert;
    const selbst = e.inputType==="insertText" && (e.data===" " || e.data===". " || (e.data && e.data.length===1));
    if(!selbst){
      let p=0; while(p<alt.length && p<v.length && alt[p]===v[p]) p++;
      let q=0; while(q<alt.length-p && q<v.length-p && alt[alt.length-1-q]===v[v.length-1-q]) q++;
      const neu=v.slice(p, v.length-q);
      if(/\s/.test(neu) && neu.trim()!=="." ){
        const sauber=neu.replace(/\s+/g,"");
        feld.value=v.slice(0,p)+sauber+v.slice(v.length-q);
        feld.setSelectionRange(p+sauber.length, p+sauber.length);
      }
    }
    letzterWert=feld.value;
  });

  form.addEventListener("submit", async e=>{
    e.preventDefault();
    if(phase!=="tippen") return;
    if(!feld.value.trim()){ const b=$("fertig"); b.classList.remove("wackel"); void b.offsetWidth; b.classList.add("wackel"); diktat(); return; }
    const r=auswerten(satz.text, feld.value);
    if(r.status==="unbewertet"){ say("Hör noch mal hin. "+satz.text, DIKTAT_TEMPO); return; }
    res=r; fehlerImSatz = r.status==="fehler";
    if(!satz.wieder){
      rundeN++; if(!fehlerImSatz) rundeOk++;
      erstversuch(satz.text, !fehlerImSatz, r.paare);
      if(fehlerImSatz && wiederholungen<WIEDER_MAX){ runde.splice(Math.min(runde.length, idx+1+WIEDER_NACH),0,{text:satz.text, wieder:true}); wiederholungen++; }
    }
    phase="laufen"; feld.blur(); zeige("");
    await wait(380);            // Tastatur schließt, Bühne bekommt die volle Höhe
    fit(); zeichneSteine(); setzeUni(-1);
    await wait(res.stuecke.length*70+380);
    laufen();
  });

  async function geschafft(){
    phase="fertig"; markiereFehler(); pos=res.stuecke.length;
    uni.classList.remove("freude"); void uni.offsetWidth; uni.classList.add("freude");
    say(satz.text);
    vorbild.textContent=satz.text; vorbild.classList.add("on");
    await wait(900);
    zeige("weiter");
  }
  $("weiter").addEventListener("click", async ()=>{
    idx++;
    if(idx<runde.length){ neuerSatz(); return; }
    zeige(""); rundeAbschliessen(rundeN, rundeOk); runden++;
    if(PAUSE_ALLE && runden%PAUSE_ALLE===0) await pause();
    ende();
  });
  function ende(){
    const s=$("start"); s.querySelector("h1").textContent="Das Einhorn ist drüben!";
    s.querySelector("p").textContent="Noch eine Runde über den Bach?";
    $("go").textContent="Noch eine Runde"; s.classList.remove("off");
  }

  // ---------- Pausenbild ----------
  let pausen=[];
  try{ pausen=await (await fetch("pausenbilder/index.json",{cache:"no-store"})).json(); }catch(e){}
  if(!Array.isArray(pausen)) pausen=[];
  function pause(){
    if(!pausen.length) return Promise.resolve();
    const c=pausen.length>1 ? pausen.filter(p=>p!==save.pause) : pausen;
    const p=c[Math.floor(Math.random()*c.length)]; save.pause=p; persist();
    const el=$("pause"), src="pausenbilder/"+p;
    return new Promise(async ok=>{
      $("pimg").src=src; $("pbg").style.backgroundImage=`url("${src}")`;
      await $("pimg").decode().catch(()=>{});
      el.classList.add("on"); requestAnimationFrame(()=>el.classList.add("show"));
      $("pweiter").onclick=()=>{ el.classList.remove("show"); setTimeout(()=>{ el.classList.remove("on"); ok(); },800); };
    });
  }

  // ---------- Elternansicht (?eltern) ----------
  function elternansicht(){
    $("start").classList.add("off");
    const d=heute(), zeilen=[];
    for(let i=0;i<14;i++){ const t=new Date(Date.now()-i*864e5).toLocaleDateString("sv"); const e=save.tage[t]; if(e&&e.n) zeilen.push(`<li>${t}: ${e.ok} von ${e.n} Sätzen ohne Kleben <small>(${Math.round(100*e.ok/e.n)} %)</small></li>`); }
    const paare=Object.entries(save.paare).map(([p,l])=>[p,l.filter(x=>tage(x,d)<=14).length]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,12);
    const wackel=Object.entries(save.saetze).filter(([t,e])=>e.f===0);
    const el=document.createElement("div"); el.className="eltern";
    el.innerHTML=`<h1>Lernstand Einhorn-Steine</h1>
      <p>Gezählt wird nur der erste Versuch jedes Satzes (Wiederholungen in derselben Runde nicht). Rechtschreibung zählt nicht, nur die Abstände.
      Stufe ${save.stufe} von 3. ${serverOk?"Gespeichert auf dem Server.":"Nur in diesem Browser gespeichert."}</p>
      <h2>Von selbst an die Abstände gedacht (14 Tage)</h2><ul>${zeilen.join("")||"<li>–</li>"}</ul>
      <h2>Am häufigsten zusammengeklebt</h2><ul>${paare.map(([p,n])=>`<li>${p.replace("|"," + ")} <small>· ${n}×</small></li>`).join("")||"<li>–</li>"}</ul>
      <h2>Sätze, die gerade wackeln (${wackel.length})</h2><ul>${wackel.map(([t,e])=>`<li>${t} <small>· zuletzt ${e.h.map(x=>x?"✓":"✗").join("")}</small></li>`).join("")||"<li>–</li>"}</ul>
      <h2>Stimme auf diesem Gerät</h2>
      <p>Bessere Stimmen: Einstellungen › Bedienungshilfen › Gesprochene Inhalte › Stimmen › Deutsch – dort z. B. „Anna (Premium)“ oder
      „Helena (Erweitert)“ laden, dann diese Seite neu öffnen. Die Siri-Stimmen stehen Webseiten leider nicht zur Verfügung.</p>
      <ul id="stimmen"></ul>
      <p><a class="btn mint" href="einhorn-steine.html">Zum Spiel</a></p>`;
    document.body.appendChild(el);
    const liste=el.querySelector("#stimmen");
    function zeigeStimmen(){
      const vs=deutscheStimmen();
      liste.innerHTML="";
      const zeile=(titel, info, aktiv, waehle)=>{
        const li=document.createElement("li");
        li.innerHTML=`${aktiv?"✅ ":""}${titel} <small>${info}</small> `;
        const b=document.createElement("button"); b.className="btn mint"; b.style.cssText="font-size:.9rem;padding:4px 14px;margin-left:6px"; b.textContent=aktiv?"Probe":"Wählen";
        b.onclick=()=>{ waehle(); sound=true; say("Das Pony frisst Gras. Die Katze schläft auf dem Sofa."); zeigeStimmen(); };
        li.appendChild(b); liste.appendChild(li);
      };
      zeile("Stimme aus den iPhone-Einstellungen", "· iOS wählt selbst", stimmWahl==="system",
        ()=>{ try{ localStorage.setItem("einhorn-stimme","system"); }catch(e){} stimmWahl="system"; voice=null; });
      vs.forEach((v,k)=>zeile(`${k+1}. ${v.name}`,
        `· ${v.lang}${v.default?" · Standard":""}${v.localService===false?" · online":""}${stimmWert(v)<0?" · alt/Spaßstimme":""}<br>${v.voiceURI}`,
        stimmWahl!=="system" && voice===v,
        ()=>{ const key=stimmSchluessel(v,k); try{ localStorage.setItem("einhorn-stimme",key); }catch(e){} stimmWahl=key; voice=v; }));
    }
    zeigeStimmen(); window.addEventListener("stimmen", zeigeStimmen);
  }

  if(new URLSearchParams(location.search).has("eltern")){ elternansicht(); return; }
  fit(); setzeUni(-1);
  $("go").disabled=false; $("go").textContent="Los geht's!";
  $("go").addEventListener("click", ()=>{
    $("start").classList.add("off");
    if(!SAETZE.length){ say("Keine Sätze gefunden."); return; }
    neueRunde();
  });
})();
</script>
</body>
