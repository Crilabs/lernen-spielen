<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Einhorn-Steine</title>
<link rel="stylesheet" href="schrift/schrift.css">
<style>
:root{--ink:#3B2A6B;--nacht:#3B2A6B;--paper:#FFFFFF;--bg:#CDEFFF;--lila:#B59CFF;--rosa:#FF8ACB;--mint:#7FE8C8;--sonne:#FFD95A;
  --himmel1:#CDEBFF;--himmel2:#EAF7FF;--gras:#9EDB7E;--gras2:#7CC45E;--wasser:#7CC8F2;--wasser2:#5AAFE0;--stein:#D9D2E6;--stein2:#BDB3CF;
  font-size:calc(100vh / 108)}   /* 1rem = 10 px bei 1080 px Höhe (Full HD), 8 px bei 864 px (125 % Skalierung) */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Andika",sans-serif;color:var(--nacht);background:var(--bg);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block}
.app{position:fixed;inset:0;display:flex;flex-direction:column;gap:1.4rem;padding:1.6rem 2.4rem 2.2rem}
/* ---------- Bühne: Bach mit zwei Ufern ---------- */
.stage{position:relative;flex:1;min-height:0;border-radius:2.4rem;overflow:hidden;background:#CDEBFF;box-shadow:0 .6rem 0 rgba(59,42,107,.15)}
/* Kulisse: Himmel, Sonne, Wolken, Hügel – reicht bis an die Ränder */
.kulisse{position:absolute;inset:0;width:100%;height:100%}
/* Kulisse steht still: Sonne, Wolken und Bäume bewegen sich nicht (Bewegung nur, wenn sie zur Handlung gehört) */
/* Bach */
.wasser{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#86CFF5,#4FA6DC)}
.welle{position:absolute;left:0;width:200%;height:2.6rem}
.welle.w1{top:-1.3rem}.welle.w2{top:3rem;opacity:.5;--d:14s;animation-direction:reverse}.welle.w3{top:9rem;opacity:.35;--d:19s}
.glitzer{position:absolute;width:2.2rem;height:.5rem;border-radius:50%;background:#fff;opacity:.55}
.schilf{position:absolute;bottom:22%;width:7rem;height:16rem;z-index:1}
.schilf.l{left:10%}.schilf.r{right:10%;transform:scaleX(-1)}
/* Ufer mit Gras, Erde und Blumen */
.ufer{position:absolute;bottom:0;width:11%;height:42%;border:.4rem solid var(--ink);border-bottom:0;
  background:linear-gradient(#A6E08A 0 2.4rem,#7CC45E 2.4rem 3.4rem,#C99B6C 3.4rem,#A97B52)}
.ufer.l{left:-.4rem;border-radius:0 4rem 0 0}.ufer.r{right:-.4rem;border-radius:4rem 0 0 0}
.ufer .deko{position:absolute;bottom:calc(100% - .6rem);width:100%;height:7rem;pointer-events:none}
.steine{position:absolute;left:11%;right:11%;bottom:11%;display:flex;align-items:flex-end;justify-content:center;gap:var(--lücke,1.4rem);padding:0 1rem;z-index:1}
/* Regenbogen über dem Bach, wenn das Einhorn drüben ist */
.regenbogen{position:absolute;left:4%;width:92%;bottom:30%;height:64%;pointer-events:none;z-index:1;opacity:0;transition:opacity .8s}
.regenbogen path{fill:none;stroke-width:15;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.regenbogen.zeigen{opacity:.9}
.regenbogen.zeigen path{animation:bogen 1.1s ease-out forwards;animation-delay:calc(var(--i) * 70ms)}
.regenbogen.weg{opacity:0}
@keyframes bogen{to{stroke-dashoffset:0}}
.stein{position:relative;border:.4rem solid var(--ink);background:radial-gradient(ellipse at 35% 25%,#EDE8F4 0 30%,transparent 55%),linear-gradient(var(--stein),var(--stein2));color:#3B2A6B;font:400 var(--fs,5rem)/1 "Andika",sans-serif;
  padding:.3em .45em .25em;border-radius:46% 46% 38% 38% / 60% 60% 40% 40%;white-space:pre;box-shadow:0 .7rem 0 rgba(30,40,80,.25);
  transform-origin:50% 100%;animation:auftauchen .35s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes auftauchen{from{transform:translateY(40%) scale(.4);opacity:0}}
.stein::before{content:"";position:absolute;left:12%;right:30%;top:-.25rem;height:.9rem;border-radius:1rem 1rem .4rem .4rem;background:#9FD07F;opacity:.85}
.stein::after{content:"";position:absolute;left:-14%;right:-14%;bottom:-1.2rem;height:2rem;border-radius:50%;border:.3rem solid rgba(255,255,255,.65);
  z-index:-1;animation:ring .9s ease-out backwards;animation-delay:inherit}   /* Ring läuft nur einmal, wenn der Stein erscheint */
@keyframes ring{from{transform:scale(.8);opacity:0}}
.stein.kippelt{animation:kippeln .7s ease-in-out}
@keyframes kippeln{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}45%{transform:rotate(8deg)}70%{transform:rotate(-6deg)}85%{transform:rotate(3deg)}}
.stein.kaputt{transform:rotate(-5deg) translateY(.8rem);background:linear-gradient(#E9E2F3,#C9BEDB)}
.stein.halb-l{border-radius:46% 12% 12% 38% / 60% 20% 20% 40%;margin-right:calc(-1 * var(--lücke,1.4rem) + .3rem)}
.stein.halb-r{border-radius:12% 46% 38% 12% / 20% 60% 40% 20%}
.riss{align-self:stretch;width:3.4rem;margin:0 -.3rem;position:relative}
.riss::after{content:"";position:absolute;left:50%;top:15%;bottom:0;width:.6rem;transform:translateX(-50%);
  background:repeating-linear-gradient(var(--ink) 0 .8rem,transparent .8rem 1.4rem)}
.korrektur .stein.kaputt,.korrektur .riss{animation:hinweis 1.6s ease-in-out infinite}
.riss.loesung::after{width:1rem;background:repeating-linear-gradient(var(--rosa) 0 .8rem,transparent .8rem 1.4rem)}
@keyframes hinweis{50%{filter:brightness(1.12) drop-shadow(0 0 .8rem #fff)}}
.uni{position:absolute;left:0;top:0;width:var(--uw,100px);pointer-events:none;z-index:2;will-change:transform}
.uni .uschatten{position:absolute;left:24%;right:24%;top:87%;height:6%;border-radius:50%;background:rgba(0,0,0,.14)}
.uni.ratlos .head{animation:ratlos .9s ease-in-out}
@keyframes ratlos{30%{transform:rotate(-10deg)}60%{transform:rotate(8deg)}}
/* Platscher: Ringe und Tropfen */
.platsch{position:absolute;width:22rem;height:14rem;transform:translate(-50%,-55%);pointer-events:none;z-index:3}
.platsch .ring{fill:none;stroke:#fff;stroke-width:4;transform-box:fill-box;transform-origin:50% 50%;animation:platschring .9s ease-out forwards}
.platsch .ring:nth-child(2){animation-delay:.15s;opacity:0}
@keyframes platschring{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.2);opacity:0}}
.platsch .tropfen{fill:#DFF4FF;stroke:#3B2A6B;stroke-width:2;animation:tropfen .8s cubic-bezier(.2,.7,.5,1) forwards}
@keyframes tropfen{0%{transform:translate(0,0);opacity:1}60%{opacity:1}100%{transform:translate(var(--tx),var(--ty));opacity:0}}
.ecke{position:absolute;top:1.6rem;width:7rem;height:7rem;border-radius:50%;background:rgba(255,255,255,.92);padding:1.4rem;
  display:flex;align-items:center;justify-content:center;box-shadow:0 .5rem 0 rgba(59,42,107,.15);z-index:4}
.ecke img{width:100%;height:100%}
.ecke.l{left:1.6rem}.ecke.r{right:1.6rem}
/* Lupe zum Teilen eines Klebesteins */
.lupe{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(31,27,69,.35);padding:2rem}
.lupe.on{display:flex}
.lupe .karte{background:var(--paper);border-radius:3rem;padding:3rem 3rem 2rem;box-shadow:0 1rem 0 rgba(59,42,107,.25);max-width:100%}
.lupe .buchst{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;row-gap:1rem}
.lupe .bst{font:400 9rem/1.15 "Andika",sans-serif;color:var(--nacht);padding:0 .2rem}
.lupe .spalt{width:4.6rem;border-radius:1.2rem;position:relative}
.lupe .spalt::after{content:"";position:absolute;left:50%;bottom:6%;width:1.2rem;height:1.2rem;transform:translateX(-50%);background:rgba(59,42,107,.22);border-radius:50%}
.lupe .spalt:active{background:rgba(181,156,255,.3)}
.lupe .spalt.tipp::after{top:6%;bottom:6%;height:auto;border-radius:.3rem;background:repeating-linear-gradient(var(--rosa) 0 .9rem,transparent .9rem 1.4rem);width:.7rem;animation:hinweis 1.2s infinite}
.lupe .buchst.wackel{animation:kippeln .6s}
.lupe .zu{display:block;margin:2rem auto 0;font:400 3rem "Andika",sans-serif;color:var(--nacht);opacity:.7;padding:.6rem 2rem}
/* ---------- Schreibzeile ---------- */
.zeile{flex:none;height:11rem;display:flex;align-items:center;justify-content:center;background:var(--paper);border-radius:2.4rem;
  border:.5rem solid var(--lila);font:400 6.8rem/1 "Andika",sans-serif;padding:0 3rem;white-space:pre;overflow:hidden;box-shadow:0 .6rem 0 rgba(59,42,107,.12)}
.zeile .cursor{display:inline-block;width:.6rem;height:1.05em;background:var(--rosa);margin-left:.4rem;border-radius:.3rem;animation:blinken 1.1s steps(1) infinite}
@keyframes blinken{50%{opacity:0}}
.zeile.vorbild{border-color:var(--mint)}
.zeile.wackel{animation:schuetteln .6s}
@keyframes schuetteln{20%{transform:translateX(-1.6rem)}40%{transform:translateX(1.4rem)}60%{transform:translateX(-1rem)}80%{transform:translateX(.6rem)}}
.zeile.vorbild .cursor,.zeile.ruhe .cursor{display:none}
/* ---------- Eigene Tastatur: nur die Buchstaben des Satzes, alphabetisch, jede Taste mit fester Regenbogenfarbe ---------- */
.tastatur{flex:none;display:flex;flex-direction:column;gap:1.4rem;align-items:center}
/* zwei Reihen: oben groß, unten klein, jede Spalte ein Buchstabe in seiner Farbe */
.tasten{display:grid;grid-template-columns:repeat(var(--spalten,8),minmax(0,9.4rem));justify-content:center;gap:1rem 1.1rem;width:100%}
.tasten .taste{min-width:0;padding:0;height:8.6rem}
.tasten .taste.leerfeld{visibility:hidden}
.tasten.eng{gap:.8rem .5rem}
.tasten.eng .taste{font-size:4.6rem;border-radius:1.4rem;border-width:.25rem}
.taste{height:9.6rem;min-width:9rem;padding:0 1.6rem;border-radius:2rem;font:400 6.6rem/1 "Andika",sans-serif;color:var(--ink);
  background:var(--farbe,#fff);border:.35rem solid rgba(59,42,107,.45);box-shadow:0 .8rem 0 var(--schatten,rgba(59,42,107,.3));
  display:flex;align-items:center;justify-content:center;gap:1rem;touch-action:none;transition:opacity .2s}
.taste.drueck{transform:translateY(.7rem);box-shadow:0 .1rem 0 var(--schatten,rgba(59,42,107,.3))}
.taste svg,.taste img{width:5.6rem;height:5.6rem}
.reihe2{display:flex;gap:1.4rem;width:100%;justify-content:center}
.taste.fn{background:var(--paper);min-width:12rem}
.taste.leer{flex:0 1 76rem;background:var(--paper);position:relative;overflow:hidden}
.taste.leer::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1rem;
  background:linear-gradient(90deg,#F78282,#F7B282,#F7E082,#9EF782,#82F7E0,#82B2F7,#B482F7,#F782E6)}
.taste.leer::before{content:"";position:absolute;inset:0;transform:translateX(-110%);
  background:linear-gradient(100deg,transparent 0 20%,#FFB3B3 30%,#FFE6A6 40%,#C6FFB3 50%,#B3F0FF 60%,#D9B3FF 70%,transparent 80%)}
.taste.leer.jubel{animation:leerjubel .5s cubic-bezier(.3,1.6,.5,1)}
.taste.leer.jubel::before{animation:schimmer .6s ease-out}
@keyframes leerjubel{0%{transform:translateY(.8rem) scale(1.02,.86)}55%{transform:translateY(-.5rem) scale(.99,1.06)}100%{transform:none}}
@keyframes schimmer{to{transform:translateX(110%)}}
.funke{position:fixed;width:3rem;height:3rem;margin:-1.5rem 0 0 -1.5rem;pointer-events:none;z-index:50;background:var(--f);
  clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:funkeflug .9s cubic-bezier(.2,.8,.4,1) forwards}
@keyframes funkeflug{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--rot));opacity:0}}
.zeile .luecke{display:inline-block;width:.5em}
.taste.ok{min-width:24rem;background:var(--mint);--schatten:#3FA987;font-size:4.8rem}
.taste.ok.weiter{background:var(--rosa);--schatten:#D45A9E;color:#fff}
.taste.wackel{animation:kippeln .5s}
.tastatur.aus .taste{opacity:.35;pointer-events:none}
.tastatur.aus .taste.ok.an{opacity:1;pointer-events:auto}
.btn{border-radius:99rem;padding:1.6rem 4rem;font:400 3rem "Andika",sans-serif;color:#fff;background:var(--rosa);box-shadow:0 .7rem 0 #D45A9E;text-decoration:none;display:inline-block}
.btn.mint{background:var(--mint);color:#3B2A6B;box-shadow:0 .6rem 0 #4FBF9C;font-size:2.2rem;padding:1rem 2.6rem}
.pause{position:fixed;inset:0;z-index:25;background:#1F1B45;display:none;overflow:hidden;opacity:0;transition:opacity .8s}
.pause.on{display:block}.pause.show{opacity:1}
.pause svg.pszene{position:absolute;inset:0;width:100%;height:100%}
.pbar{position:absolute;left:30%;width:40%;bottom:3rem;height:1.2rem;border-radius:99rem;background:rgba(59,42,107,.35);box-shadow:0 0 0 .2rem rgba(59,42,107,.35);overflow:hidden}
.pfill{height:100%;width:0;border-radius:99rem;background:#fff}
.pause.show .pfill{animation:pfill var(--pause-ms,10s) linear forwards}
@keyframes pfill{from{width:0}to{width:100%}}
.pszene .zzz{display:none}
.pszene .stern{animation:blinken 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes blinken{0%,60%,100%{opacity:.55;transform:scale(1)}80%{opacity:1;transform:scale(1.25)}}
.pszene .ring{animation:ring 8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ring{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.5;transform:scale(1.06)}}
.eltern{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--bg);padding:3rem 4rem 4rem;user-select:text;-webkit-user-select:text;touch-action:auto;font-size:2.2rem}
.eltern h1{font-size:4rem}.eltern h2{font-size:2.8rem;margin:2.4rem 0 .6rem}.eltern p{margin:.8rem 0;max-width:80ch}
.eltern ul{list-style:none}.eltern li{background:var(--paper);border-radius:1.2rem;padding:.6rem 1.4rem;margin:.6rem 0;font-weight:400;max-width:90ch}
.eltern small{font-weight:400;opacity:.75}
@media (prefers-reduced-motion:reduce){.pszene *,.zeile .cursor,.stein::after{animation:none!important}.pause{transition:none}}
</style>
</head>

        <circle r="62" fill="#FFE27A" stroke="#F2B640" stroke-width="5"/></g>
      <g class="wolke" style="--d:150s;--v:-20s"><g transform="translate(200 110) scale(1)" fill="#fff"><ellipse cx="0" cy="20" rx="90" ry="28"/><ellipse cx="-30" cy="4" rx="44" ry="34"/><ellipse cx="28" cy="-4" rx="52" ry="42"/></g></g><g class="wolke" style="--d:190s;--v:-90s"><g transform="translate(900 70) scale(0.8)" fill="#fff"><ellipse cx="0" cy="20" rx="90" ry="28"/><ellipse cx="-30" cy="4" rx="44" ry="34"/><ellipse cx="28" cy="-4" rx="52" ry="42"/></g></g><g class="wolke" style="--d:120s;--v:-60s"><g transform="translate(1400 160) scale(0.7)" fill="#fff"><ellipse cx="0" cy="20" rx="90" ry="28"/><ellipse cx="-30" cy="4" rx="44" ry="34"/><ellipse cx="28" cy="-4" rx="52" ry="42"/></g></g><g class="wolke" style="--d:170s;--v:-130s"><g transform="translate(-200 60) scale(0.9)" fill="#fff"><ellipse cx="0" cy="20" rx="90" ry="28"/><ellipse cx="-30" cy="4" rx="44" ry="34"/><ellipse cx="28" cy="-4" rx="52" ry="42"/></g></g>
      <path d="M0 470 Q240 360 520 430 T1040 410 T1560 420 T1920 400 V700 H0Z" fill="#C4E8B0"/>
      <g transform="translate(420 415) scale(0.9)"><rect x="-8" y="-10" width="16" height="50" rx="6" fill="#B07F55" stroke="#3B2A6B" stroke-width="4"/><g class="krone"><circle cx="0" cy="-40" r="44" fill="#8ED07A" stroke="#3B2A6B" stroke-width="4"/><circle cx="-14" cy="-52" r="14" fill="#B5E6A0"/></g></g><g transform="translate(1180 402) scale(0.75)"><rect x="-8" y="-10" width="16" height="50" rx="6" fill="#B07F55" stroke="#3B2A6B" stroke-width="4"/><g class="krone"><circle cx="0" cy="-40" r="44" fill="#7CC46A" stroke="#3B2A6B" stroke-width="4"/><circle cx="-14" cy="-52" r="14" fill="#A6DC90"/></g></g><g transform="translate(1500 420) scale(0.85)"><rect x="-8" y="-10" width="16" height="50" rx="6" fill="#B07F55" stroke="#3B2A6B" stroke-width="4"/><g class="krone"><circle cx="0" cy="-40" r="44" fill="#8ED07A" stroke="#3B2A6B" stroke-width="4"/><circle cx="-14" cy="-52" r="14" fill="#B5E6A0"/></g></g>
      <path d="M0 520 Q300 450 700 500 T1400 495 T1920 480 V700 H0Z" fill="#AEDD94"/>
      <g transform="translate(250 505) scale(1.1)"><rect x="-8" y="-10" width="16" height="50" rx="6" fill="#B07F55" stroke="#3B2A6B" stroke-width="4"/><g class="krone"><circle cx="0" cy="-40" r="44" fill="#7CC46A" stroke="#3B2A6B" stroke-width="4"/><circle cx="-14" cy="-52" r="14" fill="#A6DC90"/></g></g><g transform="translate(1700 495) scale(1.05)"><rect x="-8" y="-10" width="16" height="50" rx="6" fill="#B07F55" stroke="#3B2A6B" stroke-width="4"/><g class="krone"><circle cx="0" cy="-40" r="44" fill="#8ED07A" stroke="#3B2A6B" stroke-width="4"/><circle cx="-14" cy="-52" r="14" fill="#B5E6A0"/></g></g>
    </svg>
    <svg class="regenbogen" id="regenbogen" viewBox="0 0 1000 500" preserveAspectRatio="none" aria-hidden="true"><path style="--i:0" pathLength="1" stroke="#F47C7C" d="M40 500 A 460 460 0 0 1 960 500"/><path style="--i:1" pathLength="1" stroke="#F7A86B" d="M55 500 A 445 445 0 0 1 945 500"/><path style="--i:2" pathLength="1" stroke="#F7DC6F" d="M70 500 A 430 430 0 0 1 930 500"/><path style="--i:3" pathLength="1" stroke="#8FD97A" d="M85 500 A 415 415 0 0 1 915 500"/><path style="--i:4" pathLength="1" stroke="#6FC8E8" d="M100 500 A 400 400 0 0 1 900 500"/><path style="--i:5" pathLength="1" stroke="#7C9CF0" d="M115 500 A 385 385 0 0 1 885 500"/><path style="--i:6" pathLength="1" stroke="#B47CF0" d="M130 500 A 370 370 0 0 1 870 500"/></svg>
    <div class="wasser">
      <svg class="welle w1" viewBox="0 0 400 26" preserveAspectRatio="none"><path d="M0 13 Q50 0 100 13 T200 13 T300 13 T400 13 V26 H0Z" fill="#86CFF5"/><path d="M0 13 Q50 0 100 13 T200 13 T300 13 T400 13" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/></svg>
      <svg class="welle w2" viewBox="0 0 400 26" preserveAspectRatio="none"><path d="M0 13 Q50 4 100 13 T200 13 T300 13 T400 13" fill="none" stroke="#fff" stroke-width="3"/></svg>
      <svg class="welle w3" viewBox="0 0 400 26" preserveAspectRatio="none"><path d="M0 13 Q50 4 100 13 T200 13 T300 13 T400 13" fill="none" stroke="#fff" stroke-width="3"/></svg>

<script type="module">
import {lade, speichere, sperreTouch, esc, merkeGelernt, pausenKnoepfe} from "./lernspiel.js";
import {ladeEinstellungen, einstellung, setzeEinstellung} from "./kern/einstellungen.js";

// ==AUSWERTUNG-START==  (reine Funktionen, ohne Browser; getestet in docs/tests/steine-auswertung-test.mjs)
// Bewertet werden nur die Wortgrenzen. Rechtschreibung, Lautschreibung, Groß/klein und Satzzeichen zählen nicht.
const AUSWERTUNG = (() => {
  const TOL_GRENZE = 2;        // so viele (vereinfachte) Laute darf ein Leerzeichen neben der erwarteten Wortgrenze liegen
  const UNSICHER_AB = 0.35;    // ab diesem Abstand (Anteil der Ziel-Laute) nur noch die Wortzahl zählen
  const UNBEWERTET_AB = 0.6;   // ab hier gar nicht bewerten („Hör noch mal hin“)
  const VOKALE = new Set(["a","e","i","o","u","ö","ü","A","O"]);
  const AEHNLICH = [["d","t"],["g","k"],["b","p"],["s","z"],["f","w"],["S","s"],["X","k"],["m","n"]];
  const EINZELN = {"ä":"e","y":"i","c":"k","q":"k","v":"f","ß":"s"};
  const BUCHSTABE = /[a-zäöüß]/;

  // Lautnormalisierung: macht aus einem Wort eine Folge vereinfachter Laute. Jeder Laut merkt sich,
  // an welcher Stelle der Eingabe er beginnt (s) und zu welchem Stück/Wort er gehört (p).
  function lautfolge(text, base, p){
    const L=[];
    for(let i=0;i<text.length;i++){ const ch=text[i].toLowerCase(); if(BUCHSTABE.test(ch)) L.push({ch, i:base+i}); }
    const at=j=>L[j]?L[j].ch:"";
    const out=[]; const push=(c,s)=>out.push({c,s,p});
    let k=0;
    while(k<L.length){
      const c=at(k), c2=c+at(k+1), c3=c2+at(k+2), s=L[k].i;
      if(c3==="sch"){ push("S",s); k+=3; continue; }
      if(k===0 && (c2==="sp"||c2==="st")){ push("S",s); push(c2[1],L[k+1].i); k+=2; continue; }   // „schpielt“ = „spielt“
      if(c2==="ch"){ push("X",s); k+=2; continue; }
      if(c2==="ck"){ push("k",s); k+=2; continue; }
      if(c2==="tz"){ push("z",s); k+=2; continue; }
      if(c2==="ph"){ push("f",s); k+=2; continue; }
      if(c2==="qu"){ push("k",s); push("w",L[k+1].i); k+=2; continue; }
      if(c2==="dt"){ push("t",s); k+=2; continue; }
      if(c2==="ie"||c2==="ih"){ push("i",s); k+=2; continue; }
      if(c2==="äu"||c2==="eu"||c2==="oi"){ push("O",s); k+=2; continue; }
      if(c2==="ai"||c2==="ei"||c2==="ay"||c2==="ey"){ push("A",s); k+=2; continue; }
      if(c==="h" && k>0 && VOKALE.has(at(k-1)) && !VOKALE.has(at(k+1))){ k++; continue; }   // Dehnungs-h
      if(c==="x"){ push("k",s); push("s",s); k++; continue; }
      push(EINZELN[c]||c, s); k++;
    }
    const z=out;   // Doppelbuchstaben bleiben stehen (sonst verschmilzt „AmMorgen“), kosten beim Vergleich aber fast nichts
    if(z.length>=3 && z[z.length-2].c==="e" && z[z.length-1].c==="r"){ const e=z.splice(-2,2)[0]; z.push({c:"a",s:e.s,p}); }  // „Vata“ = „Vater“
    const l=z[z.length-1]; if(l){ const h={d:"t",g:"k",b:"p"}[l.c]; if(h) l.c=h; }   // Auslautverhärtung
    return z;
  }
  function kosten(a,b){
    if(a===b) return 0;
    if(VOKALE.has(a)&&VOKALE.has(b)) return .5;
    for(const [x,y] of AEHNLICH) if((a===x&&b===y)||(a===y&&b===x)) return .5;
    return 1;
  }
  const nurBuchstaben = t => t.toLowerCase().replace(/[^a-zäöüß]/g,"");

  function auswerten(ziel, eingabe){
    const woerter=(ziel.match(/\S+/g)||[]).filter(w=>BUCHSTABE.test(w.toLowerCase()));
    const B=[], grenzen=[];
    woerter.forEach((w,wi)=>{ if(wi>0) grenzen.push(B.length); B.push(...lautfolge(w,0,wi)); });
    const stuecke=[]; const re=/\S+/g; let m;
    while((m=re.exec(eingabe||""))) if(BUCHSTABE.test(m[0].toLowerCase())) stuecke.push({text:m[0], start:m.index, kleb:[]});
    const A=[], starts=[];
    stuecke.forEach((st,pi)=>{ if(pi>0) starts.push(A.length); A.push(...lautfolge(st.text, st.start, pi)); });
    const leer={status:"unbewertet", unsicher:true, abstand:1, stuecke, brueche:[], paare:[], woerter:woerter.length};
    if(!A.length || !B.length) return leer;

    // 1) Laute ausrichten (Levenshtein mit Rückverfolgung)
    const n=A.length, M=B.length;
    const D=Array.from({length:n+1},()=>new Float64Array(M+1));
    const einA=i=> i>1&&A[i-2].c===A[i-1].c ? .25 : 1, wegB=j=> j>1&&B[j-2].c===B[j-1].c ? .25 : 1;   // doppelter Laut extra/fehlt
    for(let i=1;i<=n;i++) D[i][0]=D[i-1][0]+einA(i); for(let j=1;j<=M;j++) D[0][j]=D[0][j-1]+wegB(j);
    for(let i=1;i<=n;i++) for(let j=1;j<=M;j++)
      D[i][j]=Math.min(D[i-1][j-1]+kosten(A[i-1].c,B[j-1].c), D[i-1][j]+einA(i), D[i][j-1]+wegB(j));
    const abstand=D[n][M]/M;
    if(abstand>UNBEWERTET_AB) return {...leer, abstand};
    const ops=[]; { let i=n, j=M;
      while(i>0||j>0){
        if(i>0&&j>0&&D[i][j]===D[i-1][j-1]+kosten(A[i-1].c,B[j-1].c)){ ops.push("m"); i--; j--; }
        else if(i>0&&D[i][j]===D[i-1][j]+einA(i)){ ops.push("i"); i--; }
        else { ops.push("d"); j--; }
      } ops.reverse(); }
    // Für jede Wortgrenze im Ziel: Bereich [lo,hi] der Stellen in der Eingabe, an denen sie liegen müsste
    const schnitt=grenzen.map(()=>null);
    const treffer=stuecke.map(()=>({}));   // je Stück: wie viele Laute welches Zielwort treffen
    { let i=0, j=0;
      const merke=()=>grenzen.forEach((b,g)=>{ if(j===b){ if(!schnitt[g]) schnitt[g]=[i,i]; else schnitt[g][1]=i; } });
      merke();
      for(const op of ops){
        if(op==="m"){ if(kosten(A[i].c,B[j].c)<1){ const t=treffer[A[i].p]; t[B[j].p]=(t[B[j].p]||0)+1; } i++; j++; }
        else if(op==="i") i++; else j++;
        merke(); } }
    // Ein Zielwort zählt für ein Stück erst ab 2 getroffenen Lauten (bei einlautigen Wörtern ab 1),
    // damit ein zufällig passender Einzellaut (das „i“ von „Poni“ ↔ „frisst“) nicht reicht.
    const laenge=woerter.map((_,w)=>B.filter(x=>x.p===w).length);
    const wortbereich=treffer.map(t=>{ const ws=Object.keys(t).map(Number).filter(w=>t[w]>=Math.min(2,laenge[w])); return ws.length?[Math.min(...ws),Math.max(...ws)]:[Infinity,-Infinity]; });

    // 2) Wortgrenzen und Leerzeichen paarweise optimal zuordnen (beide sind geordnet)
    const G=grenzen.length, S=starts.length, SKIP=3;
    const dist=(s,[lo,hi])=> s<lo ? lo-s : s>hi ? s-hi : 0;
    const T=Array.from({length:G+1},()=>new Array(S+1).fill(0));
    for(let g=0;g<=G;g++) for(let s=0;s<=S;s++){
      if(!g&&!s) continue;
      let best=Infinity;
      if(g) best=Math.min(best,T[g-1][s]+SKIP);
      if(s) best=Math.min(best,T[g][s-1]+SKIP);
      if(g&&s){ const d=dist(starts[s-1],schnitt[g-1]); if(d<=TOL_GRENZE) best=Math.min(best,T[g-1][s-1]+d); }
      T[g][s]=best;
    }
    const grenzeOk=new Array(G).fill(false), startOk=new Array(S).fill(false);
    { let g=G, s=S;
      while(g>0||s>0){
        if(g&&s){ const d=dist(starts[s-1],schnitt[g-1]); if(d<=TOL_GRENZE && T[g][s]===T[g-1][s-1]+d){ grenzeOk[g-1]=true; startOk[s-1]=true; g--; s--; continue; } }
        if(g && T[g][s]===T[g-1][s]+SKIP){ g--; continue; }
        s--;
      } }
    const unsicher = abstand>UNSICHER_AB;
    if(unsicher && stuecke.length===woerter.length)   // Rückfallebene: nur die Wortzahl zählt
      return {status:"ok", unsicher, abstand, stuecke, brueche:[], paare:[], woerter:woerter.length};

    // 3) Klebestellen: fehlende Wortgrenze mitten in einem Stück. Liegt sie genau auf einem gesetzten
    //    Leerzeichen, fehlt eher ein ganzes Wort – das ist kein Leerzeichenfehler und zählt nicht.
    const paare=[];
    grenzen.forEach((b,g)=>{
      if(grenzeOk[g]) return;
      const [lo,hi]=schnitt[g];
      for(let c=lo;c<=hi;c++){
        if(c<1 || c>=A.length || A[c-1].p!==A[c].p) continue;
        const st=stuecke[A[c].p], o=A[c].s-st.start, wb=wortbereich[A[c].p];
        if(o<1 || o>=st.text.length) continue;
        if(!(wb[0]<=g && wb[1]>=g+1)) continue;   // Stück enthält nur ein Zielwort (z. B. Nachbarwort vergessen)
        st.kleb.push({o, sicher:!unsicher, paar:nurBuchstaben(woerter[g])+"|"+nurBuchstaben(woerter[g+1])});
        paare.push(nurBuchstaben(woerter[g])+"|"+nurBuchstaben(woerter[g+1]));
        return;
      }
    });
    const brueche=[]; startOk.forEach((ok,s)=>{ if(!ok) brueche.push(s+1); });   // Bruch zwischen Stück s und s+1
    for(const st of stuecke) st.kleb.sort((a,b)=>a.o-b.o);
    const fehler = paare.length || brueche.length;
    return {status: fehler?"fehler":"ok", unsicher, abstand, stuecke, brueche, paare, woerter:woerter.length};
  }

  // Ist das Antippen der Lücke g (Zeichen-Index im Stück) eine richtige Teilung für eine der Klebestellen?
  function teilungPasst(stueck, g){
    const links=nurBuchstaben(stueck.text.slice(0,g)).length, rechts=nurBuchstaben(stueck.text.slice(g)).length;
    return stueck.kleb.find(k => Math.abs(g-k.o)<=1 || (!k.sicher && links>=2 && rechts>=2)) || null;
  }
  return {auswerten, teilungPasst, lautfolge, nurBuchstaben};
})();
// ==AUSWERTUNG-ENDE==

(async function(){
  // ---------- Einstellungen ----------
  const SAETZE_JE_RUNDE = 6;       // 6 Sätze + höchstens 2 Wiederholungen = 3-5 min
  const ANTEIL_ALT = 0.2;          // so viel der Runde aus älteren Stufen
  const ANTEIL_FAELLIG = 0.7;      // höchstens so viel fällige/wackelige Sätze, der Rest sichere
  const ABSTAND = [0, 1, 3, 7];    // Tage bis ein Satz in Fach f wieder fällig ist (Fach 3 = sitzt)
  const WIEDER_NACH = 3;           // ein Satz mit Fehler kommt in derselben Runde nach so vielen anderen noch einmal
  const WIEDER_MAX = 2;            // höchstens so viele Wiederholungen je Runde
  const STUFE_OK = 5;              // Stufe geschafft, wenn an STUFE_TAGE verschiedenen Tagen eine Runde mit mind. STUFE_OK Sätzen ohne Fehler
  const STUFE_TAGE = 2;
  const OFT_PAAR = 2;              // so oft in OFT_TAGE Tagen geklebt = „oft geklebt“ (wird bevorzugt geübt)
  const OFT_TAGE = 14;
  const DIKTAT_TEMPO = 0.95;       // Stimme beim Diktat (1 = normal)
  const PAUSE_ALLE = 1;            // nach so vielen Runden ein Pausenbild (0 = nie)
  const ALLE_BUCHSTABEN = false;   // false = nur die Buchstaben des Satzes, true = das ganze Alphabet (Tasten werden schmaler)
                                   // Groß/klein wird nie bewertet; Großschreibung übt der Großbuchstaben-Zauberer.

  const $ = id => document.getElementById(id);
  const {auswerten, teilungPasst, nurBuchstaben} = AUSWERTUNG;
  const wait = ms => new Promise(r=>setTimeout(r,ms));
  const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const heute = () => new Date().toLocaleDateString("sv");
  const tage = (a,b) => a ? Math.round((Date.parse(b)-Date.parse(a))/864e5) : 999;

  // ---------- Speichern (lernspiel.js: Tauri-Datei oder Browser-Speicher "lernstand-kind-1-einhorn-steine") ----------
  let save = await lade("einhorn-steine", {saetze:{}, paare:{}, tage:{}, runden:[], stufe:1, pause:""});
  for(const k of ["saetze","paare","tage"]) if(!save[k] || Array.isArray(save[k])) save[k]={};
  if(!Array.isArray(save.runden)) save.runden=[];
  save.stufe = Math.min(3, Math.max(1, save.stufe|0 || 1));
  function persist(){ speichere("einhorn-steine", save); }

  // ---------- Ton und Stimme ----------
  await ladeEinstellungen(); let sound = einstellung("ton.einhorn-steine", true);
  const sndBtn=$("snd"); const showSnd=()=>$("sndimg").src=sound?"symbole/ton-an.svg":"symbole/ton-aus.svg"; showSnd();
  sndBtn.addEventListener("pointerdown",e=>e.preventDefault());
  sndBtn.addEventListener("click",()=>{ sound=!sound; showSnd(); setzeEinstellung("ton.einhorn-steine", sound); if(!sound) stille(); });
  let actx;
  function tone(f1,f2,dur,type="sine",vol=.16){ if(!sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime; o.type=type;
    o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur*.8);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02); }catch(e){} }
  // Glockenton beim Hüpfen über eine richtige Lücke: steigt je Lücke im Satz eine Stufe (Pentatonik), klingt immer freundlich
  const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51,1567.98,1760];
  let leerNote=0;
  function glocke(f, laut=.2){ if(!sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const t=actx.currentTime;
    for(const [m,v,d] of [[1,laut,1.1],[2,laut*.3,.6],[3.01,laut*.12,.35]]){ const o=actx.createOscillator(), g=actx.createGain(); o.type="sine"; o.frequency.value=f*m;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+.006); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+.05); } }catch(e){} }
  const sfx={ glocke:()=>{ glocke(PENTA[Math.min(leerNote,PENTA.length-1)]); leerNote++; },
    ankunft:()=>[0,2,4,7].forEach((n,k)=>setTimeout(()=>glocke(PENTA[n],.13),k*110)),

  const woerterVon = t => (t.match(/\S+/g)||[]).map(nurBuchstaben).filter(Boolean);

  // ---------- Wiedervorlage und Auswahl ----------
  const eintrag = t => save.saetze[t];

  function oftGeklebt(){
    const paare=new Set(), klein={};
    for(const [p,daten] of Object.entries(save.paare)){

  function rundeZusammenstellen(){

  // Funken an einer Stelle (Bildschirmkoordinaten), z. B. dort, wo das Einhorn über eine richtige Lücke landet

    }
  }
  function druecke(b){ b.classList.add("drueck"); setTimeout(()=>b.classList.remove("drueck"),110); }
  function tastenStand(){
    tastatur.classList.toggle("aus", phase!=="tippen");
    zeile.classList.toggle("ruhe", phase!=="tippen");
    okTaste.textContent = phase==="fertig" ? "Weiter ›" : "Fertig";
    okTaste.classList.toggle("weiter", phase==="fertig");
    okTaste.classList.toggle("an", phase==="fertig");
  }
  // pointerdown statt click: reagiert sofort, auch bei schnellem Tippen mit mehreren Fingern
  tastatur.addEventListener("pointerdown", e=>{
    const b=e.target.closest(".taste"); if(!b) return;
    e.preventDefault(); druecke(b);
    if(b.dataset.c){ einfuegen(b.dataset.c); return; }
    if(b===okTaste){ okGedrueckt(); return; }
    if(b.id==="t-nochmal"){ if(satz) diktat(); return; }
    if(phase!=="tippen") return;
    if(b.id==="t-leer") leerFreude();
    else if(b.id==="t-weg") loeschen();
  });
  // Echte Tastatur (falls angeschlossen) geht auch
  addEventListener("keydown", e=>{
    if(lupe.classList.contains("on") || e.ctrlKey || e.metaKey || e.altKey) return;
    if(e.key==="Enter"){ e.preventDefault(); okGedrueckt(); return; }
    if(phase!=="tippen") return;
    if(e.key===" "){ e.preventDefault(); if(!e.repeat){ druecke(leerTaste); leerFreude(); } }
    else if(e.key==="Backspace"){ e.preventDefault(); loeschen(); }
    else if(e.key.length===1 && /[a-zäöüß]/i.test(e.key)){ e.preventDefault(); einfuegen(e.key); }
  });
  function okGedrueckt(){ if(phase==="tippen") abgeben(); else if(phase==="fertig") weiter(); }

  // ---------- Ablauf einer Runde ----------
  let runde=[], idx=0, rundeOk=0, rundeN=0, wiederholungen=0, runden=0, satz=null, fehlerImSatz=false;
  function diktat(){ say(satz.text, DIKTAT_TEMPO); }
  function neuerSatz(){
    satz=runde[idx]; res=null; pos=-1; fehlerZiel=null; fehlerImSatz=false;
    steineEl.innerHTML=""; zeile.classList.remove("vorbild"); regenbogen(false); leerNote=0; F.zustand(figEl(),"");
    eingabe=""; zeigeText(); baueTastatur(satz.text);
    phase="tippen"; tastenStand(); markiereFehler();
    diktat();
    requestAnimationFrame(()=>{ fit(); setzeUni(-1); });
  }
  function neueRunde(){ runde=rundeZusammenstellen(); idx=0; rundeOk=0; rundeN=0; wiederholungen=0; neuerSatz(); }

  async function abgeben(){
    if(!eingabe.trim()){ okTaste.classList.remove("wackel"); void okTaste.offsetWidth; okTaste.classList.add("wackel"); diktat(); return; }
    const r=auswerten(satz.text, eingabe);
    if(r.status==="unbewertet"){ nochmalHinhoeren(); return; }
    res=r; fehlerImSatz = r.status==="fehler";
    if(!satz.wieder){
      rundeN++; if(!fehlerImSatz) rundeOk++;
      erstversuch(satz.text, !fehlerImSatz, r.paare);
      if(fehlerImSatz && wiederholungen<WIEDER_MAX){ runde.splice(Math.min(runde.length, idx+1+WIEDER_NACH),0,{text:satz.text, wieder:true}); wiederholungen++; }
    }
    phase="laufen"; tastenStand();
    zeichneSteine(); setzeUni(-1);
    await wait(res.stuecke.length*70+380);
    laufen();
  }

  // Eingabe zu weit vom Satz weg: sichtbar zeigen, dass nichts ausgewertet wird, die Zeile leeren und neu diktieren.
  // Bliebe der Text stehen, hängte das Kind den nächsten Versuch daran und die Eingabe bliebe für immer unbewertet
  // (ohne Ton sah das wie ein Hänger aus).
  async function nochmalHinhoeren(){
    phase="hinhoeren"; tastenStand();
    zeile.classList.remove("wackel"); void zeile.offsetWidth; zeile.classList.add("wackel");
    uni.classList.remove("ratlos"); void uni.offsetWidth; uni.classList.add("ratlos");
    sfx.boing();
    await wait(900);
    if(phase!=="hinhoeren") return;
    zeile.classList.remove("wackel");
    eingabe=""; zeigeText(); phase="tippen"; tastenStand();
    say("Hör noch mal hin. "+satz.text, DIKTAT_TEMPO);
  }

  async function geschafft(){
    phase="fertig"; markiereFehler(); pos=res.stuecke.length;
    F.zustand(figEl(),"tanzt"); setTimeout(()=>{ if(phase==="fertig") F.zustand(figEl(),""); },1900);
    regenbogen(true); sfx.ankunft();
    say(satz.text);
    zeigeText(satz.text); zeile.classList.add("vorbild");   // Vorbild in richtiger Schreibung
    await wait(900);
    tastenStand();
  }
  async function weiter(){
    phase="wechsel"; tastenStand();
    idx++;
    if(idx<runde.length){ neuerSatz(); return; }
    rundeAbschliessen(rundeN, rundeOk); runden++;
    if(PAUSE_ALLE && runden%PAUSE_ALLE===0) await pause();
    neueRunde();
  }

  // ---------- Pause: ruhige Nachtszene am Ufer (Vollbild, Haus- und Weiter-Knopf; ?pause zeigt sie sofort) ----------
  function pausenSzene(){
    const sterne=[[160,120,5],[420,260,4],[720,90,6],[1180,180,4],[1500,110,5],[1780,300,4],[300,430,3],[1620,470,3],[960,60,3]]
      .map(([x,y,r],i)=>`<circle class="${i===3?"stern":""}" cx="${x}" cy="${y}" r="${r}" fill="#FFF6C9" opacity="${i===3?"":".7"}"/>`).join("");
    const stein=(x,y,rx,ry)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#8E86A8" stroke="#3B2A6B" stroke-width="4"/><ellipse cx="${x-rx*.2}" cy="${y-ry*.35}" rx="${rx*.5}" ry="${ry*.3}" fill="#A9A2C0"/>`;
    // schlafendes Einhorn (Figur aus figuren.js, eigene Atem-Animation der Figur) auf dem ersten Stein
    const uni=window.Figuren.svgFigur("einhorn").replace('<svg class="figur"','<svg class="figur schlaeft" x="60" y="345" width="520" height="455"');
    return `<svg class="pszene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs><linearGradient id="pnacht" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1F1B45"/><stop offset="1" stop-color="#3D3A7C"/></linearGradient>
        <linearGradient id="pwasser" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E3F86"/><stop offset="1" stop-color="#1F2B63"/></linearGradient></defs>
      <rect width="1920" height="1080" fill="url(#pnacht)"/>${sterne}
      <circle class="ring" cx="1440" cy="230" r="140" fill="#FFF6C9" opacity=".3"/>
      <circle cx="1440" cy="230" r="90" fill="#FFF3B8"/><circle cx="1412" cy="206" r="16" fill="#F1E08F"/><circle cx="1470" cy="256" r="11" fill="#F1E08F"/>
      <path d="M0 560 Q300 520 640 550 T1280 540 T1920 550 V1080 H0Z" fill="#2F5F55"/>
      <rect x="0" y="640" width="1920" height="440" fill="url(#pwasser)"/>
      <ellipse class="ring" cx="1440" cy="800" rx="90" ry="150" fill="#FFF3B8" opacity=".25"/>
      <g stroke="#9FB2F0" stroke-width="5" stroke-linecap="round" opacity=".35"><path d="M1330 760h220M1370 820h140M1300 880h260M1400 940h110"/></g>
      ${stein(320,790,270,70)}${stein(760,880,150,50)}${stein(1060,800,150,52)}
      ${uni}
    </svg>`;
  }
  function pause(){
    const el=$("pause");
    return new Promise(async ok=>{
      el.innerHTML=pausenSzene();
      el.classList.add("on"); void el.offsetWidth; el.classList.add("show");
      await pausenKnoepfe(el);   // Pause endet nur auf Wunsch des Kindes (docs/grundsaetze.md N1, N8, 9.2 Nr. 7)
      el.classList.remove("show"); await wait(850); el.classList.remove("on"); el.innerHTML=""; ok();
    });
  }

  if(new URLSearchParams(location.search).has("pause")) pause();   // Sichtprüfung: ?pause zeigt die Szene sofort

  // ---------- Elternansicht (?eltern) ----------
  function elternansicht(){
    const d=heute(), zeilen=[];
    for(let i=0;i<14;i++){ const t=new Date(Date.now()-i*864e5).toLocaleDateString("sv"); const e=save.tage[t]; if(e&&e.n) zeilen.push(`<li>${esc(t)}: ${esc(e.ok)} von ${esc(e.n)} Sätzen ohne Kleben <small>(${Math.round(100*e.ok/e.n)} %)</small></li>`); }
    const paare=Object.entries(save.paare).map(([p,l])=>[p,l.filter(x=>tage(x,d)<=14).length]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,12);
    const wackel=Object.entries(save.saetze).filter(([t,e])=>e.f===0);
    const el=document.createElement("div"); el.className="eltern";
    el.innerHTML=`<h1>Lernstand Einhorn-Steine</h1>
      <p>Gezählt wird nur der erste Versuch jedes Satzes (Wiederholungen in derselben Runde nicht). Rechtschreibung zählt nicht, nur die Abstände.
      Stufe ${save.stufe} von 3. Gespeichert auf diesem Gerät.</p>
      <h2>Von selbst an die Abstände gedacht (14 Tage)</h2><ul>${zeilen.join("")||"<li>–</li>"}</ul>
      <h2>Am häufigsten zusammengeklebt</h2><ul>${paare.map(([p,n])=>`<li>${esc(p.replace("|"," + "))} <small>· ${n}×</small></li>`).join("")||"<li>–</li>"}</ul>
      <h2>Sätze, die gerade wackeln (${wackel.length})</h2><ul>${wackel.map(([t,e])=>`<li>${esc(t)} <small>· zuletzt ${e.h.map(x=>x?"richtig":"geklebt").join(", ")}</small></li>`).join("")||"<li>–</li>"}</ul>
      <h2>Stimme auf diesem Gerät</h2>
      <p>Weitere Stimmen: in Windows unter Einstellungen › Zeit und Sprache › Sprache und Region bzw. › Sprachausgabe
      eine deutsche Stimme hinzufügen (z. B. „Microsoft Katja“ oder „Microsoft Hedda“), dann die App neu starten.
      Installierte Stimmen erscheinen in der Liste unten.</p>
      <ul id="stimmen"></ul>
      <p><a class="btn mint" href="einhorn-steine.html">Zum Spiel</a></p>`;
    document.body.appendChild(el);
    const liste=el.querySelector("#stimmen");
    function zeigeStimmen(){
      const vs=stimmen();
      liste.innerHTML="";
      const zeile=(titel, info, aktiv, waehle)=>{
        const li=document.createElement("li");
        li.innerHTML=`${aktiv?`<svg viewBox="0 0 24 24" width="1.1em" height="1.1em" aria-label="aktiv" style="vertical-align:-.15em"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#2E9E6B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg> `:""}${titel} <small>${info}</small> `;
        const b=document.createElement("button"); b.className="btn mint"; b.style.cssText="font-size:.9rem;padding:4px 14px;margin-left:6px"; b.textContent=aktiv?"Probe":"Wählen";
        b.onclick=()=>{ waehle(); sound=true; say("Das Pony frisst Gras. Die Katze schläft auf dem Sofa."); zeigeStimmen(); };
        li.appendChild(b); liste.appendChild(li);
      };
      const auto=stimmWahl()==="";
      zeile("Automatisch (beste Stimme)", "", auto, ()=>setzeStimme(""));
      zeile("Standardstimme des Geräts", "· Windows wählt selbst", !auto && !vs.some(v=>v.gewaehlt),
        ()=>setzeStimme("system"));
      vs.forEach((v,k)=>zeile(`${k+1}. ${esc(v.name)}`, "", !auto && v.gewaehlt,
        ()=>setzeStimme(v.schluessel)));
    }
    zeigeStimmen(); window.addEventListener("stimmen", zeigeStimmen);
  }

  if(new URLSearchParams(location.search).has("eltern")){ elternansicht(); return; }
  fit(); setzeUni(-1);
  if(!SAETZE.length){ zeile.classList.remove("ruhe"); textEl.textContent="Keine Sätze gefunden."; return; }
  neueRunde();   // kein Startbildschirm: das Spiel beginnt sofort (wie Wimmelbild)
})();
</script>
