<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kettenhüpfer</title>
<link rel="stylesheet" href="schrift/schrift.css">
<style>
/* Spec: docs/superpowers/specs/2026-11-13-kettenhuepfer-einmaleins-design.md – 1920×1080 quer, Touch */
:root{--nacht:#3B2A6B;--paper:#FFFFFF;--bg:#FFF1DC;--sonne:#FFD95A;--lila:#8F73E6;--lila-s:#6A50C4;
  font-size:calc(100vh / 108)}   /* 1rem = 10 px bei 1080 px Höhe */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Andika",sans-serif;color:var(--nacht);background:#FFE9C9;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block}
#welt{position:fixed;inset:0;width:100%;height:100%;display:block}
.rund{position:fixed;top:2rem;width:8rem;height:8rem;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;padding:1.7rem;
  box-shadow:0 .5rem 0 rgba(59,42,107,.15);text-decoration:none;z-index:9}
.rund img{width:100%;height:100%}
.rund:active{transform:translateY(.3rem);box-shadow:0 .2rem 0 rgba(59,42,107,.15)}
.rund.l{left:2.4rem}.rund.r{right:2.4rem}

/* Perlen */
.kugel{transform-box:fill-box;transform-origin:50% 50%;transition:transform .16s}
.perle.hell .kugel{transform:scale(1.35)}
.draht{transition:opacity .35s}
.draht.aus{opacity:0}
/* Pfeilchen */
.pfeil text{font:400 34px "Andika",sans-serif;fill:var(--nacht);text-anchor:middle;dominant-baseline:central}
.pfeil.gross text{font-size:44px}
.pfeil.wackel{animation:wackel .5s ease-in-out 3}
@keyframes wackel{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.pfeil > g{transform-box:fill-box;transform-origin:50% 0}
.frage{animation:frage 1.1s ease-in-out infinite alternate}
@keyframes frage{to{opacity:.45}}
/* Aufgabe */
.aufgabe{font:400 120px "Andika",sans-serif;fill:var(--nacht);text-anchor:middle;dominant-baseline:central}
/* Ziffernfeld */
.taste{cursor:pointer}
.taste rect{fill:#FFFDF7;stroke:var(--nacht);stroke-width:4;transition:transform .08s}
.taste text{font:400 60px "Andika",sans-serif;fill:var(--nacht);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.taste.los rect{fill:var(--lila);stroke:var(--lila-s)}
.taste.los text{fill:#fff}
.taste.weg rect{fill:#EFE7FF}
.taste.zu{opacity:.4}
.taste.druck{transform:translateY(5px)}
.anzeige text{font:400 92px "Andika",sans-serif;fill:var(--nacht);text-anchor:middle;dominant-baseline:central}
.figur .head{transition:transform .5s ease-in-out}

/* Pause */
.pause{position:fixed;inset:0;z-index:25;background:#2B2350;display:none;opacity:0;transition:opacity .6s}
.pause.on{display:block}.pause.show{opacity:1}
.pause svg.szene{position:absolute;inset:0;width:100%;height:100%}
.pause .blink{animation:sblink 4s ease-in-out infinite}
@keyframes sblink{50%{opacity:.35}}
.pbar{position:absolute;left:30%;width:40%;bottom:3rem;height:1.2rem;border-radius:99rem;background:rgba(255,255,255,.2);box-shadow:0 0 0 .2rem rgba(255,255,255,.2);overflow:hidden}
.pfill{height:100%;width:0;border-radius:99rem;background:#fff}
.pause.show .pfill{animation:pfill var(--pause-ms,10s) linear forwards}
@keyframes pfill{from{width:0}to{width:100%}}
/* Elternansicht */
.eltern{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--bg);padding:3rem 4rem 4rem;user-select:text;-webkit-user-select:text;touch-action:auto;font-size:2rem}
.eltern h1{font:700 4rem/1.1 "Andika",sans-serif}.eltern h2{font:700 2.8rem/1.1 "Andika",sans-serif;margin:2.4rem 0 .6rem}.eltern p{margin:1rem 0;font-weight:400;max-width:90ch}
.eltern ul{list-style:none}.eltern li{background:var(--paper);border-radius:1rem;padding:.6rem 1.4rem;margin:.6rem 0;font-weight:400}
.eltern small{font-weight:400;opacity:.75}
.eltern table{border-collapse:separate;border-spacing:.4rem;font-weight:400}
.eltern th{font-weight:700;padding:.2rem .8rem}
.eltern td{width:9rem;height:5rem;text-align:center;border-radius:.8rem;background:#fff;font-size:1.8rem}
.eltern td.f0{background:#FFD6E4}.eltern td.f1{background:#FFF0B8}.eltern td.f2{background:#E6F5C2}.eltern td.f3{background:#C8EDC0}.eltern td.f4{background:#8EDCA9}
.eltern td.zu{background:#E8E3EE;color:#9A90AE}.eltern td.neu{background:#fff;outline:.3rem dashed #C9BCE8}
.eltern .btn{display:inline-flex;align-items:center;height:7rem;padding:0 3.2rem;border-radius:99rem;font:400 2.6rem/1 "Andika",sans-serif;color:#fff;background:var(--lila);box-shadow:0 .9rem 0 var(--lila-s);text-decoration:none}
@media (prefers-reduced-motion:reduce){.pfeil.wackel,.frage,.pause .blink{animation:none}.pause{transition:none}}
</style>
</head>
<body>
<svg id="welt" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-label="Kettenhüpfer">
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD7B5"/><stop offset=".6" stop-color="#FFEBD0"/><stop offset="1" stop-color="#FFF4E2"/></linearGradient>
    <linearGradient id="huegelH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9E3A0"/><stop offset="1" stop-color="#B4D88E"/></linearGradient>
    <linearGradient id="wiese" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A6D684"/><stop offset="1" stop-color="#8CC774"/></linearGradient>
    <linearGradient id="filz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6E6"/><stop offset="1" stop-color="#F7E8CF"/></linearGradient>
    <linearGradient id="holz" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9C48F"/><stop offset="1" stop-color="#D6A86E"/></linearGradient>
    <radialGradient id="glanz" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <!-- Kulisse: Spätsommer-Hügelwiese, still -->
  <rect x="-400" y="-200" width="2720" height="1480" fill="url(#himmel)"/>
  <circle cx="300" cy="190" r="86" fill="#FFE49A"/><circle cx="300" cy="190" r="120" fill="#FFE49A" opacity=".25"/>
  <g fill="#fff" opacity=".8"><ellipse cx="1180" cy="120" rx="96" ry="26"/><ellipse cx="1226" cy="104" rx="56" ry="28"/><ellipse cx="620" cy="90" rx="60" ry="17"/></g>
  <path d="M-400 380 C 0 250, 380 300, 720 330 C 1060 360, 1400 240, 1800 300 C 2000 330, 2200 320, 2320 340 L2320 1280 L-400 1280Z" fill="url(#huegelH)"/>
  <g fill="#9CC77A" opacity=".7"><circle cx="1560" cy="292" r="34"/><circle cx="1600" cy="282" r="42"/><circle cx="1640" cy="296" r="30"/><rect x="1594" y="300" width="10" height="34" rx="4" fill="#8C6A4A"/></g>
  <path d="M-400 470 C 100 400, 600 440, 1000 430 C 1400 420, 1800 380, 2320 430 L2320 1280 L-400 1280Z" fill="url(#wiese)"/>
  <!-- Arbeitsteppich (Montessori) für die Kette -->
  <g>
    <rect x="44" y="352" width="1384" height="566" rx="34" fill="#000" opacity=".08" transform="translate(6 10)"/>
    <rect x="44" y="352" width="1384" height="566" rx="34" fill="url(#filz)" stroke="#3B2A6B" stroke-width="4"/>
    <rect x="62" y="370" width="1348" height="530" rx="24" fill="none" stroke="#E2C9A2" stroke-width="3" stroke-dasharray="12 9"/>
  </g>
  <!-- Ziffernbrett aus Holz -->
  <g>
    <rect x="1464" y="252" width="424" height="776" rx="36" fill="#000" opacity=".08" transform="translate(6 10)"/>
    <rect x="1464" y="252" width="424" height="776" rx="36" fill="url(#holz)" stroke="#3B2A6B" stroke-width="4"/>
  </g>
  <!-- Pusteblumen und Gras unten, still -->
  <g stroke="#3B2A6B" stroke-width="3" stroke-linecap="round" fill="none" opacity=".55">
    <path d="M120 1080 q4 -60 0 -110 M360 1080 q-6 -40 -2 -80 M980 1080 q6 -50 2 -96 M1320 1080 q-4 -36 0 -70"/>
  </g>
  <g fill="#fff" stroke="#3B2A6B" stroke-width="2.5" opacity=".9"><circle cx="120" cy="962" r="20"/><circle cx="982" cy="976" r="18"/></g>
  <g fill="#FFE07A" stroke="#3B2A6B" stroke-width="2.5"><circle cx="358" cy="996" r="12"/><circle cx="1320" cy="1006" r="11"/></g>

  <g id="tafel">
    <rect x="530" y="78" width="380" height="150" rx="40" fill="#fff" stroke="#3B2A6B" stroke-width="5"/>
    <text id="aufgabe" class="aufgabe" x="720" y="158"></text>
  </g>
  <g id="drahtG"></g>
  <g id="perlenG"></g>
  <g id="pfeileG"></g>
  <g id="figuren"></g>
  <g id="feld"></g>
</svg>
<a class="rund l" href="index.html" aria-label="Alle Spiele"><img src="symbole/haus.svg" alt=""></a>
<button class="rund r" id="snd" aria-label="Ton"><img id="sndimg" src="symbole/ton-an.svg" alt=""></button>
<div class="pause" id="pause"></div>

<script src="figuren/figuren.js"></script>
<script src="figuren/einhorn.js"></script>
<script type="module">
import {lade, speichere, sperreTouch, esc} from "./lernspiel.js";
import {K, migriere, eintrag, verbuche, naechsteAufgabe, hilfeVon, ortVon, zahlwort, paketVon, aufgabenVon} from "./einmaleins-logik.js";
sperreTouch();
(async function(){
  // ---------- Einstellungen (Logik-Werte stehen in einmaleins-logik.js, K) ----------
  const FEHLER_MS = 5000;       // Fehler-Rückmeldung nach dem Hüpfen, nichts antippbar
  const RICHTIG_MS = 1900;      // nach dem Einrasten, bis es weitergeht
  const HOP_MS = 250;           // je Stäbchen
  const LOESUNG_MS = 2600;      // 3. Fehler: Lösungspfeilchen so lange sichtbar
  const WIEDER_NACH = 2;        // falsch gelöste Aufgabe kommt nach so vielen anderen wieder
  const WIEDER_MAX = 3;         // höchstens so viele Aufgaben über die Runde hinaus
  const PAUSE_MS = 10000;
  const FARBE = {1:"#E53935",2:"#43A047",3:"#F48FB1",4:"#FDD835",5:"#64B5F6",6:"#9C27B0",7:"#FFFFFF",8:"#8D6E63",9:"#1E3A8A",10:"#F9A825"};
  // Geometrie (SVG-Einheiten, Bild 1920 × 1080)
  const P = 23, R = 10.5, G = 18, G5 = 6;   // Perlenabstand, -radius, Lücke zwischen Stäbchen, Fünferlücke im Stäbchen
  const Y1 = 500, Y2 = 740, CX = 720;      // Kettenreihen (Stäbchen 1–5 und 6–10), Mitte des Teppichs
  const KNAEUEL = {x: 720, y: 622};
  const UNI_W = 150, UNI_H = UNI_W*280/320, UNI_FUSS = 254/280*UNI_H;
  const ANZEIGE = {x: 1676, y: 330};

  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const wait = ms => new Promise(r=>setTimeout(r,ms));
  const params = new URLSearchParams(location.search);
  const ruhig = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const F = window.Figuren;
  const heute = () => new Date().toLocaleDateString("sv");
  const W = z => zahlwort(z);
  const gross = t => t.charAt(0).toUpperCase() + t.slice(1);
  function el(tag, attrs={}, parent){ const e=document.createElementNS(NS,tag); for(const [k,v] of Object.entries(attrs)) e.setAttribute(k,v); if(parent) parent.appendChild(e); return e; }
  const dauer = ms => ruhig ? Math.min(ms, 120) : ms;

  // ---------- Speichern ----------
  const vorschau = params.has("aufgabe") || params.has("fehler");
  let save = migriere(await lade("einmaleins", {}));
  function persist(){ if(!vorschau) speichere("einmaleins", save); }

  if(params.has("eltern")){ elternansicht(); return; }

  // ---------- Ton und Stimme ----------
  let sound = true; try{ sound = localStorage.getItem("einmaleins-ton")!=="aus"; }catch(e){}
  const showSnd=()=>$("sndimg").src=sound?"symbole/ton-an.svg":"symbole/ton-aus.svg"; showSnd();
  $("snd").addEventListener("click",()=>{ sound=!sound; showSnd(); try{ localStorage.setItem("einmaleins-ton",sound?"an":"aus"); }catch(e){} if(!sound) window.speechSynthesis?.cancel(); });
  let actx;
  function tone(f1,f2,dur,type="sine",vol=.15){ if(!sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime; o.type=type;
    o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur*.8);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02); }catch(e){} }
  const klick = () => tone(900,1300,.07,"sine",.07);
  const plopp = () => tone(500,760,.12,"sine",.1);
  const boing = () => tone(320,180,.35,"triangle",.12);
  const hopTon = i => tone(392*Math.pow(2,i/12),392*Math.pow(2,i/12)*1.05,.11,"sine",.07);
  const rassel = () => { for(let i=0;i<6;i++) setTimeout(()=>tone(1400+Math.random()*500,1200,.04,"triangle",.025), i*35); };
  let voice=null;
  function pickVoice(){ const vs=(window.speechSynthesis?.getVoices()||[]).filter(v=>/^de/i.test(v.lang)); voice=vs.find(v=>/Anna|Petra|Helena|Marlene|Katja/i.test(v.name))||vs[0]||null; }
  if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
  function say(text){ if(!sound||!window.speechSynthesis) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text.replace(/\d+/g,m=>W(+m))); u.lang="de-DE"; if(voice) u.voice=voice; u.rate=.85; u.pitch=1.1; speechSynthesis.speak(u); }catch(e){} }

  // ---------- Geometrie der Kette von n ----------
  // Stäbchen 1–5 laufen in Reihe 1 nach rechts, ein Bogen führt hinunter, Stäbchen 6–10 laufen in Reihe 2 zurück.
  let n = 7;
  const stabL = () => (n-1)*P + (n>5?G5:0);
  const takt = () => stabL() + P + G;
  const reiheW = () => 4*takt() + stabL();
  const xL = () => CX - reiheW()/2;
  const off = (kk,j) => kk*takt() + j*P + (n>5 && j>=5 ? G5 : 0);
  function perlPos(i){
    const k=Math.floor(i/n), j=i%n, o=off(k%5,j);
    return k<5 ? {x:xL()+o, y:Y1, dir:1} : {x:xL()+reiheW()-o, y:Y2, dir:-1};
  }
  // Stelle hinter dem k-ten Stäbchen (k = 0: vor der Kette)
  function stabEnde(k){
    if(k<=0) return {x:xL()-P*1.4, y:Y1, dir:1};
    const p=perlPos(k*n-1); return {x:p.x + p.dir*(R + G/2), y:p.y, dir:p.dir};
  }
  // Stelle nach w Perlen (für falsche Zahlen)
  function nachPerlen(w){
    if(w<=0) return stabEnde(0);
    const p=perlPos(w-1); return {x:p.x + p.dir*(w%n===0 ? R+G/2 : P/2), y:p.y, dir:p.dir};
  }
  function knaeuelPos(i){        // Perlenhaufen (Phyllotaxis); Perle 0 liegt außen, rollt zuerst ab
    const N=10*n, c=N-1-i, a=c*2.39996, r=P*.62*Math.sqrt(c+.5);
    return {x:KNAEUEL.x + r*Math.cos(a), y:KNAEUEL.y + r*Math.sin(a)*.82};
  }

  // ---------- Perlen, Draht, Knäuel ----------
  let perlen=[], draehte=[], draussen=0;          // draussen = so viele Perlen liegen ausgerollt
  const setzePerle = (p,pos) => { p.pos=pos; p.g.style.transform=`translate(${pos.x}px,${pos.y}px)`; };
  function baueKette(){
    $("perlenG").innerHTML=""; $("drahtG").innerHTML=""; perlen=[]; draehte=[]; draussen=0;
    const farbe=FARBE[n], rand = n===7 ? "#8A7AA8" : "#3B2A6B";
    for(let i=0;i<10*n;i++){
      const g=el("g",{class:"perle"},$("perlenG"));
      const k=el("g",{class:"kugel"},g);
      el("circle",{cx:0,cy:0,r:R,fill:farbe,stroke:rand,"stroke-width":2.5},k);
      el("circle",{cx:0,cy:0,r:R,fill:"url(#glanz)"},k);
      const p={g, k, i}; setzePerle(p, knaeuelPos(i)); perlen.push(p);
    }
    // Draht je Stäbchen und Glieder dazwischen, sichtbar erst ausgerollt
    for(let k=1;k<=10;k++){
      const a=perlPos((k-1)*n), b=perlPos(k*n-1);
      const stab=el("path",{d:`M${a.x} ${a.y} L${b.x} ${b.y}`,stroke:"#7A6A8F","stroke-width":6,"stroke-linecap":"round",class:"draht aus"},$("drahtG"));
      let glied=null;
      if(k<10){
        const c=perlPos(k*n);
        const d = k===5 ? `M${b.x} ${b.y} A70 ${(Y2-Y1)/2} 0 0 1 ${c.x} ${c.y}` : `M${b.x} ${b.y} L${c.x} ${c.y}`;
        glied=el("path",{d,stroke:"#9C8DB5","stroke-width":3,fill:"none","stroke-dasharray":"2 6","stroke-linecap":"round",class:"draht aus"},$("drahtG"));
      }
      draehte.push({stab, glied});
    }
  }
  function zeigeDraht(bis){
    draehte.forEach((d,k)=>{ d.stab.classList.toggle("aus", k>=bis); d.glied?.classList.toggle("aus", k+1>=bis); });
  }
  // Perlen fliegen vom Knäuel an ihre Plätze (bis Stäbchen „bis“)
  async function ausrollen(bis){
    const ziel=bis*n; if(ziel<=draussen) return;
    const liste=perlen.slice(draussen, ziel), schritt = dauer(Math.min(16, 800/liste.length));
    rassel();
    const an=liste.map((p,idx)=>{
      const von=p.pos, nach=perlPos(p.i); setzePerle(p,nach);
      if(ruhig) return null;
      return p.g.animate([{transform:`translate(${von.x}px,${von.y}px)`},{transform:`translate(${nach.x}px,${nach.y}px)`}],
        {duration:380, delay:idx*schritt, easing:"cubic-bezier(.3,1.25,.5,1)", fill:"backwards"}).finished.catch(()=>{});
    });
    draussen=ziel; zeigeDraht(bis);
    await Promise.all(an);
  }
  async function einrollen(){
    if(!draussen) return;
    const liste=perlen.slice(0, draussen).reverse(), schritt=dauer(Math.min(8, 450/liste.length));
    zeigeDraht(0);
    const an=liste.map((p,idx)=>{
      const von=p.pos, nach=knaeuelPos(p.i); setzePerle(p,nach);
      if(ruhig) return null;
      return p.g.animate([{transform:`translate(${von.x}px,${von.y}px)`},{transform:`translate(${nach.x}px,${nach.y}px)`}],
        {duration:320, delay:idx*schritt, easing:"ease-in", fill:"backwards"}).finished.catch(()=>{});
    });
    draussen=0;
    await Promise.all(an);
  }
  function leuchteStab(k){
    const ps=perlen.slice((k-1)*n, k*n);
    ps.forEach(p=>p.g.classList.add("hell")); setTimeout(()=>ps.forEach(p=>p.g.classList.remove("hell")), 220);
  }

  // ---------- Pfeilchen ----------
  // Spitze zeigt nach oben auf die Stelle (x|y = Kettenmitte), das Schild hängt darunter.
  function pfeil(text, ort, {art="normal"}={}){
    const gr = art==="quadrat", w = gr ? 118 : 96, h = gr ? 70 : 58, top = R + 6;
    const fill = {normal:"#FFF8EE", quadrat:"#FFE68A", kern:"#E8E0FF", falsch:"#F1EDF6", frage:"#FFFFFF"}[art];
    const g=el("g",{class:"pfeil"+(gr?" gross":"")},$("pfeileG"));
    const i=el("g",{},g);
    const d=`M0 ${top} L14 ${top+18} L${w/2} ${top+18} L${w/2} ${top+18+h} L${-w/2} ${top+18+h} L${-w/2} ${top+18} L-14 ${top+18} Z`;
    el("path",{d, fill, stroke:"#3B2A6B","stroke-width":gr?5:4,"stroke-linejoin":"round","stroke-dasharray": art==="frage"?"8 7":"none"},i);
    const t=el("text",{x:0,y:top+18+h/2+1},i); t.textContent=text;
    if(art==="frage") i.classList.add("frage");
    g.style.transform=`translate(${ort.x}px,${ort.y}px)`;
    return g;
  }
  // Pfeilchen fliegt von der Anzeige an seinen Ort
  async function pfeilFliegt(text, ort, opt){
    const g=pfeil(text, ort, opt);
    if(!ruhig){
      const mx=(ANZEIGE.x+ort.x)/2, my=Math.min(ANZEIGE.y, ort.y)-160;
      await g.animate([{transform:`translate(${ANZEIGE.x}px,${ANZEIGE.y}px) scale(1.25)`},{transform:`translate(${mx}px,${my}px) scale(1.1)`,offset:.5},{transform:`translate(${ort.x}px,${ort.y}px)`}],
        {duration:650, easing:"ease-in-out"}).finished.catch(()=>{});
    }
    plopp();
    return g;
  }
  const pfeileWeg = async () => {
    const ps=[...$("pfeileG").children];
    if(!ruhig) await Promise.all(ps.map(p=>p.animate([{opacity:1},{opacity:0}],{duration:250,fill:"forwards"}).finished.catch(()=>{})));
    $("pfeileG").innerHTML="";
  };

  // ---------- Einhorn ----------
  let uni=null;
  function neuesEinhorn(){
    if(uni) uni.g.remove();
    const g=el("g",{},$("figuren"));
    const sp=el("g",{},g);
    sp.innerHTML=F.svgFigur("einhorn");
    const svg=sp.querySelector("svg"); svg.setAttribute("width",UNI_W); svg.setAttribute("height",UNI_H); svg.style.width=UNI_W+"px"; svg.style.height=UNI_H+"px";
    uni={g, sp, svg, x:0, y:0};
    stelle(stabEnde(0));
    g.addEventListener("click",()=>{ if(busy) return; klick(); F.hop(svg,{hoehe:30,dauer:450}); });
  }
  // Einhorn steht mit den Hufen über der Kette an ort
  const uniXY = ort => ({x: ort.x - UNI_W/2, y: ort.y - R - 3 - UNI_FUSS});
  function stelle(ort){ const p=uniXY(ort); uni.x=p.x; uni.y=p.y; uni.g.style.transform=`translate(${p.x}px,${p.y}px)`; blick(ort.dir); }
  const blick = dir => { if(dir<0) uni.sp.setAttribute("transform",`translate(${UNI_W} 0) scale(-1 1)`); else uni.sp.removeAttribute("transform"); };
  async function huepfe(ort, ms, hoch=46){
    const p=uniXY(ort), von={x:uni.x,y:uni.y};
    if(!ruhig){
      F.hop(uni.svg,{hoehe:0,dauer:ms});
      await uni.g.animate([{transform:`translate(${von.x}px,${von.y}px)`},{transform:`translate(${(von.x+p.x)/2}px,${Math.min(von.y,p.y)-hoch}px)`,offset:.5},{transform:`translate(${p.x}px,${p.y}px)`}],
        {duration:ms, easing:"ease-in-out"}).finished.catch(()=>{});
    }
    stelle(ort);
  }
  const kopf = grad => { const h=uni.svg.querySelector(".head"); if(h) h.style.transform = grad ? `rotate(${grad}deg)` : ""; };
  async function zurueck(){
    if(ruhig){ stelle(stabEnde(0)); return; }
    blick(-1); F.zustand(uni.svg,"laeuft");
    const p=uniXY(stabEnde(0));
    await uni.g.animate([{transform:`translate(${uni.x}px,${uni.y}px)`},{transform:`translate(${p.x}px,${p.y}px)`}],{duration:600,easing:"ease-in-out"}).finished.catch(()=>{});
    F.zustand(uni.svg,""); stelle(stabEnde(0));
  }

  // ---------- Ziffernfeld ----------
  let eingabe="", tasten={};
  function baueFeld(){
    const f=$("feld"); f.innerHTML="";
    // Anzeige: das Pfeilchen, das gleich gesetzt wird
    const an=el("g",{class:"anzeige"},f);
    el("path",{d:`M${ANZEIGE.x} ${ANZEIGE.y-62} L${ANZEIGE.x+22} ${ANZEIGE.y-34} L${ANZEIGE.x+150} ${ANZEIGE.y-34} L${ANZEIGE.x+150} ${ANZEIGE.y+90} L${ANZEIGE.x-150} ${ANZEIGE.y+90} L${ANZEIGE.x-150} ${ANZEIGE.y-34} L${ANZEIGE.x-22} ${ANZEIGE.y-34} Z`,
      fill:"#FFF8EE",stroke:"#3B2A6B","stroke-width":5,"stroke-linejoin":"round"},an);
    const t=el("text",{x:ANZEIGE.x,y:ANZEIGE.y+30,id:"anzeigeText"},an);
    const keys=[7,8,9,4,5,6,1,2,3,"weg",0,"los"];
    keys.forEach((k,i)=>{
      const x=1500+(i%3)*124, y=470+Math.floor(i/3)*130;
      const g=el("g",{class:"taste"+(k==="los"?" los":k==="weg"?" weg":"")},f);
      el("rect",{x,y,width:110,height:116,rx:26},g);
      if(k==="weg") el("path",{d:`M${x+80} ${y+40} L${x+46} ${y+40} L${x+28} ${y+58} L${x+46} ${y+76} L${x+80} ${y+76} Z M${x+54} ${y+50} L${x+70} ${y+66} M${x+70} ${y+50} L${x+54} ${y+66}`,fill:"none",stroke:"#3B2A6B","stroke-width":4.5,"stroke-linejoin":"round","stroke-linecap":"round"},g);
      else if(k==="los") el("path",{d:`M${x+30} ${y+58} L${x+78} ${y+58} M${x+60} ${y+38} L${x+80} ${y+58} L${x+60} ${y+78}`,fill:"none",stroke:"#fff","stroke-width":8,"stroke-linecap":"round","stroke-linejoin":"round"},g);
      else { const tx=el("text",{x:x+55,y:y+60},g); tx.textContent=k; }
      g.addEventListener("pointerdown",e=>{ e.preventDefault(); drueck(k, g); });
      tasten[k]=g;
    });
    zeigeEingabe();
  }
  function zeigeEingabe(){
    $("anzeigeText").textContent=eingabe;
    tasten.los.classList.toggle("zu", !eingabe);
  }
  function drueck(k, g){
    if(busy) return;
    if(g){ g.classList.add("druck"); setTimeout(()=>g.classList.remove("druck"),110); }
    if(k==="los"){ if(eingabe) pruefe(); return; }
    klick();
    if(k==="weg") eingabe=eingabe.slice(0,-1);
    else if(eingabe.length<3) eingabe = (eingabe==="0" ? "" : eingabe) + k;
    zeigeEingabe();
  }
  addEventListener("keydown",e=>{
    if(/^[0-9]$/.test(e.key)) drueck(+e.key, tasten[+e.key]);
    else if(e.key==="Backspace") drueck("weg", tasten.weg);
    else if(e.key==="Enter") drueck("los", tasten.los);
  });

  // ---------- Zustand ----------
  let x=null, kette=0, rest=0, vorher="", fehler=0, busy=true, t0=0, rundeIdx=0, wieder=[], gezeigt=null;

  function satzKern(a){            // Denkhilfe (2. Fehler): Ableitung ansprechen, ohne das Ergebnis zu sagen
    const {kernA, schritt}=hilfeVon(a);
    if(a===1) return `Ein Stäbchen zu ${W(n)}.`;
    if(a===2) return `${gross(W(n))} und ${W(n)}?`;
    if(a===10) return `Zehn Stäbchen zu ${W(n)}: ${W(n)} Zehner.`;
    const kern=`${gross(W(kernA))} mal ${W(n)} ist ${W(kernA*n)}.`;
    if(schritt===0) return `${kern} Fünf ist die Hälfte von zehn.`;
    return kern + " " + {1:"Und noch ein Stäbchen?", "-1":"Ein Stäbchen weniger?", 2:"Und noch zwei Stäbchen?", "-2":"Zwei Stäbchen weniger?"}[schritt];
  }
  function satzLoesung(a){         // 3. Fehler: Lösung mit Begründung
    const {kernA, schritt}=hilfeVon(a), p=a*n;
    if(a===1) return `Ein Stäbchen zu ${W(n)} ist ${W(n)}.`;
    if(a===2) return `${gross(W(n))} und ${W(n)} ist ${W(p)}.`;
    if(a===10) return `Zehn mal ${W(n)} ist ${W(p)}.`;
    const kern=`${gross(W(kernA))} mal ${W(n)} ist ${W(kernA*n)}`;
    if(schritt===0) return `${kern}. Die Hälfte davon ist ${W(p)}.`;
    const wie = {1:"und noch ein Stäbchen", "-1":"ein Stäbchen weniger", 2:"und noch zwei Stäbchen", "-2":"zwei Stäbchen weniger"}[schritt];
    return `${kern}, ${wie} ist ${W(p)}.`;
  }
  function satzTausch(a){
    if(a<2 || a===n) return "";
    const tkey=`${n}x${a}`;
    if(!save.frei.includes(paketVon(n, a)) || eintrag(save, tkey).f < 2) return "";
    return `${gross(W(a))} mal ${W(n)} ist so viel wie ${W(n)} mal ${W(a)}. `;
  }

  // Hilfe-Leiter vor dem nächsten Versuch zeigen
  async function hilfeZeigen(){
    const a=x.a;
    if(fehler>=3){
      await ausrollen(a);
      gezeigt = pfeil(String(a*n), stabEnde(a), {art: a===n ? "quadrat" : "normal"});
      say(satzLoesung(a));
      await wait(LOESUNG_MS);
      await pfeileWeg(); gezeigt=null;
      await einrollen();
      return;
    }
    if(fehler===2){
      const {kernA}=hilfeVon(a);
      if(kernA){
        await ausrollen(kernA);
        pfeil(String(kernA*n), stabEnde(kernA), {art:"kern"});
      }
      say(satzTausch(a) + satzKern(a));
    }
  }

  // ---------- Prüfen ----------
  async function pruefe(){
    if(busy || !eingabe) return;
    busy=true;
    const w=+eingabe, a=x.a, p=a*n;
    plopp();
    // Hilfe-Pfeilchen (Kernaufgabe) bleibt liegen, wird aber gleich vom Ergebnis abgelöst
    await ausrollen(10);
    // Einhorn hüpft a Stäbchen weit
    kopf(0);
    for(let k=1;k<=a;k++){
      const ort=stabEnde(k), wechsel = k===6;
      hopTon(k);
      await huepfe(ort, dauer(wechsel ? 480 : HOP_MS), wechsel ? 90 : 40);
      leuchteStab(k);
    }
    if(w===p) await richtig(a,p);
    else await falsch(a,w);
  }

  async function richtig(a,p){
    const ms=Date.now()-t0;
    await pfeilFliegt(String(p), stabEnde(a), {art: a===n ? "quadrat" : "normal"});
    eingabe=""; zeigeEingabe();
    F.hop(uni.svg,{hoehe:36,dauer:520});
    say(`${gross(W(a))} mal ${W(n)} ist ${W(p)}.`);
    const r = vorschau ? {frei:null} : verbuche(save, a, n, {fehler, hilfe: fehler>=2, ms, heute:heute()});
    if(fehler) wieder.push({a, n, key:x.key, ab: rundeIdx + WIEDER_NACH + 1});
    persist();
    await wait(RICHTIG_MS);
    rundeIdx++;
    await weiter(r.frei);
  }

  async function falsch(a,w){
    const start=Date.now();
    fehler++; boing();
    const o=ortVon(w,n);
    // Das Pfeilchen der getippten Zahl zeigt, wo diese Zahl wirklich liegt
    let wp;
    if(o.ueber){
      // weiter, als die Kette reicht: hinter dem Kettenende vom Teppich gekippt (bleibt im Bild)
      const ende=stabEnde(10), weit={x:Math.max(110, ende.x - 70), y:ende.y, dir:-1};
      wp = await pfeilFliegt(String(w), weit, {art:"falsch"});
      if(!ruhig) await wp.animate([{transform:`translate(${weit.x}px,${weit.y}px)`},{transform:`translate(${weit.x-20}px,${weit.y+70}px) rotate(-16deg)`}],{duration:520,easing:"ease-in",fill:"forwards"}).finished.catch(()=>{});
    } else {
      wp = await pfeilFliegt(String(w), nachPerlen(w), {art:"falsch"});
    }
    wp.firstChild.classList.add("wackel");
    // Am Einhorn: das leere Pfeilchen „?“, wo die Sprünge enden
    pfeil("?", stabEnde(a), {art:"frage"});
    kopf(-14);
    say(`${gross(W(w))} liegt hier. ${gross(W(a))} Sprünge enden hier.`);
    await wait(Math.max(0, FEHLER_MS - (Date.now()-start)));
    kopf(0);
    eingabe=""; zeigeEingabe();
    await pfeileWeg();
    await Promise.all([einrollen(), zurueck()]);
    await hilfeZeigen();
    busy=false;
  }

  // ---------- Ablauf ----------
  function waehle(){
    if(params.has("aufgabe")){
      const [a,nn]=(params.get("aufgabe")||"6x7").split("x").map(Number);
      const ok = a>=1 && a<=10 && nn>=2 && nn<=10;
      return {a: ok?a:6, n: ok?nn:7, key: ok?`${a}x${nn}`:"6x7", kette: ok?nn:7, rest: 9};
    }
    if(params.has("fehler")) return {a:6, n:7, key:"6x7", kette:7, rest:9};
    const wi = wieder.findIndex(e=>e.ab<=rundeIdx && e.key!==vorher);
    if(wi>=0){ const e=wieder.splice(wi,1)[0]; return {...e, kette:e.n, rest: e.n===kette ? rest-1 : 1}; }
    return naechsteAufgabe(save, {kette, rest, vorher, heute:heute()});
  }
  async function weiter(neuPaket){
    busy=true;
    await pfeileWeg();
    if(!vorschau && rundeIdx>=K.RUNDE && (wieder.length===0 || rundeIdx>=K.RUNDE+WIEDER_MAX)){
      await Promise.all([einrollen(), zurueck()]);
      await pause(); rundeIdx=0; wieder=[];
    }
    await neueAufgabe(neuPaket);
  }
  async function neueAufgabe(){
    const neu=waehle();
    const kettenwechsel = neu.n !== n || !perlen.length;
    x=neu; kette=neu.kette; rest=neu.rest; vorher=neu.key; fehler=0; eingabe=""; zeigeEingabe();
    if(kettenwechsel){
      if(perlen.length && !ruhig){
        await einrollen();
        await $("perlenG").animate([{opacity:1,transform:"translateY(0)"},{opacity:0,transform:"translateY(30px)"}],{duration:300,fill:"forwards"}).finished.catch(()=>{});
      }
      n=x.n; baueKette(); neuesEinhorn();
      $("perlenG").getAnimations().forEach(a=>a.cancel());
      if(!ruhig) $("perlenG").animate([{opacity:0,transform:"scale(.7)"},{opacity:1,transform:"scale(1)"}],{duration:420,easing:"cubic-bezier(.3,1.3,.5,1)"});
    } else {
      await Promise.all([einrollen(), zurueck()]);
    }
    const t=$("aufgabe"); t.textContent=`${x.a} · ${n}`;
    if(!ruhig) t.animate([{opacity:0,transform:"translateY(-14px)"},{opacity:1,transform:"translateY(0)"}],{duration:300});
    say(`${gross(W(x.a))} mal ${W(n)}`);
    t0=Date.now(); busy=false;
    if(params.has("fehler") && fehler===0){
      await wait(900); for(const c of String(+params.get("fehler")||48)) drueck(+c); drueck("los");
    }
  }

  // ---------- Pause: die Kette legt sich zum Perlenquadrat ----------
  function pausenSzene(nq){
    const Pq=30, Rq=13, farbe=FARBE[nq], rand = nq===7 ? "#8A7AA8" : "#3B2A6B";
    const breite=(nq-1)*Pq, x0=960-breite/2, y0=540-((nq-1)*(Pq+6))/2 - 40;
    let reihen="";
    for(let r=0;r<nq;r++){
      let s=`<g class="qreihe" style="--d:${(r*420)}ms"><path d="M${x0} ${y0+r*(Pq+6)} h${breite}" stroke="#B7A9D6" stroke-width="5" stroke-linecap="round"/>`;
      for(let j=0;j<nq;j++) s+=`<circle cx="${x0+j*Pq}" cy="${y0+r*(Pq+6)}" r="${Rq}" fill="${farbe}" stroke="${rand}" stroke-width="2.5"/><circle cx="${x0+j*Pq-4}" cy="${y0+r*(Pq+6)-4}" r="${Rq*.4}" fill="#fff" opacity=".55"/>`;
      reihen+=s+"</g>";
    }
    const yU=y0+(nq-1)*(Pq+6)+Rq+12;
    const sterne=[[200,120,0],[520,210,1.3],[880,80,.7],[1320,160,2],[1680,110,.4],[1120,250,1.7],[1500,300,2.6]].map(([x,y,d])=>`<circle class="blink" style="animation-delay:${d}s" cx="${x}" cy="${y}" r="5" fill="#FFF6C8"/>`).join("");
    const uniW=260, uniH=uniW*280/320;
    return `<svg class="szene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs><linearGradient id="pHimmel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B2350"/><stop offset=".6" stop-color="#7A4F7E"/><stop offset="1" stop-color="#D98A7A"/></linearGradient></defs>
      <rect x="-400" y="-200" width="2720" height="1480" fill="url(#pHimmel)"/>
      ${sterne}
      <circle cx="1640" cy="200" r="54" fill="#FFF1C2"/><circle cx="1664" cy="186" r="50" fill="#5B3F6E" opacity=".9"/>
      <path d="M-400 760 C 200 680, 900 720, 1300 700 C 1700 680, 2000 720, 2320 700 L2320 1280 L-400 1280Z" fill="#4B5E5A"/>
      <rect x="${x0-70}" y="${y0-60}" width="${breite+140}" height="${yU-y0+160}" rx="30" fill="#F7E8CF" opacity=".95" stroke="#3B2A6B" stroke-width="4"/>
      ${reihen}
      <g class="qpfeil" style="--d:${nq*420+200}ms" transform="translate(960 ${yU})">
        <path d="M0 0 L16 22 L70 22 L70 102 L-70 102 L-70 22 L-16 22 Z" fill="#FFE68A" stroke="#3B2A6B" stroke-width="5" stroke-linejoin="round"/>
        <text x="0" y="64" text-anchor="middle" dominant-baseline="central" font-family="Andika,sans-serif" font-size="48" fill="#3B2A6B">${nq*nq}</text>
      </g>
      <g transform="translate(${x0+breite+120} ${800-uniH*254/280 - 40})">${F.svgFigur("einhorn").replace("<svg",`<svg class="figur schlaeft" width="${uniW}" height="${uniH}" style="width:${uniW}px;height:${uniH}px"`).replace('class="figur"','')}</g>
    </svg><div class="pbar"><div class="pfill"></div></div>`;
  }
  async function pause(nq=n){
    const e=$("pause");
    e.innerHTML=pausenSzene(nq);
    e.style.setProperty("--pause-ms", PAUSE_MS+"ms");
    e.classList.add("on"); void e.offsetWidth; e.classList.add("show");
    if(!ruhig){
      e.querySelectorAll(".qreihe").forEach((g,r)=>g.animate([{opacity:0,transform:"translateX(-260px)"},{opacity:1,transform:"translateX(0)"}],{duration:520,delay:600+r*420,easing:"cubic-bezier(.3,1.2,.5,1)",fill:"backwards"}));
      const qp=e.querySelector(".qpfeil");
      qp.animate([{opacity:0},{opacity:1}],{duration:500,delay:600+nq*420+200,fill:"backwards"});
    }
    await wait(PAUSE_MS);
    e.classList.remove("show"); await wait(600); e.classList.remove("on"); e.innerHTML="";
  }

  // ---------- Elternansicht ----------
  function elternansicht(){
    document.querySelectorAll("#welt,.rund").forEach(e=>e.remove());
    const frei=new Set(save.frei);
    const nxt=K.REIHENFOLGE.find(p=>!frei.has(p));
    const xs=save.frei.flatMap(aufgabenVon), sitzen=xs.filter(y=>eintrag(save,y.key).f>=2).length;
    const v=save.verlauf||[];
    let tafel=`<table><tr><th></th>${K.KETTEN.map(k=>`<th>· ${k}</th>`).join("")}</tr>`;
    for(let a=1;a<=10;a++){
      tafel+=`<tr><th>${a} ·</th>`;
      for(const k of K.KETTEN){
        const p=paketVon(a,k), e=save.aufgaben[`${a}x${k}`];
        const cls = !frei.has(p) ? (p===nxt?"neu":"zu") : e ? "f"+Math.min(4,e.f) : "";
        tafel+=`<td class="${cls}" title="${a} · ${k}">${frei.has(p) ? (e ? `Fach ${esc(e.f)}${e.h?.length?" "+e.h.slice(-3).map(h=>h?"✓":"✗").join(""):""}` : "neu") : ""}</td>`;
      }
      tafel+="</tr>";
    }
    tafel+="</table>";
    const wack=Object.entries(save.aufgaben).filter(([k,e])=>e.f===0 && e.h?.length).map(([k,e])=>`<li>${esc(k.replace("x"," · "))} <small>· zuletzt ${e.h.slice(-4).map(h=>h?"richtig":"falsch").join(", ")}${e.z?.length?` · Zeiten ${e.z.map(ms=>(ms/1000).toFixed(1)+" s").join(", ")}`:""}</small></li>`);
    const html=`<h1>Lernstand Kettenhüpfer</h1>
      <p>Freigeschaltet: ${save.frei.map(esc).join(", ")} (K = ·1, ·2, ·5, ·10; A = ·3, ·4, ·6, ·9; B = ·7, ·8; Zahl = Kette).
      ${nxt ? `Nächstes Paket: ${esc(nxt)} – braucht ${Math.round(K.FREI_ANTEIL*100)} % der Aufgaben in Fach ≥ 2 (jetzt ${sitzen} von ${xs.length}) und ${Math.round(K.FREI_QUOTE*100)} % fehlerfrei in den letzten ${K.FREI_FENSTER} Aufgaben (jetzt ${v.filter(Boolean).length} von ${v.length}).` : "Alles ist freigeschaltet."}
      Aufgaben insgesamt: ${esc(save.zaehler)}. Fach 0 = wackelt, ab Fach ${K.GELERNT} = gelernt, Abstände ${K.ABSTAND.join(" / ")} Tage.</p>
      <h2>Wackelt gerade</h2>${wack.length?`<ul>${wack.join("")}</ul>`:"<p>Nichts.</p>"}
      <h2>Einmaleins-Tafel</h2><p><small>Zeile = erster Faktor (Anzahl Stäbchen), Spalte = Kette. Grau = noch gesperrt, gestrichelt = kommt als Nächstes.</small></p>${tafel}
      <p><a class="btn" href="einmaleins.html">Zum Spiel</a></p>`;
    const e=document.createElement("div"); e.className="eltern"; e.innerHTML=html; document.body.appendChild(e);
  }

  $("perlenG").style.transformOrigin=`${KNAEUEL.x}px ${KNAEUEL.y}px`;
  baueFeld();
  if(params.has("pause")){ n = Math.min(10, Math.max(2, +params.get("pause")||7)); pause(n); }
  await neueAufgabe(null);
})();
</script>
</body>
