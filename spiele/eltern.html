<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Für Erwachsene</title>
<link rel="stylesheet" href="rahmen/seite.css">
<style>
/* Elternbereich hinter der PIN: nur, was das Kind nicht darf (Spec docs/superpowers/specs/2026-11-14-ansichten-design.md,
   „Für Erwachsene“). Eine ruhige Arbeitsseite für Erwachsene, kein Kinderstil: Nebel als Grund, Papier als Fläche,
   Tinte für Schrift, Linie zum Trennen; alles flach (6.4: Schatten heißt drückbar, das tragen nur die Knöpfe).
   Beere nur für Löschen und Achtung. Die Fachkachel der Kopfleiste steht vor jedem Fach im Lernstand, damit die
   Erwachsenen dieselben Fächer wiedererkennen, die das Kind sieht. Texte sind Elternsprache und werden nicht
   vorgelesen (alle Knöpfe stumm, kein sprich). Zeilen höchstens 70 Zeichen. */
body { -webkit-user-select: none; user-select: none; }
.auswahl { -webkit-user-select: text; user-select: text; }
[hidden] { display: none !important; }
h1, h2, h3, h4, p, ul, ol, dl { margin: 0; }
ul { padding: 0; list-style: none; }
a { color: inherit; text-underline-offset: 0.35em; text-decoration-thickness: 0.12em; }
:focus-visible { outline: 0.4rem solid var(--ls-tinte); outline-offset: 0.4rem; border-radius: var(--ls-radius-klein); }

/* --- PIN ---------------------------------------------------------------------------------------- */
#pin { position: fixed; inset: 0; }
#pin .zurueck { position: absolute; top: 3rem; left: 3.5rem; }
.pin-box {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 3rem;
}
.pin-box h1 { font-size: 4.8rem; line-height: 1.1; }
#pin-text { font-size: 2.6rem; color: var(--ls-tinte-weich); margin-top: -1.6rem; min-height: 3.4rem; }
#pin-text.fehler { color: var(--ls-beere); }
.punkte { display: flex; gap: 2rem; }
.punkte i { width: 2.8rem; height: 2.8rem; border-radius: 50%; border: var(--ls-kontur) solid var(--ls-tinte); }
.punkte i.voll { background: var(--ls-tinte); }
.ziffern { display: grid; grid-template-columns: repeat(3, auto); gap: 2rem 2.4rem; }
.hilfe { font-size: 2rem; color: var(--ls-tinte-weich); max-width: 70ch; text-align: center; line-height: 1.45; }

/* --- Bereich: Navigation links, Inhalt rechts ---------------------------------------------------- */
#bereich { position: fixed; inset: 0; display: grid; grid-template-columns: 53rem 1fr; }
/* Die Leiste passt ohne Scrollen in 108 rem: neun kleine Pillen (8 rem, Tippfläche 9 rem) mit 0,8 rem Abstand. */
.el-nav {
  --ls-breite: 40rem;
  background: var(--ls-papier);
  border-right: var(--ls-kontur) solid var(--ls-linie);
  padding: 2.8rem 0 2.8rem 4rem;
  display: flex; flex-direction: column; align-items: flex-start; gap: 0.8rem;
  overflow-y: auto;
}
.el-nav h1 { font-size: 3.6rem; line-height: 1.1; margin: 0.4rem 0 1.6rem 0.4rem; }
.el-nav .unten { margin-top: auto; }

.el-inhalt { overflow-y: auto; padding: 5.6rem 7rem 10rem; font-size: 2.6rem; line-height: 1.5; }
.spalte { max-width: 128rem; display: flex; flex-direction: column; gap: 4rem; }
.el-inhalt h2 { font-size: 5.2rem; line-height: 1.1; }
.el-inhalt h3 { font-size: 3.4rem; line-height: 1.2; }
.el-inhalt h4 { font-size: 2.6rem; line-height: 1.3; }
.text { max-width: 70ch; }
.vorspann { max-width: 70ch; color: var(--ls-tinte-weich); margin-top: -2.4rem; }
.leise { color: var(--ls-tinte-weich); }
.klein { font-size: 2.1rem; line-height: 1.4; }
.status { min-height: 1.5em; }

/* Fläche: Papier mit feiner Linie, flach. */
.flaeche {
  background: var(--ls-papier);
  border: var(--ls-kontur) solid var(--ls-linie);
  border-radius: var(--ls-radius);
  padding: 3.6rem 4rem;
  display: flex; flex-direction: column; gap: 2rem;
}
.flaeche > p, .flaeche > ul, .flaeche > ol { max-width: 70ch; }
.knoepfe { display: flex; flex-wrap: wrap; gap: 2rem 2.4rem; margin-top: 0.8rem; }
.spalten { display: flex; flex-direction: column; gap: 1.6rem; }

/* Eingriff, der etwas wegnimmt: Kontur und Wort in Beere; beim „Wirklich?“ gefüllt. */
ls-knopf.aus { opacity: 0.45; pointer-events: none; }

/* --- Lernplan ------------------------------------------------------------------------------------- */
.fach-kopf { display: flex; align-items: center; gap: 2.4rem; }
.fach-kopf .zuletzt { margin-left: auto; text-align: right; }
.lp-fach > summary.fach-kopf { min-height: 9rem; }
.lp-fach > summary.fach-kopf::before {
  content: ""; flex: none; width: 1.6rem; height: 1.6rem; margin: 0 0.4rem 0 0.4rem;
  border-right: 0.4rem solid var(--ls-tinte); border-bottom: 0.4rem solid var(--ls-tinte); transform: rotate(-45deg);
}
.lp-fach[open] > summary.fach-kopf::before { transform: rotate(45deg); }
.lp-fach-innen { display: flex; flex-direction: column; margin-top: 2.4rem; }
.lp-fach-leiste { display: flex; justify-content: flex-end; margin-bottom: 1.2rem; }
.fachkachel {
  flex: none; width: 9rem; height: 9rem; padding: 1.5rem;
  border: var(--ls-kontur) solid var(--ls-tinte); border-radius: var(--ls-radius);
  background: var(--fach-fuellung, var(--ls-papier));
}
.fachkachel i {
  display: block; width: 100%; height: 100%; background: var(--ls-tinte);
  -webkit-mask: var(--bild) center / contain no-repeat; mask: var(--bild) center / contain no-repeat;
}
.fachkachel.ohne i { display: none; }
.fach-kopf h3 { color: var(--fach-tief, var(--ls-tinte)); }
.flaeche > .spiele-links, .lp-fach-innen > .spiele-links { max-width: none; border-top: var(--ls-kontur) solid var(--ls-linie); padding-top: 2rem; }
/* Filter: eine schlanke Reihe; der gewählte in Tinte gefüllt (wie ein Hauptknopf), die anderen Papier. */
.lp-filter { display: flex; flex-wrap: wrap; gap: 1.2rem 1.6rem; margin-top: -1.6rem; }
.lp-filter button {
  min-height: 7.6rem; padding: 0 3rem; font: inherit; font-size: 2.6rem; font-weight: 700; cursor: pointer;
  color: var(--ls-tinte); background: var(--ls-papier); border: var(--ls-kontur) solid var(--ls-tinte); border-radius: 99rem;
  box-shadow: var(--ls-schatten);
}
.lp-filter button.an { color: var(--ls-papier); background: var(--ls-tinte); box-shadow: 0 0.6rem 0 var(--ls-haupt-schatten); }
.lp-filter button:active { transform: translateY(0.3rem); box-shadow: var(--ls-schatten-unten); }
.lp-filter button:focus-visible { outline: 0.4rem solid var(--ls-tinte); outline-offset: 0.4rem; }

.spiel-beschreibungen { display: flex; flex-direction: column; gap: 0.4rem; }
.spiel-beschreibung > summary { min-height: 6rem; display: flex; align-items: center; gap: 1.2rem; font-weight: 700; }
.spiel-beschreibung > summary::before {
  content: ""; flex: none; width: 1.4rem; height: 1.4rem;
  border-right: 0.35rem solid var(--ls-tinte); border-bottom: 0.35rem solid var(--ls-tinte);
  transform: rotate(-45deg); margin: 0 0.6rem 0 0.2rem;
}
.spiel-beschreibung[open] > summary::before { transform: rotate(45deg); }
.spiel-beschreibung > p { margin: 0 0 1.6rem 3.6rem; color: var(--ls-tinte-weich); max-width: 70ch; }

/* Zum Aufklappen: eine zusammengeklappte Liste je Fach, jede Zeile klappt die Eingriffe auf. */
/* Bereich und Thema klappen auf; der Pfeil zeigt, ob offen. .aufklapp: die Listen unter „Hinweise“. */
details > summary { list-style: none; cursor: pointer; }
details > summary::-webkit-details-marker { display: none; }
.aufklapp > summary {
  display: flex; align-items: center; gap: 1.6rem; min-height: 8rem;
  font-weight: 700; border-top: var(--ls-kontur) solid var(--ls-linie); padding-top: 1.6rem;
}
.aufklapp > summary .anzahl { font-weight: 400; color: var(--ls-tinte-weich); }
.klasse-titel { margin: 2.4rem 0 0.8rem; color: var(--ls-tinte-weich); font-weight: 700; font-size: 2.2rem; }
.lp-bereich { border-top: var(--ls-kontur) solid var(--ls-linie); }
.lp-bereich > summary { display: flex; align-items: center; gap: 1.6rem; min-height: 8rem; padding: 1.2rem 0; }
.lp-bereich > summary .name { font-weight: 700; }
.lp-bereich > summary .zustand { margin-left: auto; font-size: 2.2rem; }
.lp-bereich > summary::before, .aufklapp > summary::before, .thema > summary::before {
  content: ""; flex: none; width: 1.4rem; height: 1.4rem;
  border-right: 0.35rem solid var(--ls-tinte); border-bottom: 0.35rem solid var(--ls-tinte);
  transform: rotate(-45deg); margin: 0 0.6rem 0 0.2rem;
}
.lp-bereich[open] > summary::before, .aufklapp[open] > summary::before, .thema[open] > summary::before { transform: rotate(45deg); }
.lp-bereich-innen { display: flex; flex-direction: column; gap: 2rem; padding: 0 0 2.4rem 3.6rem; }
.themen { display: flex; flex-direction: column; gap: 0.8rem; }

/* Thema: Zustand als Farbe (Fläche und Punkt) und Wort. Gekonnt in der Tönung des Fachs mit Haken im Tief-Ton,
   gerade dran in Sonne, offen ruhig in Nebel. Keine Bewertungsfarben (kein Grün, kein Rot). */
.thema { border-radius: var(--ls-radius-klein); background: var(--ls-nebel); scroll-margin-top: 3.2rem; }
.thema.z-kann-ich { background: var(--fach-toenung, var(--ls-nebel)); }
.thema.z-dran { background: color-mix(in srgb, var(--ls-sonne) 30%, var(--ls-papier)); }
.thema > summary { display: flex; align-items: center; gap: 1.6rem; min-height: 8rem; padding: 1.2rem 2.4rem; }
.thema .punkt {
  flex: none; position: relative; width: 3rem; height: 3rem; box-sizing: border-box; border-radius: 50%;
  border: var(--ls-kontur) solid var(--ls-naht); background: var(--ls-papier);
}
.thema.z-kann-ich .punkt { border-color: var(--fach-tief, var(--ls-tinte)); background: var(--fach-tief, var(--ls-tinte)); }
.thema.z-kann-ich .punkt::after {
  content: ""; position: absolute; left: 0.85rem; top: 0.35rem; width: 0.7rem; height: 1.4rem;
  border-right: 0.35rem solid var(--ls-papier); border-bottom: 0.35rem solid var(--ls-papier); transform: rotate(45deg);
}
.thema.z-dran .punkt { border-color: var(--ls-tinte); background: var(--ls-sonne); }
.thema .name { flex: 1; }
.thema .wort {
  flex: none; font-size: 2.1rem; padding: 0.4rem 1.6rem; border-radius: 99rem;
  border: var(--ls-kontur) solid var(--ls-linie); background: var(--ls-papier); white-space: nowrap;
}
.thema.z-kann-ich .wort, .thema.z-dran .wort { border-color: var(--ls-tinte); }
.thema.z-verborgen .name, .thema.z-verborgen .wort { color: var(--ls-tinte-weich); }
/* Aufbauzeit: zwei Punkte je Thema, links digitales Spiel (Tinte), rechts Spiel mit echten Dingen (Holz); leer = noch keins. */
.spielpunkte { flex: none; display: inline-flex; gap: 0.8rem; vertical-align: middle; }
.spielpunkte i { display: block; width: 1.6rem; height: 1.6rem; box-sizing: border-box; border-radius: 50%; border: 0.25rem solid var(--ls-naht); }
.spielpunkte i.d.da { background: var(--ls-tinte); border-color: var(--ls-tinte); }
.spielpunkte i.a.da { background: var(--ls-kante); border-color: var(--ls-kante); }
.lp-legende { display: flex; align-items: center; gap: 1.2rem; margin-top: -2rem; }
.lp-legende .spielpunkte + * { margin-right: 2rem; }
/* Offene Voraussetzungen: Namen als Sprung zum Thema (unterstrichen wie ein Link). */
.voraus .sprung { font: inherit; color: var(--ls-tinte); background: none; border: 0; padding: 0; cursor: pointer;
  text-decoration: underline; text-decoration-thickness: 0.2rem; text-underline-offset: 0.4rem; }
.voraus .sprung:focus-visible { outline: 0.4rem solid var(--ls-tinte); outline-offset: 0.3rem; border-radius: 0.4rem; }

/* Spiele eines Themas: kleine Karten mit Bild, Titel, Art und (nachgezogen) Kurzbeschreibung. */
.lp-spiele { display: flex; flex-wrap: wrap; gap: 2rem; margin: 0.8rem 0; }
.lp-spiele[hidden] { display: none; }
.lp-karte {
  display: flex; flex-direction: column; width: 34rem; padding: 0; overflow: hidden; text-align: left;
  font: inherit; color: var(--ls-tinte); background: var(--ls-papier); cursor: pointer;
  border: var(--ls-kontur) solid var(--ls-tinte); border-radius: var(--ls-radius); box-shadow: var(--ls-schatten);
}
.lp-karte:active { transform: translateY(0.3rem); box-shadow: var(--ls-schatten-unten); }
.lp-karte:focus-visible { outline: 0.4rem solid var(--ls-tinte); outline-offset: 0.4rem; }
.lp-karte .bild { position: relative; display: grid; place-items: center; height: 14rem; border-bottom: var(--ls-kontur) solid var(--ls-tinte);
  background: var(--fach-toenung, var(--ls-nebel)); overflow: hidden; }
.lp-karte.analog .bild { background: var(--ls-ahorn); }
.lp-karte .bild .welt { position: absolute; inset: 0; }
.lp-karte .bild .welt svg { display: block; width: 100%; height: 100%; }
.lp-karte .bild ls-objekt { position: relative; }
.lp-karte .bild img { width: 7rem; height: 7rem; }
.lp-karte .bild ls-objekt { height: 11rem; }
.lp-karte .text { display: flex; flex-direction: column; gap: 0.4rem; padding: 1.4rem 1.8rem 1.8rem; font-size: 2.3rem; line-height: 1.3; }
.lp-karte .art { color: var(--ls-tinte-weich); font-size: 2rem; }
.lp-karte .kurz { margin-top: 0.4rem; }
.thema .innen { padding: 0 2.4rem 2.4rem 5rem; display: flex; flex-direction: column; gap: 0.8rem; }

/* --- Sachthemen ----------------------------------------------------------------------------------- */
/* Themenkreis: aufklappbar, im Kopf eine kleine Vignette in der Palette seiner Welten (start/welten.js). Sachthemen als
   Zeilen wie Themen; gelesen/gespielt mit Haken in Tinte, vorhanden mit Ring in Tinte, „kommt noch“ ruhig.
   Keine Knöpfe: nur Übersicht und Vorschau (grundsaetze K7). */
.sw-kopf { display: flex; align-items: center; gap: 2.4rem; }
.sw-kopf .klapp { margin-left: auto; }
.sw-gruppe > summary { gap: 2.4rem; }
.sw-vignette {
  flex: none; width: 15rem; height: 8rem; overflow: hidden;
  border: var(--ls-kontur) solid var(--ls-tinte); border-radius: var(--ls-radius-klein);
}
.sw-vignette svg { display: block; width: 100%; height: 100%; }
.thema.sw-welt.z-gesehen { background: color-mix(in srgb, var(--ls-tinte) 9%, var(--ls-papier)); }
.thema.sw-welt.z-gesehen .punkt { border-color: var(--ls-tinte); background: var(--ls-tinte); }
.thema.sw-welt.z-gesehen .punkt::after {
  content: ""; position: absolute; left: 0.85rem; top: 0.35rem; width: 0.7rem; height: 1.4rem;
  border-right: 0.35rem solid var(--ls-papier); border-bottom: 0.35rem solid var(--ls-papier); transform: rotate(45deg);
}
.thema.sw-welt.z-gesehen .wort, .thema.sw-welt.z-da .wort { border-color: var(--ls-tinte); }
.thema.sw-welt.z-da .punkt { border-color: var(--ls-tinte); }
.thema.sw-welt.z-kommt .name, .thema.sw-welt.z-kommt .wort { color: var(--ls-tinte-weich); }
.thema.sw-welt .inhalt { display: flex; flex-wrap: wrap; gap: 0 0.8rem; }
.thema.sw-welt .innen > p { max-width: 70ch; }

/* --- Geschichten ---------------------------------------------------------------------------------- */
/* Drei Stufen untereinander, von ruhig nach aufregend; rechts Wählen oder „Eingestellt“. Die gewählte Stufe trägt
   den Sonnenring (Sonne = ausgewählt, Farbwelt 6.2). */
.stufen { display: flex; flex-direction: column; gap: 3rem; }
.stufe { display: grid; grid-template-columns: minmax(0, 1fr) 26rem; align-items: center; gap: 2rem 4rem; }
.stufe .beispiel { font-style: italic; }
.stufe .wahl { justify-self: end; }
.stufe .gewaehlt { font-weight: 700; min-height: 11rem; display: flex; align-items: center; }
.stufe.markiert { border-color: var(--ls-tinte); }

/* --- Spielzeit ----------------------------------------------------------------------------------- */
/* Tage als Reihe gleich breiter Knöpfe (erlaubt = Hauptknopf gefüllt), Grenzen als Zeile Wert mit Weniger/Mehr. */
.tage { --ls-breite: 15rem; display: flex; flex-wrap: wrap; gap: 1.6rem 2rem; }
.grenze { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 1.6rem 4rem; }
.grenze .wert { font-size: 3.4rem; font-weight: 700; line-height: 1.2; }
.grenze .knoepfe { margin-top: 0; }
.zeit-stand { display: flex; flex-direction: column; gap: 0.6rem; }
.zeit-stand .lage { font-weight: 700; }
/* --- Updates ---------------------------------------------------------------------------------------- */
.version { font-size: 4.4rem; font-weight: 700; line-height: 1.1; }
.notiz { white-space: pre-wrap; }
.laden { height: 1.6rem; border-radius: 99rem; background: var(--ls-linie); overflow: hidden; max-width: 70ch; }
.laden i { display: block; height: 100%; width: 0; background: var(--ls-tinte); }

/* --- Hinweise ------------------------------------------------------------------------------------- */
.botschaften { list-style: decimal; padding-left: 1.4em; display: flex; flex-direction: column; gap: 0.4rem; }
.punkte-liste { list-style: disc; padding-left: 1.2em; display: flex; flex-direction: column; gap: 0.6rem; }
.nummern { display: grid; grid-template-columns: auto 1fr; gap: 0.6rem 3rem; max-width: 70ch; }
.nummern dt { font-weight: 700; white-space: nowrap; }
.nummern dd { margin: 0; }
.luecken-fach .bereich { max-width: 70ch; margin-bottom: 0.8rem; }

/* --- Sicherheit ----------------------------------------------------------------------------------- */
.flaeche > .protokoll { max-width: none; }
.protokoll { max-height: 60rem; overflow-y: auto; font-size: 2.1rem; display: flex; flex-direction: column; gap: 0.8rem; }
.protokoll li { word-break: break-word; border-bottom: 0.2rem solid var(--ls-linie); padding-bottom: 0.8rem; }

/* Schmal (hochkant): Spalten untereinander. */
@media (max-aspect-ratio: 4/3) {
  .stand, .stufe, .grenze { grid-template-columns: 1fr; }
  .stufe .wahl { justify-self: start; }
}
</style>
</head>
<body>

<section id="pin" aria-label="PIN" hidden>
  <ls-knopf class="zurueck" id="pin-zurueck" symbol="haus.svg" wort="Zurück" stumm></ls-knopf>
  <div class="pin-box">
    <h1 id="pin-titel">Für Erwachsene</h1>
    <p id="pin-text" role="status">Bitte die PIN eingeben</p>
    <div class="punkte" id="punkte" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="ziffern" id="ziffern"></div>
    <p id="pin-hilfe" class="hilfe" hidden>PIN vergessen: Tastatur anschließen, Strg+Alt+Entf → Task-Manager → „Lernen Spielen“ beenden. Dann im Ordner <b class="auswahl">%APPDATA%\de.crilabs.lernen-spielen\lernstand\</b> die Dateien <b class="auswahl">eltern.json</b> und <b class="auswahl">eltern.json.bak</b> löschen und die App neu starten.</p>
  </div>
</section>

<section id="bereich" aria-label="Elternbereich" hidden>
  <nav class="el-nav" aria-label="Bereiche">
    <h1>Für Erwachsene</h1>
    <ls-knopf data-tab="lernstand" symbol="lernstand.svg" wort="Lernplan" groesse="klein" stumm></ls-knopf>
    <ls-knopf data-tab="sachthemen" symbol="themen.svg" wort="Sachthemen" groesse="klein" stumm></ls-knopf>
    <ls-knopf data-tab="geschichten" symbol="buch.svg" wort="Geschichten" groesse="klein" stumm></ls-knopf>
    <ls-knopf data-tab="spielzeit" symbol="uhr.svg" wort="Spielzeit" groesse="klein" stumm></ls-knopf>
    <ls-knopf data-tab="geraet" symbol="update.svg" wort="Updates" groesse="klein" stumm></ls-knopf>
    <ls-knopf data-tab="hinweise" symbol="hilfe.svg" wort="Hinweise" groesse="klein" stumm></ls-knopf>
    <ls-knopf data-tab="sicherheit" symbol="schloss.svg" wort="Sicherheit" groesse="klein" stumm></ls-knopf>
    <ls-knopf class="unten" id="zurueck-spiele" symbol="haus.svg" wort="Zu den Spielen" groesse="klein" stumm></ls-knopf>
    <ls-knopf id="beenden" symbol="beenden.svg" wort="App beenden" groesse="klein" stumm hidden></ls-knopf>
  </nav>
  <main class="el-inhalt auswahl" id="inhalt"></main>
</section>
<ls-anregung id="anregung"></ls-anregung>

<script type="module">
import { lade, speichere, sofortSpeichern, sperreTouch, protokoll, protokollLesen, esc } from "./lernspiel.js";
import { pinHash, pinPruefen, pruefeUpdate } from "./eltern.js";
import { faehigkeiten, appVersion, beende, neuStart, kioskPause } from "./kern/geraet.js";
import { ladeEinstellungen, setzeEinstellung, geschichtenStufe, einstellung } from "./kern/einstellungen.js";
import { regeln, aktuell, lage as spielLage, gibZugabe, ZUGABE_MINUTEN } from "./kern/spielzeit.js";
import { STAND as SPIELZEIT_STAND } from "./rahmen/spielzeit.js";
import { elternThemen, hakeAb, mitVoraussetzungen, setzeZurueck, gibFrei, aufgabeLesbar, ladeLernstand, luecken, echteDingeFuer, spieleFuer, alsNaechstes, elternSachthemen }
  from "./lernsteuerung.js";
import { FACH, FACH_SYMBOLE, bild } from "./rahmen/stil.js";
import { ladeVerzeichnis, ladeAnleitung } from "./rahmen/echte-dinge.js";
import { paletteFuer, themenkreisSvg, vignetteSvg } from "./start/welten.js";

import "./objekte/objekt.js";

const el = (tag, text, klasse) => {

// Mit Tastatur: Ziffern und Rücktaste
document.addEventListener("keydown", (e) => {
  if ($("pin").hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^\d$/.test(e.key)) { e.preventDefault(); taste(e.key); }
  else if (e.key === "Backspace") { e.preventDefault(); taste("Löschen"); }
});
function zeichnePunkte() {
  [...$("punkte").children].forEach((p, i) => p.classList.toggle("voll", i < eingabe.length));
}
function meldung(text, fehler = false) {
  const p = $("pin-text"); p.textContent = text; p.classList.toggle("fehler", fehler);
}
function pinAnsicht(m) {
  modus = m; eingabe = ""; erste = ""; zeichnePunkte();
  $("bereich").hidden = true; $("pin").hidden = false;
  $("pin-hilfe").hidden = m !== "pruefen" || !kann.kiosk;
  $("pin-titel").textContent = m === "pruefen" ? "Für Erwachsene" : "Neue PIN festlegen";
  meldung(m === "pruefen" ? "Bitte die PIN eingeben" : "Eine PIN mit vier Ziffern wählen");
}
async function taste(z) {
  if (z === "Neu") eingabe = "";
  else if (z === "Löschen") eingabe = eingabe.slice(0, -1);
  else if (eingabe.length < LAENGE) eingabe += z;
  zeichnePunkte();
  if (eingabe.length < LAENGE) return;
  const pin = eingabe;
  if (modus === "pruefen") {
    if (await pinPruefen(pin, daten.pinHash)) { zeigeBereich(); }
    else { eingabe = ""; zeichnePunkte(); meldung("Das war nicht richtig. Bitte nochmal.", true); }
  } else if (modus === "neu") {
    erste = pin; eingabe = ""; modus = "bestaetigen"; zeichnePunkte(); meldung("Die PIN zur Sicherheit noch einmal eingeben");
  } else if (pin === erste) {
    daten.pinHash = await pinHash(pin);
    speichere("eltern", daten); await sofortSpeichern();
    zeigeBereich("pin-ok");
  } else {
    eingabe = ""; erste = ""; modus = "neu"; zeichnePunkte(); meldung("Die beiden PINs waren verschieden. Bitte von vorn.", true);
  }
}

// ---------- Hilfen ----------
const MONATE = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
const heuteTag = () => new Date().toLocaleDateString("sv");
// "2026-11-13" → "13. November" (heute und gestern als Wort, anderes Jahr mit Jahreszahl); leer bleibt leer
function datum(tag) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(tag || "");
  if (!m) return "";
  const heute = heuteTag();
  const gestern = new Date(Date.now() - 864e5).toLocaleDateString("sv");
  if (tag === heute) return "heute";
  if (tag === gestern) return "gestern";
  const jahr = m[1] !== heute.slice(0, 4) ? " " + m[1] : "";
  return `${Number(m[3])}. ${MONATE[Number(m[2]) - 1]}${jahr}`;
}
const amDatum = (tag) => { const d = datum(tag); return d === "heute" || d === "gestern" ? d : "am " + d; };

let lernCtx = null;
async function ladeCtx() {
  if (!lernCtx) {
    const [plan, spiele] = await Promise.all(["lernplan.json", "spiele.json"].map((f) => fetch(f).then((r) => r.json())));
    lernCtx = { plan, spiele, echteDinge: await ladeVerzeichnis() };
  }
  return lernCtx;
}
const fachName = (ctx, strang) => (ctx.spiele.kategorien || []).find((k) => k.id === strang)?.name || strang;
// Fächer in der Reihenfolge von spiele.json, dann weitere aus dem Lernplan
const faecher = (ctx) => {
  const folge = (ctx.spiele.kategorien || []).map((k) => k.id);
  for (const t of ctx.plan.themen || []) if (!folge.includes(t.strang)) folge.push(t.strang);
  return folge;
};

function fachFarben(strang, ziel) {
  const f = FACH[strang];
  if (!f) return;
  ziel.style.setProperty("--fach-fuellung", f.fuellung);
  ziel.style.setProperty("--fach-tief", f.tief);
  ziel.style.setProperty("--fach-toenung", f.toenung);
}
function fachKachel(strang) {
  const k = el("span", null, "fachkachel");
  k.setAttribute("aria-hidden", "true");
  const i = el("i");
  if (FACH_SYMBOLE.has(strang)) i.style.setProperty("--bild", bild(`symbole/${strang}.svg`));
  else k.classList.add("ohne");
  k.appendChild(i);
  return k;
}

// Knopf mit Bestätigung auf der Seite: erster Tipp fragt „Wirklich?“, zweiter führt aus (kein confirm-Dialog im Kiosk).
// wegnehmen (Zurücksetzen): in Beere.
// frage: eigener Text der Rückfrage (z. B. wie viele Themen davor mitkommen), erst beim ersten Tipp berechnet.
function eingriffKnopf(text, tun, { wegnehmen = false, frage = null } = {}) {
  const b = knopf(text, { achtung: wegnehmen });
  let timer = null;
  b.addEventListener("click", () => {
    if (b.classList.contains("aus")) return;
    if (!timer) {
      b.setAttribute("wort", frage ? frage() : "Wirklich? Nochmal tippen");
      b.setAttribute("art", "haupt");
      timer = setTimeout(() => { timer = null; b.setAttribute("wort", text); b.removeAttribute("art"); }, 4000);
      return;
    }
    clearTimeout(timer); timer = null;
    b.classList.add("aus");
    tun();
  });
  return b;
}

// ---------- Lernplan ----------
// Alle Themen je Fach als Baum Bereich → Thema, ohne Klassen (Christian: Klassen erzeugen Druck und sind nicht
// bundeseinheitlich). Der Zustand steht als Farbe und Wort an der Zeile (gekonnt, gerade dran, offen), ein Filter
// zeigt nur eins davon. Eltern haken Bereiche und Themen ab (hakeAb: samt offenen Voraussetzungen, still, nie in der
// Wiederholung); Zurücksetzen in Beere. Beschreibend, von Stärken aus, ohne Zahlen als Fortschritt (grundsaetze 3.3).
// Spec docs/superpowers/specs/2026-11-14-lernstand-lernplan-abhaken-design.md.
const ZUSTAND = { "verborgen": "kommt später", "in-sicht": "kann als Nächstes kommen", "dran": "gerade dran", "kann-ich": "kann" };
const STUFE = { material: "übt mit Material", vorstellung: "übt in der Vorstellung", kopf: "übt im Kopf" };
const PROBE = "fängt an: eine kurze Probe zeigt, womit es beginnt";
const FILTER = [["alle", "Alle"], ["gekonnt", "Gekonnt"], ["dran", "Gerade dran"], ["naechstes", "Als Nächstes"], ["offen", "Offen"]];
const LEER = { dran: "Gerade ist kein Thema dran.", naechstes: "Gerade ist kein Thema dran, darum kommt hier noch nichts als Nächstes.",
  gekonnt: "Hier steht, was das Kind kann, sobald es so weit ist.", offen: "Alle Themen sind gekonnt." };
let lpFilter = "alle";
const offeneBereiche = new Set();
const offeneFaecher = new Set(); // anfangs alles zu: man sieht nur die Fächer
let lernLauf = 0;

// Rückfrage beim Abhaken: nennt, wie viele Themen davor mitkommen, und aus welchen anderen Fächern.
function abhakFrage(ctx, stand, ids, strang) {
  const alle = mitVoraussetzungen(ctx, stand, ids);
  const nachId = new Map((ctx.plan.themen || []).map((t) => [t.id, t]));
  const davor = alle.filter((id) => !ids.includes(id));
  if (!davor.length) return "Wirklich? Nochmal tippen";
  const andere = [...new Set(davor.map((id) => nachId.get(id)?.strang).filter((x) => x && x !== strang))].map((x) => fachName(ctx, x));
  return `Wirklich? Mit ${davor.length === 1 ? "einem Thema" : davor.length + " Themen"} davor`
    + (andere.length ? `, auch in ${andere.join(" und ")}` : "");
}

async function lernstand(spalte, offen) {
  const lauf = ++lernLauf;
  spalte.append(el("h2", "Lernplan"),
    el("p", "Alle Themen, je Fach nach Bereichen. Was das Kind schon kann, lässt sich abhaken: Es kommt dann nicht noch einmal dran, und die Themen danach werden frei.", "vorspann"));
  let ctx, stand;
  try { ctx = await ladeCtx(); stand = await ladeLernstand(ctx, heuteTag()); }
  catch (e) {
    protokoll("Lernplan: " + e);
    spalte.appendChild(el("p", "Der Lernplan konnte nicht geladen werden. Bitte den Bereich neu öffnen.", "flaeche"));
    return;
  }
  if (tab !== "lernstand" || lauf !== lernLauf) return; // inzwischen anderer Bereich oder neu gezeichnet
  const heute = heuteTag();
  const liste = elternThemen(ctx, stand, heute);
  const spiele = ctx.spiele.spiele || [];

  const neuZeichnen = async (id) => {
    if (tab !== "lernstand") return;
    const inh = $("inhalt"), oben = inh.scrollTop;
    spalte.replaceChildren();
    await lernstand(spalte, id);
    inh.scrollTop = oben;
  };
  const eingriff = async (tun, id) => {
    tun();
    speichere("lernplan", stand); await sofortSpeichern();
    await neuZeichnen(id);
  };

  // Filter: eine Reihe kleiner Knöpfe, der gewählte gefüllt
  const filter = el("div", null, "lp-filter");
  filter.setAttribute("role", "group");
  filter.setAttribute("aria-label", "Zeigen");
  for (const [id, wort] of FILTER) {
    const k = el("button", wort, id === lpFilter ? "an" : "");
    k.type = "button";
    k.setAttribute("aria-pressed", String(id === lpFilter));
    k.addEventListener("click", () => { if (lpFilter !== id) { lpFilter = id; neuZeichnen(offen); } });
    filter.appendChild(k);
  }
  spalte.appendChild(filter);
  // Für die Aufbauzeit (Christian): zwei Punkte je Thema zeigen, ob es schon ein digitales Spiel und ein Spiel mit
  // echten Dingen gibt. Fällt weg, wenn die Spiele im aufgeklappten Thema stehen und alle Themen Spiele haben.
  const legende = el("p", null, "lp-legende leise klein");
  legende.innerHTML = '<span class="spielpunkte"><i class="d da"></i></span><span>digitales Spiel</span>'
    + '<span class="spielpunkte"><i class="a da"></i></span><span>Spiel mit echten Dingen</span>';
  spalte.appendChild(legende);

  // Als Nächstes: je Thema dran die drei, die darauf folgen (alsNaechstes in lernsteuerung.js)
  const naechste = alsNaechstes(ctx, stand);
  const zeigt = {
    alle: () => true, dran: (t) => t.zustand === "dran", naechstes: (t) => naechste.has(t.id),
    gekonnt: (t) => t.zustand === "kann-ich", offen: (t) => t.zustand !== "dran" && t.zustand !== "kann-ich",
  }[lpFilter];
  // Sprung zu einem Thema (offene Voraussetzung): Filter auf Alle, Bereich und Thema auf, dorthin scrollen
  const planNach = new Map((ctx.plan.themen || []).map((x) => [x.id, x]));
  const springe = async (id) => {
    const p = planNach.get(id);
    if (!p) return;
    lpFilter = "alle";
    offeneFaecher.add(p.strang);
    offeneBereiche.add(p.strang + "|" + (p.bereich || "Weiteres"));
    await neuZeichnen(id);
    const ziel = spalte.querySelector(`.thema[data-id="${CSS.escape(id)}"]`);
    ziel?.scrollIntoView({ block: "start" });
    ziel?.querySelector("summary")?.focus({ preventScroll: true });
  };
  let gezeigt = 0;
  for (const strang of faecher(ctx)) {
    const themen = liste.find((x) => x.strang === strang)?.themen || [];
    if (!themen.length) continue;
    // Bereiche in Planreihenfolge (erstes Vorkommen); ein Bereich in mehreren Klassen ist einer
    const bereiche = new Map();
    for (const t of themen) {
      const b = t.bereich || "Weiteres";
      if (!bereiche.has(b)) bereiche.set(b, []);
      bereiche.get(b).push(t);
    }
    const sichtbar = [...bereiche].filter(([, ts]) => ts.some(zeigt));
    if (!sichtbar.length) continue;
    gezeigt++;

    const block = el("section", null, "flaeche fach");
    block.setAttribute("aria-label", fachName(ctx, strang));
    fachFarben(strang, block);
    // Das Fach klappt auf und zu (anfangs zu); mit Filter oder Sprung ist es offen
    const fachDet = el("details", null, "lp-fach");
    fachDet.open = lpFilter !== "alle" || offeneFaecher.has(strang) || themen.some((t) => t.id === offen);
    fachDet.addEventListener("toggle", () => { if (fachDet.open) offeneFaecher.add(strang); else offeneFaecher.delete(strang); });
    const kopf = el("summary", null, "fach-kopf");
    kopf.append(fachKachel(strang), el("h3", fachName(ctx, strang)));
    let zuletzt = null;
    for (const t of themen) {
      const e = stand.themen[t.id];
      const u = e?.q ? "" : e?.u || e?.seit || ""; // Abhaken ist kein Üben
      if (u && (!zuletzt || u > zuletzt.u)) zuletzt = { u, name: t.name };
    }
    if (zuletzt) kopf.appendChild(el("p", `Zuletzt geübt ${amDatum(zuletzt.u)}: ${zuletzt.name}`, "zuletzt leise klein"));
    fachDet.appendChild(kopf);
    const fachInnen = el("div", null, "lp-fach-innen");
    fachDet.appendChild(fachInnen);
    block.appendChild(fachDet);
    // Alle Bereiche des Fachs auf- oder zuklappen; das Wort folgt dem Zustand
    const klapp = knopf("Alles ausklappen");
    klapp.setAttribute("groesse", "klein");
    klapp.classList.add("klapp");
    const klappZeile = el("div", null, "lp-fach-leiste");
    klappZeile.appendChild(klapp);
    fachInnen.appendChild(klappZeile);
    const bereichsDetails = () => [...fachInnen.querySelectorAll(":scope > details.lp-bereich")];
    const klappWort = () => klapp.setAttribute("wort", bereichsDetails().every((d) => d.open) ? "Alles einklappen" : "Alles ausklappen");
    klapp.addEventListener("click", () => {
      const alleOffen = bereichsDetails().every((d) => d.open);
      for (const d of bereichsDetails()) d.open = !alleOffen;
      klappWort();
    });

    for (const [name, alleThemen] of sichtbar) {
      const key = strang + "|" + name;
      const gezeigte = alleThemen.filter(zeigt);
      const det = el("details", null, "lp-bereich");
      det.open = lpFilter !== "alle" || offeneBereiche.has(key) || alleThemen.some((t) => t.id === offen);
      const sum = el("summary");
      const kann = alleThemen.filter((t) => t.zustand === "kann-ich").length;
      const dran = alleThemen.some((t) => t.zustand === "dran");
      const worte = [kann === alleThemen.length ? "alles gekonnt" : kann ? "teils gekonnt" : "", dran ? "gerade dran" : ""].filter(Boolean).join(", ");
      sum.append(el("span", name, "name"), el("span", worte, "zustand leise"));
      det.appendChild(sum);
      const innen = el("div", null, "lp-bereich-innen");
      det.appendChild(innen);
      // Themenzeilen erst beim Aufklappen zeichnen (956 Themen): der Reiter steht sofort
      const fuelle = () => {
        if (innen.childElementCount) return;
        const knoepfe = reihe();
        const offenIds = alleThemen.filter((t) => t.zustand !== "kann-ich").map((t) => t.id);
        if (offenIds.length) {
          const k = eingriffKnopf("Alles abhaken", () => eingriff(() => hakeAb(ctx, stand, offenIds, heute), null),
            { frage: () => abhakFrage(ctx, stand, offenIds, strang) });
          knoepfe.appendChild(k);
        }
        const mitStand = alleThemen.filter((t) => t.zustand === "dran" || t.zustand === "kann-ich" || t.frei);
        if (mitStand.length) {
          knoepfe.appendChild(eingriffKnopf("Zurücksetzen", () => eingriff(() => { for (const t of mitStand) setzeZurueck(ctx, stand, t.id); }, null),
            { wegnehmen: true }));
        }
        for (const k of knoepfe.children) k.setAttribute("groesse", "klein");
        if (knoepfe.children.length) innen.appendChild(knoepfe);
        const ul = el("ul", null, "themen");
        for (const t of gezeigte) ul.appendChild(themaZeile(t, stand, ctx, heute, offen, strang, (tun) => eingriff(tun, t.id), { liste, springe }));
        innen.appendChild(ul);
      };
      det.addEventListener("toggle", () => {
        if (det.open) { offeneBereiche.add(key); fuelle(); } else offeneBereiche.delete(key);
        klappWort();
      });
      if (det.open) fuelle();
      fachInnen.appendChild(det);
    }
    klappWort();

    const fachSpiele = spiele.filter((x) => x.kategorie === strang);
    if (fachSpiele.length) {
      const p = el("p", null, "spiele-links klein");
      p.appendChild(document.createTextNode("Was die Spiele selbst zeigen: "));
      fachSpiele.forEach((x, i) => {
        if (i) p.appendChild(document.createTextNode(", "));
        const a = el("a", x.titel || x.id); a.href = (x.datei || x.id + ".html") + "?eltern"; p.appendChild(a);
      });
      fachInnen.appendChild(p);
      // Beschreibung für Erwachsene (Feld `beschreibung` in spiele.json): ruhig, je Spiel zum Aufklappen.
      const mitText = fachSpiele.filter((s) => typeof s.beschreibung === "string" && s.beschreibung.trim());
      if (mitText.length) {
        const liste = el("div", null, "spiel-beschreibungen");
        for (const s of mitText) {
          const d = el("details", null, "spiel-beschreibung");
          d.appendChild(el("summary", s.titel || s.id));
          d.appendChild(el("p", s.beschreibung.trim(), "klein"));
          liste.appendChild(d);
        }
        fachInnen.appendChild(liste);
      }
    }
    spalte.appendChild(block);
  }
  if (!gezeigt) spalte.appendChild(el("p", LEER[lpFilter] || "Der Lernplan ist leer.", "flaeche leise"));
}

function themaZeile(t, stand, ctx, heute, offen, strang, eingriff, { liste, springe }) {
  const li = el("li");
  const det = el("details", null, "thema z-" + t.zustand);
  det.dataset.id = t.id;
  det.open = t.id === offen;
  const sum = el("summary");
  const punkt = el("span", null, "punkt");
  punkt.setAttribute("aria-hidden", "true");
  const digital = t.luecke !== "ohne-spiel";
  const ed = echteDingeFuer(ctx, t.id);
  const analog = !!ed?.formen?.length && !ed.entwurf;
  const spielpunkte = el("span", null, "spielpunkte");
  spielpunkte.innerHTML = `<i class="d${digital ? " da" : ""}"></i><i class="a${analog ? " da" : ""}"></i>`;
  spielpunkte.setAttribute("aria-label", [digital ? "digitales Spiel" : "", analog ? "Spiel mit echten Dingen" : ""].filter(Boolean).join(", ") || "noch kein Spiel");
  spielpunkte.title = spielpunkte.getAttribute("aria-label");
  sum.append(punkt, el("span", t.name, "name"), spielpunkte, el("span", ZUSTAND[t.zustand] || t.zustand, "wort"));
  det.appendChild(sum);
  const innen = el("div", null, "innen");
  if (t.zustand === "dran") innen.appendChild(el("p", "Im Moment: " + (STUFE[t.stufe] || PROBE) + "."));
  if (t.wackelig.length) innen.appendChild(el("p", "Kommt gerade öfter dran: " + t.wackelig.map(aufgabeLesbar).join(", ")));
  if (t.frei && t.zustand !== "kann-ich") innen.appendChild(el("p", "Von Ihnen freigegeben.", "leise"));
  // Voraussetzungen, die noch nicht gekonnt sind; jede führt zu ihrem Thema im Lernplan
  if (t.zustand !== "kann-ich") {
    const zustandVon = new Map(liste.flatMap((x) => x.themen).map((x) => [x.id, x]));
    const offeneV = ((ctx.plan.themen || []).find((x) => x.id === t.id)?.voraussetzungen || [])
      .map((id) => zustandVon.get(id)).filter((v) => v && v.zustand !== "kann-ich");
    if (offeneV.length) {
      const p = el("p", null, "voraus");
      p.appendChild(document.createTextNode("Davor noch offen: "));
      offeneV.forEach((v, i) => {
        if (i) p.appendChild(document.createTextNode(", "));
        const a = el("button", v.name, "sprung");
        a.type = "button";
        a.addEventListener("click", () => springe(v.id));
        p.appendChild(a);
      });
      innen.appendChild(p);
    }
  }
  if (t.luecke === "teilweise") innen.appendChild(el("p", "Die Spiele zeigen bisher nur einen Teil dieses Themas.", "leise"));
  const mitSpiel = t.luecke !== "ohne-spiel";
  if (!mitSpiel) innen.appendChild(el("p", "Für dieses Thema gibt es noch kein digitales Spiel. Das Kind sieht es in der App noch nicht.", "leise"));
  // Die Spiele des Themas als Karten, erst beim Aufklappen (lädt die Anleitung für das Bild der Karte)
  const karten = el("div", null, "lp-spiele");
  innen.appendChild(karten);
  const fuelleKarten = () => { if (!karten.dataset.voll) { karten.dataset.voll = "1"; spielKarten(karten, t, ctx, strang); } };
  det.addEventListener("toggle", () => { if (det.open) fuelleKarten(); });
  if (det.open) fuelleKarten();
  const knoepfe = reihe();
  if (t.zustand !== "kann-ich")
    knoepfe.appendChild(eingriffKnopf("Als gekonnt markieren", () => eingriff(() => hakeAb(ctx, stand, [t.id], heute)),
      { frage: () => abhakFrage(ctx, stand, [t.id], strang) }));
  if (mitSpiel && t.zustand === "verborgen")
    knoepfe.appendChild(eingriffKnopf("Freigeben", () => eingriff(() => gibFrei(stand, t.id))));
  if (t.zustand === "dran" || t.zustand === "kann-ich" || t.frei)
    knoepfe.appendChild(eingriffKnopf("Zurücksetzen", () => eingriff(() => setzeZurueck(ctx, stand, t.id)), { wegnehmen: true }));
  for (const k of knoepfe.children) k.setAttribute("groesse", "klein");
  if (knoepfe.children.length) innen.appendChild(knoepfe);
  det.appendChild(innen);
  li.appendChild(det);
  return li;
}

// Karten der Spiele eines Themas: digitale (spiele.json, Bild der Welt) und analoge (Anleitung „Mit echten Dingen“,
// Bild der Karte aus bild: im Kopf). Die analoge öffnet <ls-anregung> über dem Lernplan (mit PDF, wenn das Gerät
// drucken kann); Zurück schließt sie, der Baum bleibt, wie er war. Die digitale öffnet das Spiel für Erwachsene.
// Kurzbeschreibung: digital `text` aus spiele.json; analog `text` (oder `kurz`) im Kopf der Anleitung, sobald es ihn gibt.
// Kartenbild digital nach grundsaetze-bilder §16: die Figur des Spiels (karte.figur/zustand) vor der Welt (karte.welt).
const SITUATION_WORT = { tisch: "Am Tisch", bewegung: "In Bewegung", unterwegs: "Unterwegs" };
async function spielKarten(ziel, t, ctx, strang) {
  const spielNach = new Map((ctx.spiele.spiele || []).map((x) => [x.id, x]));
  for (const id of spieleFuer(ctx, t.id)) {
    const sp = spielNach.get(id);
    if (!sp) continue;
    const palette = paletteFuer(ctx, sp.karte?.welt ?? sp.welt);
    const figur = sp.karte?.figur
      ? `<ls-objekt art="${esc(sp.karte.figur)}"${sp.karte.zustand ? ` zustand="${esc(sp.karte.zustand)}"` : ""} still></ls-objekt>` : "";
    const b = el("button", null, "lp-karte digital");
    b.type = "button";
    b.innerHTML = `<span class="bild">${palette ? `<span class="welt">${vignetteSvg(palette)}</span>` : ""}`
      + `${figur || (palette ? "" : `<img src="${esc(sp.symbol || "symbole/mathe.svg")}" alt="">`)}</span>`
      + `<span class="text"><b>${esc(sp.titel || sp.id)}</b><span class="art">Digitales Spiel</span>${sp.text ? `<span class="kurz">${esc(sp.text)}</span>` : ""}</span>`;
    b.addEventListener("click", async () => { await sofortSpeichern(); location.href = `${sp.datei || sp.id + ".html"}?eltern&thema=${encodeURIComponent(t.id)}`; });
    ziel.appendChild(b);
  }
  const ed = echteDingeFuer(ctx, t.id);
  if (ed?.formen?.length && !ed.entwurf) {
    const a = await ladeAnleitung(strang, t.id);
    const kopfBild = String(a?.kopf?.bild ?? "");
    const figur = /figur:\s*([a-z0-9-]+)/.exec(kopfBild)?.[1], zustand = /zustand:\s*([a-z0-9-]+)/.exec(kopfBild)?.[1];
    const b = el("button", null, "lp-karte analog");
    b.type = "button";
    b.innerHTML = `<span class="bild">${figur ? `<ls-objekt art="${esc(figur)}"${zustand ? ` zustand="${esc(zustand)}"` : ""} still></ls-objekt>` : `<img src="symbole/hand.svg" alt="">`}</span>`
      + `<span class="text"><b>${esc(ed.titel || "Mit echten Dingen")}</b>`
      + `<span class="art">Mit echten Dingen: ${esc(ed.formen.map((f) => SITUATION_WORT[f.situation] || f.wort).join(", "))}</span>`
      + `${a?.kopf?.text || a?.kopf?.kurz ? `<span class="kurz">${esc(String(a.kopf.text || a.kopf.kurz))}</span>` : ""}</span>`;
    b.addEventListener("click", () => $("anregung").oeffne({ titel: t.name, thema: t.id, fach: strang, pdf: kann.drucken }));
    ziel.appendChild(b);
  }
  ziel.hidden = !ziel.childElementCount;
}

// ---------- Sachthemen ----------
// Alle Sachthemen (Welten im Lernplan) nach Themenkreisen, darin nach dem Lehrplan geordnet, ohne Klassen. Sachthemen
// haben eigene Geschichten und Spiele (Form aus spiele/geschichten/beurteilung.json), keine Lernthemen (Christian
// 2026-11-15). Nur Übersicht und Vorschau: kein Abhaken, kein Eingriff, kein „gekonnt“ (grundsaetze K7, 3.3).
// Spec docs/superpowers/specs/2026-11-15-sachthemen-eltern-design.md.
const SW_FILTER = [["alle", "Alle"], ["gesehen", "Gelesen/Gespielt"], ["offen", "Noch offen"]];
const SW_LEER = { gesehen: "Hier steht, was das Kind gelesen oder gespielt hat, sobald es eine Geschichte oder ein Spiel zu einem Sachthema kennt.",
  offen: "Das Kind kennt schon alles zu allen Sachthemen." };
const swZeigt = (filter, w) => filter === "alle" || (filter === "gesehen" ? w.zustand === "gesehen" : w.zustand !== "gesehen");
// Wort rechts in der Zeile: was gelesen/gespielt ist, sonst was es gibt
function swWort(w) {
  const da = w.inhalte.filter((x) => !x.fehlt);
  if (w.zustand === "kommt") return "kommt noch";
  const g = da.some((x) => x.art === "geschichte" && x.am), s = da.some((x) => x.art === "spiel" && x.am);
  if (g || s) return g && s ? "gelesen und gespielt" : g ? "gelesen" : "gespielt";
  return da.every((x) => x.art === "spiel") ? "noch nicht gespielt" : "noch nicht gelesen";
}
let swInhalt = null;
async function ladeSachInhalt() {
  if (!swInhalt) {
    const [beurteilung, liste] = await Promise.all(["geschichten/beurteilung.json", "geschichten/index.json"].map((f) => fetch(f).then((r) => r.json())));
    swInhalt = { beurteilung, geschichten: Array.isArray(liste?.geschichten) ? liste.geschichten : [] };
  }
  return swInhalt;
}
let swFilter = "alle";
const swOffen = new Set();
let swLauf = 0;

function swKopfWorte(welten) {
  const gesehen = welten.filter((w) => w.zustand === "gesehen").length;
  return gesehen === welten.length ? "alles angesehen" : gesehen ? "teils angesehen" : "noch nichts";
}

// neu = false beim ersten Öffnen des Reiters: alle Themenkreise zu (Christian: zugeklappt als Übersicht); beim Neuzeichnen
// nach einem Filterwechsel bleibt offen, was die Eltern selbst geöffnet haben.
async function sachthemen(spalte, neu = false) {
  if (neu !== true) swOffen.clear();
  const lauf = ++swLauf;
  spalte.append(el("h2", "Sachthemen"),
    el("p", "Zu Sachthemen wie Tieren, Wetter, Zeit oder Berufen gibt es eigene Geschichten und Spiele. Hier steht, worum es in jedem Thema geht, was es dazu gibt und was das Kind schon gelesen oder gespielt hat. Über den Titel können Sie selbst hineinsehen; dabei wird nichts gespeichert.", "vorspann"));
  let ctx, stand, inhalt;
  try { ctx = await ladeCtx(); stand = await ladeLernstand(ctx, heuteTag()); inhalt = await ladeSachInhalt(); }
  catch (e) {
    protokoll("Sachthemen: " + e);
    spalte.appendChild(el("p", "Die Sachthemen konnten nicht geladen werden. Bitte den Bereich neu öffnen.", "flaeche"));
    return;
  }
  if (tab !== "sachthemen" || lauf !== swLauf) return;
  const gruppen = elternSachthemen(ctx, stand, inhalt);

  const neuZeichnen = async () => {
    if (tab !== "sachthemen") return;
    const inh = $("inhalt"), oben = inh.scrollTop;
    spalte.replaceChildren();
    await sachthemen(spalte, true);
    inh.scrollTop = oben;
  };
  const filter = el("div", null, "lp-filter");
  filter.setAttribute("role", "group");
  filter.setAttribute("aria-label", "Zeigen");
  for (const [id, wort] of SW_FILTER) {
    const k = el("button", wort, id === swFilter ? "an" : "");
    k.type = "button";
    k.setAttribute("aria-pressed", String(id === swFilter));
    k.addEventListener("click", () => { if (swFilter !== id) { swFilter = id; neuZeichnen(); } });
    filter.appendChild(k);
  }
  spalte.appendChild(filter);

  const zeigt = (w) => swZeigt(swFilter, w);
  const sichtbar = gruppen.filter((g) => g.welten.some(zeigt));
  if (!sichtbar.length) {
    spalte.appendChild(el("p", SW_LEER[swFilter] || "Es gibt noch keine Sachthemen.", "flaeche leise"));
    return;
  }
  const block = el("section", null, "flaeche");
  block.setAttribute("aria-label", "Sachthemen");
  const kopf = el("div", null, "sw-kopf");
  kopf.appendChild(el("h3", "Nach Themenkreisen"));
  const klapp = knopf("Alles ausklappen");
  klapp.setAttribute("groesse", "klein");
  klapp.classList.add("klapp");
  kopf.appendChild(klapp);
  block.appendChild(kopf);
  const alleDetails = () => [...block.querySelectorAll(":scope > details.sw-gruppe")];
  const klappWort = () => klapp.setAttribute("wort", alleDetails().every((d) => d.open) ? "Alles einklappen" : "Alles ausklappen");
  klapp.addEventListener("click", () => {
    const offen = alleDetails().every((d) => d.open);
    for (const d of alleDetails()) d.open = !offen;
    klappWort();
  });

  for (const g of sichtbar) {
    const det = el("details", null, "lp-bereich sw-gruppe");
    det.dataset.id = g.id;
    det.open = swOffen.has(g.id);
    const sum = el("summary");
    const vignette = el("span", null, "sw-vignette");
    vignette.innerHTML = themenkreisSvg(g.id);
    sum.append(vignette, el("span", g.name, "name"), el("span", swKopfWorte(g.welten), "zustand leise"));
    det.appendChild(sum);
    const innen = el("div", null, "lp-bereich-innen");
    det.appendChild(innen);
    const fuelle = () => {
      if (innen.childElementCount) return;
      const ul = el("ul", null, "themen");
      for (const w of g.welten.filter(zeigt)) ul.appendChild(weltZeile(w));
      innen.appendChild(ul);
    };
    det.addEventListener("toggle", () => {
      if (det.open) { swOffen.add(g.id); fuelle(); } else swOffen.delete(g.id);
      klappWort();
    });
    if (det.open) fuelle();
    block.appendChild(det);
  }
  klappWort();
  spalte.appendChild(block);
}

function weltZeile(w) {
  const li = el("li");
  const det = el("details", null, "thema sw-welt z-" + w.zustand);
  det.dataset.id = w.id;
  const sum = el("summary");
  const punkt = el("span", null, "punkt");
  punkt.setAttribute("aria-hidden", "true");
  sum.append(punkt, el("span", w.name, "name"), el("span", swWort(w), "wort"));
  det.appendChild(sum);
  const innen = el("div", null, "innen");
  if (w.beschreibung) innen.appendChild(el("p", w.beschreibung));
  if (w.eltern) innen.appendChild(el("p", w.eltern, "leise"));
  const fehlt = w.inhalte.filter((x) => x.fehlt).map((x) => x.art);
  for (const x of w.inhalte.filter((y) => !y.fehlt)) {
    const p = el("p", null, "spiele-links inhalt");
    p.appendChild(document.createTextNode(x.art === "geschichte" ? "Geschichte: " : "Spiel: "));
    const a = el("a", x.titel);
    a.href = x.art === "geschichte"
      ? `geschichte.html?id=${encodeURIComponent(x.id)}&eltern&weiter=eltern.html`
      : (x.datei || x.id + ".html") + "?eltern";
    p.appendChild(a);
    if (x.am) p.appendChild(el("span", `${x.art === "geschichte" ? "gelesen" : "zuerst gespielt"} ${amDatum(x.am)}`, "leise"));
    innen.appendChild(p);
  }
  if (fehlt.length) innen.appendChild(el("p", fehlt.length === 2 ? "Geschichte und Spiel entstehen noch."
    : fehlt[0] === "geschichte" ? "Eine Geschichte entsteht noch." : "Ein Spiel entsteht noch.", "leise"));
  det.appendChild(innen);
  li.appendChild(det);
  return li;
}

// ---------- Geschichten ----------
// Stufe je Profil (grundsaetze 9.3), Einstellung "geschichten", Standard sanft. Je Stufe ein Satz Vorschau.
const STUFEN = [
  { id: "ruhig", name: "Ruhig", fuer: "Für empfindsame Kinder, in jedem Alter.",
    was: "Suchen, Helfen, Sortieren, Wetter. Keine Komplikation, kein Dunkel.",
    beispiel: "Zum Beispiel: Zwei Kinder legen im Garten die Äpfel nach Größe in Kisten, und am Ende ist alles verstaut." },
  { id: "sanft", name: "Sanft", fuer: "Vorschlag für 6 bis 8 Jahre. Der Standard.",
    was: "Dazu eine kleine Komplikation, die sofort gelöst ist. Ab 8 auch ein kleiner Rückschlag ohne Schuld.",
    beispiel: "Zum Beispiel: Der Schlüssel zum Gartenhaus ist weg, das Kind sieht ihn gleich im Gras, und alle gehen hinein." },
  { id: "abenteuer", name: "Abenteuer", fuer: "Nur auf Wunsch, etwa 8 bis 10 Jahre.",
    was: "Dazu milder Grusel mit komischer Auflösung und längere Bögen. Jede Runde endet in Ruhe.",
    beispiel: "Zum Beispiel: Im Nebel am Teich raschelt es, es ist eine Eule, und auf dem Heimweg lachen alle darüber." },

async function geschichten(spalte) {

    el("p", "Wie aufregend die Geschichten in den Spielen sein dürfen. Was ein Kind verträgt, hängt mehr vom Kind ab als vom Alter. Die Stufe stellen nur Sie um; überspringen kann das Kind jede Geschichte jederzeit.", "vorspann"));
  try { await ladeEinstellungen(); } catch (e) { protokoll("Einstellungen: " + e); }
  if (tab !== "geschichten") return;
  const status = el("p", "", "status leise");
  status.setAttribute("role", "status");
  const raster = el("div", null, "stufen");
  const zeichne = () => {
    const jetzt = geschichtenStufe();
    raster.replaceChildren(...STUFEN.map((s) => {
      const an = s.id === jetzt;
      const karte = el("section", null, "flaeche stufe" + (an ? " markiert" : ""));
      karte.setAttribute("aria-label", s.name);
      const oben = el("div", null, "spalten");
      oben.append(el("h3", s.name), el("p", s.fuer, "leise klein"), el("p", s.was, "text"), el("p", s.beispiel, "beispiel leise text"));
      karte.appendChild(oben);
      if (an) karte.appendChild(el("p", "Eingestellt", "wahl gewaehlt"));

          zeichne();
        });
        k.setAttribute("name", s.name + " wählen");
        karte.appendChild(k);
      }
      return karte;
    }));
  };
  zeichne();
  spalte.append(raster, status);

  const warn = el("section", null, "flaeche");
  warn.append(el("h3", "Wann eine Stufe ruhiger?"),
    el("p", "Wenn das Kind Geschichten oft überspringt, den Ton abschaltet, ein Spiel meidet oder abends noch darüber spricht: dann eine Stufe ruhiger stellen und in Ruhe darüber reden."));
  spalte.appendChild(warn);
}

// ---------- Spielzeit ----------
// Grenzen für digitale Spiele (Spec 2026-11-14-spielzeit). Alles im Standard aus; Startseite, Regal und
// „Mit echten Dingen“ sind nie gesperrt. Jede Änderung wird sofort gespeichert.
const WOCHENTAGE = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
const TAG_WERTE = [null, ...Array.from({ length: 23 }, (_, i) => 10 + 5 * i)];      // aus, 10 … 120
const WOCHE_WERTE = [null, ...Array.from({ length: 55 }, (_, i) => 30 + 15 * i)];   // aus, 30 … 840
const UHR_WERTE = Array.from({ length: 33 }, (_, i) => 360 + 30 * i);                 // 6:00 … 22:00 Uhr
// 870 → "14:30 Uhr"
const uhr = (min) => `${Math.floor(min / 60)}:${String(min % 60).padStart(2, "0")} Uhr`;
const LAGE_TEXT = {
  frei: "Ihr Kind kann gerade digitale Spiele spielen.",
  tag: "Heute ist kein Spieltag.",
  "tag-voll": "Die Spielzeit für heute ist um.",
  "woche-voll": "Die Spielzeit für diese Woche ist um.",
  frueh: "Digitale Spiele gehen heute erst später los.",
  spaet: "Die Spielzeit für heute ist vorbei.",
  aus: "Digitale Spiele sind ausgeblendet.",
};
// 75 → "1 Stunde 15 Minuten"; 1 → "1 Minute"
function dauer(min) {
  const h = Math.floor(min / 60), m = min % 60;
  const teile = [];
  if (h) teile.push(h === 1 ? "1 Stunde" : `${h} Stunden`);
  if (m || !h) teile.push(m === 1 ? "1 Minute" : `${m} Minuten`);
  return teile.join(" ");
}
const minutenAus = (sek) => Math.floor(sek / 60);

async function spielzeit(spalte) {
  spalte.append(el("h2", "Spielzeit"),
    el("p", "Wann und wie lange Ihr Kind digitale Spiele spielen darf. Startseite, Regal und „Mit echten Dingen“ sind nie gesperrt und zählen nicht mit. Im Standard ist alles aus: Die App selbst setzt keine Zeit fest. Ist die Zeit um, spielt Ihr Kind die laufende Runde zu Ende.", "vorspann"));
  try { await ladeEinstellungen(); } catch (e) { protokoll("Einstellungen: " + e); }
  let st = aktuell(await lade(SPIELZEIT_STAND, {}), new Date());
  if (tab !== "spielzeit") return;
  const status = el("p", "", "status leise");
  status.setAttribute("role", "status");
  const r = () => regeln(einstellung("spielzeit", null));
  const setze = async (aenderung, meldung) => {
    setzeEinstellung("spielzeit", { ...r(), ...aenderung });
    await sofortSpeichern();
    status.textContent = meldung;
    zeichne();
  };

  // Stand: heute, diese Woche, Zugabe
  const standFlaeche = el("section", null, "flaeche");
  standFlaeche.setAttribute("aria-label", "Stand");
  // Tage
  const tageFlaeche = el("section", null, "flaeche");
  tageFlaeche.setAttribute("aria-label", "Spieltage");
  // Grenzen
  const grenzenFlaeche = el("section", null, "flaeche");
  grenzenFlaeche.setAttribute("aria-label", "Höchstens");
  // Uhrzeit
  const uhrFlaeche = el("section", null, "flaeche");
  uhrFlaeche.setAttribute("aria-label", "Uhrzeit");
  // Ausblenden
  const ausFlaeche = el("section", null, "flaeche");
  ausFlaeche.setAttribute("aria-label", "Digitale Spiele ausblenden");

  // Eine Zeile Wert mit zwei Knöpfen; null in werte heißt „aus“. zeige formatiert den Wert.
  const grenze = (titel, wert, werte, feld, { zeige = dauer, worte = ["Weniger", "Mehr"] } = {}) => {
    const zeile = el("div", null, "grenze");
    const links = el("div", null, "spalten");
    links.append(el("h4", titel), el("p", wert === null ? "Aus" : zeige(wert), "wert"));
    const i = Math.max(0, werte.indexOf(wert));
    const weniger = knopf(worte[0], { klasse: i === 0 ? "aus" : "" });
    const mehr = knopf(worte[1], { klasse: i === werte.length - 1 ? "aus" : "" });
    weniger.setAttribute("name", `${titel}: ${worte[0].toLowerCase()}`);
    mehr.setAttribute("name", `${titel}: ${worte[1].toLowerCase()}`);
    const neu = (w) => setze({ [feld]: w }, `${titel}: ${w === null ? "aus" : zeige(w)}.`);
    weniger.addEventListener("click", () => { if (i > 0) neu(werte[i - 1]); });
    mehr.addEventListener("click", () => { if (i < werte.length - 1) neu(werte[i + 1]); });
    zeile.append(links, reihe(weniger, mehr));
    return zeile;
  };

  function zeichne() {
    const regel = r(), jetzt = new Date();
    const l = spielLage(regel, st, jetzt);

    const heute = minutenAus(l.heute), woche = minutenAus(l.woche);
    const zeilen = el("div", null, "zeit-stand");
    zeilen.append(
      el("p", l.frei ? LAGE_TEXT.frei : LAGE_TEXT[l.grund], "lage"),
      el("p", regel.proTag === null ? `Heute gespielt: ${dauer(heute)}.` : `Heute: ${dauer(heute)} von ${dauer(regel.proTag)}.`),
      el("p", regel.proWoche === null ? `Diese Woche gespielt: ${dauer(woche)}.` : `Diese Woche: ${dauer(woche)} von ${dauer(regel.proWoche)}.`));
    if (regel.von !== null || regel.bis !== null) {
      zeilen.append(el("p", regel.von !== null && regel.bis !== null ? `Uhrzeit: ${uhr(regel.von)} bis ${uhr(regel.bis)}.`
        : regel.von !== null ? `Uhrzeit: ab ${uhr(regel.von)}.` : `Uhrzeit: bis ${uhr(regel.bis)}.`));
    }
    if (l.zugabe) zeilen.append(el("p", `Heute dazugegeben: ${dauer(l.zugabe)}.`, "leise"));
    const mehr = knopf(`Heute ${ZUGABE_MINUTEN} Minuten mehr`, { klasse: regel.ausgeblendet ? "aus" : "" });
    mehr.addEventListener("click", async () => {
      if (r().ausgeblendet) return;
      st = gibZugabe(st, ZUGABE_MINUTEN, new Date());
      speichere(SPIELZEIT_STAND, st);
      await sofortSpeichern();
      status.textContent = `Heute ${ZUGABE_MINUTEN} Minuten mehr.`;
      zeichne();
    });
    standFlaeche.replaceChildren(el("h3", "Heute"), zeilen, reihe(mehr),
      el("p", "Gilt nur für heute, auch an einem Tag ohne Spiele und über die Grenze der Woche hinaus.", "leise klein"));

    const tage = el("div", null, "tage");
    tage.append(...WOCHENTAGE.map((name, i) => {
      const nr = i + 1, an = regel.tage.includes(nr);
      const k = knopf(name.slice(0, 2), { art: an ? "haupt" : undefined });
      k.setAttribute("name", `${name}: ${an ? "erlaubt" : "keine Spiele"}`);
      k.setAttribute("aria-pressed", String(an));
      k.addEventListener("click", () => {
        const neu = an ? regel.tage.filter((t) => t !== nr) : [...regel.tage, nr];
        setze({ tage: neu }, `${name}: ${an ? "keine digitalen Spiele" : "erlaubt"}.`);
      });
      return k;
    }));
    tageFlaeche.replaceChildren(el("h3", "An diesen Tagen"), tage,
      el("p", "Gefüllt heißt: An diesem Tag sind digitale Spiele erlaubt. Die Woche läuft von Montag bis Sonntag.", "leise klein"));

    grenzenFlaeche.replaceChildren(el("h3", "Höchstens"),
      grenze("Am Tag", regel.proTag, TAG_WERTE, "proTag"),
      grenze("In der Woche", regel.proWoche, WOCHE_WERTE, "proWoche"),
      el("p", "Gezählt wird nur, solange ein digitales Spiel offen ist und Ihr Kind darin etwas tut. Sind weniger als fünf Minuten übrig, sagt der Erzähler am Ende einer Runde einmal: „Gleich ist für heute Schluss.“", "leise klein"));

    // Beginn immer vor dem Ende: die Liste des einen endet vor dem Wert des anderen. „Aus“ liegt beim Beginn vor
    // 6:00 Uhr, beim Ende nach 22:00 Uhr (Später aus „aus“ heißt 6:00, Früher aus „aus“ heißt 22:00).
    const uhrArt = { zeige: uhr, worte: ["Früher", "Später"] };
    uhrFlaeche.replaceChildren(el("h3", "Uhrzeit"),
      grenze("Frühestens ab", regel.von, [null, ...UHR_WERTE.filter((w) => regel.bis === null || w < regel.bis)], "von", uhrArt),
      grenze("Spätestens bis", regel.bis, [...UHR_WERTE.filter((w) => regel.von === null || w > regel.von), null], "bis", uhrArt),
      el("p", "Vor dem Beginn und nach dem Ende gibt es keine digitalen Spiele. Läuft gerade eine Runde, spielt Ihr Kind sie zu Ende. „Heute mehr“ gibt Minuten dazu, verschiebt aber keine Uhrzeit.", "leise klein"));

    const schalter = knopf(regel.ausgeblendet ? "Wieder zeigen" : "Ausblenden", { art: regel.ausgeblendet ? "haupt" : undefined });
    schalter.setAttribute("aria-pressed", String(regel.ausgeblendet));
    schalter.addEventListener("click", () => setze({ ausgeblendet: !regel.ausgeblendet },
      regel.ausgeblendet ? "Digitale Spiele werden wieder gezeigt." : "Digitale Spiele sind ausgeblendet."));
    ausFlaeche.replaceChildren(el("h3", "Digitale Spiele ausblenden"),
      el("p", regel.ausgeblendet
        ? "Ausgeblendet: Die Startseite zeigt keine digitalen Spiele, auch nicht mit „Heute mehr“. Regal, Fächer und „Mit echten Dingen“ bleiben."
        : "Die Startseite zeigt dann keine digitalen Spiele mehr. Regal, Fächer und „Mit echten Dingen“ bleiben."),
      reihe(schalter));
  }
  zeichne();
  spalte.append(standFlaeche, tageFlaeche, grenzenFlaeche, uhrFlaeche, ausFlaeche, status);
}

// ---------- Updates (Tab-Id geraet) ----------
// Nur, was faehigkeiten erlaubt: Updates gibt es in der installierten App (Beenden steht in der Leiste).
function geraet(spalte) {
  spalte.appendChild(el("h2", "Updates"));
  const ver = el("section", null, "flaeche");
  const v = el("p", "Version …", "version");
  ver.append(el("h3", "Installiert"), v);
  appVersion().then((x) => { v.textContent = x ? "Version " + x : "Version unbekannt"; })
    .catch(() => { v.textContent = "Version unbekannt"; });
  if (!kann.update) ver.appendChild(el("p", "Updates gibt es nur in der installierten App.", "leise"));
  spalte.appendChild(ver);
  if (kann.update) updates(spalte);
}

function updates(spalte) {
  const karte = el("section", null, "flaeche");
  const status = el("p", "Hier lässt sich nach einer neuen Version suchen.", "status");
  status.setAttribute("role", "status");
  const suche = knopf("Nach Updates suchen", { symbol: "update.svg" });
  const neu = el("div", null, "spalten"); neu.hidden = true;
  karte.append(el("h3", "Updates"), status, reihe(suche), neu);
  spalte.appendChild(karte);

  suche.addEventListener("click", async () => {
    if (suche.classList.contains("aus")) return;
    suche.classList.add("aus"); neu.hidden = true; neu.replaceChildren();
    status.textContent = "Suche läuft …";
    const r = await pruefeUpdate();
    suche.classList.remove("aus");
    if (tab !== "geraet") return;
    if (r.status === "aktuell") status.textContent = "Alles aktuell.";
    else if (r.status === "offline") { status.textContent = "Kein Internet. Bitte später nochmal suchen."; protokoll("Update-Suche: offline oder Fehler"); }
    else if (r.status === "kein-app") status.textContent = "Updates gibt es nur in der installierten App.";
    else {
      status.textContent = "Version " + r.version + " ist verfügbar.";
      neu.hidden = false;
      neu.appendChild(el("h4", "Neu in Version " + r.version));
      if (r.notiz) neu.appendChild(el("p", r.notiz, "notiz text"));
      const los = knopf("Installieren und neu starten", { art: "haupt" });
      const balken = el("div", null, "laden"); balken.hidden = true;
      const fuell = el("i"); balken.appendChild(fuell);
      neu.append(reihe(los), balken);
      los.addEventListener("click", () => installieren(r.update, los, balken, fuell, status));
    }
  });
}
async function installieren(update, los, balken, fuell, status) {
  if (los.classList.contains("aus")) return;
  los.classList.add("aus"); balken.hidden = false; status.textContent = "Das Update wird geladen …";
  installiertGerade = true;
  try {
    await sofortSpeichern();
    await kioskPause(true);
    let gesamt = 0, geladen = 0;
    let timer;
    const zeit = new Promise((_, nein) => { timer = setTimeout(() => nein(new Error("Zeitlimit beim Laden")), 10 * 60 * 1000 + 5000); });
    await Promise.race([update.downloadAndInstall((ev) => {
      if (ev.event === "Started") gesamt = ev.data?.contentLength ?? 0;
      else if (ev.event === "Progress") { geladen += ev.data?.chunkLength ?? 0; if (gesamt) fuell.style.width = Math.min(100, geladen / gesamt * 100) + "%"; }
      else if (ev.event === "Finished") fuell.style.width = "100%";
    }, { timeout: 10 * 60 * 1000 }), zeit]).finally(() => clearTimeout(timer));
    status.textContent = "Fertig. Die App startet neu …";
    if (!(await neuStart())) throw new Error("Neustart gescheitert");
  } catch (e) {
    protokoll("Update installieren: " + (e?.message ?? e));
    installiertGerade = false;
    await kioskPause(false);
    status.textContent = "Das Update hat nicht geklappt. Bitte später nochmal versuchen.";
    los.classList.remove("aus"); balken.hidden = true;
  }
}

// ---------- Hinweise ----------
async function hinweise(spalte) {
  spalte.appendChild(el("h2", "Hinweise"));

  // Stimme: Pflichthinweis (Azure-Vorgabe für Angebote für Kinder; docs/stimme.md §5). Bleibt, solange eine erzeugte Stimme spricht.
  const stimme = el("section", null, "flaeche");
  stimme.append(el("h3", "Die Stimme der Spiele"),
    el("p", "Die Spiele lesen mit einer computererzeugten Stimme vor (Microsoft Azure). Die Sätze wurden vorab erzeugt und liegen auf diesem Gerät; beim Spielen geht nichts ins Internet."));
  spalte.appendChild(stimme);

  // Sicher und stark (grundsaetze 3.3); „Missbrauch“ steht nur hier, nie im Kindertext.
  const schutz = el("section", null, "flaeche");
  schutz.append(el("h3", "Sicher und stark"),
    el("p", "Was das Kind über seinen Körper, seine Gefühle und Hilfe lernt, folgt diesen sieben Botschaften:"));
  const bot = el("ol", null, "botschaften");
  for (const b of ["Mein Körper gehört mir.", "Ich vertraue meinem Gefühl.", "Es gibt gute, schlechte und komische Berührungen.",
    "Ich darf Nein sagen.", "Es gibt gute und schlechte Geheimnisse. Schlechte darf ich immer weitererzählen.",
    "Ich hole mir Hilfe, so lange, bis mir jemand hilft.", "Ich bin nicht schuld."]) bot.appendChild(el("li", b));
  schutz.appendChild(bot);
  schutz.appendChild(el("p", "Ein Kind zu schützen ist Aufgabe der Erwachsenen. Kein Kind muss sich selbst wehren können. Die App ersetzt kein Präventionsprogramm in Kita, Schule oder Beratungsstelle."));
  schutz.appendChild(el("h4", "Im Alltag"));
  const alltag = el("ul", null, "punkte-liste");
  for (const a of ["Kitzeln und Toben sofort beenden, wenn das Kind Stopp sagt.",
    "Keine Küsse oder Umarmungen verlangen, auch nicht für Verwandte. Winken reicht.",
    "Körperteile richtig benennen, auch Penis, Vulva und Po. Wer die Wörter kennt, kann erzählen und wird verstanden.",
    "Überraschungen wie ein Geschenk von Geheimnissen unterscheiden, bei denen das Kind ein Nein-Gefühl hat."]) alltag.appendChild(el("li", a));
  schutz.appendChild(alltag);
  schutz.appendChild(el("h4", "Wenn ein Kind etwas erzählt"));
  schutz.appendChild(el("p", "Ruhig zuhören, dem Kind glauben und sagen, dass es richtig war, davon zu erzählen. Nicht ausfragen und nichts versprechen, was sich nicht halten lässt. Dann Hilfe holen, zum Beispiel hier:"));
  const nr = el("dl", null, "nummern");
  for (const [n, w] of [["116 111", "Nummer gegen Kummer, für Kinder und Jugendliche, kostenlos und anonym"],
    ["0800 111 0 550", "Elterntelefon der Nummer gegen Kummer, kostenlos und anonym"],
    ["0800 22 55 530", "Hilfe-Telefon Sexueller Missbrauch, kostenlos und anonym"]]) nr.append(el("dt", n), el("dd", w));
  schutz.appendChild(nr);
  schutz.appendChild(el("p", "Die Sprechzeiten stehen auf den Seiten der Stellen.", "leise klein"));
  spalte.appendChild(schutz);

  // Lücken: Themen des Lernplans, für die es noch kein Spiel gibt
  const lk = el("section", null, "flaeche");
  lk.append(el("h3", "Themen ohne Spiel"),
    el("p", "Der Lernplan folgt dem Lehrplan der Grundschule. Für viele Themen gibt es noch kein Spiel; das Kind sieht sie nicht."));
  spalte.appendChild(lk);
  let ctx;
  try { ctx = await ladeCtx(); } catch (e) { protokoll("Lücken: " + e); lk.appendChild(el("p", "Der Lernplan konnte nicht geladen werden.", "leise")); return; }
  if (tab !== "hinweise") return;
  const l = luecken(ctx);
  const ohne = new Set(l.ohneSpiel);
  const planNach = new Map((ctx.plan.themen || []).map((t) => [t.id, t]));
  for (const strang of faecher(ctx)) {
    const alle = (ctx.plan.themen || []).filter((t) => t.strang === strang);
    if (!alle.length) continue;
    const fehlt = alle.filter((t) => ohne.has(t.id));
    const det = el("details", null, "aufklapp luecken-fach");
    const sum = el("summary");
    sum.append(el("span", fachName(ctx, strang)),
      el("span", fehlt.length ? `${fehlt.length} von ${alle.length} Themen noch ohne Spiel` : "alle Themen mit Spiel", "anzahl"));
    det.appendChild(sum);
    const nachKlasse = new Map();
    for (const t of fehlt) {
      const k = t.klasse ?? 0;
      if (!nachKlasse.has(k)) nachKlasse.set(k, new Map());
      const b = nachKlasse.get(k);
      const name = t.bereich || "Ohne Bereich";
      if (!b.has(name)) b.set(name, []);
      b.get(name).push(t.name);
    }
    for (const [k, bereiche] of [...nachKlasse].sort((a, b) => a[0] - b[0])) {
      det.appendChild(el("p", k ? `Klasse ${k}` : "Ohne Klasse", "klasse-titel"));
      for (const [bereich, namen] of bereiche) {
        const p = el("p", null, "bereich klein");
        p.append(el("b", bereich + ": "), document.createTextNode(namen.join(", ")));
        det.appendChild(p);
      }
    }
    const teil = l.teilweise.filter((x) => planNach.get(x.thema)?.strang === strang);
    if (teil.length) {
      det.appendChild(el("p", "Nur zum Teil im Spiel", "klasse-titel"));
      det.appendChild(el("p", teil.map((x) => planNach.get(x.thema)?.name || x.thema).join(", "), "bereich klein"));
    }
    lk.appendChild(det);
  }
}

// ---------- Sicherheit ----------
// "2026-11-14T07:40:11.000Z Text" → Zeit in Ortszeit fett davor, dann der Text
function protokollZeile(z) {
  const li = el("li");
  const m = /^(\d{4}-\d{2}-\d{2}T[\d:.]+Z) (.*)$/s.exec(z);
  const d = m ? new Date(m[1]) : null;
  if (!d || isNaN(d.getTime())) { li.textContent = z; return li; }
  const zeit = `${datum(d.toLocaleDateString("sv"))}, ${d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })} Uhr`;
  li.append(el("b", zeit + ": "), document.createTextNode(m[2]));
  return li;
}
function sicherheit(spalte, hinweis) {
  spalte.appendChild(el("h2", "Sicherheit"));
  const pin = el("section", null, "flaeche");
  const status = el("p", hinweis === "pin-ok" ? "Die neue PIN ist gespeichert." : "Die PIN schützt diesen Bereich. Sie gilt für das ganze Gerät.", "status");
  status.setAttribute("role", "status");
  const k = knopf("PIN ändern", { symbol: "schloss.svg" });
  k.addEventListener("click", () => pinAnsicht("neu"));
  pin.append(el("h3", "PIN"), status, reihe(k));
  spalte.appendChild(pin);

  const prot = el("section", null, "flaeche");
  const zeilen = protokollLesen();
  const ul = el("ul", null, "protokoll");
  ul.replaceChildren(...(zeilen.length ? zeilen.slice().reverse().map(protokollZeile) : [el("li", "Keine Einträge. Alles in Ordnung.")]));
  prot.append(el("h3", "Protokoll"), el("p", "Technische Meldungen der App, neueste zuerst. Hilfreich, wenn etwas nicht klappt.", "leise"), ul);
  spalte.appendChild(prot);
}
