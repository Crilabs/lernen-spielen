<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernen Spielen</title>
<link rel="stylesheet" href="rahmen/seite.css">
<style>
/* Startseite (Spec docs/superpowers/specs/2026-11-14-ansichten-design.md, „Startseite“).
   Drei Reihen, mittig gestapelt, wenig Wahl (N2): oben bis zu drei Spiele, deren Thema gerade dran ist; darunter die
   Fächer, für die es Spiele gibt; unten „Mein Regal“ mit den drei zuletzt gekonnten Dingen. Jede Reihe hat ihre
   eigene Gestalt (groß mit Fachrahmen, klein mit Fachkachel, Holz), damit die Ordnung ohne Worte lesbar ist.
   Alles ist ein Link und drückbar (Papier, Tinte-Kontur, Schatten). Keine Zahl als Fortschritt, keine Zählung, kein
   Klassenbezug (N5, N8). Ohne Spiele steht nur das Regal da, groß und in der Mitte, ohne Meldung.
   Zahnrad für Erwachsene rechts in der Kopfleiste: gedrückt halten, dabei läuft leise ein Ring herum.
   Diese Seite liest den Lernstand nur, sie schreibt ihn nie. */
body {
  -webkit-user-select: none;
  user-select: none;
}

.start {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4.4rem;
  padding: 3.2rem 6rem 4rem;
}
.reihe {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 3.6rem;
  width: 100%;
  margin: 0;
  padding: 0;
  list-style: none;
}
.reihe[hidden] { display: none; }
.reihe > li { display: flex; min-width: 0; }

/* Gemeinsam: jede Kachel ist ein Link, drückbar wie ein Nebenknopf. */
.kachel {
  position: relative;
  display: flex;
  color: var(--ls-tinte);
  text-decoration: none;
  background: var(--ls-papier);
  border: var(--ls-kontur) solid var(--ls-tinte);
  box-shadow: var(--ls-schatten);
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.kachel > * { pointer-events: none; }
.kachel:active { transform: translateY(0.3rem); box-shadow: var(--ls-schatten-unten); }
.kachel:focus-visible { outline: 0.5rem solid var(--ls-tinte); outline-offset: 0.8rem; }

/* --- Dran: das Spiel zum Thema, das gerade dran ist ------------------------------------------- */
/* Rahmen in der Füllung des Fachs (innen an der Kontur). Oben links das Spielsymbol auf einem Feld in der Füllung
   mit Tinte-Kontur (wie die Fachkachel und die Spiel-Kachel der Fach-Seite; Spielsymbole sind in Tinte gezeichnet),
   darunter in voller Breite der Spielname im Tief-Ton (wie in der Kopfleiste des Spiels) und leiser das Thema. */
.reihe.dran { flex-wrap: nowrap; }
.reihe.dran > li { flex: 0 1 54rem; }
.dran .kachel {
  flex-direction: column;
  align-items: flex-start;
  width: 100%;
  padding: 2.8rem 3.2rem 2.8rem;
  gap: 1.8rem;
  border-radius: var(--ls-radius-gross);
  box-shadow: inset 0 0 0 1rem var(--fach-fuellung), var(--ls-schatten);
}
.dran .kachel:active { box-shadow: inset 0 0 0 1rem var(--fach-fuellung), var(--ls-schatten-unten); }
.dran .bild {
  flex: none;
  display: grid;
  place-items: center;
  width: 12rem;
  height: 12rem;
  border: var(--ls-kontur) solid var(--ls-tinte);
  border-radius: var(--ls-radius);
  background: var(--fach-fuellung);
}
.dran .bild img { display: block; width: 8.4rem; height: 8.4rem; object-fit: contain; }
.dran .text { display: flex; flex-direction: column; gap: 0.4rem; width: 100%; min-width: 0; }
.dran b, .dran span.thema {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.dran b { font-size: 5.2rem; line-height: 1.2; color: var(--fach-tief); }
.dran span.thema { font-size: 3.4rem; line-height: 1.3; color: var(--ls-tinte-weich); }

/* --- Fächer: die Fachkachel (flach, wie in der Kopfleiste) auf Papier, der Name darunter ---------- */
/* Eine Reihe, auch mit allen sechs Fächern; ein langer Name bricht zwischen Wörtern um. */
.reihe.fach { flex-wrap: nowrap; gap: 3.2rem; }
.reihe.fach > li { flex: 0 1 25rem; }
.fach .kachel {
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 2.2rem 1.2rem 2rem;
  gap: 1.4rem;
  border-radius: var(--ls-radius);
}
.fach .zeichen {
  flex: none;
  width: 10rem;
  height: 10rem;
  padding: 1.8rem;
  border: var(--ls-kontur) solid var(--ls-tinte);
  border-radius: var(--ls-radius);
  background: var(--fach-fuellung);
}
.fach .zeichen i {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--ls-tinte);
  -webkit-mask: var(--bild) center / contain no-repeat;
  mask: var(--bild) center / contain no-repeat;
}
/* Wörter nie trennen (Kinder lesen gerade erst): lange Namen brechen nur zwischen Wörtern um. */
.fach b { font-size: 3.6rem; line-height: 1.15; text-align: center; hyphens: manual; }

/* --- Mein Regal: ein Stück vom Regal (Kante, Ahorn, flach) mit den drei zuletzt gekonnten Dingen ---- */
.regal .kachel {
  align-items: center;
  gap: 3.6rem;
  padding: 2rem 4.4rem 2rem 2rem;
  border-radius: var(--ls-radius-gross);
}
.regal .stueck {
  flex: none;
  padding: 1.6rem;
  background: var(--ls-kante);
  border: var(--ls-kontur) solid var(--ls-tinte);
  border-radius: var(--ls-radius);
}
.regal .fach-holz {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 2.4rem;
  min-width: 44rem;
  height: 12.4rem;
  padding: 0 3.2rem 1.4rem;
  background: var(--ls-ahorn);
  border: var(--ls-kontur) solid var(--ls-tinte);
  border-radius: var(--ls-radius-klein);
}
.regal .ding { display: flex; align-items: flex-end; }
.regal ls-perlenstab { height: 3.2rem; }
.regal ls-wortart { height: 7rem; }
.regal .karte {
  display: grid;
  place-items: center;
  min-width: 6.4rem;
  height: 8.6rem;
  padding: 0 2rem;
  white-space: nowrap;
  border: var(--ls-kontur) solid var(--ls-tinte);
  border-radius: var(--ls-radius-klein);
  background: var(--ls-papier);
  box-shadow: inset 0 0 0 0.8rem var(--ls-papier), inset 0 0 0 1.1rem var(--fach-fuellung);
  font-size: 3.8rem;
  font-weight: 700;
  line-height: 1;
}
.regal .karte.symbol { padding: 0; }
.regal .karte i {
  display: block;
  width: 3.4rem;
  height: 3.4rem;
  background: var(--ls-tinte);
  -webkit-mask: var(--bild) center / contain no-repeat;
  mask: var(--bild) center / contain no-repeat;
}
.regal b { font-size: 5.2rem; line-height: 1.2; white-space: nowrap; }

/* Ohne Spiele: das Regal allein, größer, Name unter dem Holz. */
.start.allein .regal .kachel {
  flex-direction: column;
  gap: 2.8rem;
  padding: 3.2rem 3.2rem 3.6rem;
}
.start.allein .regal .fach-holz { min-width: 84rem; height: 20rem; gap: 4.4rem; padding-bottom: 2.2rem; }
.start.allein .regal ls-perlenstab { height: 5.2rem; }
.start.allein .regal ls-wortart { height: 11.6rem; }
.start.allein .regal .karte { height: 13rem; min-width: 10rem; padding: 0 2.8rem; font-size: 6rem; }
.start.allein .regal .karte i { width: 5.4rem; height: 5.4rem; }
.start.allein .regal b { font-size: 6rem; }

/* --- Zahnrad für Erwachsene (im Slot rechts der Kopfleiste) ------------------------------------ */
/* Ein kleiner Nebenknopf; gedrückt halten führt zum Elternbereich. Während des Haltens erscheint ein feiner Ring
   in Tinte weich und schließt sich; früher loslassen: nichts. */
.zahnrad {
  position: relative;
  display: flex;
  width: 11rem;
  height: 11rem;
  touch-action: none;
}
.zahnrad svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
}
.zahnrad circle {
  fill: none;
  stroke: var(--ls-tinte-weich);
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-dasharray: 100;
  stroke-dashoffset: 100;
}
.zahnrad.haelt svg { opacity: 1; }
.zahnrad.haelt circle { stroke-dashoffset: 0; transition: stroke-dashoffset var(--halten) linear; }

@media (max-aspect-ratio: 4/3) {
  .start { padding-left: 3.2rem; padding-right: 3.2rem; gap: 4rem; }
  .reihe { gap: 2.4rem; }
  .reihe.fach { gap: 2.4rem; }
}
</style>
</head>
<body>
<ls-leiste id="leiste" spiel="start" titel="Lernen Spielen" ohne-haus>
  <span class="zahnrad" id="zahnrad" slot="rechts"><ls-knopf id="eltern" symbol="zahnrad.svg" name="Für Erwachsene: gedrückt halten" groesse="klein" stumm></ls-knopf><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15.6" pathLength="100"/></svg></span>
</ls-leiste>
<main class="buehne">
  <div class="spielflaeche">
    <nav class="start" id="start" aria-label="Lernen Spielen">
      <ul class="reihe dran" id="dran" hidden></ul>
      <ul class="reihe fach" id="faecher" hidden></ul>
      <ul class="reihe regal"><li><a class="kachel" id="regal" href="regal.html" aria-label="Mein Regal">
        <span class="stueck" aria-hidden="true"><span class="fach-holz" id="dinge"></span></span><b>Mein Regal</b>
      </a></li></ul>
    </nav>
  </div>
</main>

<script type="module">
import { sperreTouch, protokoll, esc, linkKlick } from "./lernspiel.js";
import { ladeLernstand, gekonnteThemen, dranThemen } from "./lernsteuerung.js";
import { sprich } from "./kern/stimme.js";
import { sageEinmal } from "./kern/sitzung.js";
import { FACH, FACH_SYMBOLE } from "./rahmen/stil.js";
import { materialFuer, bausteinHtml } from "./rahmen/material.js";
import "./rahmen/leiste.js";
import "./rahmen/knopf.js";
import "./rahmen/perlenstab.js";
import "./rahmen/wortart.js";

/** So lange hält ein Erwachsener das Zahnrad (wie bisher). */
const HALTEN_MS = 3000;

sperreTouch();
const leiste = document.getElementById("leiste");
zahnrad();
start();

async function start() {
  let ctx = null, stand = null;
  try {
    const [plan, spiele] = await Promise.all(["lernplan.json", "spiele.json"].map((d) => fetch(d).then((r) => r.json())));
    ctx = { plan, spiele };
    stand = await ladeLernstand(ctx, new Date().toLocaleDateString("sv"));
  } catch (e) { ctx = null; protokoll("start: " + e); } // ohne Daten bleibt das Regal allein stehen, ohne Meldung
  await leiste.bereit();

  const spiele = ctx?.spiele.spiele ?? [];
  const spielNach = new Map(spiele.map((s) => [s.id, s]));
  const farbe = (f) => FACH[f] ?? { fuellung: "var(--ls-papier)", tief: "var(--ls-tinte)", toenung: "var(--ls-linie)" };

  // Dran: bis zu drei Themen mit Spiel, zuletzt geübt zuerst; die Kachel zeigt das Spiel und führt mit ?thema hinein.
  const dran = ctx ? dranThemen(ctx, stand).map((t) => ({ ...t, spiel: spielNach.get(t.spiel) })).filter((t) => t.spiel) : [];
  const dranListe = document.getElementById("dran");
  dranListe.innerHTML = dran.map((t) => {
    const f = farbe(t.strang);
    return `<li><a class="kachel" href="${esc(t.spiel.datei)}?thema=${encodeURIComponent(t.id)}" aria-label="${esc(t.spiel.titel)}"
      style="--fach-fuellung:${f.fuellung};--fach-tief:${f.tief};--fach-toenung:${f.toenung}">
      <span class="bild"><img src="${esc(t.spiel.symbol)}" alt=""></span>
      <span class="text"><b>${esc(t.spiel.titel)}</b><span class="thema">${esc(t.name)}</span></span></a></li>`;
  }).join("");
  dranListe.hidden = !dran.length;
  dranListe.querySelectorAll("a").forEach((a, i) => nenne(a, dran[i].spiel.titel));

  // Fächer: nur die mit mindestens einem Spiel, in der Reihenfolge der Kategorien.
  const faecher = (ctx?.spiele.kategorien ?? []).filter((k) => Object.hasOwn(FACH, k.id) && spiele.some((s) => s.kategorie === k.id));
  const fachListe = document.getElementById("faecher");
  fachListe.innerHTML = faecher.map((k) => {
    const bild = FACH_SYMBOLE.has(k.id) ? `<i style="--bild:url('symbole/${k.id}.svg')"></i>` : "";
    return `<li><a class="kachel" href="themen.html?fach=${encodeURIComponent(k.id)}" aria-label="${esc(k.name)}"
      style="--fach-fuellung:${FACH[k.id].fuellung}"><span class="zeichen" aria-hidden="true">${bild}</span><b>${esc(k.name)}</b></a></li>`;
  }).join("");
  fachListe.hidden = !faecher.length;
  fachListe.querySelectorAll("a").forEach((a, i) => nenne(a, faecher[i].name));

  // Regal: die drei zuletzt gekonnten Dinge, das neueste rechts (wie im Regal). Ohne Gekonntes: leeres Holz.
  const zuletzt = ctx ? gekonnteThemen(ctx, stand).slice(-3) : [];
  document.getElementById("dinge").innerHTML = zuletzt.map((g) =>
    `<span class="ding" style="--fach-fuellung:${farbe(g.strang).fuellung}">${bausteinHtml(materialFuer(g))}</span>`).join("");
  document.getElementById("start").classList.toggle("allein", !dran.length && !faecher.length);
  document.getElementById("regal").addEventListener("click", (e) => {
    if (leiste.ton) sageEinmal("Mein Regal", () => sprich("Mein Regal"));
    linkKlick(e);
  });
}

// Name beim ersten Tippen je Sitzung; der Link wechselt sofort (vorher speichern über linkKlick).
function nenne(a, name) {
  a.addEventListener("click", (e) => {
    if (leiste.ton) sageEinmal(name, sprich);
    linkKlick(e);
  });
}

// Zugang für Erwachsene: Zahnrad gedrückt halten (Finger, Maus oder Eingabe-/Leertaste). Der Knopf ist stumm:
// sein Name wird nicht gesprochen, ein kurzes Tippen tut nichts.
function zahnrad() {
  const rad = document.getElementById("zahnrad");
  rad.style.setProperty("--halten", HALTEN_MS + "ms");
  let uhr = null;
  const los = () => { clearTimeout(uhr); uhr = null; rad.classList.remove("haelt"); };
  const halte = () => {
    if (uhr) return;
    rad.classList.add("haelt");
    uhr = setTimeout(() => { los(); location.href = "eltern.html"; }, HALTEN_MS);
  };
  rad.addEventListener("pointerdown", (e) => {
    try { rad.setPointerCapture(e.pointerId); } catch { /* egal */ }
    halte();
  });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach((t) => rad.addEventListener(t, los));
  rad.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); halte(); } });
  rad.addEventListener("keyup", (e) => { if (e.key === "Enter" || e.key === " ") los(); });
  rad.addEventListener("focusout", los);
}
</script>
</body>
</html>
