<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernen Spielen</title>
<link rel="stylesheet" href="rahmen/seite.css">
<link rel="stylesheet" href="start/karten.css">
<style>
/* Startseite „Können“ (Designsprache 2026-11-15, Spec docs/superpowers/specs/2026-11-15-designsprache-design.md §5.2;
   Inhalt nach 2026-11-14-startseite-karten-design.md). Oben die Reiter Können/Wissen, Ton und Zahnrad (ls-kopf).
   Je Fach der Titel (Fachkachel und Name, Link zur Fach-Seite) und die Spiele als große Plakate (höchstens 5 Spiele und
   die Karten „Mit echten Dingen“); unten „Zuletzt gelernt“ (führt ins Regal an das Thema) und die Pille
   „Was ich schon kann“. Dahinter das Grundmuster Hügel. Kein Plakat ist hervorgehoben; keine Zahl, keine Zählung,
   kein Klassenbezug (N5, N8). Diese Seite liest den Lernstand nur, sie schreibt ihn nie.
   Spielzeit der Eltern (Spec 2026-11-14-spielzeit): Die Startseite ist nie gesperrt. Ist die Zeit um oder der Tag
   gesperrt, fehlen nur die Spielkarten; über dem Raster steht ein ruhiger Satz, einmal je Sitzung gesprochen.
   „Mit echten Dingen“, die Fächer (Kopf → Fach-Seite) und „Zuletzt gelernt“ bleiben.
   Zahnrad für Erwachsene rechts im Kopf: gedrückt halten, dabei läuft leise ein Ring herum. */
body { -webkit-user-select: none; user-select: none; }

.start {
  position: absolute;
  top: var(--ls-leiste-hoehe);
  bottom: 0;
  left: max(0rem, calc((100vw - 192rem) / 2));
  width: min(100vw, 192rem);
  z-index: 1;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
}

/* --- Plakate je Fach ---------------------------------------------------------------------------- */
.raster { overflow-y: auto; padding: 1.4rem var(--ls-seite-rand) 4rem; scrollbar-width: none; }
.raster::-webkit-scrollbar { display: none; }
.raster .leer { margin: 4rem 0 0; font-size: 4.5rem; color: var(--ls-tinte-weich); }
.schluss { margin: 0 0 3.2rem; max-width: 70ch; font-size: 3.6rem; line-height: 1.3; }
.schluss[hidden] { display: none; }
.fach-abschnitt + .fach-abschnitt { margin-top: 7rem; }
.fach-kopf { display: inline-flex; align-items: center; gap: 2.6rem; margin-bottom: 4.6rem; color: var(--ls-tinte); text-decoration: none;
  -webkit-tap-highlight-color: transparent; }
.fach-kopf .knopf {
  flex: none; display: grid; place-items: center; width: 7.8rem; height: 7.8rem;
  border: var(--ls-kontur) solid var(--ls-tinte); border-radius: 1.8rem; background: var(--fach-fuellung);
  box-shadow: 0 0.6rem 0 var(--fach-tief);
}
.fach-kopf .knopf i { display: block; width: 4.6rem; height: 4.6rem; background: var(--ls-tinte);
  -webkit-mask: var(--bild) center / contain no-repeat; mask: var(--bild) center / contain no-repeat; }
.fach-kopf b { font-family: var(--ls-schrift-oberflaeche); font-feature-settings: var(--ls-schrift-merkmale);
  font-size: 9.6rem; font-weight: 750; line-height: 1; letter-spacing: -0.035em; }
.fach-kopf:active .knopf { transform: translateY(0.3rem); box-shadow: 0 0.3rem 0 var(--fach-tief); }
.fach-kopf:focus-visible { outline: 0.5rem solid var(--ls-tinte); outline-offset: 0.8rem; border-radius: 2rem; }

/* Plakat: oben das Spielbild, unten Papier mit Name und Thema; Schatten im Tief-Ton des Fachs.
   Fünf je Reihe in jedem Format (höchstens 5 Spiele je Fach = eine Reihe). Die Schrift wächst mit der Plakatbreite
   (Container-Einheiten), damit der Name auch bei 4:3 ganz auf das Plakat passt. */
.start .karten { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3.4rem 2.8rem; }
.start .karten .karte { width: auto; container-type: inline-size; border-radius: var(--ls-radius-teil); box-shadow: 0 0.7rem 0 var(--fach-tief); }
.start .karten .karte .bild { height: auto; aspect-ratio: 16 / 9; }
.start .karten .karte .unten { min-height: 0; padding: 2.2rem 2.2rem 2.6rem; }
.start .karten .karte b { font-family: var(--ls-schrift-oberflaeche); font-feature-settings: var(--ls-schrift-merkmale);
  font-size: min(3.4rem, 11.5cqi); font-weight: 700; line-height: 1.08; letter-spacing: -0.02em; }
.start .karten .karte .thema { margin-top: 0.8rem; font-size: min(2.4rem, 8.5cqi); }
.start .karten .karte:active { transform: translateY(0.35rem); box-shadow: 0 0.35rem 0 var(--fach-tief); }
/* Sonnenring nur als Fokus (hier bist du), nie als Empfehlung. */
.start .karten .karte:focus-visible { outline: 0.8rem solid var(--ls-sonne); outline-offset: 0.6rem; }
.start .karten .karte.echt::after { border-radius: calc(var(--ls-radius-teil) - 1rem); }
.start .karten .karte.echt .bild img { width: 9rem; height: 9rem; }

/* --- Unten: Zuletzt gelernt und Was ich schon kann ---------------------------------------------- */
.unten { display: flex; align-items: flex-end; gap: 3.6rem; padding: 1.6rem var(--ls-seite-rand) 4.2rem; min-width: 0; }
/* Alle Einträge ganz (bis zu 5): die Reihe bricht um, statt etwas abzuschneiden; der Fuß wächst mit. */
.zuletzt { flex: 1; min-width: 0; display: flex; align-items: center; gap: 0.6rem 2.8rem; flex-wrap: wrap; }
.zuletzt h2 { flex: none; margin: 0; font-family: var(--ls-schrift-oberflaeche); font-feature-settings: var(--ls-schrift-merkmale);
  font-size: 3.3rem; font-weight: 700; letter-spacing: -0.01em; }
.zuletzt .leer { margin: 0; font-size: 2.8rem; color: var(--ls-tinte-weich); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zuletzt ul { flex: 1 1 60rem; min-width: 0; display: flex; flex-wrap: wrap; gap: 0 3.2rem; list-style: none; margin: 0; padding: 0; }
.zuletzt li { flex: none; }
.zuletzt .ding { text-decoration: none; display: flex; align-items: center; gap: 1.2rem; min-height: 8rem; padding: 0;
  color: var(--ls-tinte); white-space: nowrap; }
.zuletzt .ding > * { pointer-events: none; }
.zuletzt .ding:focus-visible { outline: 0.4rem solid var(--ls-tinte); outline-offset: 0.3rem; border-radius: 1rem; }
.zuletzt .material { flex: none; display: flex; align-items: center; justify-content: center; min-width: 5rem; }
.zuletzt .material ls-perlenstab { height: 1.7rem; }
.zuletzt .material ls-wortart { height: 3.8rem; }
.zuletzt .material ls-objekt { height: 4.4rem; }
.zuletzt .material .karte { display: grid; place-items: center; width: auto; min-width: 3.6rem; height: 4.4rem; padding: 0 0.8rem;
  border: var(--ls-kontur) solid var(--ls-tinte); border-radius: 0.8rem; background: var(--ls-papier); font-size: 2.2rem; font-weight: 700; }
.zuletzt .material .karte i { width: 2.2rem; height: 2.2rem; background: var(--ls-tinte); -webkit-mask: var(--bild) center / contain no-repeat; mask: var(--bild) center / contain no-repeat; }
.zuletzt .name { font-size: 2.8rem; line-height: 1.15; }
.regal-knopf {
  flex: none; display: flex; align-items: center; gap: 1.6rem; height: 8.4rem; padding: 0 3.6rem 0 2.8rem;
  border: var(--ls-kontur) solid var(--ls-tinte); border-radius: 999rem; background: var(--ls-papier);
  box-shadow: var(--ls-schatten); color: var(--ls-tinte); text-decoration: none; -webkit-tap-highlight-color: transparent;
}
.regal-knopf > * { pointer-events: none; }
.regal-knopf img { width: 4.6rem; height: 4.6rem; }
.regal-knopf b { font-family: var(--ls-schrift-oberflaeche); font-feature-settings: var(--ls-schrift-merkmale);
  font-size: 3.3rem; font-weight: 700; white-space: nowrap; letter-spacing: -0.01em; }
.regal-knopf:active { transform: translateY(0.3rem); box-shadow: var(--ls-schatten-unten); }
.regal-knopf:focus-visible { outline: 1rem solid var(--ls-sonne); outline-offset: 0.6rem; }

/* --- Zahnrad für Erwachsene (im Slot rechts des Kopfes) ----------------------------------------- */
.zahnrad { position: relative; display: flex; width: 11rem; height: 11rem; touch-action: none; }
/* Der Ring sitzt um die sichtbare Form beim Halten: Knopf eingesunken (0.3rem) samt Kante unten (0.6 − 0.3rem),
   deren Mitte liegt 0.45rem unter der Mitte des Kastens. */
.zahnrad svg { position: absolute; inset: 0.6rem; width: calc(100% - 1.2rem); height: calc(100% - 1.2rem); transform: translateY(0.45rem) rotate(-90deg); pointer-events: none; opacity: 0; transition: opacity 0.2s; }
.zahnrad circle { fill: none; stroke: var(--ls-tinte-weich); stroke-width: 2.8; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; }
.zahnrad.haelt svg { opacity: 1; }
.zahnrad.haelt circle { stroke-dashoffset: 0; transition: stroke-dashoffset var(--halten) linear; }

@media (max-aspect-ratio: 4/3) {
  .fach-kopf b { font-size: 8rem; }
  .zuletzt .name { font-size: 2.5rem; }
}
</style>
</head>
<body>
<ls-muster art="huegel"></ls-muster>
<ls-kopf id="leiste" reiter="koennen" spiel="ansichten">
  <span class="zahnrad" id="zahnrad" slot="rechts"><ls-knopf id="eltern" symbol="zahnrad.svg" name="Für Erwachsene: gedrückt halten" groesse="seite" stumm></ls-knopf><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15.6" pathLength="100"/></svg></span>
</ls-kopf>
<main class="start">
  <div class="raster" aria-label="Spiele"><p class="schluss" id="schluss" role="status" hidden></p><div id="raster"></div></div>
  <footer class="unten" id="seite">
    <div id="regal"></div>
  </footer>
</main>

<script type="module">
import { sperreTouch, protokoll, linkKlick } from "./lernspiel.js";
import { ladeLernstand, gekonnteThemen, uebersicht } from "./lernsteuerung.js";
import { sprich } from "./kern/stimme.js";
import { sageEinmal } from "./kern/sitzung.js";
import "./rahmen/kopf.js";
import "./rahmen/knopf.js";
import "./rahmen/muster.js";
import "./rahmen/perlenstab.js";
import "./rahmen/perlenkette.js"; // Regal-Material der Einmaleins-Reihen (Kurzkette, material.js)
import "./rahmen/wortart.js";
import "./objekte/objekt.js";
import { startKarten } from "./start/auswahl.js";
import { paletteFuer, vignetteSvg } from "./start/welten.js";
import { spielKarteHtml, echtKarteHtml, echtBildHtml, abschnittHtml } from "./start/karten.js";
import { zuletztHtml } from "./start/regal-leiste.js";
import { spielzeitLage, schlussSatz, sage } from "./rahmen/spielzeit.js";
import { ladeVerzeichnis, fotoUrl } from "./rahmen/echte-dinge.js";

/** So lange hält ein Erwachsener das Zahnrad (wie bisher). */
const HALTEN_MS = 3000;

sperreTouch();
const leiste = document.getElementById("leiste");
zahnrad();
start();

async function start() {
  const heute = new Date().toLocaleDateString("sv");
  let ctx = null, stand = null;
  try {
    const [plan, spiele] = await Promise.all(["lernplan.json", "spiele.json"].map((d) => fetch(d).then((r) => r.json())));
    ctx = { plan, spiele };
    stand = await ladeLernstand(ctx, heute);
  } catch (e) { ctx = null; protokoll("start: " + e); } // ohne Daten: leeres Raster und leeres Regal, ohne Meldung
  await leiste.bereit();
  // Spielzeit: gesperrt heißt nur „keine Spielkarten“; nicht lesbar heißt frei (nie ohne Grund sperren).
  const zeit = await spielzeitLage().catch((e) => { protokoll("Spielzeit: " + e); return null; });
  const spielFrei = !zeit || zeit.lage.frei;
  const satz = zeit ? schlussSatz(zeit) : null;
  const schluss = document.getElementById("schluss");
  schluss.textContent = satz ?? "";
  schluss.hidden = !satz;
  if (satz && leiste.ton) sage(satz);

  const themaNach = new Map((ctx?.plan.themen ?? []).map((t) => [t.id, t]));
  const kategorien = new Map((ctx?.spiele.kategorien ?? []).map((k) => [k.id, k]));

  // Karten je Fach
  const raster = document.getElementById("raster");
  const faecher = ctx ? startKarten(uebersicht(ctx, stand), ctx, stand, heute) : [];
  raster.innerHTML = faecher.length ? faecher.map((f) => abschnittHtml(kategorien.get(f.fach) ?? { id: f.fach, name: f.fach },
    (spielFrei ? f.spiele : []).map((k) => {
      const palette = paletteFuer(ctx, k.spiel.karte?.welt ?? k.spiel.welt);
      return spielKarteHtml(k, f.fach, palette ? vignetteSvg(palette) : null);
    }).join("") + f.echt.map((k) => echtKarteHtml(k, f.fach)).join(""))).join("")
    : (satz ? "" : `<p class="leer">Hier kommen bald Spiele.</p>`);
  raster.querySelectorAll("a.karte.spiel").forEach((a) => nenne(a, a.querySelector("b").textContent));
  raster.querySelectorAll("a.fach-kopf").forEach((a) => nenne(a, a.querySelector("b").textContent));

  // Unten: zuletzt gelernt (bleibt kurz), daneben der Knopf zum Regal
  document.getElementById("regal").outerHTML = zuletztHtml(ctx ? gekonnteThemen(ctx, stand) : []);
  document.querySelectorAll(".zuletzt .ding").forEach((a) => a.addEventListener("click", (e) => {
    const t = themaNach.get(a.dataset.thema);
    if (t?.sprich && leiste.ton) sageEinmal(t.sprich, sprich);
    linkKlick(e);
  }));
  document.querySelectorAll(".regal-knopf").forEach((k) => k.addEventListener("click", (e) => {
    const wort = k.querySelector("b").textContent;
    if (leiste.ton) sageEinmal(wort, () => sprich(wort));
    linkKlick(e);
  }));

  // Mit echten Dingen: Karten führen zur eigenen Seite; gibt es eine Anleitung, steht ihr Titel auf der Karte.
  const echtKarten = [...raster.querySelectorAll("a.karte.echt")];
  echtKarten.forEach((a) => nenne(a, "Mit echten Dingen"));
  // Den Titel nennt das Verzeichnis (nur freigegebene Anleitungen, npm run echte-dinge); ohne bleibt „Mit echten Dingen“.
  const { themen } = echtKarten.length ? await ladeVerzeichnis() : { themen: {} };
  echtKarten.forEach((a) => {
    const t = themaNach.get(a.dataset.thema);
    const e = t && Object.hasOwn(themen, t.id) ? themen[t.id] : null;
    if (e && e.fach === t.strang && e.titel) a.querySelector("b").textContent = e.titel;
    if (e && e.fach === t.strang && fotoUrl(e)) a.querySelector(".bild").outerHTML = echtBildHtml(fotoUrl(e));
  });
}

// Name beim ersten Tippen je Sitzung; der Link wechselt sofort (vorher speichern über linkKlick).
function nenne(a, name) {
  a.addEventListener("click", (e) => {
    if (leiste.ton) sageEinmal(name, sprich);
    linkKlick(e);
  });
}

// Zugang für Erwachsene: Zahnrad gedrückt halten (Finger, Maus oder Eingabe-/Leertaste). Der Knopf ist stumm:
// sein Name wird nicht gesprochen, ein kurzes Tippen tut nichts.
function zahnrad() {
  const rad = document.getElementById("zahnrad");
  rad.style.setProperty("--halten", HALTEN_MS + "ms");
  let uhr = null;
  const los = () => { clearTimeout(uhr); uhr = null; rad.classList.remove("haelt"); };
  const halte = () => {
    if (uhr) return;
    rad.classList.add("haelt");
    uhr = setTimeout(() => { los(); location.href = "eltern.html"; }, HALTEN_MS);
  };
  rad.addEventListener("pointerdown", (e) => {
    try { rad.setPointerCapture(e.pointerId); } catch { /* egal */ }
    halte();
  });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach((t) => rad.addEventListener(t, los));
  rad.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); halte(); } });
  rad.addEventListener("keyup", (e) => { if (e.key === "Enter" || e.key === " ") los(); });
  rad.addEventListener("focusout", los);
}
</script>
</body>
</html>
