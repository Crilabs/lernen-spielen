<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernen Spielen</title>
<link rel="stylesheet" href="rahmen/seite.css">
<style>
/* Startseite „Der Treffpunkt“ (Spec docs/superpowers/specs/2026-11-14-startseite-treffpunkt-design.md).
   Eine Szene statt eines Menüs: Wiese mit Baumhaus, die Runde steht vorne. Bis zu drei Dran-Spiele sind Tore auf der
   Anhöhe, die Fächer Bretter am Wegweiser, das Regal steht im Baumhaus. Keine Zahl, keine Zählung, kein
   Klassenbezug (N5, N8). Diese Seite liest den Lernstand nur, sie schreibt ihn nie.
   Aufbau: .box ist 288 × 108 rem groß und waagrecht mittig; SVG (viewBox 0 0 2880 1080) und bedienbare Teile nutzen
   dieselben Koordinaten (1 rem = 10 Einheiten). Bei 16:9 sieht man x 48–240 rem, bei 4:3 x 72–216 rem; alles
   Bedienbare liegt in 72–216 rem (ORTE in start/szene.js).
   Zahnrad für Erwachsene rechts in der Kopfleiste: gedrückt halten, dabei läuft leise ein Ring herum. */
body {
  -webkit-user-select: none;
  user-select: none;
  background: #8FCBF2;
}

.treffpunkt { position: fixed; inset: 0; overflow: hidden; }
.box { position: absolute; top: 0; left: calc(50% - 144rem); width: 288rem; height: 108rem; }
.box:not(.mit-faechern) #pfahl { display: none; }
.szene, .szene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* --- Die Runde: vor der Anhöhe; nur die gemalten Flächen nehmen Tippen an ------------------------ */
.runde { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.kind { position: absolute; pointer-events: none; -webkit-tap-highlight-color: transparent; }
.kind svg { width: 100%; height: 100%; display: block; overflow: visible; }
.kind svg * { pointer-events: visiblePainted; }

/* --- Bedienbare Teile -------------------------------------------------------------------------- */
.bedienung { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
.bedienung a {
  pointer-events: auto;
  color: var(--ls-tinte);
  text-decoration: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.bedienung a > * { pointer-events: none; }
.bedienung a:focus-visible { outline: none; }

/* Tore: Weidenbogen mit Blick in die Welt, darunter ein Schild mit Spielsymbol und Name. Drückbar ist das Schild
   (fester Schatten im Fach-Tief, sinkt ein). */
.tore { position: absolute; inset: 0; }
.tor { position: absolute; width: 30rem; display: flex; flex-direction: column; align-items: center; }
.tor .bogen { display: block; width: 30rem; height: 35rem; }
.tor .schild {
  position: relative;
  z-index: 1;
  display: grid;
  place-items: center;
  width: 11rem;
  height: 11rem;
  margin-top: -9rem;
  border: var(--ls-kontur) solid var(--ls-tinte);
  border-radius: 50%;
  background: var(--fach-fuellung);
  box-shadow: 0 0.6rem 0 var(--fach-tief);
}
.tor .schild img { display: block; width: 7.2rem; height: 7.2rem; object-fit: contain; }
.tor .text {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: max-content;
  max-width: 34rem;
  margin-top: -2.4rem;
  padding: 3rem 2.4rem 1.2rem;
  border: var(--ls-kontur) solid var(--ls-tinte);
  border-radius: var(--ls-radius-klein);
  background: var(--ls-papier);
  box-shadow: 0 0.6rem 0 var(--fach-tief);
  text-align: center;
}
.tor b { font-size: 4.2rem; line-height: 1.1; color: var(--fach-tief); hyphens: manual; }
.tor .thema { font-size: 2.8rem; line-height: 1.2; color: var(--ls-tinte-weich); }
.tor:active .schild, .tor:active .text { transform: translateY(0.3rem); box-shadow: 0 0.3rem 0 var(--fach-tief); }
.tor:focus-visible .text { outline: 0.5rem solid var(--ls-tinte); outline-offset: 0.6rem; }

/* Wegweiser: Pfeilbretter am Pfahl (Pfahl im SVG). Bis drei Fächer ein Brett je Zeile mit Namen daneben;
   ab vier zwei Spalten, Symbol über dem Namen. */
.wegweiser { position: absolute; display: flex; flex-direction: column; gap: 1.4rem; }
.wegweiser.zwei { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
.brett {
  position: relative;
  display: flex;
  align-items: center;
  gap: 1.4rem;
  min-height: 11rem;
  padding: 1.2rem 4.4rem 1.2rem 1.6rem;
  border: var(--ls-kontur) solid var(--ls-tinte);
  border-radius: var(--ls-radius-klein);
  background: var(--ls-ahorn);
  box-shadow: 0 0.6rem 0 var(--ls-kante);
  clip-path: none;
}
/* Pfeilspitze als gedrehtes Quadrat an der Seite, in die das Brett zeigt. */
.brett::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 6.4rem;
  height: 6.4rem;
  border: var(--ls-kontur) solid var(--ls-tinte);
  border-left-color: transparent;
  border-bottom-color: transparent;
  border-radius: 0 1rem 0 0;
  background: linear-gradient(45deg, transparent 50%, var(--ls-ahorn) 50%);
  pointer-events: none;
}
.brett.rechts::after { right: -3.4rem; transform: translateY(-50%) rotate(45deg); }
.brett.links { padding: 1.2rem 1.6rem 1.2rem 4.4rem; }
.brett.links::after { left: -3.4rem; transform: translateY(-50%) rotate(-135deg); }
.brett .zeichen {
  flex: none;
  width: 7.6rem;
  height: 7.6rem;
  padding: 1.3rem;
  border: var(--ls-kontur) solid var(--ls-tinte);
  border-radius: var(--ls-radius-klein);
  background: var(--fach-fuellung);
}
.brett .zeichen i {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--ls-tinte);
  -webkit-mask: var(--bild) center / contain no-repeat;
  mask: var(--bild) center / contain no-repeat;
}
.brett b { font-size: 3.6rem; line-height: 1.1; hyphens: manual; }
.zwei .brett { flex-direction: column; gap: 0.6rem; padding: 1.2rem; text-align: center; }
.zwei .brett::after { display: none; }
.zwei .brett b { font-size: 2.6rem; }
.brett:active { transform: translateY(0.3rem); box-shadow: 0 0.3rem 0 var(--ls-kante); }
.brett:focus-visible { outline: 0.5rem solid var(--ls-tinte); outline-offset: 0.6rem; }

/* Baumhaus: die Öffnung ist der Link zum Regal; darin ein Regalbrett mit den drei zuletzt gekonnten Dingen. */
.baumhaus {
  position: absolute;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 0 2rem 2rem;
  border-radius: 2.2rem;
}
.baumhaus .brett-holz {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 2rem;
  width: 100%;
  min-height: 3.2rem;
  padding: 0 1.6rem;
  position: relative;
  padding-bottom: 3rem;
}
/* Das Brett: Ahorn mit Kante, Tinte-Kontur, fester Schatten (drückbar wie alles, was hinführt). */
.baumhaus .brett-holz::after {
  content: "";
  position: absolute;
  left: -0.6rem; right: -0.6rem; bottom: 0;
  height: 3rem;
  border: var(--ls-kontur) solid var(--ls-tinte);
  border-radius: 0.8rem;
  background: var(--ls-ahorn);
  box-shadow: inset 0 -1rem 0 var(--ls-kante), 0 0.6rem 0 var(--ls-tinte-weich);
}
.baumhaus .ding { position: relative; z-index: 1; }
.baumhaus .ding { display: flex; align-items: flex-end; margin-bottom: 2.6rem; }
.baumhaus ls-perlenstab { height: 2.6rem; }
.baumhaus ls-wortart { height: 6.4rem; }
.baumhaus .karte {
  display: grid;
  place-items: center;
  min-width: 5.6rem;
  height: 7.6rem;
  padding: 0 1.6rem;
  white-space: nowrap;
  border: var(--ls-kontur) solid var(--ls-tinte);
  border-radius: var(--ls-radius-klein);
  background: var(--ls-papier);
  box-shadow: inset 0 0 0 0.7rem var(--ls-papier), inset 0 0 0 1rem var(--fach-fuellung);
  font-size: 3.4rem;
  font-weight: 700;
  line-height: 1;
}
.baumhaus .karte.symbol { padding: 0; }
.baumhaus .karte i {
  display: block;
  width: 3rem;
  height: 3rem;
  background: var(--ls-tinte);
  -webkit-mask: var(--bild) center / contain no-repeat;
  mask: var(--bild) center / contain no-repeat;
}
.baumhaus:active .brett-holz { transform: translateY(0.3rem); }
.baumhaus:focus-visible { outline: 0.5rem solid var(--ls-tinte); outline-offset: 0.4rem; }

/* --- Zahnrad für Erwachsene (im Slot rechts der Kopfleiste) ------------------------------------ */
.zahnrad {
  position: relative;
  display: flex;
  width: 11rem;
  height: 11rem;
  touch-action: none;
}
.zahnrad svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
}
.zahnrad circle {
  fill: none;
  stroke: var(--ls-tinte-weich);
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-dasharray: 100;
  stroke-dashoffset: 100;
}
.zahnrad.haelt svg { opacity: 1; }
.zahnrad.haelt circle { stroke-dashoffset: 0; transition: stroke-dashoffset var(--halten) linear; }
</style>
</head>
<body>
<ls-leiste id="leiste" spiel="ansichten" titel="Lernen Spielen" ohne-haus durchsichtig>
  <span class="zahnrad" id="zahnrad" slot="rechts"><ls-knopf id="eltern" symbol="zahnrad.svg" name="Für Erwachsene: gedrückt halten" groesse="klein" stumm></ls-knopf><svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15.6" pathLength="100"/></svg></span>
</ls-leiste>
<main class="treffpunkt">
  <div class="box" id="box">
    <div class="szene" id="szene"></div>
    <div class="runde" id="runde"></div>
    <nav class="bedienung" aria-label="Lernen Spielen">
      <div class="tore" id="dran"></div>
      <div class="wegweiser" id="faecher"></div>
      <a class="baumhaus" id="regal" href="regal.html" aria-label="Mein Regal"><span class="brett-holz" id="dinge"></span></a>
    </nav>
  </div>
</main>

<script type="module">
import { sperreTouch, protokoll, esc, linkKlick } from "./lernspiel.js";
import { ladeLernstand, gekonnteThemen, dranThemen } from "./lernsteuerung.js";
import { sprich } from "./kern/stimme.js";
import { sageEinmal } from "./kern/sitzung.js";
import { FACH } from "./rahmen/stil.js";
import { materialFuer, bausteinHtml } from "./rahmen/material.js";
import "./rahmen/leiste.js";
import "./rahmen/knopf.js";
import "./rahmen/perlenstab.js";
import "./rahmen/wortart.js";
import { szeneSvg, ORTE } from "./start/szene.js";
import { torHtml } from "./start/tore.js";
import { wegweiserHtml } from "./start/wegweiser.js";
import { setzeRunde } from "./start/runde-auf-start.js";

/** So lange hält ein Erwachsener das Zahnrad (wie bisher). */
const HALTEN_MS = 3000;

sperreTouch();
const leiste = document.getElementById("leiste");
zahnrad();
document.getElementById("szene").innerHTML = szeneSvg({ jahreszeit: "sommer", tageszeit: "tag" });
setzeRunde(document.getElementById("runde"), { ton: () => leiste.ton });
Object.assign(document.getElementById("regal").style,
  { left: `${ORTE.regal.x}rem`, top: `${ORTE.regal.y}rem`, width: `${ORTE.regal.b}rem`, height: `${ORTE.regal.h}rem` });
start();

async function start() {
  let ctx = null, stand = null;
  try {
    const [plan, spiele] = await Promise.all(["lernplan.json", "spiele.json"].map((d) => fetch(d).then((r) => r.json())));
    ctx = { plan, spiele };
    stand = await ladeLernstand(ctx, new Date().toLocaleDateString("sv"));
  } catch (e) { ctx = null; protokoll("start: " + e); } // ohne Daten: Szene, Runde und leeres Regal, ohne Meldung
  await leiste.bereit();

  const spiele = ctx?.spiele.spiele ?? [];
  const spielNach = new Map(spiele.map((s) => [s.id, s]));
  const farbe = (f) => FACH[f] ?? { fuellung: "var(--ls-papier)", tief: "var(--ls-tinte)", toenung: "var(--ls-linie)" };

  // Tore: bis zu drei Themen mit Spiel, zuletzt geübt zuerst; das Tor führt mit ?thema ins Spiel. Mittig auf der
  // Anhöhe verteilt, auch wenn es weniger als drei sind.
  const dran = ctx ? dranThemen(ctx, stand).map((t) => ({ ...t, spiel: spielNach.get(t.spiel) })).filter((t) => t.spiel)
    .slice(0, ORTE.tore.length) : [];
  const tore = document.getElementById("dran");
  tore.innerHTML = dran.map((t) => torHtml(t)).join("");
  const [links, mitte] = ORTE.tore;
  tore.querySelectorAll("a").forEach((a, i) => {
    const schritt = i - (dran.length - 1) / 2; // −1, 0, 1 bei drei; ±½ bei zwei
    a.style.left = `${mitte.x + schritt * (mitte.x - links.x)}rem`;
    a.style.top = `${mitte.y + Math.abs(schritt) * (links.y - mitte.y)}rem`;
    nenne(a, dran[i].spiel.titel);
  });

  // Wegweiser: nur Fächer mit mindestens einem Spiel, in der Reihenfolge der Kategorien.
  const faecher = (ctx?.spiele.kategorien ?? []).filter((k) => Object.hasOwn(FACH, k.id) && spiele.some((s) => s.kategorie === k.id));
  const weg = document.getElementById("faecher");
  weg.innerHTML = wegweiserHtml(faecher);
  weg.classList.toggle("zwei", faecher.length > 3);
  document.getElementById("box").classList.toggle("mit-faechern", faecher.length > 0);
  weg.style.left = `${ORTE.wegweiser.x}rem`;
  weg.style.top = `${ORTE.wegweiser.y}rem`;
  weg.style.width = `${ORTE.wegweiser.b}rem`;
  weg.querySelectorAll("a").forEach((a, i) => nenne(a, faecher[i].name));

  // Regal: die drei zuletzt gekonnten Dinge, das neueste rechts (wie im Regal). Ohne Gekonntes: leeres Holz.
  const zuletzt = ctx ? gekonnteThemen(ctx, stand).slice(-3) : [];
  document.getElementById("dinge").innerHTML = zuletzt.map((g) =>
    `<span class="ding" style="--fach-fuellung:${farbe(g.strang).fuellung}">${bausteinHtml(materialFuer(g))}</span>`).join("");
  document.getElementById("regal").addEventListener("click", (e) => {
    if (leiste.ton) sageEinmal("Mein Regal", () => sprich("Mein Regal"));
    linkKlick(e);
  });
}

// Name beim ersten Tippen je Sitzung; der Link wechselt sofort (vorher speichern über linkKlick).
function nenne(a, name) {
  a.addEventListener("click", (e) => {
    if (leiste.ton) sageEinmal(name, sprich);
    linkKlick(e);
  });
}

// Zugang für Erwachsene: Zahnrad gedrückt halten (Finger, Maus oder Eingabe-/Leertaste). Der Knopf ist stumm:
// sein Name wird nicht gesprochen, ein kurzes Tippen tut nichts.
function zahnrad() {
  const rad = document.getElementById("zahnrad");
  rad.style.setProperty("--halten", HALTEN_MS + "ms");
  let uhr = null;
  const los = () => { clearTimeout(uhr); uhr = null; rad.classList.remove("haelt"); };
  const halte = () => {
    if (uhr) return;
    rad.classList.add("haelt");
    uhr = setTimeout(() => { los(); location.href = "eltern.html"; }, HALTEN_MS);
  };
  rad.addEventListener("pointerdown", (e) => {
    try { rad.setPointerCapture(e.pointerId); } catch { /* egal */ }
    halte();
  });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach((t) => rad.addEventListener(t, los));
  rad.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); halte(); } });
  rad.addEventListener("keyup", (e) => { if (e.key === "Enter" || e.key === " ") los(); });
  rad.addEventListener("focusout", los);
}
</script>
</body>
</html>
