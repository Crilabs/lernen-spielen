<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Zahlen legen</title>
<!-- M08 Stellentafel (Idee docs/spiele/mathe/m08-stellentafel.md, Wanderung 2026-11-16). Heller Montessori-Werkraum
     (raum.js). Die Oberfläche ist das Spiel: Auf der Matte steht die Aufgabe aus Zifferntäfelchen (Rand in der Farbe
     ihrer Stelle), unter jeder Zahl ihr Material; darunter die Stellentafel mit je einem Platz für Zehner und Einer.
     Das Kind tippt das Ergebnis aus dem Ziffernkasten auf die Plätze; beim Haken wandern die Ziffern der Aufgabe und
     ihr Material in die Tafel. Timo steht links daneben. Leiste, Blase, Hilfe und Pause an ihren festen Plätzen. -->
<link rel="stylesheet" href="../../rahmen/seite.css">
<style>
  /* ===== SPIELWELT: Montessori-Werkraum, die Stellentafel auf der Arbeitsmatte. Alles in rem (1rem = Bildhöhe/108). ===== */
  :root {
    --timo-hoehe: 56rem;      /* Feld der Figur (320 × 280); die Figur selbst ist etwa 47 rem hoch */
    /* Auf :root, damit auch die fliegenden Täfelchen (eigene Ebene über der Matte) sie kennen. */
    --tf-b: 8.6rem;           /* Täfelchen: Breite, Höhe, Schrift */
    --tf-h: 10.6rem;
    --tf-schrift: 7.6rem;
    --stab: 3.6rem;           /* Dicke der Perlenstäbe */
    --zehner: #F07C1E;
    --einer: #0FA3A3;
  }
  /* Der Raum (raum.js) füllt die Welt; die Wandkante liegt bei 29 rem. Bis das SVG da ist: Wand und Boden als Fläche. */
  .welt { background: linear-gradient(#F6ECDF 0 29rem, #EDDCC0 29rem); }
  .welt svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* Drei Spalten: links Timo (und die Blase), in der Mitte die Matte, rechts der Ziffernkasten. */
  .spielflaeche {
    display: grid;
    grid-template-columns: 24rem minmax(0, 1fr) 46rem;
    column-gap: 2.4rem;
    padding: 1.6rem 2.4rem 2.4rem;
  }
  ls-blase { grid-column: 1; grid-row: 1; align-self: start; justify-self: start; position: relative; z-index: 7; }

  /* Die Matte (Lernfeld, grundsaetze-bilder.md §6.2): Papier, Tinte-Kontur, gestrichelte Naht. Alles darauf ist
     Material – die Aufgabe aus Zifferntäfelchen, darunter ihr Material, darunter die Stellentafel mit zwei Plätzen. */
  .hof { grid-column: 2; grid-row: 1; position: relative; z-index: 6; min-height: 0; }
  .matte {
    position: relative;
    display: flex; flex-direction: column; gap: 2rem;
    padding: 2.4rem 3rem 3rem;
    background: var(--ls-papier); border: var(--ls-kontur) solid var(--ls-tinte); border-radius: var(--ls-radius-gross);
  }
  .matte::after { content: ""; position: absolute; inset: 1.2rem; border: 0.25rem dashed var(--ls-naht); border-radius: calc(var(--ls-radius-gross) - 1.2rem); pointer-events: none; }

  /* Die Aufgabe: Zahlen aus Täfelchen, unter jeder Zahl ihr Material; Zeichen in Tinte. */
  .aufgabe { position: relative; z-index: 1; display: flex; justify-content: center; align-items: flex-start; gap: 3.2rem; min-height: calc(var(--tf-h) + 1.2rem + var(--stab)); }
  .aufgabe.still { visibility: hidden; }
  .zahl { display: grid; justify-items: center; gap: 1.2rem; }
  .ziffern { display: flex; gap: 0.6rem; }
  .stoff { display: flex; flex-direction: column; align-items: center; gap: 0.8rem; min-height: var(--stab); }
  .zeichen { height: var(--tf-h); display: flex; align-items: center; font-size: var(--tf-schrift); font-weight: 700; color: var(--ls-tinte); line-height: 1; }
  .taefelchen {
    --farbe: var(--ls-tinte);
    position: relative;
    width: var(--tf-b); height: var(--tf-h);
    display: grid; place-items: center;
    background: var(--ls-papier); color: var(--ls-tinte);
    border: 0.7rem solid var(--farbe); border-radius: 1.4rem;
    box-shadow: 0 0 0 0.3rem var(--ls-tinte);   /* Kontur wie bei den Stellenwertkarten, kein Schatten (kein Knopf) */
    font-family: "Andika", sans-serif; font-size: var(--tf-schrift); font-weight: 700; line-height: 1;
  }
  .taefelchen[data-stelle="z"] { --farbe: var(--zehner); }
  .taefelchen[data-stelle="e"] { --farbe: var(--einer); }
  .taefelchen.verblasst { opacity: 0.35; transition: opacity 0.4s; }
  /* Die 0, die bei c − e unter der Einerziffer liegt (kommt zum Vorschein, wenn die Ziffer mit Timo geht). */
  .taefelchen .darunter { position: absolute; inset: -0.7rem; border-radius: inherit; }
  .flug { position: absolute; left: 0; top: 0; z-index: 9; will-change: transform; pointer-events: none; }

  /* Die Stellentafel: Köpfe Zehner und Einer, darunter je ein Feld mit dem Material und dem Platz für die Ziffer. */
  .tafel { position: relative; z-index: 1; display: grid; grid-template-columns: 1fr 1fr; column-gap: 2rem; grid-template-rows: 6.4rem auto; }
  .kopf {
    display: flex; align-items: center; justify-content: center;
    border: var(--ls-kontur) solid var(--ls-tinte); border-radius: 2rem;
    font-size: 4.6rem; font-weight: 700; color: var(--ls-tinte); line-height: 1;
  }
  .kopf.z { background: var(--zehner); }
  .kopf.e { background: var(--einer); }
  .feld {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 1.6rem;
    padding: 1.6rem 0 0.4rem;
    border-left: 0.3rem solid var(--ls-naht); border-right: 0.3rem solid var(--ls-naht);
  }
  .real { display: flex; flex-direction: column; align-items: center; gap: 0.8rem; min-height: var(--stab); }
  .matte ls-perlenstab, .schoss ls-perlenstab { height: var(--stab); display: block; }
  /* Der Platz für eine Ziffer: so groß wie ein Täfelchen, gestrichelt in der Farbe der Stelle; ausgewählt mit dem
     Sonnenring. Flach – er wählt nur aus (Tippziel, kein Knopf-Schatten). */
  .platz {
    --farbe: var(--ls-tinte);
    width: calc(var(--tf-b) + 2rem); height: calc(var(--tf-h) + 2rem);
    display: grid; place-items: center; padding: 0; margin: 0;
    background: transparent; border: 0.45rem dashed var(--farbe); border-radius: 1.8rem;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .platz[data-stelle="z"] { --farbe: var(--zehner); }
  .platz[data-stelle="e"] { --farbe: var(--einer); }
  .platz:focus-visible { outline: 0.6rem solid var(--ls-sonne); }
  /* .passt-nicht: Zustand nach einem Fehlversuch (der Platz hat gewackelt), für die Prüfungen; ohne eigenes Aussehen. */

  /* Timo und die Dinge, die mit ihm gehen: über allem Bild, nehmen keine Tipps. */
  .figuren { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .timo { position: absolute; left: 0; top: 0; height: var(--timo-hoehe); width: calc(var(--timo-hoehe) * 320 / 280); transform-origin: 50% 90.7%; will-change: transform; }
  .timo > .koerper { width: 100%; height: 100%; transform-origin: 50% 90.7%; }
  .timo svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .schatten {
    position: absolute; left: 0; top: 0; width: 20rem; height: 3rem; margin: -1.5rem 0 0 -10rem;
    border-radius: 50%; background: rgba(43, 38, 34, 0.28); filter: blur(0.25rem); will-change: transform;
  }
  /* Auf dem Schoß: was Timo bei Minus mitnimmt. */
  .schoss { position: absolute; left: 47%; top: 58%; display: flex; flex-direction: column; gap: 0.4rem; align-items: flex-start; }

  /* Der Ziffernkasten (Tablett): Täfelchen 0–9, Löschen, darunter der Knopf mit dem Haken. */
  .brett {
    grid-column: 3; grid-row: 1;
    align-self: start;
    display: flex; flex-direction: column; align-items: center; gap: 2.4rem;
    padding: 2.4rem 2rem 2.6rem;
    max-height: calc(100% - 13.6rem);
    position: relative; z-index: 6;
  }
  #fertig { align-self: center; }

  /* Schmale Bildschirme (4:3): kleinere Täfelchen und Stäbe. */
  @media (max-aspect-ratio: 3/2) {
    :root { --tf-b: 7rem; --tf-h: 8.8rem; --tf-schrift: 6.2rem; --stab: 2.8rem; }
    .spielflaeche { grid-template-columns: 20rem minmax(0, 1fr) 42rem; }
    .kopf { font-size: 4rem; }
    .aufgabe { gap: 2.4rem; }
  }

  /* Pause: Sachmoment auf der Papierkarte. */
  .sachmoment { display: grid; justify-items: center; gap: 3rem; max-width: 110rem; font-size: 4rem; text-align: center; }
  .sachmoment p { margin: 0; }
  .sachmoment .stifte { display: flex; align-items: center; gap: 4rem; }
  .sachmoment .stifte ls-perlenstab { height: 6.4rem; }
  .sachmoment .hinweis {
    display: inline-flex; align-items: center; gap: 2.4rem; min-height: 11rem; padding: 1.6rem 4rem 1.6rem 1.6rem;
    border: var(--ls-kontur) solid var(--ls-tinte); border-radius: var(--ls-radius); background: var(--ls-papier);
    box-shadow: var(--ls-schatten); color: var(--ls-tinte); font-weight: 700; text-decoration: none;
  }
  .sachmoment .hinweis img { width: 8rem; height: 8rem; }
  .sachmoment .hinweis:active { transform: translateY(0.3rem); box-shadow: var(--ls-schatten-unten); }

  .eltern { position: fixed; inset: 0; z-index: 200; overflow: auto; padding: 6rem 8rem; background: var(--ls-papier); }
  .eltern h1 { margin: 0 0 3rem; font-size: 6rem; }
  .eltern p { max-width: 70ch; }
  .eltern .beschreibung { margin: 0 0 3rem; color: var(--ls-tinte-weich); }
  .eltern a { color: var(--ls-tinte); font-weight: 700; }
</style>
</head>
<body>
<div class="welt" id="welt" aria-hidden="true"></div>
<script type="module">
  import { raumSvg } from "./raum.js";
  document.getElementById("welt").innerHTML = raumSvg();
</script>

<ls-leiste id="leiste" spiel="stellentafel" fach="mathe" titel="Zahlen legen" thema="">
  <!-- Einführung im Spielbild wieder ansehen (docs/spielbau.md §8) -->
  <ls-knopf slot="rechts" id="anleitung" symbol="buch.svg" name="Anleitung" hidden></ls-knopf>
</ls-leiste>

<div class="buehne">
  <main class="spielflaeche" aria-label="Stellentafel auf der Arbeitsmatte">
    <ls-blase id="blase" ohne-text></ls-blase>
    <div class="hof" id="hof">
      <div class="matte" id="matte">
        <div class="aufgabe" id="aufgabe" aria-live="polite"></div>
        <div class="tafel" id="tafel">
          <div class="kopf z" aria-hidden="true">Zehner</div>
          <div class="kopf e" aria-hidden="true">Einer</div>
          <div class="feld" id="feld-z"><div class="real" id="real-z"></div><button class="platz" id="platz-z" data-stelle="z" type="button" aria-label="Zehner"></button></div>
          <div class="feld" id="feld-e"><div class="real" id="real-e"></div><button class="platz" id="platz-e" data-stelle="e" type="button" aria-label="Einer"></button></div>
        </div>
      </div>
    </div>
    <div class="brett tablett" id="brett">
      <ls-tastatur id="tastatur" tasten="1234567890" je-reihe="3" loeschen></ls-tastatur>
      <ls-knopf id="fertig" art="haupt" symbol="fertig.svg" wort="Fertig"></ls-knopf>
    </div>
  </main>
</div>
<div class="figuren" id="figuren" aria-hidden="true"><div class="schatten" id="schatten"></div><div class="timo" id="timo"><div class="koerper" id="timo-koerper"></div><div class="schoss" id="schoss"></div></div></div>

<ls-hilfe id="hilfe"></ls-hilfe>
<ls-pause id="pause"><div class="sachmoment" id="sachmoment"></div></ls-pause>

<script type="module" src="spiel.js"></script>
</body>
</html>
