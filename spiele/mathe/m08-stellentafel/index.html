<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Zahlen legen</title>
<!-- M08 Stellentafel (Idee docs/spiele/mathe/m08-stellentafel.md). Das Spielbild ist ein heller Pausenhof über den
     ganzen Bildschirm: mit Kreide eine Stellentafel aus zwei Feldern (Z und E), Timo rollt davor und legt goldenes
     Material hinein. Rechts mit Kreide die Aufgabe, darunter das Ziffernbrett. Leiste, Blase, Hilfe und Pause an ihren
     festen Plätzen. -->
<link rel="stylesheet" href="../../rahmen/seite.css">
<style>
  /* ===== SPIELWELT: Pausenhof mit Kreide. Alles in rem (1rem = Bildhöhe/108). ===== */
  :root {
    --kreide: #FBF8F1;
    --timo-hoehe: 33rem;      /* Feld der Figur (320 × 280); die Figur selbst ist etwa 31 rem hoch */
    --stange: 5.8rem;         /* Dicke der goldenen Stangen und der Einerperlen */
  }
  .welt {
    background:
      radial-gradient(ellipse 70% 40% at 40% 88%, rgba(255, 255, 255, 0.28), transparent 70%),
      linear-gradient(#D9D3C6 0 62%, #C9C2B3 62% 100%);
  }

  .spielflaeche {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 46rem;
    grid-template-rows: 12rem minmax(0, 1fr);
    column-gap: 2.4rem;
    row-gap: 1.6rem;
    padding: 1.6rem 2.4rem 2.4rem;
  }
  ls-blase { grid-column: 1; grid-row: 1; align-self: start; justify-self: start; position: relative; z-index: 7; }

  /* Die Aufgabe auf den Boden geschrieben; das Kästchen nimmt die getippte Zahl auf. */
  .gleichung {
    grid-column: 2; grid-row: 1;
    display: flex; align-items: center; justify-content: center; gap: 1.6rem;
    color: #3B2A6B;
    font-size: 6.2rem; font-weight: 700; line-height: 1; white-space: nowrap;
  }
  .gleichung.still { visibility: hidden; }
  .gleichung .rechnung:empty::before { content: "\00a0"; }
  .karte {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 11rem; height: 8.6rem; padding: 0 1.4rem;
    border: 0.55rem solid #3B2A6B;
    border-radius: 2rem 1.4rem 2.2rem 1.2rem;
    background: rgba(251, 248, 241, 0.7);
    font-size: 6rem;
  }
  .karte.leer { color: transparent; }

  /* Der Hof: Tafel oben, darunter der Weg, auf dem Timo rollt. */
  .hof { grid-column: 1; grid-row: 1 / 3; position: relative; z-index: 6; min-height: 0; margin-top: 1rem; }
  .tafel {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    display: grid; grid-template-columns: 54rem 54rem; column-gap: 3.2rem;
    grid-template-rows: 7.6rem 12.4rem 38rem; row-gap: 0;
  }
  .kopf {
    display: flex; align-items: center; justify-content: center;
    border: 0.7rem solid var(--kreide); border-bottom: 0; border-radius: 2.4rem 2.4rem 0 0;
    font-size: 5.4rem; font-weight: 700; color: #3B2A6B; line-height: 1;
  }
  .kopf.z { background: #F07C1E; }
  .kopf.e { background: #0FA3A3; }
  .karten, .feld { border-left: 0.7rem solid var(--kreide); border-right: 0.7rem solid var(--kreide); position: relative; }
  .feld { border-bottom: 0.7rem solid var(--kreide); border-radius: 0 0 2.4rem 2.4rem; background: rgba(70, 64, 58, 0.2); }
  .karten { display: flex; align-items: center; justify-content: center; background: rgba(251, 248, 241, 0.28); }
  .karten > * { flex: none; }
  /* Der Platz für das Material: nur ein blasser Umriss, damit man sieht, wohin Timo legt. */
  .feld::before { content: ""; position: absolute; left: 1.4rem; right: 1.4rem; top: 1.4rem; height: 8.4rem; border: 0.4rem dashed rgba(251, 248, 241, 0.4); border-radius: 2rem; }
  .real { position: absolute; left: 2.2rem; top: 2.4rem; display: flex; align-items: center; }
  .real ls-perlenstab { height: var(--stange); }
  .hohl {
    position: absolute; left: 2.2rem; right: 2.2rem; top: 10.8rem;
    display: grid; grid-template-columns: repeat(2, max-content); gap: 0.8rem 1.6rem; justify-content: start;
  }
  .hohl .hohlstab { display: block; padding: 0.3rem 0.6rem; border: 0.35rem dashed var(--kreide); border-radius: 1.4rem; opacity: 0.8; line-height: 0; }
  .hohl ls-perlenstab { height: 2.8rem; }
  .hohlkarte { position: absolute; left: 3rem; bottom: 1rem; z-index: 3; line-height: 0; }
  .hohlkarte ls-stellenwertkarte { --karte-hoehe: 10.5rem; }
  .karten ls-stellenwertkarte { --karte-hoehe: 10rem; will-change: transform; }
  /* Leerer Kartenplatz: nur ein blasser Umriss, damit man sieht, wohin die Karte kommt. */
  .karten:empty::before { content: ""; width: 16rem; height: 9rem; border: 0.4rem dashed rgba(251, 248, 241, 0.45); border-radius: 1.8rem; }

  /* Timo und die Dinge, die mit ihm rollen: über allem Bild, nehmen keine Tipps. */
  .figuren { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .timo { position: absolute; left: 0; top: 0; height: var(--timo-hoehe); width: calc(var(--timo-hoehe) * 320 / 280); transform-origin: 50% 90.7%; will-change: transform; }
  .timo > .koerper { width: 100%; height: 100%; transform-origin: 50% 90.7%; }
  .timo svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .schatten {
    position: absolute; left: 0; top: 0; width: 20rem; height: 3rem; margin: -1.5rem 0 0 -10rem;
    border-radius: 50%; background: rgba(43, 38, 34, 0.28); filter: blur(0.25rem); will-change: transform;
  }
  /* Auf dem Schoß: die Stange und die Perlen, die Timo gleich legt. */
  .schoss { position: absolute; left: 47%; top: 60%; display: flex; flex-direction: column; gap: 0.4rem; align-items: flex-start; }
  .schoss ls-perlenstab { height: 2.4rem; display: block; }
  /* Die getippte Zahl im Flug von der Aufgabe auf die Karte. */
  .flug { position: absolute; left: 0; top: 0; color: #3B2A6B; font-weight: 700; line-height: 1; white-space: nowrap; will-change: transform; z-index: 9; }
  .flug.hohl { opacity: 0.8; }

  /* Ziffernbrett, liegt rechts auf dem Hof: Ziffernblock, darunter Fertig. Unten bleibt Platz für die Hilfe. */
  .brett {
    grid-column: 2; grid-row: 2;
    align-self: start;
    display: flex; flex-direction: column; align-items: center; gap: 2.4rem;
    padding: 2.4rem 2rem 2.6rem;
    max-height: calc(100% - 13.6rem);
    position: relative; z-index: 6;
  }
  #fertig { align-self: center; }

  /* Schmale Bildschirme (4:3): kleinere Aufgabe und schmalere Tafel. */
  @media (max-aspect-ratio: 3/2) {
    .spielflaeche { grid-template-columns: minmax(0, 1fr) 42rem; }
    .gleichung { font-size: 5.2rem; }
    .karte { font-size: 5rem; min-width: 9rem; }
    .tafel { grid-template-columns: 46rem 46rem; column-gap: 2rem; }
  }

  /* Pause: Sachmoment auf der Papierkarte. */
  .sachmoment { display: grid; justify-items: center; gap: 3rem; max-width: 110rem; font-size: 4rem; text-align: center; }
  .sachmoment p { margin: 0; }
  .sachmoment .stifte { display: flex; align-items: center; gap: 4rem; }
  .sachmoment .stifte ls-perlenstab { height: 6.4rem; }
  .sachmoment .hinweis {
    display: inline-flex; align-items: center; gap: 2.4rem; min-height: 11rem; padding: 1.6rem 4rem 1.6rem 1.6rem;
    border: var(--ls-kontur) solid var(--ls-tinte); border-radius: var(--ls-radius); background: var(--ls-papier);
    box-shadow: var(--ls-schatten); color: var(--ls-tinte); font-weight: 700; text-decoration: none;
  }
  .sachmoment .hinweis img { width: 8rem; height: 8rem; }
  .sachmoment .hinweis:active { transform: translateY(0.3rem); box-shadow: var(--ls-schatten-unten); }

  .eltern { position: fixed; inset: 0; z-index: 200; overflow: auto; padding: 6rem 8rem; background: var(--ls-papier); }
  .eltern h1 { margin: 0 0 3rem; font-size: 6rem; }
  .eltern p { max-width: 70ch; }
  .eltern .beschreibung { margin: 0 0 3rem; color: var(--ls-tinte-weich); }
  .eltern a { color: var(--ls-tinte); font-weight: 700; }
</style>
</head>
<body>
<div class="welt" aria-hidden="true"></div>

<ls-leiste id="leiste" spiel="stellentafel" fach="mathe" titel="Zahlen legen" thema="">
  <!-- Einführung im Spielbild wieder ansehen (docs/spielbau.md §8) -->
  <ls-knopf slot="rechts" id="anleitung" symbol="buch.svg" name="Anleitung" hidden></ls-knopf>
</ls-leiste>

<div class="buehne">
  <main class="spielflaeche" aria-label="Stellentafel auf dem Pausenhof">
    <ls-blase id="blase" ohne-text></ls-blase>
    <div class="gleichung" id="aufgabe" aria-live="polite"><span class="rechnung" id="rechnung"></span><span class="karte leer" id="eingabe">0</span></div>
    <div class="hof" id="hof">
      <div class="tafel" id="tafel">
        <div class="kopf z" aria-hidden="true">Z</div>
        <div class="kopf e" aria-hidden="true">E</div>
        <div class="karten" id="karten-z" role="img" aria-label="Zehnerkarten"></div>
        <div class="karten" id="karten-e" role="img" aria-label="Einerkarten"></div>
        <div class="feld" id="feld-z" role="img" aria-label="Zehnerfeld"><div class="real" id="real-z"></div><div class="hohl" id="hohl-z"></div></div>
        <div class="feld" id="feld-e" role="img" aria-label="Einerfeld"><div class="real" id="real-e"></div><div class="hohl" id="hohl-e"></div></div>
      </div>
      <div class="hohlkarte" id="hohlkarte"></div>
    </div>
    <div class="brett tablett" id="brett">
      <ls-tastatur id="tastatur" tasten="1234567890" je-reihe="3" loeschen></ls-tastatur>
      <ls-knopf id="fertig" art="haupt" symbol="fertig.svg" wort="Fertig"></ls-knopf>
    </div>
  </main>
</div>
<div class="figuren" id="figuren" aria-hidden="true"><div class="schatten" id="schatten"></div><div class="timo" id="timo"><div class="koerper" id="timo-koerper"></div><div class="schoss" id="schoss"></div></div></div>

<ls-hilfe id="hilfe"></ls-hilfe>
<ls-pause id="pause"><div class="sachmoment" id="sachmoment"></div></ls-pause>

<script type="module" src="spiel.js"></script>
</body>
</html>
