<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Streifenbrett</title>
<!-- M20 Streifenbrett (Idee docs/spiele/mathe/m20-streifenbrett.md). Das Spielbild ist ein Teich am frühen Morgen über den ganzen
     Bildschirm: links das Ufer mit Kofi, nach rechts eine helle, ruhige Bahn aus Wasser (die Matte), hinten Nebel. Auf dem Holzschild
     steht die Aufgabe, rechts das Ziffernbrett aus Holz mit dem Haken. Die Perlenstäbe der Aufgabe legen sich als Steg aufs Wasser,
     und Kofi rennt so viele Perlen weit, wie das Kind getippt hat. Leiste, Blase, Hilfe und Pause an ihren Plätzen. -->
<link rel="stylesheet" href="../../rahmen/seite.css">
<style>
  /* ===== SPIELWELT: ein Teich im Morgennebel. Alles in rem (1rem = Bildhöhe/108). ===== */
  :root {
    --feld-links: max(0rem, calc((100vw - 192rem) / 2));
    --feld-breite: min(100vw, 192rem);
    --x0: 24rem;        /* Beginn der ersten Perle */
    --d: 4.2rem;        /* Durchmesser einer Perle */
    --steg-y: 70rem;    /* Oberkante der Stäbe: hier stehen Kofis Füße */
  }
  .welt { background: linear-gradient(#D8E9EE 0, #EEF1E6 46rem, #A9CFD3 46rem, #86B5BF 100%); overflow: hidden; }
  .feld { position: absolute; top: 0; bottom: 0; left: var(--feld-links); width: var(--feld-breite); }
  .feld > * { position: absolute; }

  .ferne { left: 0; top: 14rem; width: 100%; height: 36rem; }
  .wasser { left: -40rem; right: -40rem; top: 46rem; bottom: 0;
    background: repeating-linear-gradient(0deg, transparent 0 6rem, rgba(255, 255, 255, 0.07) 6rem 6.6rem), linear-gradient(#A9CFD3, #86B5BF); }
  /* Die Bahn ist die Matte: das Hellste, flach und ruhig. */
  .bahn { left: 20rem; top: 66.4rem; width: 112rem; height: 14.6rem; border-radius: 3rem; background: #E9F5F2; opacity: 0.9; }
  .pfahl { position: absolute; top: 0; width: 1.5rem; border-radius: 0.5rem 0.5rem 0 0; background: #8A6A4B; border: 0.25rem solid var(--ls-tinte); border-bottom: 0; box-sizing: border-box; }

  /* Die Insel liegt hinter dem Nebel, bis die Zahl stimmt. */
  .insel { top: 56rem; width: 18rem; height: 24rem; }
  .insel > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .insel .reiher { position: absolute; left: 10.4rem; top: 0.6rem; width: 5.4rem; height: 8.4rem; will-change: transform, opacity; }
  .insel .reiher svg { width: 100%; height: 100%; overflow: visible; }
  .nebel { left: calc(var(--x0) + 8rem); right: -30rem; top: 40rem; height: 48rem; will-change: opacity;
    -webkit-mask-image: linear-gradient(transparent, #000 28%, #000 72%, transparent); mask-image: linear-gradient(transparent, #000 28%, #000 72%, transparent);
    background:
      radial-gradient(ellipse 60% 55% at 38% 52%, rgba(244, 249, 250, 0.96) 0 42%, rgba(244, 249, 250, 0) 100%),
      radial-gradient(ellipse 70% 60% at 76% 46%, rgba(244, 249, 250, 0.96) 0 40%, rgba(244, 249, 250, 0) 100%),
      linear-gradient(90deg, rgba(244, 249, 250, 0) 0, rgba(244, 249, 250, 0.9) 14rem, rgba(244, 249, 250, 0.94) 100%); }

  /* Der Steg: die Stäbe der Aufgabe, von links nach rechts; das Ufer ist links davon. */
  .steg { left: var(--x0); top: var(--steg-y); height: calc(var(--d) * 1.4); width: 120rem; transform-origin: 0 50%; will-change: transform; }
  .steg > ls-perlenstab, .steg > .stab { position: absolute; top: 0; height: calc(var(--d) * 1.4); }
  .steg > .stab { display: block; }
  .steg.sinkt { pointer-events: none; }
  .deckel { position: absolute; top: calc(var(--d) * -0.1); height: calc(var(--d) * 1.6); box-sizing: border-box; border: var(--ls-kontur) solid var(--ls-tinte); border-radius: calc(var(--d) * 0.8);
    background: rgba(107, 92, 150, 0.82); }

  .ufer { left: 0; top: 56rem; width: 30rem; height: 40rem; pointer-events: none; }

  /* Vorn: Kofi und die Schilder (nehmen keine Tipps). */
  .welt-vorn { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .welt-vorn .feld > * { position: absolute; }
  .kofi { left: 0; top: calc(var(--steg-y) - 34.5rem); height: 38rem; width: calc(38rem * 320 / 280); margin-left: -21.7rem; will-change: transform; transform-origin: 50% 90.7%; }
  .kofi > .koerper { width: 100%; height: 100%; transform-origin: 50% 90.7%; }
  .kofi svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .schatten { left: 0; top: calc(var(--steg-y) - 0.8rem); width: 12rem; height: 1.6rem; margin-left: -6rem; border-radius: 50%; background: rgba(43, 38, 34, 0.18); filter: blur(0.3rem); }

  /* Das Holzschild am Ufer mit der Aufgabe (flach, kein Knopf: kein Schatten). */
  .schild { left: 19rem; top: 32rem; min-width: 58rem; height: 16rem; padding: 0 3.6rem; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 2.2rem;
    background: #F1DDB8; border: var(--ls-kontur) solid var(--ls-tinte); border-radius: 2.2rem;
    font: 700 7.6rem/1 "Andika", sans-serif; color: var(--ls-tinte); will-change: transform; }
  .schild::before { content: ""; position: absolute; left: 2.2rem; bottom: -22rem; width: 2rem; height: 22rem; z-index: -1; background: #8A6A4B; border: 0.25rem solid var(--ls-tinte); border-top: 0; box-sizing: border-box; }
  .schild .eingabe { position: relative; min-width: 13rem; height: 11rem; padding: 0 1.6rem; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
    background: var(--ls-papier); border: var(--ls-kontur) solid var(--ls-tinte); border-radius: 1.6rem; }
  .schild .eingabe .z.sinkt { animation: sinkt 0.22s ease-out; }
  @keyframes sinkt { from { transform: translateY(-1.6rem); opacity: 0.2; } to { transform: none; opacity: 1; } }
  .schild.markiert { outline: 0.8rem solid var(--ls-sonne); outline-offset: 0.5rem; box-shadow: 0 0 0 0.3rem var(--ls-tinte); }

  /* Schild mit der Zahl: auf der Insel (fest), als Probe (Sonnenring) oder hohl (die getippte Zahl, die nicht passt). */
  .zahlschild { left: 0; top: 0; width: 11rem; height: 9rem; margin-left: -5.5rem; display: flex; align-items: center; justify-content: center; box-sizing: border-box;
    background: #F1DDB8; border: var(--ls-kontur) solid var(--ls-tinte); border-radius: 1.4rem; font: 700 6.2rem/1 "Andika", sans-serif; color: var(--ls-tinte); will-change: transform, opacity; }
  .zahlschild::after { content: ""; position: absolute; left: 50%; bottom: -3.4rem; width: 1.2rem; height: 3.4rem; margin-left: -0.6rem; background: #8A6A4B; border: 0.25rem solid var(--ls-tinte); border-top: 0; box-sizing: border-box; z-index: -1; }
  .zahlschild.hohl { background: rgba(255, 252, 247, 0.22); border-style: dashed; color: var(--ls-tinte-weich); }
  .zahlschild.hohl::after { opacity: 0.55; }
  .zahlschild.boje::after { display: none; }
  .zahlschild.markiert { outline: 0.8rem solid var(--ls-sonne); outline-offset: 0.4rem; box-shadow: 0 0 0 0.3rem var(--ls-tinte); }
  .tropfen { left: 0; top: 0; width: 1.6rem; height: 2.4rem; margin-left: -0.8rem; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: #BFE0EA; border: 0.25rem solid var(--ls-tinte); box-sizing: border-box; opacity: 0; }
  .markiert-pfahl { outline: 0.8rem solid var(--ls-sonne); outline-offset: 0.3rem; }

  /* Ziffernbrett aus Holz, rechts: Ziffernblock, darunter der Haken. Unten bleibt Platz für die Hilfe. */
  .spielflaeche { display: grid; grid-template-columns: minmax(0, 1fr) 46rem; grid-template-rows: 12rem minmax(0, 1fr); column-gap: 2.4rem; row-gap: 1.6rem; padding: 1.6rem 2.4rem 2.4rem; }
  ls-blase { grid-column: 1; grid-row: 1; align-self: start; justify-self: start; position: relative; z-index: 6; }
  .brett { grid-column: 2; grid-row: 2; align-self: start; display: flex; flex-direction: column; align-items: center; gap: 2.4rem; padding: 2.4rem 2rem 2.6rem; max-height: calc(100% - 13.6rem); }
  #fertig { align-self: center; }
  .sachmoment { display: grid; justify-items: center; gap: 3rem; max-width: 110rem; font-size: 4rem; text-align: center; }
  .sachmoment p { margin: 0; }
  @media (prefers-reduced-motion: reduce) { .schild .eingabe .z.sinkt { animation: none; } }
  @media (max-aspect-ratio: 3/2) { .spielflaeche { grid-template-columns: minmax(0, 1fr) 42rem; } }

  .eltern { position: fixed; inset: 0; z-index: 200; overflow: auto; padding: 6rem 8rem; background: var(--ls-papier); }
  .eltern h1 { margin: 0 0 3rem; font-size: 6rem; }
  .eltern p { max-width: 70ch; }
  .eltern .beschreibung { margin: 0 0 3rem; color: var(--ls-tinte-weich); }
  .eltern a { color: var(--ls-tinte); font-weight: 700; }
</style>
</head>
<body>
<div class="welt" aria-hidden="true">
  <div class="feld" id="szene">
    <svg class="ferne" viewBox="0 0 192 36" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 36 V22 C14 14 26 18 40 12 C56 6 66 16 84 14 C102 12 112 4 130 8 C150 12 168 6 192 16 V36 Z" fill="#C3D5DB"/>
      <path d="M0 36 V28 C18 22 30 26 48 22 C68 18 80 26 100 24 C122 22 140 17 160 22 C174 25 184 22 192 24 V36 Z" fill="#B0C7CF"/>
      <g fill="#9DB5A9"><rect x="20" y="22" width="1.1" height="8"/><ellipse cx="20.5" cy="21" rx="3.2" ry="4.4"/><rect x="152" y="24" width="1" height="7"/><ellipse cx="152.5" cy="23" rx="2.8" ry="4"/></g>
    </svg>
    <div class="wasser"></div>
    <div class="bahn"></div>
    <div id="pfaehle"></div>
    <div class="insel" id="insel">
      <svg viewBox="0 0 180 240" aria-hidden="true">
        <g stroke="#3B2A6B" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
          <path d="M8 156 C14 144 40 140 90 140 C140 140 168 146 174 156 C178 178 160 196 90 198 C20 196 4 178 8 156 Z" fill="#E7D8A6"/>
          <path d="M12 154 C22 142 50 138 90 138 C130 138 158 142 170 154 C150 150 120 150 90 150 C60 150 34 150 12 154 Z" fill="#8FBF7C"/>
          <rect x="44" y="82" width="9" height="62" fill="#9A7050"/>
          <ellipse cx="48.5" cy="74" rx="26" ry="30" fill="#6FA97C"/>
          <ellipse cx="40" cy="82" rx="14" ry="16" fill="#80B88B" stroke="none"/>
        </g>
      </svg>
      <div class="reiher" id="reiher">
        <svg viewBox="0 0 54 84" aria-hidden="true"><g stroke="#3B2A6B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 80 V62 M31 80 V62" fill="none"/>
          <path d="M14 46 C14 36 24 32 34 34 C44 36 48 46 40 54 C34 62 18 60 14 46 Z" fill="#E4E7EF"/>
          <path d="M34 36 C42 28 30 22 32 14 C33 8 40 8 41 13" fill="none" stroke-width="3.2"/>
          <path d="M41 13 L51 15 L41 17 Z" fill="#F2C94C"/>
          <path d="M16 44 C10 42 6 48 8 54 C14 54 20 50 16 44 Z" fill="#B5BFCD"/>
          <circle cx="38" cy="12" r="1" fill="#3B2A6B" stroke="none"/>
        </g></svg>
      </div>
    </div>
    <div class="nebel" id="nebel"></div>
    <div class="steg" id="steg"></div>
    <svg class="ufer" viewBox="0 0 30 40" aria-hidden="true">
      <g stroke="#3B2A6B" stroke-width="0.3" stroke-linejoin="round" stroke-linecap="round">
        <g fill="none" stroke="#5E8760" stroke-width="0.6"><path d="M1.6 17 C1 10 2.4 5 1.8 -2"/><path d="M3 17 C3.6 11 2 6 3.4 0"/><path d="M4.6 17 C5.2 12 4.2 8 5 3"/><path d="M0.4 18 C-0.6 11 0.2 7 -0.8 2"/></g>
        <g fill="#8A5A3B" stroke-width="0.25"><ellipse cx="1.8" cy="-2" rx="0.5" ry="1.5"/><ellipse cx="3.4" cy="0" rx="0.5" ry="1.5"/><ellipse cx="5" cy="3" rx="0.5" ry="1.4"/></g>
        <rect x="3" y="19" width="1.6" height="12" fill="#7A5A3B"/><rect x="18.4" y="19" width="1.6" height="11" fill="#7A5A3B"/>
        <rect x="0" y="16.4" width="22.6" height="3.6" fill="#B8864F"/>
        <rect x="0" y="14" width="22.6" height="2.4" fill="#D9A869"/>
        <path d="M5.2 14 V16.4 M10.6 14 V16.4 M16.2 14 V16.4 M5.2 16.4 V20 M11.6 16.4 V20 M17 16.4 V20" fill="none" stroke-width="0.22"/>
      </g>
    </svg>
  </div>
</div>

<ls-leiste id="leiste" spiel="streifenbrett" fach="mathe" titel="Streifenbrett" thema="">
  <!-- Einführung im Spielbild wieder ansehen (docs/spielbau.md §8) -->
  <ls-knopf slot="rechts" id="anleitung" symbol="buch.svg" name="Anleitung" hidden></ls-knopf>
</ls-leiste>

<div class="buehne">
  <main class="spielflaeche" aria-label="Teich mit Steg">
    <ls-blase id="blase" ohne-text></ls-blase>
    <div class="brett tablett" id="brett">
      <ls-tastatur id="tastatur" tasten="1234567890" je-reihe="3" loeschen></ls-tastatur>
      <ls-knopf id="fertig" art="haupt" symbol="fertig.svg" wort="Fertig" stumm></ls-knopf>
    </div>
  </main>
</div>
<div class="welt-vorn" aria-hidden="true">
  <div class="feld" id="figuren">
    <div class="schatten" id="schatten"></div>
    <div class="schild" id="schild"><span id="op-a"></span><span id="op-zeichen"></span><span id="op-b"></span><span>=</span><span class="eingabe" id="eingabe"></span></div>
    <div class="kofi" id="kofi"><div class="koerper" id="kofi-koerper"></div></div>
  </div>
</div>

<ls-hilfe id="hilfe"></ls-hilfe>
<ls-pause id="pause"><div class="sachmoment" id="sachmoment"></div></ls-pause>
<ls-gekonnt id="gekonnt"></ls-gekonnt>

<script type="module" src="spiel.js"></script>
</body>
