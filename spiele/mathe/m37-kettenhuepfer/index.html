<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kettenhüpfer</title>
<!-- M37 Kettenhüpfer (Idee docs/spiele/mathe/m37-kettenhuepfer.md). Das Spielbild ist die Straße über den ganzen
     Bildschirm: Die Perlenkette ist mit Kreide leicht perspektivisch auf den Asphalt gemalt, Lena hüpft sie ab
     (Christian, 2026-11-15). Rechts mit Kreide die Aufgabe, darunter das Ziffernbrett aus Holz. Leiste, Blase, Hilfe
     und Pause an ihren festen Plätzen. -->
<link rel="stylesheet" href="../../rahmen/seite.css">
<style>
  /* ===== SPIELWELT: Straße mit Kreide. Alles in rem (1rem = Bildhöhe/108). ===== */
  :root {
    --kreide: #FBF8F1;
    --lena-hoehe: 43rem;      /* Feld der Figur vorn (320 × 280); die Figur selbst ist etwa 36 rem hoch, ein Drittel des Bilds */
  }
  .welt { background: #9C988F; }

  .spielflaeche {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 46rem;
    grid-template-rows: 12rem minmax(0, 1fr);
    column-gap: 2.4rem;
    row-gap: 1.6rem;
    padding: 1.6rem 2.4rem 2.4rem;
  }
  ls-blase { grid-column: 1; grid-row: 1; align-self: start; width: min(80rem, 100%); position: relative; z-index: 2; }

  /* Die Aufgabe mit Kreide auf den Asphalt geschrieben; das Kästchen nimmt die getippte Zahl auf. */
  .gleichung {
    grid-column: 2; grid-row: 1;
    display: flex; align-items: center; justify-content: center; gap: 1.6rem;
    color: var(--kreide);
    font-size: 6.2rem; font-weight: 700; line-height: 1; white-space: nowrap;
    -webkit-mask-image: var(--kreide-korn); mask-image: var(--kreide-korn);
    -webkit-mask-size: 16rem; mask-size: 16rem;
    transform: rotate(-1.5deg);
  }
  .gleichung .rechnung:empty::before { content: "\00a0"; }
  .karte {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 11rem; height: 8.6rem; padding: 0 1.4rem;
    border: 0.55rem solid var(--kreide);
    border-radius: 2rem 1.4rem 2.2rem 1.2rem;
    background: rgba(70, 64, 58, 0.22);
    font-size: 6rem;
  }
  .karte.leer { color: transparent; }

  /* Lena und ihr Schatten: über allem Bild, nehmen keine Tipps; spiel.js setzt sie mit transform auf ihr Stäbchen. */
  .figuren { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .lena { position: absolute; left: 0; top: 0; height: var(--lena-hoehe); width: calc(var(--lena-hoehe) * 320 / 280); transform-origin: 50% 90.7%; will-change: transform; }
  .lena > .koerper { width: 100%; height: 100%; transform-origin: 50% 90.7%; }
  .lena svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .schatten {
    position: absolute; left: 0; top: 0; width: 13rem; height: 3rem; margin: -1.5rem 0 0 -6.5rem;
    border-radius: 50%; background: rgba(43, 38, 34, 0.32); filter: blur(0.25rem); will-change: transform, opacity;
  }
  /* Die getippte Zahl im Flug von der Aufgabe zur Kette: Kreide. */
  .flug {
    position: absolute; left: 0; top: 0;
    color: var(--kreide); font-weight: 700; line-height: 1; white-space: nowrap;
    -webkit-mask-image: var(--kreide-korn); mask-image: var(--kreide-korn); -webkit-mask-size: 16rem; mask-size: 16rem;
    will-change: transform;
  }
  .flug.hohl { opacity: 0.8; }

  /* Ziffernbrett aus Holz, liegt rechts auf der Straße: Ziffernblock, darunter Fertig. Unten bleibt Platz für die Hilfe. */
  .brett {
    grid-column: 2; grid-row: 2;
    align-self: start;
    display: flex; flex-direction: column; align-items: center; gap: 2.4rem;
    padding: 2.4rem 2rem 2.6rem;
    max-height: calc(100% - 13.6rem);
  }
  #fertig { align-self: center; }

  /* Schmale Bildschirme (4:3): etwas kleinere Aufgabe. */
  @media (max-aspect-ratio: 3/2) {
    .spielflaeche { grid-template-columns: minmax(0, 1fr) 42rem; }
    .gleichung { font-size: 5.2rem; }
    .karte { font-size: 5rem; min-width: 9rem; }
  }

  /* Pause: Sachmoment auf der Papierkarte. */
  .sachmoment { display: grid; justify-items: center; gap: 3rem; max-width: 110rem; font-size: 4rem; text-align: center; }
  .sachmoment p { margin: 0; }
  .sachmoment .hinweis {
    display: inline-flex; align-items: center; gap: 2.4rem; min-height: 11rem; padding: 1.6rem 4rem 1.6rem 1.6rem;
    border: var(--ls-kontur) solid var(--ls-tinte); border-radius: var(--ls-radius); background: var(--ls-papier);
    box-shadow: var(--ls-schatten); color: var(--ls-tinte); font-weight: 700; text-decoration: none;
  }
  .sachmoment .hinweis img { width: 8rem; height: 8rem; }
  .sachmoment .hinweis:active { transform: translateY(0.3rem); box-shadow: var(--ls-schatten-unten); }

  .eltern { position: fixed; inset: 0; z-index: 200; overflow: auto; padding: 6rem 8rem; background: var(--ls-papier); }
  .eltern h1 { margin: 0 0 3rem; font-size: 6rem; }
  .eltern p { max-width: 70ch; }
  .eltern .beschreibung { margin: 0 0 3rem; color: var(--ls-tinte-weich); }
  .eltern a { color: var(--ls-tinte); font-weight: 700; }
</style>
</head>
<body>
<div class="welt" aria-hidden="true"><m37-kreidekette id="kette" reihe="2"></m37-kreidekette></div>

<ls-leiste id="leiste" spiel="kettenhuepfer" fach="mathe" titel="Kettenhüpfer" thema="">
  <!-- Einführung im Spielbild wieder ansehen (docs/spielbau.md §8) -->
  <ls-knopf slot="rechts" id="anleitung" symbol="buch.svg" name="Anleitung" hidden></ls-knopf>
</ls-leiste>

<div class="buehne">
  <main class="spielflaeche" aria-label="Perlenkette auf der Straße">
    <ls-blase id="blase"></ls-blase>
    <div class="gleichung" id="tafel" aria-live="polite"><span class="rechnung" id="rechnung"></span><span class="karte leer" id="eingabe">0</span></div>
    <div class="brett tablett" id="brett">
      <ls-tastatur id="tastatur" tasten="1234567890" je-reihe="3" loeschen></ls-tastatur>
      <ls-knopf id="fertig" art="haupt" symbol="fertig.svg" wort="Fertig"></ls-knopf>
    </div>
  </main>
</div>
<div class="figuren" aria-hidden="true"><div class="schatten" id="schatten"></div><div class="lena" id="lena"><div class="koerper" id="lena-koerper"></div></div></div>

<ls-hilfe id="hilfe"></ls-hilfe>
<ls-pause id="pause"><div class="sachmoment" id="sachmoment"></div></ls-pause>

<script type="module" src="spiel.js"></script>
</body>
</html>
