<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Die Perlenbrücke</title>
<link rel="stylesheet" href="schrift/schrift.css">
<style>
/* Spec: docs/superpowers/specs/2026-11-13-perlenbruecke-neu-design.md – 1920×1080 quer, Touch */
:root{--nacht:#3B2A6B;--paper:#FFFFFF;--bg:#CDEFFF;--sonne:#FFD95A;--lila:#8F73E6;--lila-s:#6A50C4;
  font-size:calc(100vh / 108)}   /* 1rem = 10 px bei 1080 px Höhe */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Andika",sans-serif;color:var(--nacht);background:#E8F7FF;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block}
#welt{position:fixed;inset:0;width:100%;height:100%;display:block}
#welt *{transform-box:fill-box}
.rund{position:fixed;top:2rem;width:8rem;height:8rem;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;padding:1.7rem;
  box-shadow:0 .5rem 0 rgba(59,42,107,.15);text-decoration:none;z-index:9}
.rund img{width:100%;height:100%}
.rund:active{transform:translateY(.3rem);box-shadow:0 .2rem 0 rgba(59,42,107,.15)}
.rund.l{left:2.4rem}.rund.r{right:2.4rem}

/* Perlen und Stäbchen (SVG) */
.perle{transform-origin:50% 50%;transition:transform .18s,opacity .3s}
.perle.zaehl{transform:scale(1.28)}
.perle.zaehl .ring{opacity:1}
.perle .ring{opacity:0;transition:opacity .15s}
.perle.aus{opacity:.22}
.perle.hell .ring{opacity:1}
.perle.zuviel{animation:zuviel .35s ease-in-out 2}
@keyframes zuviel{50%{transform:translateY(-10px) rotate(-12deg)}}
.platz{fill:rgba(255,255,255,.18);stroke:rgba(255,255,255,.9);stroke-width:3;stroke-dasharray:7 6}
.platz.blink{animation:blink .3s ease-in-out 4 alternate}
@keyframes blink{to{fill:rgba(255,217,90,.85);stroke:#FFD95A}}
.platte{fill:#FFF8EE;stroke:rgba(59,42,107,.18);stroke-width:3;transition:fill .15s,stroke .15s}
.stab{cursor:pointer;transition:transform .15s,opacity .3s}
.stab.gewaehlt{transform:translateY(-10px)}
.stab.gewaehlt .platte{fill:#FFF2BF;stroke:var(--sonne);stroke-width:8}
.stab.weg{opacity:.2}
.stab.zu{opacity:.35}
.stab.leuchtet .platte{stroke:var(--sonne);stroke-width:8;animation:leuchten 1s ease-in-out infinite alternate}
@keyframes leuchten{to{fill:#FFE68A}}
.ziffer{font:400 56px "Andika",sans-serif;fill:var(--nacht);dominant-baseline:central}
.zahl{font:400 120px "Andika",sans-serif;fill:var(--nacht);dominant-baseline:central;text-anchor:middle}
.wippe{transform-origin:50% 100%;animation:wippe 1.4s ease-in-out}
@keyframes wippe{20%{transform:rotate(-4deg)}45%{transform:rotate(3.5deg)}70%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
.figur .head{transition:transform .6s ease-in-out}
.bruecke-traegt{animation:traegt .5s ease-out}
@keyframes traegt{40%{transform:translateY(8px)}100%{transform:translateY(0)}}

/* Pause: eigene Abendszene (SVG) mit Balken; nach „kann ich“ mit Knöpfen statt Balken */
.pause{position:fixed;inset:0;z-index:25;background:#1F1B45;display:none;opacity:0;transition:opacity .6s}
.pause.on{display:block}.pause.show{opacity:1}
.pause svg.szene{position:absolute;inset:0;width:100%;height:100%}
.pause .atmen{transform-box:fill-box;transform-origin:50% 100%;animation:atmen 5s ease-in-out infinite}
@keyframes atmen{50%{transform:scaleY(1.02)}}
.pause .blink{animation:sblink 4s ease-in-out infinite}
@keyframes sblink{50%{opacity:.35}}
.pause .schimmer{animation:schim 6s ease-in-out infinite}
@keyframes schim{50%{opacity:.7}}
.pbar{position:absolute;left:30%;width:40%;bottom:3rem;height:1.2rem;border-radius:99rem;background:rgba(59,42,107,.35);box-shadow:0 0 0 .2rem rgba(59,42,107,.35);overflow:hidden}
.pfill{height:100%;width:0;border-radius:99rem;background:#fff}
.pause.show .pfill{animation:pfill var(--pause-ms,10s) linear forwards}
@keyframes pfill{from{width:0}to{width:100%}}
.eltern{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--bg);padding:3rem 4rem 4rem;user-select:text;-webkit-user-select:text;touch-action:auto;font-size:2rem}
.eltern h1{font:700 4rem/1.1 "Andika",sans-serif}.eltern h2{font:700 2.8rem/1.1 "Andika",sans-serif;margin:2.4rem 0 .6rem}.eltern p{margin:1rem 0;font-weight:400;max-width:80ch}
.eltern ul{list-style:none}.eltern li{background:var(--paper);border-radius:1rem;padding:.6rem 1.4rem;margin:.6rem 0;font-weight:400}
.eltern small{font-weight:400;opacity:.75}
.eltern .btn{display:inline-flex;align-items:center;height:7rem;padding:0 3.2rem;border-radius:99rem;font:400 2.6rem/1 "Andika",sans-serif;color:#fff;background:var(--lila);box-shadow:0 .9rem 0 var(--lila-s);text-decoration:none}
/* Sprechblase: Sätze mit Ziffern lesen statt hören */
.sprech{width:100%;height:100%;display:flex;align-items:flex-end;padding:6px 8px 34px}
.blase{position:relative;width:100%;background:#fff;border:5px solid var(--nacht);border-radius:36px;padding:18px 28px;
  font:400 36px/1.3 "Andika",sans-serif;color:var(--nacht);transition:opacity .3s}
.blase::before,.blase::after{content:"";position:absolute;right:54px;border:solid transparent}
.blase::before{bottom:-34px;border-width:34px 18px 0 18px;border-top-color:var(--nacht)}
.blase::after{bottom:-24px;right:59px;border-width:26px 13px 0 13px;border-top-color:#fff}
.blase.leer{opacity:0}
/* Stufen vorstellung/kopf: Abdeckung in Ufer-Farbe über den Perlen, die Ziffer bleibt */
.deckel{fill:url(#fels);stroke:rgba(59,42,107,.35);stroke-width:3;opacity:0;transition:opacity .4s;pointer-events:none}
.deckel.zu{opacity:1}
.kettenperlen{transition:opacity .4s}
.kettenperlen.verdeckt,.luecke.verdeckt{opacity:0}
.luecke{transition:opacity .3s}
/* Knöpfe in der Pause nach „kann ich“: Haus und Weiter */
.pknoepfe{position:absolute;left:0;right:0;bottom:6rem;display:flex;justify-content:center;gap:8rem}
.pk{width:16rem;height:16rem;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;padding:3.4rem;box-shadow:0 .8rem 0 rgba(0,0,0,.25);text-decoration:none}
.pk img{width:100%;height:100%}
.pk.weiter img{transform:scaleX(-1)}
.phinweis{position:absolute;right:5rem;top:5rem;display:flex;align-items:center;gap:2rem;padding:1.6rem 3.2rem 1.6rem 1.6rem;border-radius:99rem;background:rgba(255,255,255,.92);
  box-shadow:0 .8rem 0 rgba(0,0,0,.25);text-decoration:none;color:var(--nacht);font:400 4rem/1 "Andika",sans-serif}
.phinweis img{width:9rem;height:9rem}
.phinweis:active{transform:translateY(.4rem);box-shadow:0 .4rem 0 rgba(0,0,0,.25)}
.pk:active{transform:translateY(.4rem);box-shadow:0 .4rem 0 rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){.bruecke-traegt,.wippe,.perle.zuviel,.platz.blink,.stab.leuchtet .platte{animation:none}.pause{transition:none}.pause .atmen,.pause .blink,.pause .schimmer{animation:none}}
</style>
</head>
<body>
<svg id="welt" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-label="Perlenbrücke">
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE6FF"/><stop offset="1" stop-color="#E8F7FF"/></linearGradient>
    <linearGradient id="wasser" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CC8F2"/><stop offset="1" stop-color="#4E9FD6"/></linearGradient>
    <linearGradient id="fels" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C79A7E"/><stop offset="1" stop-color="#A97C62"/></linearGradient>
  </defs>
  <rect x="-400" y="-200" width="2720" height="1480" fill="url(#himmel)"/>
  <circle cx="1700" cy="150" r="70" fill="#FFE27A"/>
  <g fill="#fff" opacity=".85"><ellipse cx="300" cy="140" rx="90" ry="28"/><ellipse cx="350" cy="122" rx="55" ry="30"/><ellipse cx="1300" cy="110" rx="70" ry="20"/><ellipse cx="1340" cy="96" rx="40" ry="22"/></g>
  <rect x="-400" y="860" width="2720" height="420" fill="url(#wasser)"/>
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".6"><path d="M700 920 q20 -10 40 0 M1150 960 q20 -10 40 0 M900 1010 q20 -10 40 0"/></g>
  <path id="uferL"/><path id="uferR"/>
  <g id="plaetze"></g>
  <g id="kette"></g>
  <g id="spalteL"></g><g id="spalteR"></g>
  <g id="bruecke"></g>
  <g id="figuren"></g>
  <foreignObject x="130" y="10" width="540" height="262"><div xmlns="http://www.w3.org/1999/xhtml" class="sprech"><div class="blase leer" id="blase" aria-live="polite"></div></div></foreignObject>
  </svg>
<a class="rund l" href="index.html" aria-label="Alle Spiele"><img src="symbole/haus.svg" alt=""></a>
<button class="rund r" id="snd" aria-label="Ton"><img id="sndimg" src="symbole/ton-an.svg" alt=""></button>
<div class="pause" id="pause"></div>

<script src="figuren/figuren.js"></script>
<script src="figuren/einhorn.js"></script>
<script type="module">
import {lade, speichere, sperreTouch, esc, protokoll} from "./lernspiel.js";
import {ladeEinstellungen, einstellung, setzeEinstellung} from "./kern/einstellungen.js";
import {sprich as kernSprich, stille} from "./kern/stimme.js";
import {K, paareVon, migriere, angebotAus, verbucheBau, zerlegung, eigenerStand, SPEICHER, SPEICHER_ALT} from "./perlen-logik.js";
import {runde, einmal} from "./lernsteuerung.js";
import {spieleEinfuehrung} from "./einfuehrung.js";
sperreTouch();
(async function(){
  // ---------- Einstellungen (Logik-Werte stehen in perlen-logik.js, K) ----------
  const BAUEN_NACH_MS = 600;    // so lange nach der Wahl beider Seiten, dann wird gebaut
  const FEHLER_MS = 4800;       // Fehlerszene (ab dem zweiten Tipp, nichts antippbar) dauert höchstens so lange; Zählen passt sich an
  const ZAEHL_MS = 280;         // je gezählte Perle (höchstens; bei vielen Perlen schneller)
  const HILFE_SPERRE_MS = 2500; // Denkhilfe: andere Spalte so lange gesperrt, bis die Frage gesprochen ist
  const VORSTELLUNG_MS = 1500;  // Stufe vorstellung: so lange sind die Perlen der Stäbchen zu sehen
  const GEKONNT_MS = 3500;      // Gekonnt-Satz in der Blase, bevor die Pause kommt
  const PAUSE_MS = 10000;
  const FARBE = {1:"#E53935",2:"#43A047",3:"#F48FB1",4:"#FDD835",5:"#64B5F6",6:"#9C27B0",7:"#FFFFFF",8:"#8D6E63",9:"#1E3A8A",10:"#F9A825"};
  // Geometrie (SVG-Einheiten, Bild 1920 × 1080)
  const P = 58, R = 26;         // Perlenabstand und -radius
  const Y0 = 420;               // Oberkante der Ufer = Laufbahn
  const YB = Y0 + 30;           // Mitte der Brückenperlen
  const YK = 200;               // Mitte der Zielkette
  const ZEILE0 = 545, ZEILE = 106;   // Spalten: erste Zeile und Abstand
  const UNI_W = 220, UNI_S = UNI_W/320, UNI_FUSS = 254*UNI_S;
  const STUFEN = ["material","vorstellung","kopf"];
  const SCHILD_W = P+2*R+108;   // Stufe kopf: Breite jedes Ziffernschilds (wie die Platte eines Zweier-Stäbchens)

  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const wait = ms => new Promise(r=>setTimeout(r,ms));
  const params = new URLSearchParams(location.search);
  const wunsch = einmal(params.get("thema"));   // ?thema= aus der Übersicht gilt nur für die erste Runde
  const ruhig = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const F = window.Figuren;
  const zk = (n,a,b) => `zerl:${n}:${a}+${b}`;
  function el(tag, attrs={}, parent){ const e=document.createElementNS(NS,tag); for(const [k,v] of Object.entries(attrs)) e.setAttribute(k,v); if(parent) parent.appendChild(e); return e; }

  // ---------- Vorschau (?zahl, ?fehler, ?stufe): schreibt nie in einen Lernstand ----------
  const eigeneAufgabe = params.has("zahl") || params.has("fehler");   // Aufgabe ohne Lernsteuerung
  // jeder Vorschau-Parameter: runde() nur mit nurAnsehen, spieleigener Stand wird nicht gespeichert
  const vorschau = eigeneAufgabe || ["stufe","pause","hinweis"].some(x=>params.has(x));
  const vorschauStufe = STUFEN.includes(params.get("stufe")) ? params.get("stufe") : null;

  // ---------- Elternansicht (?eltern) ----------
  // Spieleigener Stand unter SPEICHER; der alte Stand (SPEICHER_ALT) wird nur gelesen, nie geschrieben
  const ladeEigen = async () => eigenerStand(await lade(SPEICHER, {}), await lade(SPEICHER_ALT, {}));
  if(params.has("eltern")){ elternansicht(await ladeEigen()); return; }

  // ---------- Ton ----------
  await ladeEinstellungen(); let sound = einstellung("ton.perlenbruecke", true);
  const showSnd=()=>$("sndimg").src=sound?"symbole/ton-an.svg":"symbole/ton-aus.svg"; showSnd();
  $("snd").addEventListener("click",()=>{ sound=!sound; showSnd(); setzeEinstellung("ton.perlenbruecke", sound); if(!sound) stille(); });
  let actx;
  function tone(f1,f2,dur,type="sine",vol=.15){ if(!sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime; o.type=type;
    o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur*.8);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02); }catch(e){} }
  const klick = () => tone(900,1300,.09,"sine",.08);
  const plopp = () => tone(500,700,.1,"sine",.1);
  const boing = () => tone(320,180,.35,"triangle",.12);
  const zaehlTon = i => tone(440*Math.pow(2,i/12),440*Math.pow(2,i/12),.12,"sine",.08);
  // Sprechblase des Einhorns. Zahlen werden nicht vorgelesen: Ziffern lesen sich sicherer als eine Computerstimme.
  function sag(text){ const b=$("blase"); if(text) b.textContent=text; b.classList.toggle("leer", !text); }
  // Stimme nur für Sätze ohne Zahlen (Stimme wie im Einführungs-Abspieler, Wahl im Elternbereich)
  function sprich(text){ if(!sound) return; kernSprich(text); }

  // ---------- Lernsteuerung und spieleigener Stand ----------
  let plan = null, spieleListe = [];
  try{ plan = await fetch("lernplan.json").then(x=>x.json()); }catch(e){}
  try{ spieleListe = (await fetch("spiele.json").then(x=>x.json())).spiele || []; }catch(e){}
  const themaPlan = id => plan?.themen?.find(t=>t.id===id) || null;
  let r = null;                 // aktuelle Runde der Lernsteuerung
  let eigen = migriere(null);   // Reise und Abnutzung (erst nach runde() laden: die Lernsteuerung übernimmt beim ersten Start den alten Stand)
  function persist(){ if(!vorschau) speichere(SPEICHER, eigen); }

  // ---------- Geometrie je Zahl ----------
  let n = 7;
  const gapW = () => n*P, gapL = () => 960 - gapW()/2, gapR = () => 960 + gapW()/2;
  const slotX = i => gapL() + P/2 + i*P;

  // ---------- Perlen und Stäbchen ----------
  function perle(parent, x, y, farbe){
    const g=el("g",{class:"perle"},parent);
    el("circle",{cx:x,cy:y,r:R+7,fill:"none",stroke:"#FFD95A","stroke-width":7,class:"ring"},g);
    el("circle",{cx:x,cy:y,r:R,fill:farbe,stroke:"#3B2A6B","stroke-width":3},g);
    el("ellipse",{cx:x-8,cy:y-9,rx:9,ry:6,fill:"#fff",opacity:.55},g);
    return g;
  }
  // Stäbchen der Länge len, erste Perle bei (x0|y). Draht dahinter, Fünfermarke als Strich.
  function stab(parent, len, x0, y, farbe=FARBE[len]){
    const g=el("g",{class:"staebchen"},parent);
    el("rect",{x:x0-R-6,y:y-5,width:(len-1)*P+2*R+12,height:10,rx:5,fill:"#7A6A8F"},g);
    const perlen=[]; for(let i=0;i<len;i++) perlen.push(perle(g, x0+i*P, y, farbe));
    if(len>5) el("line",{x1:x0+4.5*P,y1:y-R-8,x2:x0+4.5*P,y2:y+R+8,stroke:"#3B2A6B","stroke-width":4,"stroke-linecap":"round",opacity:.55},g);
    return {g, perlen};
  }

  // ---------- Szene aufbauen ----------
  function ufer(){
    const l=gapL(), r=gapR();
    const form = (x0,x1,innen) => `M${x0} ${Y0} L${x1} ${Y0} L${x1+innen} 1080 L${x0} 1080 Z`;
    for(const [id,x0,x1,innen] of [["uferL",-400,l,-24],["uferR",2320,r,24]]){
      const p=$(id); p.setAttribute("d",form(x0,x1,innen)); p.setAttribute("fill","url(#fels)"); p.setAttribute("stroke","#3B2A6B"); p.setAttribute("stroke-width","4");
    }
    // Gras oben
    const gras=$("plaetze"); gras.innerHTML="";
    el("rect",{x:-400,y:Y0-6,width:l+400,height:26,rx:10,fill:"#8EDCA9",stroke:"#3B2A6B","stroke-width":4},gras);
    el("rect",{x:r,y:Y0-6,width:2320-r,height:26,rx:10,fill:"#8EDCA9",stroke:"#3B2A6B","stroke-width":4},gras);
    // Plätze und Fünferstrich in der Lücke: bei kopf erst beim Bauen sichtbar (sonst ließe sich n abzählen)
    luecke=el("g",{class:"luecke"+(stufe==="kopf"?" verdeckt":"")},gras);
    for(let i=0;i<n;i++) el("circle",{cx:slotX(i),cy:YB,r:R,class:"platz","data-i":i},luecke);
    if(n>5) el("line",{x1:gapL()+5*P,y1:YB-R-12,x2:gapL()+5*P,y2:YB+R+12,stroke:"#fff","stroke-width":5,"stroke-linecap":"round"},luecke);
  }
  let luecke=null;
  const zeigeLuecke = () => luecke?.classList.remove("verdeckt");
  // Zielkette: Zahl im Kreis, daneben die Perlen (bei kopf nur die Zahl; die Perlen erscheinen erst zum Erklären eines Fehlers)
  let kettePerlen=[], ketteG=null;
  function kette(){
    const k=$("kette"); k.innerHTML="";
    const bx=gapR()+115;
    el("circle",{cx:bx,cy:YK,r:72,fill:"#fff",stroke:"#3B2A6B","stroke-width":5},k);
    const t=el("text",{x:bx,y:YK+6,class:"zahl"},k); t.textContent=n;
    ketteG=el("g",{class:"kettenperlen"+(stufe==="kopf"?" verdeckt":"")},k);
    el("rect",{x:gapL()-6,y:YK-R-14,width:gapW()+12,height:2*R+28,rx:R+14,fill:"rgba(255,255,255,.55)"},ketteG);
    kettePerlen = stab(ketteG, n, slotX(0), YK, FARBE[n]).perlen;
  }
  const zeigeKette = () => ketteG?.classList.remove("verdeckt");
  // Spalten: links rechtsbündig zur Lücke, rechts linksbündig; kurz oben, lang unten.
  // Bei vorstellung deckt eine Fläche in Ufer-Farbe die Perlen ab, die Ziffern bleiben.
  // Bei kopf ist jedes Stäbchen ein Ziffernschild gleicher Breite (keine Länge zum Vergleichen).
  let staebe = {l:[], r:[]}, deckTimer=0;
  function spalten(ang){
    clearTimeout(deckTimer);
    for(const seite of ["l","r"]){
      const box=$(seite==="l"?"spalteL":"spalteR"); box.innerHTML=""; staebe[seite]=[];
      const werte = seite==="l" ? ang.links : ang.rechts;
      werte.forEach((len,i)=>{
        const y=ZEILE0+i*ZEILE;
        const breite=(len-1)*P+2*R;
        const x0 = seite==="l" ? gapL()-50-breite+R : gapR()+50+R;     // Mitte der ersten Perle
        if(stufe==="kopf"){
          const w=SCHILD_W, sx = seite==="l" ? gapL()-50-w : gapR()+50;
          const g=el("g",{class:"stab schild","data-len":len},box);
          el("rect",{x:sx,y:y-46,width:w,height:92,rx:30,class:"platte"},g);
          const z=el("text",{x:sx+w/2,y:y+2,class:"ziffer","text-anchor":"middle"},g); z.textContent=len;
          const s={seite,len,g,x0:sx+R+18,y};     // Flugstart der ersten Perle: im Schild
          g.addEventListener("click",()=>tippe(s));
          staebe[seite].push(s);
          return;
        }
        const g=el("g",{class:"stab","data-len":len},box);
        const plX = seite==="l" ? x0-R-90 : x0-R-18, plW = breite+108;
        el("rect",{x:plX,y:y-46,width:plW,height:92,rx:30,class:"platte"},g);
        stab(g, len, x0, y);
        if(stufe==="vorstellung") el("rect",{x:x0-R-12,y:y-R-12,width:breite+24,height:2*R+24,rx:R+12,class:"deckel"},g);
        const z=el("text",{x: seite==="l" ? x0-R-22 : x0+breite-R+22, y:y+2, class:"ziffer","text-anchor": seite==="l"?"end":"start"},g); z.textContent=len;
        const s={seite,len,g,x0,y};
        g.addEventListener("click",()=>tippe(s));
        staebe[seite].push(s);
      });
    }
    if(stufe==="vorstellung") deckTimer=setTimeout(()=>document.querySelectorAll(".deckel").forEach(d=>d.classList.add("zu")), VORSTELLUNG_MS);
  }

  // ---------- Einhorn ----------
  let uni=null;
  function figurG(id, x, links=false){
    const g=el("g",{},$("figuren"));
    g.innerHTML=F.svgFigur(id);
    const d=F.figuren[id], w=UNI_W*(d.groesse||1), h=w*280/320;
    const svg=g.querySelector("svg"); svg.setAttribute("width",w); svg.setAttribute("height",h); svg.style.width=w+"px"; svg.style.height=h+"px";
    if(links) svg.style.transform="scaleX(-1)", svg.style.transformOrigin="50% 50%";
    const a={g, svg, x, y:Y0-254/280*h, w};
    setze(a,x); return a;
  }
  const setze = (a,x,y=a.y) => { a.x=x; a.y=y; a.g.style.transform=`translate(${x}px,${y}px)`; };
  function bewege(a, x, ms, {y=a.y, laufen=true, easing="ease-in-out"}={}){
    if(laufen) F.zustand(a.svg,"laeuft");
    if(ruhig || ms<=0){ setze(a,x,y); F.zustand(a.svg,""); return Promise.resolve(); }
    const an=a.g.animate([{transform:`translate(${a.x}px,${a.y}px)`},{transform:`translate(${x}px,${y}px)`}],{duration:ms,easing,fill:"forwards"});
    return an.finished.then(()=>{ setze(a,x,y); an.cancel(); F.zustand(a.svg,""); },()=>{});
  }
  const kopf = (a, grad) => { const h=a.svg.querySelector(".head"); if(h) h.style.transform = grad ? `rotate(${grad}deg)` : ""; };
  const uniStart = () => gapL() - UNI_W - 6;
  function neuesEinhorn(){ if(uni) uni.g.remove(); uni=figurG("einhorn", uniStart()); uni.g.addEventListener("click",()=>{ if(busy) return; klick(); F.hop(uni.svg,{hoehe:40,dauer:500}); }); }

  // ---------- Zustand einer Brücke ----------
  let ang=null, stufe="material", wahl={l:null,r:null}, fehler=0, busy=true, t0=0, bauTimer=0, sperreBis={l:0,r:0}, loesung=null;
  let vorher=0;

  function zeigeWahl(){
    for(const seite of ["l","r"]) for(const s of staebe[seite]) s.g.classList.toggle("gewaehlt", wahl[seite]===s);
  }
  function erlaubt(s){
    if(busy) return false;
    if(Date.now() < sperreBis[s.seite]) return false;
    if(loesung && s.len !== loesung[s.seite]) return false;
    return true;
  }
  // Gesperrte Spalte (Denkhilfe) sichtbar machen – abgeleitet aus sperreBis, ein Timer zum Neuzeichnen
  let sperrTimer=0;
  function zeigeSperre(){
    clearTimeout(sperrTimer);
    const jetzt=Date.now();
    for(const seite of ["l","r"]) if(!loesung) staebe[seite].forEach(t=>t.g.classList.toggle("zu", jetzt < sperreBis[seite]));
    const naechste=Math.min(...["l","r"].map(x=>sperreBis[x]).filter(t=>t>jetzt));
    if(Number.isFinite(naechste)) sperrTimer=setTimeout(zeigeSperre, naechste-jetzt+20);
  }
  function tippe(s){
    if(!erlaubt(s)) return;
    clearTimeout(bauTimer);
    if(fehler<2) sag("");            // Ansage oder Fehlersatz verschwindet beim ersten Tipp
    wahl[s.seite] = wahl[s.seite]===s ? null : s;
    klick(); zeigeWahl();
    // Denkhilfe ab dem 2. Fehler: gewählte Perlen in der Zielkette abdecken, Frage stellen, andere Seite kurz sperren.
    // Die Frage kommt bei jeder neuen Wahl, solange die andere Seite leer ist (auch beim Wechsel 2 → 3).
    if(fehler>=2 && !loesung){
      denkhilfe();
      const andere = s.seite==="l" ? "r" : "l";
      if(wahl[s.seite] && !wahl[andere]){
        const x=s.len;
        const fuenf = n>5 ? `${n} ist 5 und ${n-5}. ` : "";
        sag(x>=n ? `${x} ist schon ${x===n?"so lang wie":"länger als"} ${n}.` : `${fuenf}Mit ${x} – wie viele fehlen noch bis ${n}?`);
        sperreBis[andere] = Date.now() + HILFE_SPERRE_MS + (n>5?1500:0);
        zeigeSperre();
      }
    }
    if(wahl.l && wahl.r) bauTimer=setTimeout(baue, BAUEN_NACH_MS);
  }
  // Zielkette: von der gewählten Seite her abdecken (nur in der Denkhilfe)
  function denkhilfe(){
    kettePerlen.forEach(p=>p.classList.remove("aus","hell"));
    const s = wahl.l || wahl.r; if(!s || (wahl.l && wahl.r)) return;
    kettePerlen.forEach((p,i)=>{ const bedeckt = s.seite==="l" ? i < s.len : i >= n - s.len; p.classList.add(bedeckt?"aus":"hell"); });
  }

  // ---------- Bauen ----------
  // Stäbchen fliegen in die Lücke: links von links, rechts von rechts (bei zu lang direkt hinter das linke).
  // In der Lücke sind die Perlen immer zu sehen: bei vorstellung und kopf wird hier aufgedeckt.
  async function baue(){
    if(busy || !wahl.l || !wahl.r) return;
    busy=true;
    const a=wahl.l.len, b=wahl.r.len, summe=a+b;
    kettePerlen.forEach(p=>p.classList.remove("aus","hell"));
    const br=$("bruecke"); br.innerHTML="";
    zeigeLuecke();                                // kopf: erst jetzt Plätze und Fünferstrich
    const zielR = summe > n ? a : n-b;            // Startplatz des rechten Stäbchens
    const flieg = (s, platz) => {
      s.g.classList.add("weg");
      const st=stab(br, s.len, slotX(platz), YB);
      if(!ruhig) st.g.animate([{transform:`translate(${s.x0-slotX(platz)}px,${s.y-YB}px)`},{transform:"translate(0,0)"}],{duration:520,easing:"cubic-bezier(.3,1.25,.5,1)"});
      return st;
    };
    const L=flieg(wahl.l,0); plopp(); await wait(160);
    const Rr=flieg(wahl.r,zielR); await wait(420); plopp();
    if(summe===n) await richtig(a,b,L,Rr);
    else await falsch(a,b,L,Rr,zielR);
  }

  async function richtig(a,b,L,Rr){
    const ms=Date.now()-t0, key=zk(n,a,b);
    // hilfe: 0 ohne, 1 nach Denkhilfe (2. Fehler), 2 nach gezeigter Lösung (ab dem 3. Fehler)
    let ereignis=null;
    if(!eigeneAufgabe) ereignis = r.melde(key, {ok: fehler===0, hilfe: fehler>=3 ? 2 : fehler===2 ? 1 : 0, ms});
    verbucheBau(eigen, key); persist();
    // verschmelzen zur Farbe der Zahl, Planken
    for(const p of [...L.perlen, ...Rr.perlen]) p.querySelector("circle:nth-of-type(2)").setAttribute("fill", FARBE[n]);
    el("rect",{x:gapL()-20,y:Y0-10,width:gapW()+40,height:14,rx:7,fill:"#E3B27C",stroke:"#3B2A6B","stroke-width":3},$("bruecke"));
    zeigeKette();
    // Die Brücke trägt: sie setzt sich kurz, das Einhorn läuft hinüber
    plopp(); const brg=$("bruecke"); brg.classList.remove("bruecke-traegt"); void brg.getBBox(); brg.classList.add("bruecke-traegt");
    sag(`${a} und ${b} sind ${n}.`);
    await wait(350);
    await bewege(uni, gapR()+40, 1300);
    await wait(150);
    await weiter(ereignis);
  }

  async function falsch(a,b,L,Rr,zielR){
    const start=Date.now(), summe=a+b, kurz=summe<n;
    fehler++; boing();
    zeigeKette(); zeigeLuecke();  // die Rückmeldung erklärt immer an den Perlen
    const alle=[...L.perlen, ...Rr.perlen];
    if(kurz){
      // Einhorn tastet sich bis an das Loch und schaut hinunter
      await bewege(uni, gapL() + a*P - UNI_W + 40, 700);
      kopf(uni, 28); await wait(250);
    } else {
      // zu lang: das Stäbchen ragt übers Ufer, die Brücke wippt, das Einhorn rutscht zurück
      await bewege(uni, gapL() - UNI_W + 90, 450);
      $("bruecke").classList.remove("wippe","bruecke-traegt"); void $("bruecke").getBBox(); $("bruecke").classList.add("wippe");
      F.hop(uni.svg,{hoehe:24,dauer:500});
      await wait(300); await bewege(uni, uniStart()-30, 400, {laufen:false, easing:"ease-out"});
    }
    // Zählen: jede Perle der Brücke und die Perle der Zielkette darüber leuchten nacheinander
    sag(kurz ? `${a} und ${b} sind ${summe}. Bis ${n} ${n-summe===1?"fehlt noch 1 Perle":"fehlen noch "+(n-summe)+" Perlen"}.`
             : `${a} und ${b} sind ${summe}. Das ist zu lang für ${n}.`);
    const zaehlMs = Math.max(120, Math.min(ZAEHL_MS, (FEHLER_MS - 1200 - (Date.now()-start) - 1000) / alle.length));   // 1200 = Bauen davor, 1000 = Halten, Ausblenden, Rückkehr
    for(let i=0;i<alle.length;i++){
      alle[i].classList.add("zaehl"); if(i<n) kettePerlen[i].classList.add("zaehl"); zaehlTon(i);
      await wait(zaehlMs); alle[i].classList.remove("zaehl"); if(i<n) kettePerlen[i].classList.remove("zaehl");
    }
    if(kurz){
      for(let i=a;i<zielR;i++) $("plaetze").querySelector(`[data-i="${i}"]`)?.classList.add("blink");
      kettePerlen.forEach((p,i)=>{ if(i>=summe) p.classList.add("hell"); });
    } else {
      alle.slice(n).forEach(p=>p.classList.add("zuviel"));
    }
    await wait(600);
    kopf(uni, 0);
    // Stäbchen zurück in die Spalten
    kettePerlen.forEach(p=>p.classList.remove("hell"));
    $("plaetze").querySelectorAll(".blink").forEach(e=>e.classList.remove("blink"));
    const br=$("bruecke");
    if(!ruhig) await br.animate([{opacity:1,transform:"translateY(0)"},{opacity:0,transform:"translateY(-60px)"}],{duration:300,easing:"ease-in"}).finished.catch(()=>{});
    br.innerHTML=""; br.classList.remove("wippe","bruecke-traegt");
    for(const s of [wahl.l,wahl.r]) s.g.classList.remove("weg");
    wahl={l:null,r:null}; zeigeWahl();
    bewege(uni, uniStart(), 250, {laufen:false});
    // Hilfe-Leiter: ab dem 3. Fehler leuchtet die Ziel-Zerlegung
    if(fehler>=3){
      const {a:la, b:lb} = zerlegung(ang.paare[0]);
      loesung={l:la, r:lb};
      for(const seite of ["l","r"]) for(const s of staebe[seite]){ const ok = s.len===loesung[seite]; s.g.classList.toggle("leuchtet", ok); s.g.classList.toggle("zu", !ok); }
      sag(`${n} ist ${la} und ${lb}.`);
    }   // ab dem 2. Fehler: Denkhilfe beim ersten Tipp (siehe tippe)
    await wait(100);
    busy=false;
  }

  // ---------- Ablauf ----------
  const ausblenden = async () => {
    if(ruhig) return;
    [$("bruecke"),$("kette"),$("spalteL"),$("spalteR"),$("plaetze"),$("figuren")].forEach(e=>e.animate([{opacity:1},{opacity:0}],{duration:350,fill:"forwards"}));
    await wait(360);
  };
  async function weiter(ereignis){
    busy=true;
    if(ereignis?.typ==="gekonnt"){
      // ruhig und sachlich: Stimme ohne Zahl, Ziffer in der Blase
      const z = themaPlan(ereignis.thema)?.aufgaben?.zahl ?? n;
      await wait(600);
      sag(`${z} kannst du jetzt zerlegen.`); sprich("Das kannst du jetzt zerlegen.");
      await wait(GEKONNT_MS);
      await ausblenden();
      await r.ende();
      await pause({knoepfe:true});
      return neueRunde();
    }
    await ausblenden();
    const a = naechsteAufgabe();
    if(!a){ const {hinweisSpiel} = await r.ende(); await pause({hinweis: hinweisSpiel}); return neueRunde(); }
    neueBruecke(a);
  }
  // Angebot holen; Vorschau ?zahl/?fehler: eigene Aufgabe ohne Lernsteuerung
  function naechsteAufgabe(){
    if(params.get("fehler")) return {n:7, ang: params.get("fehler")==="lang" ? {paare:[zk(7,2,5)],links:[2,4,5],rechts:[1,5,6]} : {paare:[zk(7,2,5)],links:[1,2,4],rechts:[2,4,5]}, stufe: vorschauStufe || "material"};
    if(params.has("zahl")){
      const z = Math.min(10, Math.max(2, +params.get("zahl")||7));
      const alle = paareVon(z).map(p=>"zerl:"+p.key).sort(()=>Math.random()-.5);
      return {n:z, ang: angebotAus(z, alle[0], alle.slice(1,3), eigen), stufe: vorschauStufe || "material"};
    }
    const a = r.naechste(); if(!a) return null;
    const z = a.ziel.daten.n;
    return {n:z, ang: angebotAus(z, a.ziel.key, a.auch.map(x=>x.key), eigen), stufe: vorschauStufe || a.stufe};
  }
  async function neueBruecke(a){
    n = a.n; ang = a.ang; stufe = STUFEN.includes(a.stufe) ? a.stufe : "material";
    fehler=0; wahl={l:null,r:null}; loesung=null; sperreBis={l:0,r:0}; clearTimeout(sperrTimer);
    $("bruecke").innerHTML="";
    ufer(); kette(); spalten(ang); neuesEinhorn();
    for(const e of [$("bruecke"),$("kette"),$("spalteL"),$("spalteR"),$("plaetze"),$("figuren")]){ e.getAnimations().forEach(x=>x.cancel()); if(!ruhig) e.animate([{opacity:0},{opacity:1}],{duration:400}); }
    sag(n!==vorher ? `Bau eine Brücke für ${n}.` : "");
    vorher=n;
    t0=Date.now(); busy=false;
    if(params.has("fehler")){ await wait(900); const l=ang.links.indexOf(params.get("fehler")==="lang"?4:2), rr=ang.rechts.indexOf(params.get("fehler")==="lang"?5:4); tippe(staebe.l[l]); tippe(staebe.r[rr]); }
  }
  // Neue Runde: Thema von der Lernsteuerung, Einführung falls fällig, dann die erste Brücke
  async function neueRunde(){
    busy=true; sag("");
    // Lernplan oder Spiele nicht ladbar: kurzer Satz in der Blase, der Haus-Knopf bleibt (kein Dialog)
    try{ r = await runde("perlenbruecke", { wunsch: wunsch(), max: K.RUNDE, nurAnsehen: vorschau }); }
    catch(e){ protokoll("perlenbruecke: Runde starten: " + (e?.message ?? e)); sag("Das Spiel geht gerade nicht."); return; }
    eigen = await ladeEigen();
    if(r.einfuehrungFaellig && !vorschau){
      const e = themaPlan(r.thema?.id)?.einfuehrung;
      const ergebnis = e ? await spieleEinfuehrung(e.vorlage, e.werte, {ton: sound}) : "abgebrochen";
      if(ergebnis!=="gesehen"){ location.href="index.html"; return; }
      r.einfuehrungGesehen();
    }
    const a = naechsteAufgabe();
    if(!a){ await r.ende(); await pause({knoepfe:true}); return neueRunde(); }
    neueBruecke(a);
  }

  // ---------- Pause: Einhorn auf der fertigen Brücke im Abendlicht ----------
  function pausenSzene(){
    const cols=["#FF9FC4","#FFD36E","#9FE0C0","#A8C8FF","#D9B0FF"];
    let perlen="";
    for(let i=0;i<=14;i++){ const t=i/14, x=300+t*1320, y=700-Math.sin(t*Math.PI)*90;
      perlen+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="24" fill="${cols[i%5]}" stroke="#fff" stroke-width="3"/><circle cx="${(x-8).toFixed(0)}" cy="${(y-8).toFixed(0)}" r="6" fill="#fff" opacity=".8"/>`; }
    const sterne=[[200,120,0],[520,200,1.3],[900,90,.7],[1300,170,2],[1650,110,.4],[1100,260,1.7]].map(([x,y,d])=>`<circle class="blink" style="animation-delay:${d}s" cx="${x}" cy="${y}" r="5" fill="#FFF6C8"/>`).join("");
    const uniW=300, uniH=uniW*280/320;
    return `<svg class="szene" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="pHimmel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3B2A6B"/><stop offset=".55" stop-color="#C9708F"/><stop offset="1" stop-color="#FFC98A"/></linearGradient>
        <linearGradient id="pWasser" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A6AA8"/><stop offset="1" stop-color="#3B2A6B"/></linearGradient>
      </defs>
      <rect x="-400" y="-200" width="2720" height="1480" fill="url(#pHimmel)"/>
      ${sterne}
      <circle cx="960" cy="640" r="110" fill="#FFE9A8" opacity=".9"/>
      <rect x="-400" y="800" width="2720" height="480" fill="url(#pWasser)"/>
      <g fill="none" stroke="#FFE9C8" stroke-width="5" stroke-linecap="round" opacity=".45"><path d="M760 860 q20 -10 40 0 M1100 900 q20 -10 40 0 M900 960 q20 -10 40 0 M1400 1000 q20 -10 40 0"/></g>
      <path d="M-100 700 L330 700 Q380 700 380 760 L380 1100 L-100 1100Z" fill="#6B4E6E"/>
      <path d="M2020 700 L1590 700 Q1540 700 1540 760 L1540 1100 L2020 1100Z" fill="#6B4E6E"/>
      <path d="M300 700 Q960 520 1620 700" fill="none" stroke="#FFE9C8" stroke-width="14" stroke-linecap="round" opacity=".6"/>
      <g class="schimmer">${perlen}</g>
      <g transform="translate(810 ${(626-uniH*254/280).toFixed(0)})"><g class="atmen">${F.svgFigur("einhorn").replace("<svg",`<svg width="${uniW}" height="${uniH}" style="width:${uniW}px;height:${uniH}px"`)}</g></g>
    </svg><div class="pbar"><div class="pfill"></div></div>`;
  }
  // Ohne Knöpfe: Balken läuft PAUSE_MS, dann geht es weiter. Mit Knöpfen (nach „kann ich“): Weiter oder Haus.
  // hinweis (nach einer Wiederholungsrunde): ruhiger Hinweis auf das Spiel, das gerade etwas Neues hat (antippbar).
  async function pause({knoepfe=false, hinweis=null}={}){
    const e=$("pause");
    e.innerHTML=pausenSzene();
    const sp = hinweis ? spieleListe.find(x=>x.id===hinweis) : null;
    if(sp){
      const a=document.createElement("a"); a.className="phinweis"; a.href=sp.datei; a.setAttribute("aria-label", sp.titel);
      const img=document.createElement("img"); img.src=sp.symbol; img.alt="";
      const t=document.createElement("span"); t.textContent=sp.titel;
      a.append(img, t); e.appendChild(a);
      sprich(sp.titel);
    }
    if(knoepfe){
      e.querySelector(".pbar").remove();
      e.insertAdjacentHTML("beforeend",`<div class="pknoepfe"><a class="pk" href="index.html" aria-label="Alle Spiele"><img src="symbole/haus.svg" alt=""></a><button class="pk weiter" aria-label="Weiter"><img src="symbole/zurueck.svg" alt=""></button></div>`);
    }
    e.style.setProperty("--pause-ms", PAUSE_MS+"ms");
    e.classList.add("on"); void e.offsetWidth; e.classList.add("show");
    if(knoepfe) await new Promise(ok=>e.querySelector(".weiter").addEventListener("click",()=>{ klick(); ok(); },{once:true}));
    else await wait(PAUSE_MS);
    e.classList.remove("show"); await wait(600); e.classList.remove("on"); e.innerHTML="";
  }
  if(params.has("pause")) pause({knoepfe: params.get("pause")==="knoepfe", hinweis: params.get("hinweis")});   // Sichtprüfung

  // ---------- Elternansicht: nur Spieleigenes; den Lernstand zeigt der Elternbereich ----------
  function elternansicht(eigen){
    document.querySelectorAll("#welt,.rund").forEach(e=>e.remove());
    let html=`<h1>Perlenbrücke</h1>
      <p>Was dran ist und was Ihr Kind schon kann, steht bei den Themen im Elternbereich.
      Hier steht nur, was das Spiel selbst mitzählt: gebaute Brücken insgesamt ${esc(eigen.reise)}.
      „Gebaut“ zählt, wie oft eine Zerlegung schon als Brücke gebaut wurde; oft gebaute kommen seltener als zusätzliche Wahl, damit Abwechslung entsteht.</p>`;
    for(let z=2; z<=10; z++){
      const ps=paareVon(z), c=k=>eigen.c["zerl:"+k]||0;
      if(!ps.some(p=>c(p.key))) continue;
      html+=`<h2>${z}</h2><ul>${ps.map(p=>`<li>${p.a} + ${p.b} <small>· ${c(p.key)}× gebaut</small></li>`).join("")}</ul>`;
    }
    html+=`<p><a class="btn" href="eltern.html">Themen im Elternbereich</a> <a class="btn" href="perlenbruecke.html">Zum Spiel</a></p>`;
    const e=document.createElement("div"); e.className="eltern"; e.innerHTML=html; document.body.appendChild(e);
  }

  await neueRunde();
})();
</script>
