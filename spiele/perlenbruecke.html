<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Die Perlenbrücke</title>
<link rel="stylesheet" href="schrift/schrift.css">
<style>
/* Spec: docs/superpowers/specs/2026-11-13-perlenbruecke-neu-design.md – 1920×1080 quer, Touch */
:root{--nacht:#3B2A6B;--paper:#FFFFFF;--bg:#CDEFFF;--sonne:#FFD95A;--lila:#8F73E6;--lila-s:#6A50C4;
  font-size:calc(100vh / 108)}   /* 1rem = 10 px bei 1080 px Höhe */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Baloo 2","Andika",sans-serif;color:var(--nacht);background:#E8F7FF;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{display:block}
#welt{position:fixed;inset:0;width:100%;height:100%;display:block}
#welt *{transform-box:fill-box}
.rund{position:fixed;top:2rem;width:8rem;height:8rem;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;padding:1.7rem;
  box-shadow:0 .5rem 0 rgba(59,42,107,.15);text-decoration:none;z-index:9}
.rund img{width:100%;height:100%}
.rund:active{transform:translateY(.3rem);box-shadow:0 .2rem 0 rgba(59,42,107,.15)}
.rund.l{left:2.4rem}.rund.r{right:2.4rem}

/* Perlen und Stäbchen (SVG) */
.perle{transform-origin:50% 50%;transition:transform .18s,opacity .3s}
.perle.zaehl{transform:scale(1.28)}
.perle.zaehl .ring{opacity:1}
.perle .ring{opacity:0;transition:opacity .15s}
.perle.aus{opacity:.22}
.perle.hell .ring{opacity:1}
.perle.zuviel{animation:zuviel .5s ease-in-out 3}
@keyframes zuviel{50%{transform:translateY(-10px) rotate(-12deg)}}
.platz{fill:rgba(255,255,255,.18);stroke:rgba(255,255,255,.9);stroke-width:3;stroke-dasharray:7 6}
.platz.blink{animation:blink .45s ease-in-out 4 alternate}
@keyframes blink{to{fill:rgba(255,217,90,.85);stroke:#FFD95A}}
.platte{fill:#FFF8EE;stroke:rgba(59,42,107,.18);stroke-width:3;transition:fill .15s,stroke .15s}
.stab{cursor:pointer;transition:transform .15s,opacity .3s}
.stab.gewaehlt{transform:translateY(-10px)}
.stab.gewaehlt .platte{fill:#FFF2BF;stroke:var(--sonne);stroke-width:8}
.stab.weg{opacity:.2}
.stab.zu{opacity:.35}
.stab.leuchtet .platte{stroke:var(--sonne);stroke-width:8;animation:leuchten 1s ease-in-out infinite alternate}
@keyframes leuchten{to{fill:#FFE68A}}
.ziffer{font:800 52px "Baloo 2",sans-serif;fill:var(--nacht);dominant-baseline:central}
.zahl{font:800 110px "Baloo 2",sans-serif;fill:var(--nacht);dominant-baseline:central;text-anchor:middle}
.wippe{transform-origin:50% 100%;animation:wippe 1.4s ease-in-out}
@keyframes wippe{20%{transform:rotate(-4deg)}45%{transform:rotate(3.5deg)}70%{transform:rotate(-2deg)}100%{transform:rotate(0)}}
.figur .head{transition:transform .6s ease-in-out}
.funke{pointer-events:none}

/* Pause wie im Zauberer: Einhornbild mit Balken, ohne Knöpfe */
.pause{position:fixed;inset:0;z-index:25;background:#1F1B45;display:none;opacity:0;transition:opacity .6s}
.pause.on{display:block}.pause.show{opacity:1}
.pause img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pbar{position:absolute;left:30%;width:40%;bottom:3rem;height:1.2rem;border-radius:99rem;background:rgba(59,42,107,.35);box-shadow:0 0 0 .2rem rgba(59,42,107,.35);overflow:hidden}
.pfill{height:100%;width:0;border-radius:99rem;background:#fff}
.pause.show .pfill{animation:pfill var(--pause-ms,10s) linear forwards}
@keyframes pfill{from{width:0}to{width:100%}}
.eltern{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--bg);padding:3rem 4rem 4rem;user-select:text;-webkit-user-select:text;touch-action:auto;font-size:2rem}
.eltern h1{font:800 4rem/1.1 "Baloo 2",sans-serif}.eltern h2{font:800 2.8rem/1.1 "Baloo 2",sans-serif;margin:2.4rem 0 .6rem}.eltern p{margin:1rem 0;font-weight:700;max-width:80ch}
.eltern ul{list-style:none}.eltern li{background:var(--paper);border-radius:1rem;padding:.6rem 1.4rem;margin:.6rem 0;font-weight:700}
.eltern small{font-weight:400;opacity:.75}
.eltern .btn{display:inline-flex;align-items:center;height:7rem;padding:0 3.2rem;border-radius:99rem;font:800 2.6rem/1 "Baloo 2",sans-serif;color:#fff;background:var(--lila);box-shadow:0 .9rem 0 var(--lila-s);text-decoration:none}
@media (prefers-reduced-motion:reduce){.wippe,.perle.zuviel,.platz.blink,.stab.leuchtet .platte{animation:none}.pause{transition:none}}
</style>
</head>
<body>
<svg id="welt" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-label="Perlenbrücke">
  <defs>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE6FF"/><stop offset="1" stop-color="#E8F7FF"/></linearGradient>
    <linearGradient id="wasser" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CC8F2"/><stop offset="1" stop-color="#4E9FD6"/></linearGradient>
    <linearGradient id="fels" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C79A7E"/><stop offset="1" stop-color="#A97C62"/></linearGradient>
  </defs>
  <rect x="-400" y="-200" width="2720" height="1480" fill="url(#himmel)"/>
  <circle cx="1700" cy="150" r="70" fill="#FFE27A"/>
  <g fill="#fff" opacity=".85"><ellipse cx="300" cy="140" rx="90" ry="28"/><ellipse cx="350" cy="122" rx="55" ry="30"/><ellipse cx="1300" cy="110" rx="70" ry="20"/><ellipse cx="1340" cy="96" rx="40" ry="22"/></g>
  <rect x="-400" y="860" width="2720" height="420" fill="url(#wasser)"/>
  <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".6"><path d="M700 920 q20 -10 40 0 M1150 960 q20 -10 40 0 M900 1010 q20 -10 40 0"/></g>
  <path id="uferL"/><path id="uferR"/>
  <g id="plaetze"></g>
  <g id="kette"></g>
  <g id="spalteL"></g><g id="spalteR"></g>
  <g id="bruecke"></g>
  <g id="figuren"></g>
  <g id="fx"></g>
</svg>
<a class="rund l" href="index.html" aria-label="Alle Spiele"><img src="symbole/haus.svg" alt=""></a>
<button class="rund r" id="snd" aria-label="Ton"><img id="sndimg" src="symbole/ton-an.svg" alt=""></button>
<div class="pause" id="pause"><img id="pimg" alt=""><div class="pbar"><div class="pfill"></div></div></div>

<script src="figuren/figuren.js"></script>
<script src="figuren/einhorn.js"></script>
<script src="figuren/frosch.js"></script>
<script src="figuren/hase.js"></script>
<script src="figuren/eule.js"></script>
<script type="module">
import {lade, speichere, sperreTouch, esc} from "./lernspiel.js";
import {K, paareVon, migriere, eintrag, angebot, verbuche, naechsteZahl} from "./perlen-logik.js";
sperreTouch();
(async function(){
  // ---------- Einstellungen (Logik-Werte stehen in perlen-logik.js, K) ----------
  const BAUEN_NACH_MS = 600;    // so lange nach der Wahl beider Seiten, dann wird gebaut
  const FEHLER_MS = 7000;       // Fehlversuch: so lange dauert die Rückmeldung mindestens (nichts antippbar) – bewusst lang
  const ZAEHL_MS = 300;         // je gezählte Perle
  const HILFE_SPERRE_MS = 2500; // Denkhilfe: andere Spalte so lange gesperrt, bis die Frage gesprochen ist
  const WIEDER_NACH = 2;        // falsch gelöste Zahl kommt in der Runde nach so vielen anderen Brücken wieder
  const PAUSE_MS = 10000;
  const BESUCH = [10, 20];      // Besuch alle 10–20 Brücken (zufällig)
  const FARBE = {1:"#E53935",2:"#43A047",3:"#F48FB1",4:"#FDD835",5:"#64B5F6",6:"#9C27B0",7:"#FFFFFF",8:"#8D6E63",9:"#1E3A8A",10:"#F9A825"};
  const WORT = ["null","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn","elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn"];
  // Geometrie (SVG-Einheiten, Bild 1920 × 1080)
  const P = 58, R = 26;         // Perlenabstand und -radius
  const Y0 = 420;               // Oberkante der Ufer = Laufbahn
  const YB = Y0 + 30;           // Mitte der Brückenperlen
  const YK = 200;               // Mitte der Zielkette
  const ZEILE0 = 545, ZEILE = 106;   // Spalten: erste Zeile und Abstand
  const UNI_W = 220, UNI_S = UNI_W/320, UNI_FUSS = 254*UNI_S;

  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const wait = ms => new Promise(r=>setTimeout(r,ms));
  const params = new URLSearchParams(location.search);
  const ruhig = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const F = window.Figuren;
  const heute = () => new Date().toLocaleDateString("sv");
  const W = z => WORT[z] ?? String(z);
  const gross = t => t.charAt(0).toUpperCase() + t.slice(1);
  function el(tag, attrs={}, parent){ const e=document.createElementNS(NS,tag); for(const [k,v] of Object.entries(attrs)) e.setAttribute(k,v); if(parent) parent.appendChild(e); return e; }

  // ---------- Speichern ----------
  const vorschau = params.has("zahl") || params.has("fehler");
  let save = migriere(await lade("perlenbruecke", {}));
  function persist(){ if(!vorschau) speichere("perlenbruecke", save); }

  // ---------- Elternansicht (?eltern) ----------
  if(params.has("eltern")){ elternansicht(); return; }

  // ---------- Ton und Stimme ----------
  let sound = true; try{ sound = localStorage.getItem("perlenbruecke-ton")!=="aus"; }catch(e){}
  const showSnd=()=>$("sndimg").src=sound?"symbole/ton-an.svg":"symbole/ton-aus.svg"; showSnd();
  $("snd").addEventListener("click",()=>{ sound=!sound; showSnd(); try{ localStorage.setItem("perlenbruecke-ton",sound?"an":"aus"); }catch(e){} if(!sound) window.speechSynthesis?.cancel(); });
  let actx;
  function tone(f1,f2,dur,type="sine",vol=.15){ if(!sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime; o.type=type;
    o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur*.8);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02); }catch(e){} }
  const klick = () => tone(900,1300,.09,"sine",.08);
  const plopp = () => tone(500,700,.1,"sine",.1);
  const boing = () => tone(320,180,.35,"triangle",.12);
  const zaehlTon = i => tone(440*Math.pow(2,i/12),440*Math.pow(2,i/12),.12,"sine",.08);
  const fanfare = () => [0,110,220].forEach((d,i)=>setTimeout(()=>tone(660+i*220,700+i*220,.16,"sine",.09),d));
  let voice=null;
  function pickVoice(){ const vs=(window.speechSynthesis?.getVoices()||[]).filter(v=>/^de/i.test(v.lang)); voice=vs.find(v=>/Anna|Petra|Helena|Marlene|Katja/i.test(v.name))||vs[0]||null; }
  if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
  function say(text){ if(!sound||!window.speechSynthesis) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="de-DE"; if(voice) u.voice=voice; u.rate=.85; u.pitch=1.1; speechSynthesis.speak(u); }catch(e){} }

  // ---------- Geometrie je Zahl ----------
  let n = 7;
  const gapW = () => n*P, gapL = () => 960 - gapW()/2, gapR = () => 960 + gapW()/2;
  const slotX = i => gapL() + P/2 + i*P;

  // ---------- Perlen und Stäbchen ----------
  function perle(parent, x, y, farbe){
    const g=el("g",{class:"perle"},parent);
    el("circle",{cx:x,cy:y,r:R+7,fill:"none",stroke:"#FFD95A","stroke-width":7,class:"ring"},g);
    el("circle",{cx:x,cy:y,r:R,fill:farbe,stroke:"#3B2A6B","stroke-width":3},g);
    el("ellipse",{cx:x-8,cy:y-9,rx:9,ry:6,fill:"#fff",opacity:.55},g);
    return g;
  }
  // Stäbchen der Länge len, erste Perle bei (x0|y). Draht dahinter, Fünfermarke als Strich.
  function stab(parent, len, x0, y, farbe=FARBE[len]){
    const g=el("g",{class:"staebchen"},parent);
    el("rect",{x:x0-R-6,y:y-5,width:(len-1)*P+2*R+12,height:10,rx:5,fill:"#7A6A8F"},g);
    const perlen=[]; for(let i=0;i<len;i++) perlen.push(perle(g, x0+i*P, y, farbe));
    if(len>5) el("line",{x1:x0+4.5*P,y1:y-R-8,x2:x0+4.5*P,y2:y+R+8,stroke:"#3B2A6B","stroke-width":4,"stroke-linecap":"round",opacity:.55},g);
    return {g, perlen};
  }

  // ---------- Szene aufbauen ----------
  function ufer(){
    const l=gapL(), r=gapR();
    const form = (x0,x1,innen) => `M${x0} ${Y0} L${x1} ${Y0} L${x1+innen} 1080 L${x0} 1080 Z`;
    for(const [id,x0,x1,innen] of [["uferL",-400,l,-24],["uferR",2320,r,24]]){
      const p=$(id); p.setAttribute("d",form(x0,x1,innen)); p.setAttribute("fill","url(#fels)"); p.setAttribute("stroke","#3B2A6B"); p.setAttribute("stroke-width","4");
    }
    // Gras oben
    const gras=$("plaetze"); gras.innerHTML="";
    el("rect",{x:-400,y:Y0-6,width:l+400,height:26,rx:10,fill:"#8EDCA9",stroke:"#3B2A6B","stroke-width":4},gras);
    el("rect",{x:r,y:Y0-6,width:2320-r,height:26,rx:10,fill:"#8EDCA9",stroke:"#3B2A6B","stroke-width":4},gras);
    for(let i=0;i<n;i++) el("circle",{cx:slotX(i),cy:YB,r:R,class:"platz","data-i":i},gras);
    if(n>5) el("line",{x1:gapL()+5*P,y1:YB-R-12,x2:gapL()+5*P,y2:YB+R+12,stroke:"#fff","stroke-width":5,"stroke-linecap":"round"},gras);
  }
  let kettePerlen=[];
  function kette(){
    const k=$("kette"); k.innerHTML="";
    const bx=gapR()+115;
    el("circle",{cx:bx,cy:YK,r:72,fill:"#fff",stroke:"#3B2A6B","stroke-width":5},k);
    const t=el("text",{x:bx,y:YK+6,class:"zahl"},k); t.textContent=n;
    el("rect",{x:gapL()-6,y:YK-R-14,width:gapW()+12,height:2*R+28,rx:R+14,fill:"rgba(255,255,255,.55)"},k);
    kettePerlen = stab(k, n, slotX(0), YK, FARBE[n]).perlen;
  }
  // Spalten: links rechtsbündig zur Lücke, rechts linksbündig; kurz oben, lang unten
  let staebe = {l:[], r:[]};
  function spalten(ang){
    for(const seite of ["l","r"]){
      const box=$(seite==="l"?"spalteL":"spalteR"); box.innerHTML=""; staebe[seite]=[];
      const werte = seite==="l" ? ang.links : ang.rechts;
      werte.forEach((len,i)=>{
        const y=ZEILE0+i*ZEILE;
        const breite=(len-1)*P+2*R;
        const x0 = seite==="l" ? gapL()-50-breite+R : gapR()+50+R;     // Mitte der ersten Perle
        const g=el("g",{class:"stab","data-len":len},box);
        const plX = seite==="l" ? x0-R-90 : x0-R-18, plW = breite+108;
        el("rect",{x:plX,y:y-46,width:plW,height:92,rx:30,class:"platte"},g);
        stab(g, len, x0, y);
        const z=el("text",{x: seite==="l" ? x0-R-22 : x0+breite-R+22, y:y+2, class:"ziffer","text-anchor": seite==="l"?"end":"start"},g); z.textContent=len;
        const s={seite,len,g,x0,y};
        g.addEventListener("click",()=>tippe(s));
        staebe[seite].push(s);
      });
    }
  }

  // ---------- Einhorn ----------
  let uni=null;
  function figurG(id, x, links=false){
    const g=el("g",{},$("figuren"));
    g.innerHTML=F.svgFigur(id);
    const d=F.figuren[id], w=UNI_W*(d.groesse||1), h=w*280/320;
    const svg=g.querySelector("svg"); svg.setAttribute("width",w); svg.setAttribute("height",h); svg.style.width=w+"px"; svg.style.height=h+"px";
    if(links) svg.style.transform="scaleX(-1)", svg.style.transformOrigin="50% 50%";
    const a={g, svg, x, y:Y0-254/280*h, w};
    setze(a,x); return a;
  }
  const setze = (a,x,y=a.y) => { a.x=x; a.y=y; a.g.style.transform=`translate(${x}px,${y}px)`; };
  function bewege(a, x, ms, {y=a.y, laufen=true, easing="ease-in-out"}={}){
    if(laufen) F.zustand(a.svg,"laeuft");
    if(ruhig || ms<=0){ setze(a,x,y); F.zustand(a.svg,""); return Promise.resolve(); }
    const an=a.g.animate([{transform:`translate(${a.x}px,${a.y}px)`},{transform:`translate(${x}px,${y}px)`}],{duration:ms,easing,fill:"forwards"});
    return an.finished.then(()=>{ setze(a,x,y); an.cancel(); F.zustand(a.svg,""); },()=>{});
  }
  const kopf = (a, grad) => { const h=a.svg.querySelector(".head"); if(h) h.style.transform = grad ? `rotate(${grad}deg)` : ""; };
  const uniStart = () => gapL() - UNI_W - 6;
  function neuesEinhorn(){ if(uni) uni.g.remove(); uni=figurG("einhorn", uniStart()); uni.g.addEventListener("click",()=>{ if(busy) return; klick(); F.hop(uni.svg,{hoehe:40,dauer:500}); }); }

  const STERN='M0 -17 L5 -5 L18 -4 L8 5 L11 18 L0 11 L-11 18 L-8 5 L-18 -4 L-5 -5Z';
  function funken(x,y,k=8){
    if(ruhig) return;
    for(let i=0;i<k;i++){ const s=el("path",{d:STERN,fill:"#FFD95A",stroke:"#3B2A6B","stroke-width":3,class:"funke"},$("fx"));
      const w=Math.random()*Math.PI*2, dx=Math.cos(w)*90, dy=Math.sin(w)*70-30;
      s.animate([{transform:`translate(${x}px,${y}px) scale(.3)`,opacity:0},{transform:`translate(${x+dx*.5}px,${y+dy*.5}px) scale(1)`,opacity:1,offset:.3},{transform:`translate(${x+dx}px,${y+dy}px) scale(.9)`,opacity:0}],{duration:800,easing:"ease-out"}).finished.then(()=>s.remove(),()=>s.remove()); }
  }

  // ---------- Zustand einer Brücke ----------
  let ang=null, wahl={l:null,r:null}, fehler=0, busy=true, t0=0, bauTimer=0, sperreBis={l:0,r:0}, loesung=null;
  let sitzungStart=true, rundeZaehler=0, vorher=0, wieder=[], angesagt=new Set();
  if(!save.besuch) save.besuch = save.reise + BESUCH[0] + Math.floor(Math.random()*(BESUCH[1]-BESUCH[0]+1));

  function zeigeWahl(){
    for(const seite of ["l","r"]) for(const s of staebe[seite]) s.g.classList.toggle("gewaehlt", wahl[seite]===s);
  }
  function erlaubt(s){
    if(busy) return false;
    if(Date.now() < sperreBis[s.seite]) return false;
    if(loesung && s.len !== loesung[s.seite]) return false;
    return true;
  }
  // Gesperrte Spalte (Denkhilfe) sichtbar machen – abgeleitet aus sperreBis, ein Timer zum Neuzeichnen
  let sperrTimer=0;
  function zeigeSperre(){
    clearTimeout(sperrTimer);
    const jetzt=Date.now();
    for(const seite of ["l","r"]) if(!loesung) staebe[seite].forEach(t=>t.g.classList.toggle("zu", jetzt < sperreBis[seite]));
    const naechste=Math.min(...["l","r"].map(x=>sperreBis[x]).filter(t=>t>jetzt));
    if(Number.isFinite(naechste)) sperrTimer=setTimeout(zeigeSperre, naechste-jetzt+20);
  }
  function tippe(s){
    if(!erlaubt(s)) return;
    clearTimeout(bauTimer);
    wahl[s.seite] = wahl[s.seite]===s ? null : s;
    klick(); zeigeWahl();
    // Denkhilfe ab dem 2. Fehler: gewählte Perlen in der Zielkette abdecken, Frage stellen, andere Seite kurz sperren.
    // Die Frage kommt bei jeder neuen Wahl, solange die andere Seite leer ist (auch beim Wechsel 2 → 3).
    if(fehler>=2 && !loesung){
      denkhilfe();
      const andere = s.seite==="l" ? "r" : "l";
      if(wahl[s.seite] && !wahl[andere]){
        const x=s.len;
        const fuenf = n>5 ? `${gross(W(n))} ist fünf und ${W(n-5)}. ` : "";
        say(x>=n ? `${gross(W(x))} ist schon ${x===n?"so lang wie":"länger als"} ${W(n)}.` : `${fuenf}Mit ${W(x)} – wie viele fehlen noch bis ${W(n)}?`);
        sperreBis[andere] = Date.now() + HILFE_SPERRE_MS + (n>5?1500:0);
        zeigeSperre();
      }
    }
    if(wahl.l && wahl.r) bauTimer=setTimeout(baue, BAUEN_NACH_MS);
  }
  // Zielkette: von der gewählten Seite her abdecken (nur in der Denkhilfe)
  function denkhilfe(){
    kettePerlen.forEach(p=>p.classList.remove("aus","hell"));
    const s = wahl.l || wahl.r; if(!s || (wahl.l && wahl.r)) return;
    kettePerlen.forEach((p,i)=>{ const bedeckt = s.seite==="l" ? i < s.len : i >= n - s.len; p.classList.add(bedeckt?"aus":"hell"); });
  }

  // ---------- Bauen ----------
  // Stäbchen fliegen in die Lücke: links von links, rechts von rechts (bei zu lang direkt hinter das linke)
  async function baue(){
    if(busy || !wahl.l || !wahl.r) return;
    busy=true;
    const a=wahl.l.len, b=wahl.r.len, summe=a+b;
    kettePerlen.forEach(p=>p.classList.remove("aus","hell"));
    const br=$("bruecke"); br.innerHTML="";
    const zielR = summe > n ? a : n-b;            // Startplatz des rechten Stäbchens
    const flieg = (s, platz) => {
      s.g.classList.add("weg");
      const st=stab(br, s.len, slotX(platz), YB);
      if(!ruhig) st.g.animate([{transform:`translate(${s.x0-slotX(platz)}px,${s.y-YB}px)`},{transform:"translate(0,0)"}],{duration:520,easing:"cubic-bezier(.3,1.25,.5,1)"});
      return st;
    };
    const L=flieg(wahl.l,0); plopp(); await wait(160);
    const Rr=flieg(wahl.r,zielR); await wait(420); plopp();
    if(summe===n) await richtig(a,b,L,Rr);
    else await falsch(a,b,L,Rr,zielR);
  }

  async function richtig(a,b,L,Rr){
    const ms=Date.now()-t0;
    const r = vorschau ? {frei:null} : verbuche(save, n, a, b, {fehler, hilfe: fehler>=2, ms, heute:heute()});
    if(fehler) wieder.push({zahl:n, ab: rundeZaehler + WIEDER_NACH + 1});
    persist();
    // verschmelzen zur Farbe der Zahl, Planken
    for(const p of [...L.perlen, ...Rr.perlen]) p.querySelector("circle:nth-of-type(2)").setAttribute("fill", FARBE[n]);
    el("rect",{x:gapL()-20,y:Y0-10,width:gapW()+40,height:14,rx:7,fill:"#E3B27C",stroke:"#3B2A6B","stroke-width":3},$("bruecke"));
    fanfare(); funken(960, YB, 10);
    say(`${gross(W(a))} und ${W(b)} sind ${W(n)}.`);
    await wait(500);
    await bewege(uni, gapR()+40, 1500);
    F.hop(uni.svg,{hoehe:50,dauer:600}); await wait(700);
    rundeZaehler++;
    if(!vorschau && save.reise >= save.besuch){ save.besuch = save.reise + BESUCH[0] + Math.floor(Math.random()*(BESUCH[1]-BESUCH[0]+1)); persist(); await besuch(); }
    await weiter(r.frei);
  }

  async function falsch(a,b,L,Rr,zielR){
    const start=Date.now(), summe=a+b, kurz=summe<n;
    fehler++; boing();
    const alle=[...L.perlen, ...Rr.perlen];
    if(kurz){
      // Einhorn tastet sich bis an das Loch und schaut hinunter
      await bewege(uni, gapL() + a*P - UNI_W + 40, 1100);
      kopf(uni, 28); await wait(500);
    } else {
      // zu lang: das Stäbchen ragt übers Ufer, die Brücke wippt, das Einhorn rutscht zurück
      await bewege(uni, gapL() - UNI_W + 90, 600);
      $("bruecke").classList.remove("wippe"); void $("bruecke").getBBox(); $("bruecke").classList.add("wippe");
      F.hop(uni.svg,{hoehe:24,dauer:500});
      await wait(500); await bewege(uni, uniStart()-30, 500, {laufen:false, easing:"ease-out"});
    }
    // Zählen: jede Perle der Brücke und die Perle der Zielkette darüber leuchten nacheinander
    say(kurz ? `${gross(W(a))} und ${W(b)} sind ${W(summe)}. Bis ${W(n)} ${n-summe===1?"fehlt noch eine Perle":"fehlen noch "+W(n-summe)+" Perlen"}.`
             : `${gross(W(a))} und ${W(b)} sind ${W(summe)}. Das ist zu lang für ${W(n)}.`);
    for(let i=0;i<alle.length;i++){
      alle[i].classList.add("zaehl"); if(i<n) kettePerlen[i].classList.add("zaehl"); zaehlTon(i);
      await wait(Math.min(ZAEHL_MS, 2700/alle.length)); alle[i].classList.remove("zaehl"); if(i<n) kettePerlen[i].classList.remove("zaehl");
    }
    if(kurz){
      for(let i=a;i<zielR;i++) $("plaetze").querySelector(`[data-i="${i}"]`)?.classList.add("blink");
      kettePerlen.forEach((p,i)=>{ if(i>=summe) p.classList.add("hell"); });
    } else {
      alle.slice(n).forEach(p=>p.classList.add("zuviel"));
    }
    await wait(1600);
    kopf(uni, 0);
    // Rest der Mindestzeit, dann Stäbchen zurück in die Spalten
    await wait(Math.max(0, FEHLER_MS - 700 - (Date.now()-start)));
    kettePerlen.forEach(p=>p.classList.remove("hell"));
    $("plaetze").querySelectorAll(".blink").forEach(e=>e.classList.remove("blink"));
    const br=$("bruecke");
    if(!ruhig) await br.animate([{opacity:1,transform:"translateY(0)"},{opacity:0,transform:"translateY(-60px)"}],{duration:450,easing:"ease-in"}).finished.catch(()=>{});
    br.innerHTML=""; br.classList.remove("wippe");
    for(const s of [wahl.l,wahl.r]) s.g.classList.remove("weg");
    wahl={l:null,r:null}; zeigeWahl();
    bewege(uni, uniStart(), 250, {laufen:false});
    // Hilfe-Leiter
    if(fehler>=3){
      const bestes = ang.paare.map(k=>[k, eintrag(save,k).c]).sort((x,y)=>x[1]-y[1])[0][0];
      const [la, lb] = bestes.split(":")[1].split("+").map(Number);
      loesung={l:la, r:lb};
      for(const seite of ["l","r"]) for(const s of staebe[seite]){ const ok = s.len===loesung[seite]; s.g.classList.toggle("leuchtet", ok); s.g.classList.toggle("zu", !ok); }
      say(`${gross(W(n))} ist ${W(la)} und ${W(lb)}.`);
    }   // ab dem 2. Fehler: Denkhilfe beim ersten Tipp (siehe tippe)
    await wait(300);
    busy=false;
  }

  // ---------- Ablauf ----------
  async function weiter(neu){
    busy=true;
    if(!ruhig){ const fade=[$("bruecke"),$("kette"),$("spalteL"),$("spalteR"),$("plaetze"),$("figuren")]; fade.forEach(e=>e.animate([{opacity:1},{opacity:0}],{duration:350,fill:"forwards"})); await wait(360); }
    if(!vorschau && rundeZaehler>0 && rundeZaehler % K.RUNDE === 0){ wieder=[]; await pause(); }
    await neueBruecke(neu);
  }
  function waehleZahl(){
    if(params.has("zahl")) return Math.min(10, Math.max(3, +params.get("zahl")||7));
    const w = wieder.findIndex(x=>x.ab<=rundeZaehler && x.zahl!==vorher && save.frei.includes(x.zahl));
    if(w>=0) return wieder.splice(w,1)[0].zahl;
    return naechsteZahl(save, {vorher, heute:heute()});
  }
  async function neueBruecke(neu){
    n = waehleZahl(); vorher=n;
    ang = angebot(n, save, heute());
    if(params.get("fehler")==="kurz"){ n=7; ang={paare:["7:2+5"],links:[1,2,4],rechts:[2,4,5]}; }
    if(params.get("fehler")==="lang"){ n=7; ang={paare:["7:2+5"],links:[2,4,5],rechts:[1,5,6]}; }
    fehler=0; wahl={l:null,r:null}; loesung=null; sperreBis={l:0,r:0}; clearTimeout(sperrTimer);
    $("bruecke").innerHTML=""; $("fx").innerHTML="";
    ufer(); kette(); spalten(ang); neuesEinhorn();
    for(const e of [$("bruecke"),$("kette"),$("spalteL"),$("spalteR"),$("plaetze"),$("figuren")]){ e.getAnimations().forEach(x=>x.cancel()); if(!ruhig) e.animate([{opacity:0},{opacity:1}],{duration:400}); }
    const frisch = (neu===n) || (save.neu?.zahl===n && !angesagt.has(n) && save.reise < save.neu.bis);
    if(sitzungStart || frisch){ say(`Bau eine Brücke für ${W(n)}.`); angesagt.add(n); }
    sitzungStart=false;
    t0=Date.now(); busy=false;
    if(params.has("fehler")){ await wait(900); const l=ang.links.indexOf(params.get("fehler")==="kurz"?2:4), r=ang.rechts.indexOf(params.get("fehler")==="kurz"?4:5); tippe(staebe.l[l]); tippe(staebe.r[r]); }
  }

  // ---------- Besuch (selten): eine Figur kommt ans rechte Ufer, hüpft, geht wieder ----------
  async function besuch(){
    const id=["frosch","hase","eule"][Math.floor(Math.random()*3)];
    if(!F.figuren[id]) return;
    const g=figurG(id, 1960, true);
    tone(660,880,.12);
    await bewege(g, gapR()+UNI_W+80, 1200);
    F.hop(g.svg,{hoehe:50,dauer:600}); F.hop(uni.svg,{hoehe:50,dauer:600}); await wait(1300);
    await bewege(g, 1960, 1000);
    g.g.remove();
  }

  // ---------- Pausenbild ----------
  let pausen=[];
  try{ pausen = await (await fetch("pausenbilder/index.json",{cache:"no-store"})).json(); }catch(e){}
  if(!Array.isArray(pausen)) pausen=[];
  async function pause(){
    if(!pausen.length) return;
    const c = pausen.length>1 ? pausen.filter(p=>p!==save.pause) : pausen;
    const p=c[Math.floor(Math.random()*c.length)];
    save.pause=p; persist();
    const e=$("pause"), im=$("pimg");
    im.src="pausenbilder/"+p; await im.decode().catch(()=>{});
    e.style.setProperty("--pause-ms", PAUSE_MS+"ms");
    e.classList.add("on"); void e.offsetWidth; e.classList.add("show");
    await wait(PAUSE_MS);
    e.classList.remove("show"); await wait(600); e.classList.remove("on");
  }

  // ---------- Elternansicht ----------
  function elternansicht(){
    document.querySelectorAll("#welt,.rund").forEach(e=>e.remove());
    const nxt = K.REIHENFOLGE.find(z=>!save.frei.includes(z));
    const ps = save.frei.flatMap(paareVon), sitzen = ps.filter(p=>eintrag(save,p.key).f>=2).length;
    const v = save.verlauf || [];
    const zeile = p => { const e=eintrag(save,p.key); return `<li>${p.a} + ${p.b}
      <small>· Fach ${esc(e.f)}${e.t?" seit "+esc(e.t):""} · ${e.c}× fehlerfrei gebaut · zuletzt ${(e.h||[]).map(x=>x?"✓":"✗").join("")||"–"}</small></li>`; };
    let html=`<h1>Lernstand Perlenbrücke</h1>
      <p>Freigeschaltet: ${save.frei.map(esc).join(", ")}. ${nxt ? `Nächste Zahl: ${nxt} – braucht ${Math.round(K.FREI_ANTEIL*100)} % der Zerlegungen in Fach ≥ 2 (jetzt ${sitzen} von ${ps.length}) und ${Math.round(K.FREI_QUOTE*100)} % fehlerfrei in den letzten ${K.FREI_FENSTER} Brücken (jetzt ${v.filter(Boolean).length} von ${v.length}).` : "Alle Zahlen sind freigeschaltet."}
      Brücken insgesamt: ${esc(save.reise)}. Fach 0 = wackelt, ab Fach ${K.GELERNT} = gelernt, Abstände ${K.ABSTAND.join(" / ")} Tage. „Fehlerfrei gebaut“ zeigt, ob Abwechslung entsteht.</p>`;
    for(const z of [...save.frei].sort((x,y)=>x-y)){
      const pz=paareVon(z), zs=save.zahlen[z];
      const wack=pz.filter(p=>eintrag(save,p.key).f===0), rest=pz.filter(p=>eintrag(save,p.key).f>0);
      html+=`<h2>${z}${zs?.w?" <small>(wackelt)</small>":""}${zs?.z?.length?` <small>· letzte Zeiten ${zs.z.map(ms=>(ms/1000).toFixed(1)+" s").join(", ")}</small>`:""}</h2><ul>${[...wack,...rest].map(zeile).join("")}</ul>`;
    }
    html+=`<p><a class="btn" href="perlenbruecke.html">Zum Spiel</a></p>`;
    const e=document.createElement("div"); e.className="eltern"; e.innerHTML=html; document.body.appendChild(e);
  }

  await neueBruecke(null);
})();
</script>
