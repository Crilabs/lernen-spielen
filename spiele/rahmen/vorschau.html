<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rahmen-Bausteine</title>
<link rel="stylesheet" href="seite.css">
<style>
  /* Entwicklerseite, nicht aus der App verlinkt: jeder Baustein einmal, in der Anordnung aus docs/bedienung.md 3.
     Adresse: vorschau.html?fach=mathe&titel=Spielvorlage&thema=Die%207%20zerlegen  (&pause, &leuchte; ?objekte zeigt die Spielobjekte)
     Alle Maße in rem; Platz bleibt für 172 rem Breite (16:10), dort ist das sichere Feld schmaler als 192 rem. */
  .welt { background: linear-gradient(#CFEFFF, #EAF7FF 60%); }
  .huegel { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 34rem; }
  .buehne > * { position: absolute; }

  ls-blase { top: 19rem; left: 50%; transform: translateX(-50%); width: min(150rem, calc(100% - 30rem)); }

  /* Links: das Lernfeld mit den Lernzeichen. */
  .zeichen-feld { top: 35.4rem; left: 2.4rem; width: 90rem; display: grid; gap: 2.4rem; padding: 3.4rem 3.8rem; }
  .staebe { display: grid; grid-template-columns: auto auto; justify-content: space-between; align-items: center; }
  .reihe { display: grid; gap: 1.2rem; justify-items: start; }
  .reihe ls-perlenstab { height: 4.2rem; }
  .reihe .verdeckt { height: 6rem; }
  .woerter { display: flex; align-items: flex-end; justify-content: space-between; }
  .wort { display: grid; justify-items: center; gap: 1rem; font-size: 3.6rem; line-height: 1; }
  .wort ls-wortart { height: 6rem; }

  /* Rechts: Matte mit zwei Lücken, darunter das Tablett mit den Teilen. */
  .matte { top: 35.4rem; left: 95rem; width: 75rem; display: flex; justify-content: space-around; align-items: center; padding: 2.6rem 2.4rem; font-size: 4.4rem; font-weight: 700; line-height: 1; }
  .aufgabe { display: flex; align-items: center; gap: 1.6rem; white-space: nowrap; }
  .luecke { display: grid; place-items: center; width: 12rem; height: 12rem; background: var(--ls-nebel); border: var(--ls-kontur) solid var(--ls-linie); border-radius: var(--ls-radius); }
  .luecke:has(.teil) { background: none; border-color: transparent; }
  .tablett-zeile { top: 56.4rem; left: 107rem; display: flex; gap: 4rem; padding: 2.4rem 5rem; }
  .tablett-zeile .teil { margin: 0; }

  /* Unten: Tastatur Mitte, Auslöser rechts daneben, Protokoll links. Hilfe sitzt selbst unten rechts. */
  ls-tastatur { bottom: 2.4rem; left: 50%; transform: translateX(-50%); }
  .ausloeser { right: 17.8rem; bottom: 2.4rem; display: grid; gap: 2rem; }
  .protokoll { left: 2.4rem; bottom: 2.4rem; width: 44rem; height: 31rem; overflow: hidden; margin: 0; padding: 2rem 2.6rem; background: var(--ls-papier); border: var(--ls-kontur) solid var(--ls-linie); border-radius: var(--ls-radius); font-size: 3.2rem; line-height: 1.3; list-style: none; }
  .protokoll li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .protokoll li:first-child { font-weight: 700; }

  .pausen-inhalt { display: grid; gap: 2rem; justify-items: center; font-size: 4rem; text-align: center; max-width: 90rem; }
  .pausen-inhalt img { width: 22rem; height: 22rem; }
  /* Spielobjekte (spiele/objekte/): nur mit ?objekte, dann statt der Bausteine. Eine Wiese, Ela zum Vergleich der
     Größe und des Stils, jede Tonne in jedem Zustand, Werfen zum Ausprobieren, unten rechts das Regal-Bild (still). */
  .objekte { position: absolute; inset: 17rem 2.4rem 2.4rem; display: grid; grid-template-rows: auto 1fr; row-gap: 2rem; }
  .objekte[hidden] { display: none; }
  .objekte .reihe-zustaende { display: flex; align-items: flex-end; justify-content: space-between; }
  .objekte .gruppe { display: flex; align-items: flex-end; gap: 0.6rem; }
  .objekte ls-objekt { height: 22rem; }
  .objekte .kind svg { display: block; height: 30rem; width: auto; overflow: visible; }
  .objekte .spiel { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 4rem 2rem; }
  .objekte .dinge { display: flex; align-items: flex-end; gap: 3rem; }
  .objekte .dinge ls-objekt { height: 9rem; }
  .objekte .dinge ls-objekt[hidden] { display: inline-block; visibility: hidden; }
  .objekte .knoepfe { display: grid; gap: 1.6rem; align-self: center; }
  .objekte .regal { display: flex; align-items: flex-end; gap: 2rem; padding: 1.6rem 2.4rem; }
  .objekte .regal ls-objekt { height: 10rem; }
</style>
</head>
<body>
<div class="welt">
<svg class="huegel" viewBox="0 0 1920 340" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 120 C360 40 660 100 960 80 C1290 58 1560 20 1920 70 V340 H0Z" fill="#BFE3C9"/>
  <path d="M0 200 C480 150 900 210 1260 180 C1560 156 1770 170 1920 166 V340 H0Z" fill="#9ED8A8"/>
</svg>
</div>
<ls-leiste id="leiste" spiel="vorschau" fach="mathe" titel="Spielvorlage" thema="Die 7 zerlegen"></ls-leiste>
<div class="buehne">
  <ls-blase id="blase"></ls-blase>

  <div class="lernfeld zeichen-feld" id="zeichen">
    <div class="staebe">
      <div class="reihe">
        <ls-perlenstab wert="5" ziffer></ls-perlenstab>
        <ls-perlenstab wert="7" ziffer></ls-perlenstab>
        <ls-perlenstab wert="10" ziffer></ls-perlenstab>
      </div>
      <div class="reihe">
        <ls-perlenstab class="verdeckt" wert="7" verdeckt ziffer></ls-perlenstab>
        <ls-perlenstab class="verdeckt" wert="7" verdeckt></ls-perlenstab>
      </div>
    </div>
    <div class="woerter">
      <span class="wort"><ls-wortart art="artikel"></ls-wortart>Die</span>
      <span class="wort"><ls-wortart art="adjektiv"></ls-wortart>kleine</span>
      <span class="wort"><ls-wortart art="nomen"></ls-wortart>Katze</span>
      <span class="wort"><ls-wortart art="verb"></ls-wortart>schläft</span>
    </div>
  </div>

  <div class="lernfeld matte" id="matte">
    <div class="aufgabe">3 + <span class="luecke" data-passt="2" name="Lücke bei 3 plus"></span> = 5</div>
    <div class="aufgabe">4 + <span class="luecke" data-passt="1" name="Lücke bei 4 plus"></span> = 5</div>
  </div>
  <div class="tablett tablett-zeile" id="tablett">
    <span class="teil" data-wert="1">1</span>
    <span class="teil" data-wert="2">2</span>
    <span class="teil" data-wert="3">3</span>
  </div>

  <ol class="protokoll" id="protokoll" aria-label="Ereignisse"></ol>
  <ls-tastatur id="tastatur" tasten="Die Katze schläft" leertaste loeschen></ls-tastatur>
  <div class="ausloeser">
    <ls-knopf id="pausenknopf" art="haupt" wort="Pause"></ls-knopf>
    <ls-knopf id="leuchtknopf" art="haupt" wort="Leuchte"></ls-knopf>
  </div>
</div>
<section class="objekte" id="objekte" hidden>
  <div class="reihe-zustaende">
    <div class="kind" id="kind"></div>
    <div class="gruppe">
      <ls-objekt art="papiertonne" zustand="zu"></ls-objekt>
      <ls-objekt art="papiertonne" zustand="offen"></ls-objekt>
      <ls-objekt art="papiertonne" zustand="voll"></ls-objekt>
    </div>
    <div class="gruppe">
      <ls-objekt art="wertstofftonne" zustand="zu"></ls-objekt>
      <ls-objekt art="wertstofftonne" zustand="offen"></ls-objekt>
      <ls-objekt art="wertstofftonne" zustand="voll"></ls-objekt>
    </div>
  </div>
  <div class="spiel">
    <div class="dinge" id="dinge">
      <ls-objekt id="ding-papier" art="papier"></ls-objekt>
      <ls-objekt id="ding-dose" art="dose"></ls-objekt>
    </div>
    <div class="gruppe">
      <ls-objekt id="ziel-papier" art="papiertonne" zustand="zu"></ls-objekt>
      <ls-objekt id="ziel-dose" art="wertstofftonne" zustand="zu"></ls-objekt>
    </div>
    <div class="knoepfe">
      <ls-knopf id="werfen" art="haupt" wort="Werfen"></ls-knopf>
      <ls-knopf id="fuellen" wort="Füllen"></ls-knopf>
      <ls-knopf id="leeren" wort="Neu"></ls-knopf>
    </div>
    <div class="lernfeld regal" aria-label="Regal-Bild">
      <ls-objekt art="papiertonne" wert="7" still></ls-objekt>
      <ls-objekt art="wertstofftonne" wert="10" still></ls-objekt>
      <ls-objekt art="papiertonne" wert="Mm" still></ls-objekt>
    </div>
  </div>
</section>
<ls-hilfe id="hilfe"></ls-hilfe>
<ls-pause id="pause">
  <div class="pausen-inhalt">
    <img src="../symbole/mathe.svg" alt="">
    <div>Die Brücke steht. Ein Perlenstäbchen mit sieben Perlen ist so lang wie eins mit fünf und eins mit zwei.</div>
  </div>
</ls-pause>
<script type="module">
  import "./leiste.js";
  import "./blase.js";
  import "./hilfe.js";
  import "./pause.js";
  import "./tastatur.js";
  import "./perlenstab.js";
  import "./wortart.js";
  import { ziehbar, setze, zurueck } from "./ziehen.js";
  import "../objekte/papiertonne.js";
  import "../objekte/wertstofftonne.js";
  import { wirf } from "../objekte/objekt.js";
  import { zeichne } from "../runde/runde.js";

  const q = new URLSearchParams(location.search);
  const leiste = document.getElementById("leiste");
  const hilfe = document.getElementById("hilfe");
  const pause = document.getElementById("pause");
  const liste = document.getElementById("protokoll");

  // Ereignis-Protokoll: das neueste oben, sechs Zeilen; window.ereignisse hält alle (für die Browser-Prüfung).
  window.ereignisse = [];
  const merke = (text) => {
    window.ereignisse.push(text);
    const li = document.createElement("li");
    li.textContent = text;
    liste.prepend(li);
    while (liste.children.length > 6) liste.lastChild.remove();
  };

  for (const a of ["fach", "titel", "thema"]) if (q.get(a)) leiste.setAttribute(a, q.get(a));
  leiste.addEventListener("ton", (e) => merke(`ton ${e.detail.an ? "an" : "aus"}`));
  leiste.addEventListener("bereit", () => merke("leiste bereit"));
  hilfe.addEventListener("hilfe", () => merke("hilfe"));
  document.getElementById("tastatur").addEventListener("taste", (e) => merke(`taste ${JSON.stringify(e.detail.zeichen)}`));

  document.getElementById("blase").sage("Welches Stäbchen passt an die Fünf, damit es sieben werden?", { sprechen: false });

  document.getElementById("leuchtknopf").addEventListener("click", () => {
    hilfe.leuchte();
    merke("leuchte");
  });
  const zeigePause = async () => {
    merke("pause zeige");
    merke(`pause ${await pause.zeige()}`);
  };
  document.getElementById("pausenknopf").addEventListener("click", zeigePause);

  // Ziehen: passt die Zahl, bleibt sie in der Lücke, sonst kehrt sie aufs Tablett zurück.
  window.abgelegt = [];
  const freieLuecken = () => [...document.querySelectorAll(".luecke")].filter((l) => !l.querySelector(".teil"));
  for (const teil of document.querySelectorAll("#tablett .teil")) {
    const loesen = ziehbar(teil, {
      ziele: freieLuecken,
      beimAblegen(teil, luecke) {
        window.abgelegt.push([teil.dataset.wert, luecke.dataset.passt]);
        merke(`ablegen ${teil.dataset.wert} auf ${luecke.dataset.passt}`);
        if (teil.dataset.wert === luecke.dataset.passt) {
          setze(teil, luecke);
          loesen();
          teil.classList.add("gesetzt");
        } else zurueck(teil);
      },
    });
  }

  if (q.has("leuchte")) hilfe.leuchte();
  if (q.has("pause")) zeigePause();
  // Spielobjekte: ?objekte zeigt sie statt der Bausteine.
  if (q.has("objekte")) {
    document.querySelector(".buehne").hidden = true;
    document.getElementById("objekte").hidden = false;
    document.getElementById("kind").innerHTML = zeichne("ela", { ansicht: "dreiviertel", haltung: "stehen" });
    const [papier, dose] = ["ding-papier", "ding-dose"].map((id) => document.getElementById(id));
    const [zielP, zielD] = ["ziel-papier", "ziel-dose"].map((id) => document.getElementById(id));
    document.getElementById("werfen").addEventListener("click", async () => {
      const ding = !papier.hidden ? papier : !dose.hidden ? dose : null;
      if (!ding) return;
      merke(`wirf ${ding.getAttribute("art")}`);
      merke(`wirf ${await wirf(ding, ding === papier ? zielP : zielD).fertig}`);
    });
    document.getElementById("fuellen").addEventListener("click", () => {
      for (const t of [zielP, zielD]) t.zustand = t.zustand === "voll" ? "offen" : "voll";
    });
    document.getElementById("leeren").addEventListener("click", () => {
      papier.hidden = dose.hidden = false;
      for (const t of [zielP, zielD]) t.zustand = "zu";
    });
  }
</script>
</body>
</html>
