<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Was ich schon kann</title>
<link rel="stylesheet" href="rahmen/seite.css">
<link rel="stylesheet" href="start/karten.css">
<style>
/* Regal: was ich kann (Spec 2026-11-14-startseite-karten-design.md, Nachtrag Regal-Seite; Aussehen nach der
   Designsprache 2026-11-15, Spec 2026-11-15-designsprache-design.md §5.3).
   Links Zurück, der Titel und die Fächer als Liste (Punkt in der Füllung, Name); das gewählte Fach liegt auf seiner
   Tönung mit Sonnenring. In der Mitte je Bereich ein Brett aus Ahorn, darauf die gekonnten Themen als Kacheln (Papier,
   Kontur, Schatten) mit dem Material, der Name unter dem Brett. Das Neueste oben (Christian): Bereiche nach ihrem
   jüngsten Thema, darin neueste zuerst. Rechts das Detail des gewählten Themas (immer etwas gewählt, Christian):
   Name, Noch mal hören, die Spiele zum Nochmal-Spielen, Mit echten Dingen. Bereiche ohne Gekonntes erscheinen nicht.
   Kein Sockel, kein Glanz, keine Zählung (N5, N8). Neu seit dem letzten Besuch: einmal ein Sonnenring für etwa 1 s.
   Dahinter das Grundmuster Jahresringe. Diese Seite liest den Lernstand nur, sie schreibt ihn nie. */
body { -webkit-user-select: none; user-select: none; }

.regal-seite {
  position: absolute;
  top: var(--ls-leiste-hoehe);
  bottom: 0;
  left: max(0rem, calc((100vw - 192rem) / 2));
  width: min(100vw, 192rem);
  z-index: 1;
  display: grid;
  grid-template-columns: 36rem minmax(0, 1fr) 40rem;
  gap: 5rem;
  padding: 0 var(--ls-seite-rand);
}

/* Links: Zurück, Titel, Fächer */
.links { display: flex; flex-direction: column; align-items: flex-start; min-height: 0; padding-top: 0.6rem; }
.links ls-knopf { margin: -1.3rem 0 0 -1.3rem; }
.titel { margin: 2.6rem 0 4rem; font-family: var(--ls-schrift-oberflaeche); font-feature-settings: var(--ls-schrift-merkmale);
  font-size: 6.4rem; font-weight: 750; line-height: 1.04; letter-spacing: -0.035em; }
.reiter { display: flex; flex-direction: column; gap: 1.2rem; align-self: stretch; overflow-y: auto; scrollbar-width: none; padding: 1.6rem; margin: -1.6rem; }
.reiter-knopf {
  display: flex; align-items: center; gap: 2rem; min-height: 9rem; padding: 0 2.8rem; border-radius: var(--ls-radius-teil);
  background: none; border: 0; color: var(--ls-tinte); font: inherit; text-align: left; cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.reiter-knopf > * { pointer-events: none; }
.reiter-knopf .punkt { flex: none; width: 2.6rem; height: 2.6rem; border-radius: 50%; background: var(--fach-fuellung);
  border: var(--ls-kontur) solid var(--ls-tinte); }
.reiter-knopf b { font-family: var(--ls-schrift-oberflaeche); font-feature-settings: var(--ls-schrift-merkmale);
  font-size: 3.2rem; font-weight: 650; line-height: 1.1; letter-spacing: -0.01em; }
.reiter-knopf:focus-visible { outline: 0.4rem solid var(--ls-tinte); outline-offset: 0.3rem; }
/* Gewählt: Tönung des Fachs und ein Sonnenring (bewertet nichts); die einzige Fachfläche der Seite. */
.reiter-knopf[aria-selected="true"] { background: var(--fach-toenung); box-shadow: 0 0 0 0.9rem var(--ls-sonne); }
.reiter-knopf[aria-selected="true"] b { color: var(--fach-tief); }

/* Bretter: je Bereich eins */
/* Links 1,2 rem Luft für den Sonnenring des gewählten Dings (0,9 rem), per negativem Rand ausgeglichen: die Bretter
   bleiben bündig, der Ring wird vom Scrollbereich nicht abgeschnitten. */
.bretter { min-height: 0; overflow-y: auto; padding: 1.4rem 1rem 6rem 1.2rem; margin-left: -1.2rem; scrollbar-width: none; }
.bretter::-webkit-scrollbar { display: none; }
.brett + .brett { margin-top: 4.4rem; }
.brett h3 { margin: 0 0 2rem; font-family: var(--ls-schrift-oberflaeche); font-feature-settings: var(--ls-schrift-merkmale);
  font-size: 3.4rem; font-weight: 700; letter-spacing: -0.01em; }
/* Jede Reihe steht auf einem eigenen Brett (Ahorn mit Kante): die Kacheln stehen darauf, der Name darunter. Feste
   Reihenhöhe, das Brett wiederholt sich mit jeder Reihe; Reihen brechen um, der Bereich rollt senkrecht. */
.brett .dinge {
  --kachel: 13.4rem;
  --boden: calc(var(--kachel) + 1rem);
  --reihe: calc(var(--boden) + 9rem);
  display: grid; grid-template-columns: repeat(auto-fill, 17.6rem); grid-auto-rows: var(--reihe); column-gap: 2rem; row-gap: 1.6rem;
  background: repeating-linear-gradient(to bottom,
    transparent 0 var(--boden),
    var(--ls-ahorn) var(--boden) calc(var(--boden) + 1.2rem),
    var(--ls-kante) calc(var(--boden) + 1.2rem) calc(var(--boden) + 1.8rem),
    transparent calc(var(--boden) + 1.8rem) calc(var(--reihe) + 1.6rem));
  background-size: 100% calc(var(--reihe) + 1.6rem);
}
.ding {
  position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 0;
  width: 17.6rem; height: var(--reihe); padding: 0;
  background: none; border: 0; color: var(--ls-tinte); font: inherit; cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.ding > * { pointer-events: none; }
.ding .material { display: flex; align-items: center; justify-content: center; width: 100%; height: var(--kachel);
  background: var(--ls-papier); border: var(--ls-kontur) solid var(--ls-tinte); border-radius: var(--ls-radius-teil);
  box-shadow: var(--ls-schatten); padding: 1.2rem; }
.ding:active .material { transform: translateY(0.3rem); box-shadow: var(--ls-schatten-unten); }
/* Perlen so groß, dass auch der Zehnerstab in die Kachel passt (Längen bleiben im Verhältnis) */
.ding ls-perlenstab { height: 1.45rem; }
.ding ls-wortart { height: 6.4rem; }
.ding ls-objekt { height: 8rem; }
.ding .karte { display: grid; place-items: center; min-width: 5.6rem; height: 7rem; padding: 0 1.4rem; white-space: nowrap;
  border: 0; background: none; font-size: 4rem; font-weight: 700; line-height: 1; }
.ding .karte.symbol { padding: 0; }
.ding .karte i { display: block; width: 4.4rem; height: 4.4rem; background: var(--ls-tinte); -webkit-mask: var(--bild) center / contain no-repeat; mask: var(--bild) center / contain no-repeat; }
/* Höchstens zwei Zeilen; der volle Name steht im Detail und wird vorgelesen. */
.ding .name { margin-top: 3rem; font-size: 2.4rem; line-height: 1.15; text-align: center; hyphens: manual;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; }
.ding:focus-visible .material { outline: 0.4rem solid var(--ls-tinte); outline-offset: 0.4rem; }
.ding[aria-pressed="true"] .material, .ding.markiert .material { box-shadow: var(--ls-schatten), 0 0 0 0.9rem var(--ls-sonne); }

/* Detail rechts: eine ruhige Papierfläche (flach, ohne Kontur), höchstens so hoch wie der Platz; darin rollt es. */
.detail {
  align-self: start; max-height: calc(100% - 4rem); overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 2rem;
  margin-top: 1.4rem; padding: 3.6rem; background: var(--ls-papier); border-radius: var(--ls-radius-plakat);
}
.detail[hidden] { display: none; }
.detail .kopf { display: flex; align-items: center; gap: 1.6rem; }
.detail h2 { flex: 1; margin: 0; font-family: var(--ls-schrift-oberflaeche); font-feature-settings: var(--ls-schrift-merkmale);
  font-size: 4.4rem; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
.detail h3 { margin: 0.8rem 0 0; font-size: 2.8rem; color: var(--ls-tinte-weich); font-weight: 400; }
.detail .spiele { display: flex; flex-direction: column; gap: 1.2rem; }
.detail .karten { gap: 2.4rem; }
.detail .karten .karte { width: 100%; }

.leer { display: flex; align-items: center; gap: 2rem; margin-top: 2rem; font-size: 4.5rem; color: var(--ls-tinte-weich); }
.leer p { margin: 0; }
.fehler { margin: 2rem 0 0; font-size: 4rem; color: var(--ls-tinte-weich); }

@media (max-aspect-ratio: 3/2) {
  .regal-seite { grid-template-columns: 30rem minmax(0, 1fr) 36rem; gap: 3.6rem; }
  .titel { font-size: 5.4rem; }
}
</style>
</head>
<body>
<ls-muster art="ringe"></ls-muster>
<ls-kopf id="leiste" reiter="koennen" spiel="ansichten"></ls-kopf>
<main class="regal-seite">
  <nav class="links" aria-label="Fächer">
    <ls-knopf id="zurueck" symbol="zurueck.svg" name="Alle Spiele" groesse="seite"></ls-knopf>
    <h1 class="titel">Was ich schon kann</h1>
    <div id="reiter"></div>
  </nav>
  <div class="bretter" id="bretter"></div>
  <aside class="detail" id="detail" hidden aria-live="off">
    <div class="kopf"><h2 id="name" tabindex="-1"></h2>
      <ls-knopf id="hoeren" symbol="vorlesen.svg" name="Noch mal hören" groesse="klein" stumm></ls-knopf></div>
    <h3 id="spiele-titel">Nochmal spielen</h3>
    <div class="karten" id="spiele"></div>
  </aside>
</main>

<script type="module">
import { sperreTouch, protokoll, esc, linkKlick } from "./lernspiel.js";
import { ladeLernstand, gekonnteThemen, spieleFuer } from "./lernsteuerung.js";
import { sprich } from "./kern/stimme.js";
import { schonGesagt, merkeGesagt, vergissGesagt, sageEinmal } from "./kern/sitzung.js";
import { ladeEinstellungen, einstellung, setzeEinstellung } from "./kern/einstellungen.js";
import { neuSeit } from "./rahmen/material.js";
import "./rahmen/kopf.js";
import "./rahmen/knopf.js";
import "./rahmen/muster.js";
import "./rahmen/perlenstab.js";
import "./rahmen/perlenkette.js"; // Regal-Material der Einmaleins-Reihen (Kurzkette, material.js)
import "./rahmen/wortart.js";
import "./objekte/objekt.js";
import { regalBaum, reiterHtml, bretterHtml } from "./start/regal-leiste.js";
import { spielKarteHtml, echtKarteHtml } from "./start/karten.js";
import { paletteFuer, vignetteSvg } from "./start/welten.js";
import { spielzeitLage } from "./rahmen/spielzeit.js";
import { ladeVerzeichnis } from "./rahmen/echte-dinge.js";

/** Merker im Profil (einstellungen): Ids, die beim letzten Besuch im Regal standen. */
const GESEHEN = "regal.gesehen";
/** So lange steht der Sonnenring an einem neuen Ding. */
const NEU_MS = 1200;

// Zurück zu „Können“ (Startseite); der Name spricht der Knopf beim ersten Tippen selbst.
document.getElementById("zurueck").addEventListener("click", () => { location.href = "index.html"; });
start();

async function start() {
  sperreTouch();
  const leiste = document.getElementById("leiste");
  let ctx, stand;
  try {
    const [plan, spiele] = await Promise.all(["lernplan.json", "spiele.json"].map((d) => fetch(d).then((r) => r.json())));
    ctx = { plan, spiele };
    stand = await ladeLernstand(ctx, new Date().toLocaleDateString("sv"));
  } catch (e) { protokoll("regal: " + e); zeigeFehler(); return; }
  const [, , verzeichnis] = await Promise.all([leiste.bereit(), ladeEinstellungen(), ladeVerzeichnis()]);
  // „Mit echten Dingen“ gibt es, wenn das Thema eine (freigegebene) Anleitung oder einen Einzeiler im Lernplan hat.
  const anleitungVon = (/** @type {string} */ id, /** @type {string} */ fach) => {
    const e = Object.hasOwn(verzeichnis.themen, id) ? verzeichnis.themen[id] : null;
    return e && e.fach === fach ? e : null;
  };
  // Spielzeit der Eltern: gesperrt fehlen die Spielkarten im Detail; „Mit echten Dingen“ bleibt.
  const zeit = await spielzeitLage().catch((e) => { protokoll("Spielzeit: " + e); return null; });
  const spielFrei = !zeit || zeit.lage.frei;

  const themaNach = new Map((ctx.plan.themen ?? []).map((t) => [t.id, t]));
  const spielNach = new Map((ctx.spiele.spiele ?? []).map((s) => [s.id, s]));
  const gekonnt = gekonnteThemen(ctx, stand);
  const baum = regalBaum(gekonnteThemen(ctx, stand), ctx, spieleFuer);

  // Neu seit dem letzten Besuch (vor dem Merken lesen); gemerkt werden genau die jetzt gekonnten Ids, so fällt ein
  // zurückgesetztes Thema still heraus. Von Eltern Abgehaktes ist nie neu (es steht still im Regal).
  const ids = gekonnt.map((g) => g.id), alt = einstellung(GESEHEN, null);
  const erspielt = gekonnt.filter((g) => !g.vonEltern).map((g) => g.id);
  const neu = new Set(neuSeit(erspielt, alt));
  if (!Array.isArray(alt) || alt.length !== ids.length || alt.some((id, i) => id !== ids[i])) setzeEinstellung(GESEHEN, ids);

  if (!baum.length) { leer(leiste); return; }

  // Immer etwas gewählt, passend zum Reiter (Christian): beim Öffnen der erste Reiter und darin das erste Thema
  // (oben links, das neueste); mit ?thema das Fach dieses Themas und genau dieses Thema.
  const fachVon = (id) => baum.find((f) => f.bereiche.some((b) => b.themen.some((t) => t.id === id)))?.fach;
  // Mit ?thema (aus „Zuletzt gelernt“ auf der Startseite) öffnet das Regal an genau diesem Thema.
  const gewuenscht = new URLSearchParams(location.search).get("thema");
  const ziel = fachVon(gewuenscht) ? gewuenscht : null;
  let aktiv = fachVon(ziel) ?? baum[0].fach;
  const erstesVon = (fach) => baum.find((f) => f.fach === fach).bereiche[0].themen[0].id;

  const reiter = document.getElementById("reiter"), bretter = document.getElementById("bretter");
  const detail = document.getElementById("detail"), nameFeld = document.getElementById("name");
  const spieleFeld = document.getElementById("spiele"), spieleTitel = document.getElementById("spiele-titel");
  const hoeren = document.getElementById("hoeren");
  let jetzt = null;

  function zeigeFach(fach) {
    aktiv = fach;
    reiter.innerHTML = reiterHtml(baum, aktiv);
    bretter.innerHTML = bretterHtml(baum.find((f) => f.fach === aktiv), neu);
    bretter.scrollTop = 0;
    reiter.querySelectorAll(".reiter-knopf").forEach((k) => k.addEventListener("click", () => {
      if (k.dataset.fach === aktiv) return;
      const f = baum.find((x) => x.fach === k.dataset.fach);
      if (leiste.ton && f) sageEinmal(f.name, sprich);
      zeigeFach(k.dataset.fach);
      oeffne(erstesVon(k.dataset.fach), false);
    }));
    bretter.querySelectorAll(".ding").forEach((d) => d.addEventListener("click", () => { oeffne(d.dataset.thema, true); }));
    // Neues: einmal ein Sonnenring, dann still (B3)
    const neue = [...bretter.querySelectorAll(".ding.neu")];
    neue.forEach((d) => d.classList.add("markiert"));
    if (neue.length) setTimeout(() => neue.forEach((d) => d.classList.remove("markiert")), NEU_MS);
  }

  function oeffne(id, sprechen) {
    const t = baum.flatMap((f) => f.bereiche.flatMap((b) => b.themen)).find((x) => x.id === id);
    if (!t) return;
    jetzt = { ...t, sprich: String(themaNach.get(id)?.sprich ?? ""), eltern: String(themaNach.get(id)?.eltern ?? "") };
    bretter.querySelectorAll(".ding").forEach((d) => d.setAttribute("aria-pressed", String(d.dataset.thema === id)));
    nameFeld.textContent = t.name;
    // Dieselben Karten wie auf der Startseite: Spielkarte mit Vignette, dazu Mit echten Dingen
    const fach = t.strang;
    const anleitung = anleitungVon(id, fach);
    const echtDa = !!jetzt.eltern || !!anleitung;
    spieleFeld.innerHTML = (spielFrei ? t.spiele : []).map((s) => {
      const spiel = spielNach.get(s.id) ?? s;
      const palette = paletteFuer(ctx, spiel.karte?.welt ?? spiel.welt);
      return spielKarteHtml({ spiel, thema: { id, name: t.name } }, fach, palette ? vignetteSvg(palette) : null);
    }).join("") + (echtDa ? echtKarteHtml({ thema: { id, name: t.name } }, fach, anleitung?.titel) : "");
    spieleTitel.hidden = !(spielFrei && t.spiele.length) && !echtDa;
    spieleFeld.querySelectorAll("a.karte.spiel").forEach((a) => a.addEventListener("click", (e) => {
      if (leiste.ton) sageEinmal(a.querySelector("b").textContent, sprich);
      linkKlick(e);
    }));
    spieleFeld.querySelector(".karte.echt")?.addEventListener("click", (e) => linkKlick(e));
    detail.hidden = false;
    if (sprechen && jetzt.sprich && leiste.ton) sprich(jetzt.sprich);
  }

  hoeren.addEventListener("click", () => { if (jetzt?.sprich && leiste.ton) sprich(jetzt.sprich); });

  zeigeFach(aktiv);
  const erstes = ziel ?? erstesVon(aktiv);
  oeffne(erstes, false);
  bretter.querySelector(`.ding[data-thema="${CSS.escape(erstes)}"]`)?.scrollIntoView({ block: "nearest" });
}

function leer(leiste) {
  const bretter = document.getElementById("bretter");
  bretter.innerHTML = `<div class="leer"><p>Hier stellst du hin, was du kannst.</p>
    <ls-knopf id="leer-hoeren" symbol="vorlesen.svg" name="Noch mal hören" groesse="klein" stumm></ls-knopf></div>`;
  const merker = "regal:leer";
  const sag = () => sprich("Hier stellst du hin, was du kannst.");
  bretter.querySelector("#leer-hoeren").addEventListener("click", () => { if (leiste.ton) sag(); });
  if (leiste.ton && !schonGesagt(merker)) {
    merkeGesagt(merker);
    sag().then((r) => { if (r === "abgebrochen") vergissGesagt(merker); });
  }
}

// Lernplan oder Spiele fehlen: ein kurzer Text statt leerer Seite (nicht vorgelesen); Haus führt zurück.
function zeigeFehler() {
  const p = document.createElement("p");
  p.className = "fehler";
  p.textContent = "Das geht gerade nicht. Später noch einmal.";
  document.getElementById("bretter").replaceWith(p);
}
</script>
</body>
</html>
