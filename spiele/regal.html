<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein Regal</title>
<link rel="stylesheet" href="rahmen/seite.css">
<link rel="stylesheet" href="start/karten.css">
<style>
/* Regal: was ich kann (Spec docs/superpowers/specs/2026-11-14-startseite-karten-design.md, Nachtrag Regal-Seite).
   Gegliedert wie der Lernplan: oben die Fächer als Reiter, darunter je Bereich ein Brett aus Ahorn mit den gekonnten
   Themen (Material und Name). Das Neueste oben (Christian): Bereiche nach ihrem jüngsten Thema, darin neueste zuerst. Thema antippen: rechts das Detail (Name, Noch mal hören, die Spiele zum
   Nochmal-Spielen, Mit echten Dingen). Bereiche ohne Gekonntes erscheinen nicht (das Regal zeigt nie, was fehlt).
   Kein Sockel, kein Glanz, keine Zählung (Anti-Ziel Trophäenwand; N5, N8). Neu seit dem letzten Besuch: einmal ein
   Sonnenring für etwa 1 s, sonst nichts. Dahinter dieselbe dezente Landschaft wie auf der Startseite.
   Diese Seite liest den Lernstand nur, sie schreibt ihn nie. */
body { -webkit-user-select: none; user-select: none; }
.hintergrund, .hintergrund svg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.regal-seite {
  position: absolute;
  inset: var(--ls-leiste-hoehe) 0 0 0;
  display: grid;
  grid-template-columns: 1fr 34rem;
  gap: 3.2rem;
  padding: 0 3.2rem 0 4.4rem;
}
.links { display: flex; flex-direction: column; min-height: 0; }

/* Reiter: die Fächer */
.reiter { flex: none; display: flex; flex-wrap: wrap; gap: 2.4rem; padding: 2.4rem 0 2.8rem 1.2rem; }
.reiter-knopf {
  display: flex; align-items: center; gap: 1.2rem; min-height: 11rem; padding: 1.2rem 2.4rem 1.2rem 1.2rem;
  border: var(--ls-kontur) solid var(--ls-tinte); border-radius: 6rem; background: var(--ls-papier);
  box-shadow: var(--ls-schatten); color: var(--ls-tinte); font: inherit; cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.reiter-knopf > * { pointer-events: none; }
.reiter-knopf .knopf { display: grid; place-items: center; width: 8rem; height: 8rem; border: var(--ls-kontur) solid var(--ls-tinte);
  border-radius: 50%; background: var(--fach-fuellung); }
.reiter-knopf .knopf i { display: block; width: 4.8rem; height: 4.8rem; background: var(--ls-tinte);
  -webkit-mask: var(--bild) center / contain no-repeat; mask: var(--bild) center / contain no-repeat; }
.reiter-knopf b { font-size: 3.4rem; }
.reiter-knopf:active { transform: translateY(0.3rem); box-shadow: var(--ls-schatten-unten); }
.reiter-knopf:focus-visible { outline: 0.5rem solid var(--ls-tinte); outline-offset: 0.6rem; }
/* Gewählt: der Sonnenring (bewertet nichts) */
.reiter-knopf[aria-selected="true"] { outline: 0.8rem solid var(--ls-sonne); outline-offset: 0; box-shadow: 0 0 0 1.1rem var(--ls-tinte); }

/* Bretter: je Bereich eins */
.bretter { flex: 1; min-height: 0; overflow-y: auto; padding: 0 1rem 6rem 0; scrollbar-width: none; }
.bretter::-webkit-scrollbar { display: none; }
.brett + .brett { margin-top: 3.2rem; }
.brett h3 { margin: 0 0 0.8rem; font-size: 3rem; }
/* Jede Reihe steht auf einem eigenen Brett (Ahorn mit Kante, Tinte-Linien): feste Reihenhöhe, das Brett wiederholt
   sich mit jeder Reihe. So findet jedes Thema Platz (Reihen brechen um, der Bereich rollt senkrecht) und nichts schwebt. */
.brett .dinge {
  --reihe: 17.6rem;
  --boden: 14.8rem;
  display: grid; grid-template-columns: repeat(auto-fill, 18rem); grid-auto-rows: var(--reihe); column-gap: 2rem;
  padding: 0 2rem;
  background: repeating-linear-gradient(to bottom,
    transparent 0 var(--boden),
    var(--ls-tinte) var(--boden) calc(var(--boden) + 0.3rem),
    var(--ls-ahorn) calc(var(--boden) + 0.3rem) calc(var(--boden) + 1.6rem),
    var(--ls-kante) calc(var(--boden) + 1.6rem) calc(var(--reihe) - 0.3rem),
    var(--ls-tinte) calc(var(--reihe) - 0.3rem) var(--reihe));
  border-radius: 0.8rem;
}
.ding {
  position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 0.6rem;
  width: 18rem; height: var(--boden); padding: 0.8rem 0.8rem 0.6rem;
  background: none; border: 0; border-radius: 1.6rem; color: var(--ls-tinte); font: inherit; cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.ding > * { pointer-events: none; }
.ding .material { display: flex; align-items: flex-end; justify-content: center; min-height: 6rem; }
/* Perlen so groß, dass auch der Zehnerstab in seinen Platz passt (Längen bleiben im Verhältnis) */
.ding ls-perlenstab { height: 1.5rem; }
.ding ls-wortart { height: 6.4rem; }
.ding .karte { display: grid; place-items: center; min-width: 5.6rem; height: 7rem; padding: 0 1.4rem; white-space: nowrap;
  border: var(--ls-kontur) solid var(--ls-tinte); border-radius: var(--ls-radius-klein); background: var(--ls-papier);
  font-size: 3.4rem; font-weight: 700; line-height: 1; }
.ding .karte.symbol { padding: 0; }
.ding .karte i { display: block; width: 3.2rem; height: 3.2rem; background: var(--ls-tinte); -webkit-mask: var(--bild) center / contain no-repeat; mask: var(--bild) center / contain no-repeat; }
/* Höchstens drei Zeilen; der volle Name steht im Detail und wird vorgelesen. */
.ding .name { font-size: 2.2rem; line-height: 1.15; text-align: center; hyphens: manual;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden; }
.ding:focus-visible { outline: 0.4rem solid var(--ls-tinte); outline-offset: 0.3rem; }
.ding[aria-pressed="true"], .ding.markiert { outline: 0.8rem solid var(--ls-sonne); outline-offset: 0; box-shadow: 0 0 0 1.1rem var(--ls-tinte); }

/* Detail rechts */
/* Detail: höchstens so hoch wie der Platz, darin rollt es (mehrere Spiele) */
.detail {
  align-self: start; max-height: calc(100% - 3rem); overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 1.6rem; margin-top: 0.4rem; padding: 2.8rem;
  background: var(--ls-papier); border: var(--ls-kontur) solid var(--ls-tinte); border-radius: var(--ls-radius);
}
.detail[hidden] { display: none; }
.detail .kopf { display: flex; align-items: center; gap: 1.6rem; }
.detail h2 { flex: 1; margin: 0; font-size: 3.8rem; line-height: 1.15; }
.detail h3 { margin: 0.8rem 0 0; font-size: 2.6rem; color: var(--ls-tinte-weich); font-weight: 400; }
.detail .spiele { display: flex; flex-direction: column; gap: 1.2rem; }
.detail .karten { gap: 2rem; }

.leer { display: flex; align-items: center; gap: 2rem; margin-top: 6rem; font-size: 4rem; color: var(--ls-tinte-weich); }
.leer p { margin: 0; }
.fehler { margin: 6rem 0 0; font-size: 3.6rem; color: var(--ls-tinte-weich); }

@media (max-aspect-ratio: 4/3) {
  .regal-seite { grid-template-columns: 1fr 34rem; padding-left: 3rem; gap: 2.4rem; }
  .reiter-knopf b { font-size: 3rem; }
}
</style>
</head>
<body>
<div class="hintergrund" id="hintergrund"></div>
<ls-leiste id="leiste" spiel="ansichten" titel="Mein Regal"></ls-leiste>
<main class="regal-seite">
  <div class="links">
    <div id="reiter"></div>
    <div class="bretter" id="bretter"></div>
  </div>
  <aside class="detail" id="detail" hidden aria-live="off">
    <div class="kopf"><h2 id="name" tabindex="-1"></h2>
      <ls-knopf id="hoeren" symbol="vorlesen.svg" name="Noch mal hören" groesse="klein" stumm></ls-knopf></div>
    <h3 id="spiele-titel">Nochmal spielen</h3>
    <div class="karten" id="spiele"></div>
  </aside>
</main>
<ls-anregung id="anregung"></ls-anregung>

<script type="module">
import { sperreTouch, protokoll, esc, linkKlick } from "./lernspiel.js";
import { ladeLernstand, gekonnteThemen, spieleFuer } from "./lernsteuerung.js";
import { sprich } from "./kern/stimme.js";
import { schonGesagt, merkeGesagt, vergissGesagt, sageEinmal } from "./kern/sitzung.js";
import { ladeEinstellungen, einstellung, setzeEinstellung } from "./kern/einstellungen.js";
import { neuSeit } from "./rahmen/material.js";
import "./rahmen/leiste.js";
import "./rahmen/knopf.js";
import "./rahmen/perlenstab.js";
import "./rahmen/wortart.js";
import "./rahmen/anregung.js";
import { regalBaum, reiterHtml, bretterHtml } from "./start/regal-leiste.js";
import { spielKarteHtml, echtKarteHtml } from "./start/karten.js";
import { paletteFuer, vignetteSvg } from "./start/welten.js";
import { hintergrundSvg } from "./start/hintergrund.js";

/** Merker im Profil (einstellungen): Ids, die beim letzten Besuch im Regal standen. */
const GESEHEN = "regal.gesehen";
/** So lange steht der Sonnenring an einem neuen Ding. */
const NEU_MS = 1200;

document.getElementById("hintergrund").innerHTML = hintergrundSvg();
start();

async function start() {
  sperreTouch();
  const leiste = document.getElementById("leiste");
  let ctx, stand;
  try {
    const [plan, spiele] = await Promise.all(["lernplan.json", "spiele.json"].map((d) => fetch(d).then((r) => r.json())));
    ctx = { plan, spiele };
    stand = await ladeLernstand(ctx, new Date().toLocaleDateString("sv"));
  } catch (e) { protokoll("regal: " + e); zeigeFehler(); return; }
  await Promise.all([leiste.bereit(), ladeEinstellungen()]);

  const themaNach = new Map((ctx.plan.themen ?? []).map((t) => [t.id, t]));
  const spielNach = new Map((ctx.spiele.spiele ?? []).map((s) => [s.id, s]));
  const gekonnt = gekonnteThemen(ctx, stand);
  const baum = regalBaum(gekonnteThemen(ctx, stand), ctx, spieleFuer);

  // Neu seit dem letzten Besuch (vor dem Merken lesen); gemerkt werden genau die jetzt gekonnten Ids, so fällt ein
  // zurückgesetztes Thema still heraus.
  const ids = gekonnt.map((g) => g.id), alt = einstellung(GESEHEN, null);
  const neu = new Set(neuSeit(ids, alt));
  if (!Array.isArray(alt) || alt.length !== ids.length || alt.some((id, i) => id !== ids[i])) setzeEinstellung(GESEHEN, ids);

  if (!baum.length) { leer(leiste); return; }

  // Zuerst das Fach mit Neuem, sonst das des zuletzt Gekonnten.
  const zuletzt = gekonnt[gekonnt.length - 1];
  const fachVon = (id) => baum.find((f) => f.bereiche.some((b) => b.themen.some((t) => t.id === id)))?.fach;
  // Mit ?thema (aus „Zuletzt gelernt“ auf der Startseite) öffnet das Regal an genau diesem Thema.
  const gewuenscht = new URLSearchParams(location.search).get("thema");
  const ziel = fachVon(gewuenscht) ? gewuenscht : null;
  let aktiv = fachVon(ziel) ?? fachVon([...neu][0]) ?? fachVon(zuletzt?.id) ?? baum[0].fach;

  const reiter = document.getElementById("reiter"), bretter = document.getElementById("bretter");
  const detail = document.getElementById("detail"), nameFeld = document.getElementById("name");
  const spieleFeld = document.getElementById("spiele"), spieleTitel = document.getElementById("spiele-titel");
  const hoeren = document.getElementById("hoeren");
  const anregung = document.getElementById("anregung");
  let jetzt = null;

  function zeigeFach(fach) {
    aktiv = fach;
    reiter.innerHTML = reiterHtml(baum, aktiv);
    bretter.innerHTML = bretterHtml(baum.find((f) => f.fach === aktiv), neu);
    bretter.scrollTop = 0;
    reiter.querySelectorAll(".reiter-knopf").forEach((k) => k.addEventListener("click", () => {
      if (k.dataset.fach === aktiv) return;
      const f = baum.find((x) => x.fach === k.dataset.fach);
      if (leiste.ton && f) sageEinmal(f.name, sprich);
      zeigeFach(k.dataset.fach);
    }));
    bretter.querySelectorAll(".ding").forEach((d) => d.addEventListener("click", () => { oeffne(d.dataset.thema, true); }));
    // Neues: einmal ein Sonnenring, dann still (B3)
    const neue = [...bretter.querySelectorAll(".ding.neu")];
    neue.forEach((d) => d.classList.add("markiert"));
    if (neue.length) setTimeout(() => neue.forEach((d) => d.classList.remove("markiert")), NEU_MS);
  }

  function oeffne(id, sprechen) {
    const t = baum.flatMap((f) => f.bereiche.flatMap((b) => b.themen)).find((x) => x.id === id);
    if (!t) return;
    jetzt = { ...t, sprich: String(themaNach.get(id)?.sprich ?? ""), eltern: String(themaNach.get(id)?.eltern ?? "") };
    bretter.querySelectorAll(".ding").forEach((d) => d.setAttribute("aria-pressed", String(d.dataset.thema === id)));
    nameFeld.textContent = t.name;
    // Dieselben Karten wie auf der Startseite: Spielkarte mit Vignette, dazu Mit echten Dingen
    const fach = t.strang;
    spieleFeld.innerHTML = t.spiele.map((s) => {
      const spiel = spielNach.get(s.id) ?? s;
      const palette = paletteFuer(ctx, spiel.welt);
      return spielKarteHtml({ spiel, thema: { id, name: t.name } }, fach, palette ? vignetteSvg(palette) : null);
    }).join("") + (jetzt.eltern ? echtKarteHtml({ thema: { id, name: t.name } }, fach) : "");
    spieleTitel.hidden = !t.spiele.length && !jetzt.eltern;
    spieleFeld.querySelectorAll("a.karte").forEach((a) => a.addEventListener("click", (e) => {
      if (leiste.ton) sageEinmal(a.querySelector("b").textContent, sprich);
      linkKlick(e);
    }));
    spieleFeld.querySelector(".karte.echt")?.addEventListener("click", () => {
      const t = jetzt;
      if (t?.eltern) anregung.oeffne({ titel: t.name, text: t.eltern });
    });
    detail.hidden = false;
    if (sprechen && jetzt.sprich && leiste.ton) sprich(jetzt.sprich);
  }

  hoeren.addEventListener("click", () => { if (jetzt?.sprich && leiste.ton) sprich(jetzt.sprich); });

  zeigeFach(aktiv);
  // Rechts steht gleich das Neueste dieses Fachs (ohne zu sprechen); es steht oben links.
  const imFach = baum.find((f) => f.fach === aktiv).bereiche.flatMap((b) => b.themen);
  const erstes = ziel ?? ([...neu].find((id) => imFach.some((t) => t.id === id))) ?? imFach[0].id;
  oeffne(erstes, false);
  bretter.querySelector(`.ding[data-thema="${CSS.escape(erstes)}"]`)?.scrollIntoView({ block: "nearest" });
}

function leer(leiste) {
  const bretter = document.getElementById("bretter");
  bretter.innerHTML = `<div class="leer"><p>Hier stellst du hin, was du kannst.</p>
    <ls-knopf id="leer-hoeren" symbol="vorlesen.svg" name="Noch mal hören" groesse="klein" stumm></ls-knopf></div>`;
  const merker = "regal:leer";
  const sag = () => sprich("Hier stellst du hin, was du kannst.");
  bretter.querySelector("#leer-hoeren").addEventListener("click", () => { if (leiste.ton) sag(); });
  if (leiste.ton && !schonGesagt(merker)) {
    merkeGesagt(merker);
    sag().then((r) => { if (r === "abgebrochen") vergissGesagt(merker); });
  }
}

// Lernplan oder Spiele fehlen: ein kurzer Text statt leerer Seite (nicht vorgelesen); Haus führt zurück.
function zeigeFehler() {
  const p = document.createElement("p");
  p.className = "fehler";
  p.textContent = "Das geht gerade nicht. Später noch einmal.";
  document.getElementById("bretter").replaceWith(p);
}
</script>
</body>
</html>
