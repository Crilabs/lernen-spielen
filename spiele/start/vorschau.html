<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treffpunkt – Vorschau</title>
<!-- Entwicklungsansicht der Startseiten-Szene (nicht für Kinder): ?zeit=<jahreszeit>-<tageszeit>.
     Zeigt die Szene bildfüllend und die Ränder für 16:9 und 4:3. -->
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #222; }
#s { position: absolute; inset: 0; }
#s svg { width: 100%; height: 100%; display: block; }
.rand { position: absolute; top: 0; bottom: 0; border-left: 2px dashed #fff8; border-right: 2px dashed #fff8; pointer-events: none; }
</style>
</head>
<body>
<div id="s"></div>
<div class="rand" style="left:16.667%;right:16.667%"></div>
<div class="rand" style="left:25%;right:25%"></div>
<script type="module">
import { szeneSvg } from "./szene.js";
const [jahreszeit, tageszeit] = (new URLSearchParams(location.search).get("zeit") ?? "sommer-tag").split("-");
document.getElementById("s").innerHTML = szeneSvg({ jahreszeit, tageszeit });
</script>
</body>
</html>
