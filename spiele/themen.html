<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Der Weg</title>
<link rel="stylesheet" href="rahmen/seite.css">
<style>
/* Fach-Seite: der Weg eines Fachs (Spec docs/superpowers/specs/2026-11-14-ansichten-design.md, „Fach-Seite“).
   Adresse: themen.html?fach=<id>; ohne oder mit unbekanntem Fach zurück zur Startseite.
   Der Weg läuft waagrecht von links nach rechts: gekonnte Themen (ihr Material klein und flach), das Thema „dran“
   (groß, Sonnenring), wenige „in Sicht“ (Anzahl aus der Lernsteuerung) (zart, Umriss in Naht). Alles andere bleibt verborgen
   (Lernplan-Design „Sichtbarkeit“). Keine Zahlen als Fortschritt, keine Zählung, kein Klassenbezug (N5, N8).
   Antippen einer Station öffnet die Fläche darunter: Name (vorlesbar), Spiele, Geschichte, Mit echten Dingen.
   Diese Seite liest den Lernstand nur, sie schreibt ihn nie. */
body {
  --fach-fuellung: var(--ls-papier);
  --fach-tief: var(--ls-tinte);
  --fach-toenung: var(--ls-linie);
  -webkit-user-select: none;
  user-select: none;
}

/* --- Der Weg ----------------------------------------------------------------------------------- */
.weg {
  position: absolute;
  top: 2rem;
  left: 0;
  right: 0;
  height: 30rem;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: none;
  touch-action: pan-x;
}
.weg::-webkit-scrollbar { display: none; }
/* Geht es links oder rechts weiter, läuft der Rand sanft aus (ohne zu zählen, was dort liegt). */
.weg.links { -webkit-mask-image: linear-gradient(to right, transparent, #000 14rem); mask-image: linear-gradient(to right, transparent, #000 14rem); }
.weg.rechts { -webkit-mask-image: linear-gradient(to left, transparent, #000 14rem); mask-image: linear-gradient(to left, transparent, #000 14rem); }
.weg.links.rechts {
  -webkit-mask-image: linear-gradient(to right, transparent, #000 14rem, #000 calc(100% - 14rem), transparent);
  mask-image: linear-gradient(to right, transparent, #000 14rem, #000 calc(100% - 14rem), transparent);
}
.reihe {
  position: relative;
  display: flex;
  align-items: center;
  gap: 5.6rem;
  box-sizing: border-box;
  width: max-content;
  min-width: 100%;
  height: 100%;
  margin: 0;
  padding: 0 24rem 0 8rem;
  list-style: none;
}
/* Der Pfad: eine Linie in der Füllung des Fachs wie die Linie auf dem Boden des Werkraums, auf der man geht;
   die Stationen liegen darauf. Rechts läuft sie aus (es geht weiter, ohne zu zählen). */
.reihe::before {
  content: "";
  position: absolute;
  left: 4rem;
  right: 0;
  top: calc(50% - 0.4rem);
  height: 0.8rem;
  border-radius: 999rem;
  background: var(--fach-fuellung);
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 22rem), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 22rem), transparent);
}
.reihe > li { position: relative; display: flex; }

/* Station: drückbar wie ein Nebenknopf (Papier, Tinte-Kontur, Schatten in Tinte weich), rund; mit einem
   Perlenstab wird sie so lang wie der Stab. Das Material darin ist flach (nur ansehen). */
.station {
  --d: 12rem;
  position: relative;
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: var(--d);
  min-width: var(--d);
  margin: 0;
  padding: 0 2.6rem;
  border: var(--ls-kontur) solid var(--ls-tinte);
  border-radius: 999rem;
  background: var(--ls-papier);
  color: var(--ls-tinte);
  box-shadow: var(--ls-schatten);
  font: inherit;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.station > * { pointer-events: none; }
.station ls-perlenstab { height: 2.8rem; }
.station ls-wortart { height: 6.4rem; }
.station ls-objekt { height: 6.4rem; }
.station .karte {
  box-sizing: border-box;
  display: grid;
  place-items: center;
  min-width: 8rem;
  height: 8rem;
  padding: 0 1.4rem;
  border: 0.4rem solid var(--fach-fuellung);
  border-radius: 999rem;
  font-size: 4.4rem;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
}
/* Karte ohne Graphem: das Fachsymbol in Tinte (wie die Fachkachel). */
.station .karte i {
  display: block;
  width: 4.4rem;
  height: 4.4rem;
  background: var(--ls-tinte);
  -webkit-mask: var(--bild) center / contain no-repeat;
  mask: var(--bild) center / contain no-repeat;
}
/* dran: groß, mit dem Sonnenring (hier geht es weiter). */
.station.dran {
  --d: 17rem;
  padding: 0 3.6rem;
  outline: 0.8rem solid var(--ls-sonne);
  outline-offset: 0;
  box-shadow: 0 0 0 1.1rem var(--ls-tinte), 0 1.7rem 0 0 var(--ls-neben-schatten);
}
.station.dran ls-perlenstab { height: 3.8rem; }
.station.dran ls-wortart { height: 9rem; }
.station.dran ls-objekt { height: 9rem; }
.station.dran .karte { min-width: 11rem; height: 11rem; font-size: 6rem; border-width: 0.5rem; }
.station.dran .karte i { width: 6rem; height: 6rem; }
/* in Sicht: zart, Umriss und Schatten in Naht, die Karte des Themas in Tinte weich. */
.station.in-sicht {
  border-color: var(--ls-naht);
  box-shadow: 0 0.6rem 0 var(--ls-naht);
  color: var(--ls-tinte-weich);
}
/* Die Karte in Sicht: Rand in Naht statt Fachfarbe, Graphem und Fachsymbol in Tinte weich. */
.station.in-sicht .karte { border-color: var(--ls-naht); }
.station.in-sicht .karte i { background: var(--ls-tinte-weich); }

/* Gedrückt sinkt jede Station ein; die offene bleibt eingesunken (sie gehört zur Fläche darunter). */
.station:active, .station[aria-expanded="true"] { transform: translateY(var(--ls-kontur)); box-shadow: var(--ls-schatten-unten); }
.station.in-sicht:active, .station.in-sicht[aria-expanded="true"] { box-shadow: 0 0.3rem 0 var(--ls-naht); }
.station.dran:active, .station.dran[aria-expanded="true"] { box-shadow: 0 0 0 1.1rem var(--ls-tinte), 0 1.4rem 0 0 var(--ls-neben-schatten); }
.station:focus-visible { outline: 0.5rem solid var(--ls-tinte); outline-offset: 0.8rem; }
.station.dran:focus-visible { outline-color: var(--ls-sonne); outline-width: 0.8rem; outline-offset: 0; }

/* Ladefehler: ein kurzer Satz auf Papier, flach. */
.fehler {
  position: absolute;
  top: 8rem;
  left: 50%;
  transform: translateX(-50%);
  margin: 0;
  padding: 2.4rem 4rem;
  background: var(--ls-papier);
  border: var(--ls-kontur) solid var(--ls-tinte);
  border-radius: var(--ls-radius-gross);
  font-size: 4rem;
  white-space: nowrap;
}

/* --- Fläche eines Themas ----------------------------------------------------------------------- */
.flaeche {
  position: absolute;
  top: 36rem;
  left: 2.4rem;
  right: 2.4rem;
  box-sizing: border-box;
  max-height: calc(100% - 38.4rem);
  padding: 3.2rem 4rem 4rem;
  background: var(--ls-papier);
  border: var(--ls-kontur) solid var(--ls-tinte);
  border-radius: var(--ls-radius-gross);
  animation: auf 0.16s ease-out;
}
.flaeche[hidden] { display: none; }
@keyframes auf { from { opacity: 0; } }
/* Zeiger nach oben zur offenen Station (folgt ihr beim Verschieben des Wegs). */
.zeiger {
  position: absolute;
  top: -2.2rem;
  left: calc(var(--zeiger, 12rem) - 2rem);
  width: 4rem;
  height: 4rem;
  background: var(--ls-papier);
  border-left: var(--ls-kontur) solid var(--ls-tinte);
  border-top: var(--ls-kontur) solid var(--ls-tinte);
  border-top-left-radius: 0.6rem;
  transform: rotate(45deg);
}
.zeiger[hidden] { display: none; }
.kopf {
  display: flex;
  align-items: center;
  gap: 2.4rem;
  min-height: 11rem;
}
.kopf h2 {
  margin: 0;
  min-width: 0;
  font-size: 5.2rem;
  line-height: 1.2;
  font-weight: 700;
  overflow-wrap: anywhere;
}
.kopf .echt { margin-left: auto; }
.spiele {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 3.2rem;
  margin-top: 3.2rem;
}
.spiele:empty { display: none; }
/* Spiel-Kachel: ein Link, drückbar (Schatten); Spielsymbol auf einem Feld in der Füllung des Fachs mit
   Tinte-Kontur (wie die Fachkachel und die Dran-Kachel der Startseite), Name daneben. */
.spiel {
  box-sizing: border-box;
  display: inline-flex;
  align-items: center;
  gap: 2.4rem;
  min-height: 16rem;
  min-width: 40rem;
  padding: 2rem 4rem 2rem 2rem;
  background: var(--ls-papier);
  border: var(--ls-kontur) solid var(--ls-tinte);
  border-radius: var(--ls-radius);
  box-shadow: var(--ls-schatten);
  color: var(--ls-tinte);
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}
.spiel:active { transform: translateY(var(--ls-kontur)); box-shadow: var(--ls-schatten-unten); }
.spiel:focus-visible { outline: 0.5rem solid var(--ls-tinte); outline-offset: 0.8rem; }
.spiel .ico {
  flex: none;
  box-sizing: border-box;
  width: 12rem;
  height: 12rem;
  padding: 1.8rem;
  border: var(--ls-kontur) solid var(--ls-tinte);
  border-radius: var(--ls-radius-klein);
  background: var(--fach-fuellung);
}
.spiel .ico img { display: block; width: 100%; height: 100%; }
.spiel b { font-size: 4rem; line-height: 1.15; }
</style>
</head>
<body>
<ls-leiste id="leiste" spiel="ansichten"></ls-leiste>
<main class="buehne">
  <div class="spielflaeche">
    <div class="weg" id="weg"><ol class="reihe" id="reihe"></ol></div>
    <section class="flaeche" id="flaeche" hidden aria-labelledby="name">
      <span class="zeiger" aria-hidden="true"></span>
      <div class="kopf">
        <h2 id="name"></h2>
        <ls-knopf id="hoeren" symbol="vorlesen.svg" name="Noch mal hören" groesse="klein" stumm></ls-knopf>
        <ls-knopf id="echt" class="echt" symbol="hand.svg" wort="Mit echten Dingen" hidden></ls-knopf>
      </div>
      <div class="spiele" id="spiele"></div>
    </section>
  </div>
</main>
<ls-anregung id="anregung"></ls-anregung>

<!-- Figuren nur für die Geschichten (Einführungen der Themen), kein Maskottchen -->
<script src="figuren/figuren.js"></script>
<script src="figuren/einhorn.js"></script>
<script type="module">
import { sperreTouch, protokoll, esc, linkKlick } from "./lernspiel.js";
import { uebersicht, ladeLernstand, gekonnteThemen, themaMaterial, spieleFuer } from "./lernsteuerung.js";
import { spieleEinfuehrung } from "./einfuehrung.js";
import { sprich, stille } from "./kern/stimme.js";
import { schonGesagt, merkeGesagt, vergissGesagt, sageEinmal } from "./kern/sitzung.js";
import { FACH } from "./rahmen/stil.js";
import { materialFuer, bausteinHtml } from "./rahmen/material.js";
import "./rahmen/leiste.js";
import "./rahmen/knopf.js";
import "./rahmen/perlenstab.js";
import "./rahmen/wortart.js";
import "./objekte/objekt.js";
import "./rahmen/anregung.js";

const ZUSTAND = { "kann-ich": "kann ich", dran: "dran", "in-sicht": "in Sicht" };
const fach = new URLSearchParams(location.search).get("fach") ?? "";
if (!Object.hasOwn(FACH, fach)) location.replace("index.html");
else start();

async function start() {
  sperreTouch();
  const leiste = document.getElementById("leiste");
  const f = FACH[fach];
  document.body.style.cssText = `--fach-fuellung:${f.fuellung};--fach-tief:${f.tief};--fach-toenung:${f.toenung}`;
  leiste.setAttribute("fach", fach);

  let ctx, stand;
  try {
    const [plan, spiele] = await Promise.all(["lernplan.json", "spiele.json"].map((d) => fetch(d).then((r) => r.json())));
    ctx = { plan, spiele };
    stand = await ladeLernstand(ctx, new Date().toLocaleDateString("sv"));
  } catch (e) { protokoll("themen: " + e); zeigeFehler(); return; }
  const kategorie = (ctx.spiele.kategorien ?? []).find((k) => k.id === fach);
  leiste.setAttribute("titel", kategorie?.name ?? fach);
  await leiste.bereit();

  const spielNach = new Map((ctx.spiele.spiele ?? []).map((s) => [s.id, s]));
  const themaNach = new Map((ctx.plan.themen ?? []).map((t) => [t.id, t]));

  // Stationen in der Reihenfolge des Wegs: gekonnt (wie sie gekonnt wurden), dran, in Sicht (Planreihenfolge).
  // Gekonnte Themen kommen aus dem Stand, auch ohne Spiel; dran und in Sicht gibt es nur mit Spiel (uebersicht).
  const offen = uebersicht(ctx, stand).find((w) => w.strang === fach)?.stationen ?? [];
  const stationen = [
    ...gekonnteThemen(ctx, stand).filter((t) => t.strang === fach).map((t) => ({ id: t.id, zustand: "kann-ich", material: t })),
    ...offen.filter((s) => s.zustand === "dran").map((s) => ({ id: s.id, zustand: "dran", material: themaMaterial(ctx, s.id) })),
    // wie viele in Sicht sind, begrenzt die Lernsteuerung (K.IN_SICHT in sichtbar())
    ...offen.filter((s) => s.zustand === "in-sicht")
      .map((s) => ({ id: s.id, zustand: "in-sicht", material: themaMaterial(ctx, s.id) })),
  ].map((s) => {
    const t = themaNach.get(s.id) ?? {};
    return { ...s, name: String(t.name ?? ""), sprich: String(t.sprich ?? ""), eltern: String(t.eltern ?? ""),
      spiele: spieleFuer(ctx, s.id).map((id) => spielNach.get(id)).filter(Boolean),
      geschichte: stand?.themen?.[s.id]?.e && t.einfuehrung?.vorlage ? t.einfuehrung : null };
  });

  // Ohne eine einzige Station gäbe es nur eine leere Wegzeile: zurück zur Startseite, wie bei unbekanntem Fach.
  if (!stationen.length) { location.replace("index.html"); return; }

  const weg = document.getElementById("weg"), reihe = document.getElementById("reihe");
  reihe.innerHTML = stationen.map((s, i) => `<li><button class="station ${s.zustand}" type="button" data-i="${i}"
    aria-label="${esc(s.name + ", " + ZUSTAND[s.zustand])}"${s.zustand === "dran" ? ' aria-current="step"' : ""} aria-expanded="false" aria-controls="flaeche">${zeichen(s)}</button></li>`).join("");
  const knoepfe = [...reihe.querySelectorAll(".station")];

  const flaeche = document.getElementById("flaeche"), zeiger = flaeche.querySelector(".zeiger");
  const nameFeld = document.getElementById("name"), spieleFeld = document.getElementById("spiele");
  const hoeren = document.getElementById("hoeren"), echt = document.getElementById("echt");
  const anregung = document.getElementById("anregung");
  let jetzt = null; // offene Station

  function zeigeZeiger() {
    const knopf = jetzt && knoepfe[stationen.indexOf(jetzt)];
    if (!knopf || flaeche.hidden) return;
    const r = knopf.getBoundingClientRect(), w = flaeche.getBoundingClientRect();
    const x = r.left + r.width / 2 - w.left, rand = 5 * remPx();
    zeiger.hidden = x < rand || x > w.width - rand; // Station aus dem Bild geschoben: kein Zeiger ins Leere
    flaeche.style.setProperty("--zeiger", x + "px");
  }

  function oeffne(s) {
    jetzt = s;
    knoepfe.forEach((k, i) => k.setAttribute("aria-expanded", String(stationen[i] === s)));
    nameFeld.textContent = s.name;
    echt.hidden = !s.eltern;
    spieleFeld.innerHTML = s.spiele.map((sp) => `<a class="spiel" href="${esc(sp.datei)}?thema=${encodeURIComponent(s.id)}"
        aria-label="${esc(sp.titel)}"><span class="ico"><img src="${esc(sp.symbol)}" alt=""></span><b>${esc(sp.titel)}</b></a>`).join("")
      + (s.geschichte ? `<ls-knopf class="geschichte" symbol="buch.svg" wort="Geschichte ansehen"></ls-knopf>` : "");
    spieleFeld.querySelectorAll("a.spiel").forEach((a, i) => a.addEventListener("click", (e) => {
      // Name beim ersten Tippen; ein Link wechselt sofort (der Name gilt als gesagt, sobald er beginnt).
      if (leiste.ton) sageEinmal(s.spiele[i].titel, sprich);
      linkKlick(e);
    }));
    spieleFeld.querySelector(".geschichte")?.addEventListener("click", () => {
      stille();
      // nur ansehen: der Lernstand bleibt, wie er ist
      spieleEinfuehrung(s.geschichte.vorlage, s.geschichte.werte || {}, { ton: leiste.ton });
    });
    flaeche.hidden = false;
    zeigeZeiger();
  }

  // Name des Themas beim ersten Antippen je Sitzung, wie sageEinmal (kern/sitzung.js), aber je Thema gemerkt:
  // viele Themen teilen dasselbe sprich („Zerlegen“). Bricht anderer Inhalt ihn ab, kommt er beim nächsten Tippen.
  async function sagThema(s) {
    const merker = "thema:" + s.id;
    if (!leiste.ton || !s.sprich || schonGesagt(merker)) return;
    merkeGesagt(merker);
    if ((await sprich(s.sprich)) === "abgebrochen") vergissGesagt(merker);
  }

  knoepfe.forEach((k, i) => k.addEventListener("click", () => {
    const s = stationen[i];
    if (jetzt !== s) oeffne(s);
    sagThema(s);
  }));
  hoeren.addEventListener("click", () => { if (jetzt?.sprich && leiste.ton) sprich(jetzt.sprich); });
  echt.addEventListener("click", () => {
    if (jetzt?.eltern) anregung.oeffne({ titel: jetzt.name, text: jetzt.eltern });
  });

  // Beim Öffnen ist das erste Thema „dran“ (sonst das erste in Sicht) schon aufgeschlagen, ohne zu sprechen, und
  // steht in der Mitte des Wegs; gibt es keins, steht der Weg am rechten Ende (zuletzt gekonnt).
  const erstes = stationen.find((s) => s.zustand === "dran") ?? stationen.find((s) => s.zustand === "in-sicht");
  if (erstes) {
    const li = knoepfe[stationen.indexOf(erstes)].parentElement; // offsetParent des li ist die Reihe
    weg.scrollLeft = li.offsetLeft + li.offsetWidth / 2 - weg.clientWidth / 2;
    oeffne(erstes);
  } else weg.scrollLeft = weg.scrollWidth;
  const raender = () => {
    weg.classList.toggle("links", weg.scrollLeft > 1);
    weg.classList.toggle("rechts", weg.scrollLeft + weg.clientWidth < weg.scrollWidth - 24 * remPx());
    zeigeZeiger();
  };
  weg.addEventListener("scroll", raender, { passive: true });
  addEventListener("resize", raender);
  raender();
}

// Lernplan oder Spiele fehlen: ein kurzer Text statt leerer Seite (nicht vorgelesen); Haus führt zurück.
function zeigeFehler() {
  const p = document.createElement("p");
  p.className = "fehler";
  p.textContent = "Das geht gerade nicht. Später noch einmal.";
  document.getElementById("weg").replaceWith(p);
}

function remPx() {
  return parseFloat(getComputedStyle(document.documentElement).fontSize) || 10;
}

// Zeichen einer Station: gekonnt und dran zeigen ihr Lernmaterial (materialFuer). In Sicht immer eine Karte nach
// derselben Regel (material.js): das Graphem nur bei Buchstabenthemen, sonst das Fachsymbol; zart über die CSS.
function zeichen(s) {
  const m = s.material ? materialFuer(s.material) : { baustein: "karte", wert: "", fach };
  if (s.zustand === "in-sicht" && m.baustein !== "karte") return bausteinHtml({ baustein: "karte", wert: "", fach });
  return bausteinHtml(m);
}
</script>
</body>
</html>
