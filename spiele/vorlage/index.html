<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Spielvorlage</title>
<!-- Spielvorlage. Die Schritte zum eigenen Spiel stehen oben in spiel.js. Diese Seite bleibt dünn:
     Markup, Grundstil (rahmen/seite.css), ein paar Zeilen Anordnung, ein Modul. -->
<link rel="stylesheet" href="../rahmen/seite.css">
<style>
  /* ===== SPIELWELT (ersetzen): Welt und Anordnung des Lernfelds. Alles in rem (1rem = Bildhöhe/108). =====
     Rahmen-Teile (Kopfleiste, Hilfe, Pause) stehen selbst an ihren festen Plätzen; hier nur das Spielfeld. */

  /* Welt: Werkstatt (Farbwelt 6.2), ein Tisch, auf dem Matte und Tablett liegen. Verläufe nur hier. */
  .welt { background: linear-gradient(#EFE7DD 0 58%, #D9C7B3 58% 100%); }

  /* Spielfeld unter der Kopfleiste: oben die Blase, in der Mitte die Arbeit, unten frei (Hilfe, Rand). */
  .spielflaeche {
    display: grid;
    grid-template-rows: auto 1fr 11rem;
    justify-items: center;
    row-gap: 2.4rem;
    padding: 2.4rem 2.4rem 2.4rem;
  }
  ls-blase { width: min(130rem, 100%); }
  .arbeit { display: flex; align-items: center; justify-content: center; gap: 5rem; min-height: 0; }

  /* Perlenstab: Dicke 7 rem; d = Perlendurchmesser (Stab-Höhe / 1,4, perlen-geometrie.js HOEHE). */
  .buehne { --stab: 7rem; --d: calc(var(--stab) / 1.4); }
  ls-perlenstab { height: var(--stab); }
  .matte ls-perlenstab { justify-self: start; }

  /* Matte: links die Ziffer, rechts der lange Stab und darunter die Rinne, bündig an der ersten Perle. */
  .matte { display: grid; grid-template-columns: 9rem auto; align-items: center; column-gap: 2rem; row-gap: 2.4rem; padding: 4.4rem 5rem; }
  .matte .ziffer { font-size: 7rem; font-weight: 700; line-height: 1; text-align: center; }
  .rinne {
    box-sizing: content-box;
    display: flex;
    align-items: center;
    width: calc(var(--laenge) * var(--d));
    height: var(--stab);
    padding: 2rem 0;
    margin-left: -0.3rem;
    background: var(--ls-nebel);
    border: var(--ls-kontur) solid var(--ls-naht);
    border-radius: var(--ls-radius-klein);
  }
  .rinne .frei { flex: 1 1 auto; align-self: stretch; border-radius: 1rem; }
  .gleichung { grid-column: 1 / -1; justify-self: center; min-height: 7rem; font-size: 6rem; font-weight: 700; line-height: 1; }

  /* Tablett: der Vorrat an Stäben, gemischt (die Paare liegen nicht nebeneinander). */
  .tablett { display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 2.4rem 3rem; width: 94rem; min-height: 40rem; padding: 4.4rem; }

  /* Stab als Teil: Papierkarte mit Schatten (drückbar), Tippfläche 11 rem (Grundmaß in seite.css,
     ls-perlenstab.teil). In der Rinne flach und ohne Karte. */
  .rinne .stab.teil { height: var(--stab); min-width: 0; min-height: 0; padding: 0; border: 0; border-radius: 0; background: none; box-shadow: none; }
  .rinne .stab.teil + .stab.teil { margin-left: var(--fuge, 0rem); }

  /* Pause: Sachmoment auf der Papierkarte. */
  .sachmoment { display: grid; justify-items: center; gap: 3rem; max-width: 110rem; font-size: 4rem; text-align: center; }
  .sachmoment .hinweis {
    display: inline-flex; align-items: center; gap: 2.4rem; min-height: 11rem; padding: 1.6rem 4rem 1.6rem 1.6rem;
    border: var(--ls-kontur) solid var(--ls-tinte); border-radius: var(--ls-radius); background: var(--ls-papier);
    box-shadow: var(--ls-schatten); color: var(--ls-tinte); font-weight: 700; text-decoration: none;
  }
  .sachmoment .hinweis img { width: 8rem; height: 8rem; }
  .sachmoment .hinweis:active { transform: translateY(0.3rem); box-shadow: var(--ls-schatten-unten); }

  /* Elternansicht (?eltern): ruhige Textseite über allem, Text darf markiert werden. */
  .eltern { position: fixed; inset: 0; z-index: 200; overflow: auto; padding: 6rem 8rem; background: var(--ls-papier); }
  .eltern h1 { margin: 0 0 3rem; font-size: 6rem; }
  .eltern p { max-width: 70ch; }
  .eltern .beschreibung { margin: 0 0 3rem; color: var(--ls-tinte-weich); }
  .eltern a { color: var(--ls-tinte); font-weight: 700; }
</style>
</head>
<body>
<!-- Stimmungsebene: ganzer Bildschirm, hinter allem. -->
<div class="welt" aria-hidden="true"></div>

<!-- Kopfleiste: spiel = Kennung (wie in spiele.json), fach, titel. Das Thema setzt spiel.js. -->
<ls-leiste id="leiste" spiel="vorlage" fach="mathe" titel="Spielvorlage">
  <!-- Einführung wieder ansehen (docs/spielbau.md §8); erscheint, wenn das Thema eine Einführung hat -->
  <ls-knopf slot="rechts" id="anleitung" symbol="buch.svg" name="Anleitung" hidden></ls-knopf>
</ls-leiste>

<!-- Bedeutungsebene: das sichere Feld 192 × 108 rem; das Spielfeld beginnt unter der Kopfleiste. -->
<div class="buehne">
  <main class="spielflaeche">
    <ls-blase id="blase"></ls-blase>
    <div class="arbeit">
      <section class="lernfeld matte" id="matte" aria-label="Matte"></section>
      <section class="tablett" id="tablett" aria-label="Tablett"></section>
    </div>
  </main>
</div>

<ls-hilfe id="hilfe"></ls-hilfe>
<ls-pause id="pause"><div class="sachmoment" id="sachmoment"></div></ls-pause>

<script type="module" src="spiel.js"></script>
</body>
</html>
