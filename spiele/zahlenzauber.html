<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Einhorn-Zahlenzauber</title>
<link rel="stylesheet" href="schrift/schrift.css">
<style>
:root{--sky:#D8F3FF;--lila:#B59CFF;--rosa:#FF8ACB;--mint:#7FE8C8;--sonne:#FFD95A;--nacht:#3B2A6B;--petal:#ffffff;--paper:#FFF8FC;
  --faden:#B59CFF;--wiese1:#BDEB9C;--wiese2:#8ED07A;--punkt-a:#FF8ACB;--punkt-b:#8C6CF0;--leer:rgba(59,42,107,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#2A2550;--paper:#2F2A5A;--nacht:#F6EEFF;--petal:#45407A;--wiese1:#4F8A55;--wiese2:#3B6E44;--leer:rgba(246,238,255,.12)}}
:root[data-theme="dark"]{--sky:#2A2550;--paper:#2F2A5A;--nacht:#F6EEFF;--petal:#45407A;--wiese1:#4F8A55;--wiese2:#3B6E44;--leer:rgba(246,238,255,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Baloo 2","Comic Sans MS","Arial Rounded MT Bold",sans-serif;color:var(--nacht);background:var(--sky);overflow-x:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.app{min-height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.top{display:flex;justify-content:space-between;align-items:center}
.rund{width:44px;height:44px;border-radius:50%;border:0;background:var(--paper);font-size:22px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 0 rgba(59,42,107,.15);cursor:pointer;text-decoration:none;color:inherit}
.screen{display:none;flex-direction:column;align-items:center;gap:12px;text-align:center}.screen.on{display:flex}
h1{font-size:2.1rem;line-height:1.1;font-weight:800}
.lead{font-size:1.15rem;font-weight:600;max-width:30ch}
.btn{border:0;border-radius:999px;padding:14px 28px;font:800 1.2rem "Baloo 2",sans-serif;color:#fff;background:var(--lila);cursor:pointer;box-shadow:0 6px 0 #7A5FD1}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #7A5FD1}
.btn.pink{background:var(--rosa);box-shadow:0 6px 0 #D45A9E}
.btn.big{font-size:1.5rem;padding:16px 38px}
.btn:focus-visible,.petal:focus-visible,.rund:focus-visible{outline:4px solid var(--sonne);outline-offset:3px}

/* Wiese */
.wiese{position:relative;width:100%;border-radius:22px;overflow:hidden;background:linear-gradient(#CFEFFF 0 45%,var(--wiese1) 45%,var(--wiese2));flex:none}
.wiese.klein{height:78px}
.wiese.gross{height:260px}
.wiese .w{position:absolute;transform:translate(-50%,-100%)}
.wiese .name{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-size:.75rem;font-weight:800;white-space:nowrap;background:rgba(255,248,252,.8);border-radius:8px;padding:0 6px;color:#3B2A6B}
.wiese .neu{animation:spriessen .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes spriessen{from{transform:translate(-50%,-100%) scale(0)}}

/* Blüte */
.talk{background:var(--paper);border-radius:20px;padding:8px 14px;font-weight:800;font-size:1.1rem;min-height:2.6em;display:flex;align-items:center;justify-content:center;width:100%}
.flower{position:relative;width:min(86vw,340px);height:min(86vw,340px);margin:0 auto}
.faeden{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.faeden path{fill:none;stroke-linecap:round;transition:opacity .4s}
.faeden .geprueft{stroke:var(--faden);stroke-width:1.3}
.faeden .alt{stroke:var(--faden);stroke-width:1;opacity:.28}
.faeden .aktiv{stroke:var(--rosa);stroke-width:2.2}
.faeden .loesung{stroke:var(--sonne);stroke-width:2.6}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:38%;height:38%;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fff,#FFE58F);display:flex;align-items:center;justify-content:center;z-index:2}
.center .figbox{width:92%;margin-top:-6%}
.petal{position:absolute;width:24%;height:24%;border-radius:50%;border:0;background:var(--petal);z-index:3;
  font:800 clamp(28px,9vw,42px) "Baloo 2",sans-serif;color:var(--nacht);cursor:pointer;box-shadow:0 6px 0 rgba(59,42,107,.18);
  transition:transform .15s,box-shadow .15s,opacity .4s;touch-action:manipulation}
.petal.anker{box-shadow:0 6px 0 rgba(59,42,107,.18),0 0 0 6px var(--sonne);animation:pulse 1.6s ease-in-out infinite}
.petal.sel{background:#FFE2F2;transform:translateY(-4px) scale(1.06);box-shadow:0 8px 0 #D45A9E,0 0 0 5px var(--rosa)}
.petal.zeig{background:var(--sonne);transform:scale(1.12)}
.petal.wackel{animation:wobble .45s}
.petal.weg{transform:scale(0);opacity:0;pointer-events:none}
.petal.aus{opacity:.35;pointer-events:none}
.flower.bluehen .petal{animation:bluehen .7s ease-out}
@keyframes bluehen{40%{transform:scale(1.18) rotate(8deg)}}
@keyframes pulse{50%{box-shadow:0 6px 0 rgba(59,42,107,.18),0 0 0 11px rgba(255,217,90,.55)}}
@keyframes wobble{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.hand{position:absolute;z-index:5;font-size:40px;pointer-events:none;transform:translate(-20%,10%);animation:tippen 1.1s ease-in-out infinite}
@keyframes tippen{50%{transform:translate(-20%,-10%) scale(.9)}}

/* Rechenzeile + Punkte */
.zeile{display:flex;align-items:center;justify-content:center;gap:12px;min-height:58px;width:100%}
.rechnung{font-size:2.1rem;font-weight:800;letter-spacing:1px}
.rechnung .fr{color:var(--rosa)}
.weiter{border:0;border-radius:999px;padding:10px 18px;font:800 1.1rem "Baloo 2",sans-serif;background:var(--paper);color:var(--nacht);
  box-shadow:0 5px 0 rgba(59,42,107,.2);cursor:pointer}
.weiter:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(59,42,107,.2)}
.feld{display:flex;flex-direction:column;gap:6px;align-items:center;min-height:20px}
.reihe{display:flex;gap:4px}
.reihe .luecke{width:8px}
.dot{width:15px;height:15px;border-radius:50%;background:var(--leer);transition:background .15s,opacity .4s,transform .4s}
.dot.a{background:var(--punkt-a)}.dot.b{background:var(--punkt-b)}
.dot.fort{opacity:.12;transform:scale(.6)}
.stangen{display:flex;gap:5px;align-items:flex-end;flex-wrap:wrap;justify-content:center;max-width:100%}
.stange{width:12px;height:84px;border-radius:6px;background:var(--punkt-a);background-image:repeating-linear-gradient(transparent 0 7px,rgba(255,255,255,.55) 7px 8.4px)}
.stange.b{background-color:var(--punkt-b)}
.einzel{display:flex;flex-direction:column-reverse;gap:3px}
.stangen .dot{width:12px;height:12px}

/* Eltern */
.eltern{text-align:left;align-items:stretch;font-size:1rem}
.eltern h2{font-size:1.3rem;margin-top:8px}
.eltern li{list-style:none;padding:3px 0;border-bottom:1px solid rgba(59,42,107,.1)}
.eltern small{opacity:.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <a class="rund" href="index.html" aria-label="Alle Spiele">🏠</a>
    <button class="rund" id="snd" aria-label="Ton an oder aus">🔊</button>
  </div>

  <section class="screen on" id="start">
    <div class="wiese gross" id="startWiese"></div>
    <h1>Zahlenzauber</h1>
    <p class="lead">Welche zwei Zahlen ergeben zusammen eine dritte?</p>
    <button class="btn big pink" id="go">Los geht's!</button>
  </section>

  <section class="screen" id="spiel">
    <div class="wiese klein" id="spielWiese"></div>
    <div class="talk" id="talk"></div>
    <div class="flower" id="flower">
      <svg class="faeden" id="faeden" viewBox="0 0 100 100" aria-hidden="true"></svg>
      <div class="center"><div class="figbox" id="begleiter"></div></div>
    </div>
    <div class="zeile"><div class="rechnung" id="rechnung"></div><button class="weiter" id="weiter" hidden>nicht dabei ➜</button></div>
    <div class="feld" id="feld"></div>
  </section>

  <section class="screen" id="pause">
    <div class="wiese gross" id="pauseWiese"></div>
    <p class="lead" id="pauseText"></p>
    <button class="btn big pink" id="nochmal">Noch eine Runde</button>
  </section>

  <section class="screen eltern" id="eltern"></section>
</div>

<script src="figuren/figuren.js"></script>
<script type="module">
import {lade, speichere, sperreTouch, esc} from "./lernspiel.js";
sperreTouch();
(async function(){
  // ---------- Einstellungen ----------
  // Stufen: max = Zahlenraum, minus = nach dem Erblühen manchmal eine Minus-Aufgabe, schnell = Median-Zeit (ms) einer
  // fehlerfreien Blüte, ab der die Stufe auch ohne Vergleich mit dem Anfang als „schnell“ gilt.
  const STUFEN = [
    {max:10,  minus:false, schnell:12000},
    {max:20,  minus:false, schnell:16000},
    {max:20,  minus:true,  schnell:16000},
    {max:30,  minus:true,  schnell:20000},
    {max:100, minus:true,  schnell:30000}];
  const UEBERGANG_AB = 20;     // Aufgaben mit Summe über dieser Zahl nur ohne Zehnerübergang der Einer (z. B. 34 + 25, nicht 38 + 25)
  const RUNDE = 5;             // Blüten je Runde
  const EINSTIEG = 6;          // so viele Blüten je Stufe mit 4 Zahlen, danach 5
  const P_MINUS = 0.5;         // Anteil der Blüten mit Minus-Nachspiel (nur in Minus-Stufen)
  const ABSTAND = [0, 1, 3, 7, 21];   // Wiedervorlage über Tage, wie im Wimmelbild
  const GELERNT = 4;
  const ANTEIL_FAELLIG = 0.7;
  const WIEDER_NACH = 2;
  const WIEDER_MAX = 2;        // höchstens so viele Wiederholungs-Blüten nach der Runde       // falsch gelöste Aufgabe kommt in der Runde nach so vielen Blüten noch einmal
  // Aufstieg: letzte AUF_N Blüten (mit 5 Zahlen) der Stufe ≥ AUF_QUOTE fehlerfrei, aus ≥ AUF_TAGE Tagen,
  // und Median-Zeit ≤ AUF_FAKTOR × Median der ersten AUF_N Blüten (oder ≤ schnell der Stufe).
  const AUF_N = 10, AUF_QUOTE = 0.8, AUF_TAGE = 2, AUF_FAKTOR = 0.7;
  const P_BESUCH = 0.25;       // nach einer Runde: so wahrscheinlich kommt jemand auf die Wiese …
  const BESUCH_ABSTAND = 3;    // … frühestens nach so vielen Runden seit dem letzten Besuch
  const P_EINZUG = 0.4;        // Anteil der Besuche, bei denen ein neues Einhorn einzieht (sonst besucht ein Tier)
  const ANLEITUNG = 3;         // so viele Blüten überhaupt mit Zeige-Hand und ausführlicher Ansage
  const LANG_MS = 550;         // langes Drücken = neue Start-Blüte
  const EINHOERNER = [         // aus dem alten Stall, Reihenfolge wie dort
    ["Luna","#ffffff"],["Regenbogen-Rosi","#FFD6EC"],["Sternchen","#FFF3B0"],["Zuckerwolke","#E8DEFF"],
    ["Blütenfee","#FFE3F1"],["Glitzi","#D6F4FF"],["Lolli","#FFD1DC"],["Mondlicht","#DCD6F7"],
    ["Flatterli","#DDF6E5"],["Erdbeerchen","#FFC9C9"],["Schneeflocke","#EEF7FF"],["Königin Perla","#FFEFD6"]];
  const BLUMENFARBEN = ["#FF9ECF","#B59CFF","#FFD95A","#8AD1FF","#FFB27F","#FF8A8A","#ffffff"];
  const BESUCHER = ["hase","igel","eule","ente","frosch","maus","katze"];

  const $ = id => document.getElementById(id);
  const wait = ms => new Promise(r=>setTimeout(r,ms));
  const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const median = a => { if(!a.length) return Infinity; const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
  const params = new URLSearchParams(location.search);
  const F = window.Figuren;
  const load = src => new Promise(r=>{ const s=document.createElement("script"); s.src=src; s.onload=s.onerror=r; document.head.appendChild(s); });
  await Promise.all(["einhorn","blume",...BESUCHER].map(id=>load("figuren/"+id+".js")));

  // ---------- Speichern (lernspiel.js: Tauri-Datei oder localStorage "lernstand-zahlenzauber") ----------
  let save = await lade("zahlenzauber", {fakten:{}, verlauf:[], stufe:0, einhoerner:1, wiese:0, runden:0, letzterBesuch:0, anleitung:0});
  if(Array.isArray(save.fakten)) save.fakten={};
  if(!Array.isArray(save.verlauf)) save.verlauf=[];
  function persist(){ speichere("zahlenzauber", save); }
  persist();

  // Lernstand je Aufgabe ("3+9", "12-9"): {f: Fach, t: Tag, h: letzte 6 (1/0)}
  const heute = () => new Date().toLocaleDateString("sv");
  const tage = (a,b) => a ? Math.round((Date.parse(b)-Date.parse(a))/864e5) : 999;
  const eintrag = s => save.fakten[s] || {f:0, t:"", h:[]};
  const faellig = s => { const e=eintrag(s); return e.f===0 || tage(e.t, heute()) >= ABSTAND[Math.min(e.f, ABSTAND.length-1)]; };
  function record(s, richtig){
    const e=save.fakten[s]||(save.fakten[s]={f:0,t:"",h:[]});
    e.h.push(richtig?1:0); if(e.h.length>6) e.h.shift();
    if(!richtig){ e.f=0; e.t=heute(); }
    else if(faellig(s)){ e.f=Math.min(e.f+1, GELERNT); e.t=heute(); }
    persist();
  }

  // ---------- Ton und Stimme (gleiche Stimmwahl wie Wimmelbild, Einstellung „einhorn-stimme“ gilt für alle Spiele) ----------
  let sound = true; try{ sound = localStorage.getItem("zahlenzauber-ton")!=="aus"; }catch(e){}
  const sndBtn=$("snd"); const showSnd=()=>sndBtn.textContent=sound?"🔊":"🔈"; showSnd();
  sndBtn.addEventListener("click",()=>{ sound=!sound; showSnd(); try{ localStorage.setItem("zahlenzauber-ton",sound?"an":"aus"); }catch(e){} if(!sound) window.speechSynthesis?.cancel(); });
  let actx;
  function tone(f1,f2,dur,type="sine",vol=.15){ if(!sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime; o.type=type;
    o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur*.8);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02); }catch(e){} }
  const sfx = {
    tipp: ()=>tone(700,1000,.08,"sine",.08),
    faden: ()=>tone(520,780,.14,"triangle",.1),
    hm: ()=>{ tone(330,260,.18,"triangle",.14); setTimeout(()=>tone(300,380,.2,"triangle",.12),170); },
    bluehen: ()=>[0,110,220].forEach((d,i)=>setTimeout(()=>tone(660+i*220,900+i*260,.14,"sine",.09),d)),
    happs: ()=>{ tone(600,200,.15,"square",.06); setTimeout(()=>tone(300,700,.12,"sine",.1),140); }
  };
  const SCHLECHT = /eddy|flo\b|grandma|grandpa|oma|opa|reed|rocko|sandy|shelley|eloquence|albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|kathy|ralph|novelty/i;
  function stimmWert(v){ const n=v.name+" "+v.voiceURI; if(SCHLECHT.test(n)) return -1; let w=0;
    if(/premium/i.test(n)) w+=40; else if(/enhanced|erweitert|verbessert|natural|neural/i.test(n)) w+=25;
    if(/google/i.test(n)) w+=15; if(/de[-_]DE/i.test(v.lang)) w+=5; if(/anna|helena|petra|marlene|katja/i.test(n)) w+=3; return w; }
  let voice=null;
  function pickVoice(){ const vs=(window.speechSynthesis?.getVoices()||[]).filter(v=>/^de/i.test(v.lang)); let fest=""; try{ fest=localStorage.getItem("einhorn-stimme")||""; }catch(e){}
    if(fest==="system"){ voice=null; return; }
    const i=vs.findIndex((v,k)=>(k+"|"+v.name+"|"+v.voiceURI)===fest);
    voice = i>=0 ? vs[i] : (vs.filter(v=>stimmWert(v)>=0).sort((a,b)=>stimmWert(b)-stimmWert(a))[0] || null); }
  if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
  function say(text){ if(!sound||!window.speechSynthesis) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="de-DE"; if(voice) u.voice=voice; u.rate=.85; u.pitch=1.05; speechSynthesis.speak(u); }catch(e){} }
  function sag(text, sprechen=text){ $("talk").textContent=text; say(sprechen); }

  // ---------- Wiese ----------
  const pr = (i,k) => { const x=Math.sin(i*12.9898+k*78.233)*43758.5453; return x-Math.floor(x); };
  function wiese(el, {gross=false, neueBlume=false}={}){
    el.innerHTML="";
    const n=Math.min(save.wiese, gross?90:60);
    for(let i=0;i<n;i++){
      const d=document.createElement("div"); d.className="w"+(neueBlume&&i===n-1?" neu":"");
      const y=48+pr(i,2)*50, w=(gross?16:9)*(0.75+y/200);
      d.style.left=(3+pr(i,1)*94)+"%"; d.style.top=y+"%"; d.style.width=w+"px"; d.style.zIndex=Math.round(y);
      d.innerHTML=F.svgDing("blume").replace('fill="#FF9ECF"', `fill="${BLUMENFARBEN[Math.floor(pr(i,3)*BLUMENFARBEN.length)]}"`); el.appendChild(d);
    }
    const ue=[];
    for(let i=0;i<save.einhoerner;i++){
      const [name,fell]=EINHOERNER[i];
      const d=document.createElement("div"); d.className="w";
      const y=gross?(i%2?88:68)+pr(i,7)*8:70+pr(i,7)*22, w=(gross?(save.einhoerner>6?54:70):34)*(0.7+y/220);
      const n=save.einhoerner, x = n===1 ? 50 : 14+72*i/(n-1);
      d.style.left=x+"%"; d.style.top=y+"%"; d.style.width=w+"px"; d.style.zIndex=Math.round(y)+1;
      d.innerHTML=`<div class="dreh" style="${pr(i,6)<.5?"transform:scaleX(-1)":""}">${F.svgFigur("einhorn",{fell})}</div>`+(gross?`<div class="name">${name}</div>`:"");
      el.appendChild(d); ue.push(d);
    }
    return ue;
  }
  function akteur(el, id, {x, y=92, w=80, fell, links=false}={}){
    const d=document.createElement("div"); d.className="w"; d.style.left=x+"%"; d.style.top=y+"%"; d.style.width=w+"px"; d.style.zIndex=200;
    d.style.transition="left 2.2s linear";
    d.innerHTML=`<div style="${links?"transform:scaleX(-1)":""}">${F.svgFigur(id,{fell})}</div>`;
    el.appendChild(d); return {el:d, svg:d.querySelector("svg")};
  }

  // ---------- Aufgaben ----------
  const stufe = () => STUFEN[Math.min(save.stufe, STUFEN.length-1)];
  function pool(){
    const {max}=stufe(), out=[];
    for(let a=1;a<max;a++) for(let b=a+1;a+b<=max;b++){
      if(a+b>UEBERGANG_AB && (a%10)+(b%10)>=10) continue;
      out.push(a+"+"+b);
    }
    return out;
  }
  function mische(liste, n){
    const due=shuffle(liste.filter(faellig)).sort((a,b)=>eintrag(a).f-eintrag(b).f);
    const sicher=shuffle(liste.filter(s=>!faellig(s)));
    const nDue=Math.min(due.length, Math.ceil(n*ANTEIL_FAELLIG));
    return shuffle(due.slice(0,nDue).concat(sicher.slice(0,n-nDue)).concat(due.slice(nDue))).slice(0,n);
  }
  function tripel(nums){ const t=[]; for(let i=0;i<nums.length;i++) for(let j=i+1;j<nums.length;j++){ const k=nums.indexOf(nums[i]+nums[j]); if(k>=0) t.push([i,j,k]); } return t; }
  function baueBluete(fakt, n){
    const [a,b]=fakt.split("+").map(Number), {max}=stufe();
    for(let t=0;t<2000;t++){
      const nums=[a,b,a+b]; let g=0;
      while(nums.length<n && g++<200){ const x=1+Math.floor(Math.random()*max); if(!nums.includes(x)) nums.push(x); }
      if(nums.length===n && tripel(nums).length===1) return shuffle(nums);
    }
    return n>3 ? baueBluete(fakt, n-1) : shuffle([a,b,a+b]);
  }
  const anzahlInStufe = () => save.verlauf.filter(e=>e.s===save.stufe).length;
  function pruefeAufstieg(){
    if(save.stufe>=STUFEN.length-1) return false;
    const v=save.verlauf.filter(e=>e.s===save.stufe && e.n===5);
    if(v.length<AUF_N) return false;
    const letzte=v.slice(-AUF_N);
    const quote=letzte.filter(e=>e.ok).length/AUF_N;
    const tageAnz=new Set(letzte.map(e=>e.d)).size;
    const jetzt=median(letzte.filter(e=>e.ok).map(e=>e.ms));
    const anfang=v.length>=2*AUF_N ? median(v.slice(0,AUF_N).filter(e=>e.ok).map(e=>e.ms)) : Infinity;
    const schnell = jetzt<=stufe().schnell || jetzt<=AUF_FAKTOR*anfang;
    return quote>=AUF_QUOTE && tageAnz>=AUF_TAGE && schnell;
  }

  // Strategie-Tipp zu einem Paar – zeigt den Weg, nicht das Ergebnis
  function tipp(x,y){
    const a=Math.min(x,y), b=Math.max(x,y), s=a+b;
    if(s>20) return {t:"Tipp: Erst die Zehner, dann die Einer.", s:"Tipp: Rechne erst die Zehner zusammen, dann die Einer."};
    if(a<=2) return {t:`Tipp: Von ${b} nur ${a} weiter.`, s:`Tipp: Fang bei der ${b} an und geh nur ${a===1?"einen":"zwei"} weiter.`};
    if(b>=10 && (b%10)+a<10) return {t:`Tipp: Die 10 bleibt. Rechne ${b%10} + ${a}.`, s:`Tipp: Die Zehn bleibt. Rechne nur ${b%10} plus ${a}.`};
    if(b-a===1) return {t:`Tipp: ${a} + ${b} ist fast ${a} + ${a}.`, s:`Tipp: ${a} plus ${b} ist fast ${a} plus ${a}. Und dann noch eins dazu.`};
    if(b===9 && a<10) return {t:"Tipp: Erst plus 10, dann eins weniger.", s:`Tipp: Rechne ${a} plus zehn. Und dann eins weniger.`};
    if(s>10 && b<10) return {t:`Tipp: ${b} + ${10-b} ist 10. Dann der Rest.`, s:`Tipp: Erst bis zur Zehn. ${b} plus ${10-b} ist zehn. Und dann noch der Rest.`};
    if(s>10) return {t:"Tipp: Die Zehn und dann der Rest.", s:"Tipp: Erst die Zehn, dann den Rest dazu."};
    return {t:`Tipp: Fang bei ${b} an und zähl ${a} weiter.`, s:`Tipp: Fang bei der ${b} an und geh ${a} weiter.`};
  }

  // ---------- Punktefeld: x Punkte (rosa) + y Punkte (lila), in Zehnerreihen mit Fünferlücke; über 30 als Stangen ----------
  async function punkte(x, y, {fort=0}={}){
    const feld=$("feld"); feld.innerHTML=""; const s=x+y, dots=[];
    if(s<=30){
      const reihen=Math.max(1,Math.ceil(s/10));
      for(let r=0;r<reihen;r++){ const row=document.createElement("div"); row.className="reihe";
        for(let c=0;c<10;c++){ if(c===5){ const l=document.createElement("span"); l.className="luecke"; row.appendChild(l); }
          const d=document.createElement("span"); d.className="dot"; row.appendChild(d); dots.push(d); }
        feld.appendChild(row); }
      for(let k=0;k<s;k++){ dots[k].classList.add(k<x?"a":"b"); if(k%2===0) await wait(22); }
      if(fort){ await wait(500); for(let k=s-1;k>=s-fort;k--){ dots[k].classList.add("fort"); await wait(30); } }
    }else{
      const box=document.createElement("div"); box.className="stangen"; feld.appendChild(box);
      for(const [n,cls] of [[x,"a"],[y,"b"]]){
        for(let z=0;z<Math.floor(n/10);z++){ const st=document.createElement("span"); st.className="stange "+cls; box.appendChild(st); dots.push(st); await wait(40); }
        if(n%10){ const e=document.createElement("span"); e.className="einzel"; for(let k=0;k<n%10;k++){ const d=document.createElement("span"); d.className="dot "+cls; e.appendChild(d); }
          box.appendChild(e); dots.push(...e.children); }
      }
      if(fort){ await wait(500); const bteil=[...box.querySelectorAll(".b")]; for(const d of bteil){ d.classList.add("fort"); } }
    }
  }
  const leereFeld = () => { $("feld").innerHTML=""; };

  // ---------- Spielzustand ----------
  let runde=[], rundeIdx=0, wieder=[];
  let B=null;   // aktuelle Blüte
  let begleiter=null;

  function zeileSetzen(html, weiter=false){ $("rechnung").innerHTML=html; $("weiter").hidden=!weiter; }
  const paarKey = (i,j) => i<j ? i+"-"+j : j+"-"+i;
  const fertig = i => B.nums.every((_,j)=> { const f=B.faeden.get(paarKey(i,j)); return j===i || (f && (f.ok||f.loesung)); });

  function neueBluete(){
    let fakt;
    const w=wieder.findIndex(x=>x.ab<=rundeIdx || rundeIdx>=RUNDE);
    if(w>=0){ fakt=wieder[w].fakt; wieder.splice(w,1); } else fakt=runde[rundeIdx % runde.length];
    const n = anzahlInStufe()<EINSTIEG ? 4 : 5;
    const nums=baueBluete(fakt, n);
    const [ti,tj,tk]=tripel(nums)[0];
    B={fakt, nums, loes:[ti,tj,tk], anker:-1, sel:null, faeden:new Map(), fehler:0, t0:Date.now(), busy:false, nachtippen:null, anleitung:save.anleitung<ANLEITUNG};
    zeichneBluete();
    setzeAnker(kleinsterOffener(), true);
    leereFeld(); zeileSetzen("");
    if(B.anleitung) sag("Die leuchtende Blüte ist dein Start. Tipp eine zweite an!", "Die leuchtende Blüte ist dein Start. Tipp noch eine Blüte an, und rechne die zwei im Kopf zusammen.");
    else if(rundeIdx===0) sag("Welche zwei ergeben eine dritte?");
    else $("talk").textContent="Welche zwei ergeben eine dritte?";
  }
  function kleinsterOffener(){
    const ord=B.nums.map((v,i)=>i).sort((i,j)=>B.nums[i]-B.nums[j]);
    return ord.find(i=>!fertig(i)) ?? ord[0];
  }

  function zeichneBluete(){
    const f=$("flower"); f.classList.remove("bluehen");
    f.querySelectorAll(".petal,.hand").forEach(p=>p.remove());
    const n=B.nums.length, R=37;
    B.pos=B.nums.map((_,i)=>{ const a=-Math.PI/2+i*2*Math.PI/n; return [50+R*Math.cos(a), 50+R*Math.sin(a)]; });
    B.el=B.nums.map((v,i)=>{
      const b=document.createElement("button"); b.className="petal"; b.textContent=v;
      b.style.left=(B.pos[i][0]-12)+"%"; b.style.top=(B.pos[i][1]-12)+"%";
      let timer=null, lang=false;
      b.addEventListener("pointerdown",()=>{ lang=false; clearTimeout(timer); timer=setTimeout(()=>{ lang=true; langDruck(i); }, LANG_MS); });
      const stop=()=>clearTimeout(timer);
      b.addEventListener("pointerup",stop); b.addEventListener("pointerleave",stop); b.addEventListener("pointercancel",stop);
      b.addEventListener("contextmenu",e=>e.preventDefault());
      b.addEventListener("click",()=>{ if(lang){ lang=false; return; } tipp_(i); });
      f.appendChild(b); return b;
    });
    zeichneFaeden();
  }
  function zeichneFaeden(){
    const svg=$("faeden"); let h="";
    for(const [k,info] of B.faeden){ const [i,j]=k.split("-").map(Number);
      const cls = info.loesung ? "loesung" : (B.sel!=null && k===paarKey(B.anker,B.sel)) ? "aktiv" : (i===B.anker||j===B.anker) ? "geprueft" : "alt";
      h+=`<path class="${cls}" d="${fadenWeg(B.pos[i],B.pos[j])}"/>`; }
    svg.innerHTML=h;
    B.el.forEach((e,i)=>{ e.classList.toggle("anker", i===B.anker); e.classList.toggle("sel", i===B.sel); });
  }
  // Faden als Bogen um die Mitte (Einhorn, Radius 19) herum: Scheitel mindestens BOGEN vom Mittelpunkt entfernt
  const BOGEN = 24;
  function fadenWeg([x1,y1],[x2,y2]){
    const mx=(x1+x2)/2-50, my=(y1+y2)/2-50; let d=Math.hypot(mx,my), ux, uy;
    if(d<0.5){ const l=Math.hypot(x2-x1,y2-y1); ux=-(y2-y1)/l; uy=(x2-x1)/l; d=0; } else { ux=mx/d; uy=my/d; }
    if(d>=BOGEN) return `M${x1} ${y1} L${x2} ${y2}`;
    const c=2*BOGEN-d;
    return `M${x1} ${y1} Q${(50+ux*c).toFixed(2)} ${(50+uy*c).toFixed(2)} ${x2} ${y2}`;
  }
  function zeigeHand(i){
    $("flower").querySelectorAll(".hand").forEach(h=>h.remove());
    if(!B.anleitung || i==null) return;
    const h=document.createElement("div"); h.className="hand"; h.textContent="👆";
    h.style.left=B.pos[i][0]+"%"; h.style.top=B.pos[i][1]+"%"; $("flower").appendChild(h);
  }
  function setzeAnker(i, still=false){
    B.anker=i; B.sel=null; zeichneFaeden(); zeileSetzen("");
    if(B.anleitung){ const z=B.nums.map((_,j)=>j).find(j=>j!==i && !B.faeden.has(paarKey(i,j))); zeigeHand(z); }
    if(!still){ sfx.tipp(); sag(`Jetzt ist die ${B.nums[i]} dran.`); }
  }
  function langDruck(i){
    if(!B || B.busy || B.nachtippen || i===B.anker) return;
    setzeAnker(i);
  }

  function tipp_(i){
    if(!B || B.busy) return;
    if(B.nachtippen){ return nachtippen(i); }
    if(B.minus){ return minusTipp(i); }
    if(i===B.anker || i===B.sel){
      if(B.sel!=null){ abwaehlen(); sfx.tipp(); zeichneFaeden(); zeileSetzen(""); }
      else sag("Das ist deine Start-Blüte. Tipp eine andere an!");
      return;
    }
    if(B.sel==null){ waehle(i); return; }
    // dritte Blüte: kleiner als ein Teil kann keine Summe sein → Partner wechseln
    const x=B.nums[B.anker], y=B.nums[B.sel], z=B.nums[i];
    if(z<Math.max(x,y)){ waehle(i); return; }
    behaupte(i);
  }
  // gewähltes, aber nicht mit „nicht dabei“ bestätigtes Paar zurücknehmen
  function abwaehlen(){
    if(B.sel==null) return;
    const k=paarKey(B.anker,B.sel); if(B.faeden.get(k) && !B.faeden.get(k).ok && !B.faeden.get(k).loesung) B.faeden.delete(k);
    B.sel=null;
  }
  function waehle(i){
    abwaehlen();
    B.sel=i; if(!B.faeden.has(paarKey(B.anker,i))) B.faeden.set(paarKey(B.anker,i), {});
    sfx.faden(); zeichneFaeden(); leereFeld();
    zeileSetzen(`${B.nums[B.anker]} + ${B.nums[i]} = <span class="fr">?</span>`, true);
    zeigeHand(null);
    if(B.anleitung) sag("Ist das Ergebnis in der Blüte? Tipp es an! Sonst: nicht dabei.", "Ist das Ergebnis in der Blüte? Dann tipp es an. Wenn nicht, tipp auf: nicht dabei.");
  }
  const istLoesungsPaar = (i,j) => { const [a,b]=B.loes; return (i===a&&j===b)||(i===b&&j===a); };

  // „nicht dabei“: Paar ist geprüft
  async function weiter(){
    if(!B || B.busy || B.sel==null) return;
    if(istLoesungsPaar(B.anker,B.sel)){
      // doch dabei – das ist ein echter Fehler
      B.fehler++; B.busy=true; sfx.hm(); fragend();
      const x=B.nums[B.anker], y=B.nums[B.sel];
      zeileSetzen(`${x} + ${y} = ${x+y}`);
      await punkte(x,y);
      sag(`Schau mal: ${x} + ${y} sind ${x+y}. Die ${x+y} ist in der Blüte!`, `Schau mal. ${x} plus ${y} sind ${x+y}. Und die ${x+y} ist in der Blüte!`);
      B.el[B.loes[2]].classList.add("zeig");
      B.busy=false; B.nachtippen={folge:[B.loes[2]], schritt:0, vorher:true};
      return;
    }
    B.faeden.get(paarKey(B.anker,B.sel)).ok=true;
    B.sel=null; sfx.tipp(); zeichneFaeden(); zeileSetzen(""); leereFeld();
    if(fertig(B.anker)){
      const n=kleinsterOffener();
      if(n!==B.anker && !fertig(n)) setzeAnker(n);
    }else if(B.anleitung){ const z=B.nums.map((_,j)=>j).find(j=>j!==B.anker && !B.faeden.has(paarKey(B.anker,j))); zeigeHand(z); sag("Gut, der Faden zeigt: schon geprüft. Tipp die nächste an!"); }
  }

  function fragend(){
    const head=begleiter?.querySelector(".head"); if(!head) return;
    head.animate([{transform:"rotate(0)"},{transform:"rotate(-16deg)"},{transform:"rotate(-16deg)"},{transform:"rotate(0)"}],{duration:1100,easing:"ease-in-out"});
  }

  async function behaupte(k){
    const x=B.nums[B.anker], y=B.nums[B.sel], z=B.nums[k];
    if(x+y===z) return erfolg();
    B.fehler++; B.busy=true; sfx.hm(); fragend();
    B.el[k].classList.add("wackel"); setTimeout(()=>B.el[k].classList.remove("wackel"),500);
    const solPaar=istLoesungsPaar(B.anker,B.sel);
    zeileSetzen(`${x} + ${y} = ${x+y}`);
    if(B.fehler>=3){ await punkte(x,y); await wait(900); return zeigeLoesung(); }
    if(B.fehler===2){ const t=tipp(x,y); sag(t.t, t.s); await wait(1600); await punkte(x,y); await wait(600); }
    else { await punkte(x,y); sag(`${x} + ${y} sind ${x+y}, nicht ${z}.`, `${x} plus ${y} sind ${x+y}. Nicht ${z}.`); }
    B.busy=false;
    if(solPaar){ B.el[B.loes[2]].classList.add("zeig"); B.nachtippen={folge:[B.loes[2]], schritt:0, vorher:true}; return; }
    B.faeden.get(paarKey(B.anker,B.sel)).ok=true;
    B.sel=null; zeichneFaeden(); $("weiter").hidden=true;
    if(fertig(B.anker)){ const n=kleinsterOffener(); if(n!==B.anker && !fertig(n)) setTimeout(()=>{ if(!B.busy) setzeAnker(n); }, 1800); }
  }

  async function zeigeLoesung(){
    const [a,b,c]=B.loes; const x=B.nums[a], y=B.nums[b];
    B.faeden.set(paarKey(a,b), {loesung:true}); B.anker=a; B.sel=null; zeichneFaeden();
    sag(`Schau: ${x} + ${y} = ${x+y}. Tipp es nach!`, `Schau. ${x} plus ${y} ist ${x+y}. Tipp es nach. Erst die ${x}, dann die ${y}, dann die ${x+y}.`);
    for(const i of [a,b,c]){ B.el[i].classList.add("zeig"); await wait(500); }
    await punkte(x,y);
    await wait(700); B.el.forEach(e=>e.classList.remove("zeig"));
    zeileSetzen(""); leereFeld();
    B.busy=false; B.nachtippen={folge:[a,b,c], schritt:0}; B.el[a].classList.add("zeig");
  }
  function nachtippen(i){
    const N=B.nachtippen, soll=N.folge[N.schritt];
    if(i!==soll){ B.el[soll].classList.add("zeig"); B.el[i].classList.add("wackel"); setTimeout(()=>B.el[i].classList.remove("wackel"),500); return; }
    sfx.tipp(); B.el[i].classList.remove("zeig"); N.schritt++;
    if(N.folge.length===3){
      const [a,b]=B.loes;
      if(N.schritt===1){ zeileSetzen(`${B.nums[a]} + …`); B.el[b].classList.add("zeig"); }
      if(N.schritt===2){ zeileSetzen(`${B.nums[a]} + ${B.nums[b]} = <span class="fr">?</span>`); B.el[B.loes[2]].classList.add("zeig"); }
    }
    if(N.schritt>=N.folge.length){ B.nachtippen=null; erfolg(); }
  }

  async function erfolg(){
    B.busy=true;
    const [a,b,c]=B.loes, x=B.nums[a], y=B.nums[b];
    const ok=B.fehler===0, ms=Date.now()-B.t0;
    record(B.fakt, ok);
    if(!ok && !wieder.some(w=>w.fakt===B.fakt)) wieder.push({fakt:B.fakt, ab:rundeIdx+1+WIEDER_NACH});
    save.verlauf.push({d:heute(), s:save.stufe, n:B.nums.length, ms, ok:ok?1:0}); if(save.verlauf.length>300) save.verlauf.shift();
    if(B.anleitung) save.anleitung++;
    B.faeden.set(paarKey(a,b), {loesung:true}); B.sel=null; zeichneFaeden(); zeigeHand(null);
    [a,b,c].forEach(i=>B.el[i].classList.add("zeig"));
    zeileSetzen(`${x} + ${y} = ${x+y}`);
    sag(`${x} + ${y} = ${x+y}`, `${x} plus ${y} ist ${x+y}.`);
    sfx.bluehen(); $("flower").classList.add("bluehen");
    if(begleiter) F.hop(begleiter.querySelector("svg"), {hoehe:40, dauer:650, mal:2});
    await punkte(x,y);
    await wait(1500);
    if(stufe().minus && Math.random()<P_MINUS){ return minusStart(); }
    blumeFertig();
  }

  // Minus-Nachspiel: das Einhorn nascht einen Teil, das Kind tippt den Rest
  async function minusStart(){
    const [a,b,c]=B.loes; const weg = Math.random()<.5 ? a : b, rest = weg===a ? b : a;
    const s=B.nums[c], w=B.nums[weg];
    B.el.forEach(e=>e.classList.remove("zeig")); B.faeden.clear(); B.anker=-1; zeichneFaeden(); leereFeld();
    const svg=begleiter.querySelector("svg"); F.zustand(svg,"frisst"); sfx.happs();
    B.el[weg].classList.add("weg"); B.el[c].classList.add("aus");
    await wait(1400); F.zustand(svg,"");
    B.minus={rest, s, w, fehler:0, key:`${s}-${w}`};
    zeileSetzen(`${s} − ${w} = <span class="fr">?</span>`);
    sag(`Das Einhorn nascht die ${w}. Was bleibt von ${s}?`, `Das Einhorn hat die ${w} genascht. ${s} weniger ${w}. Was bleibt übrig?`);
    B.busy=false;
  }
  async function minusTipp(i){
    const M=B.minus;
    if(i===M.rest){
      B.busy=true; record(M.key, M.fehler===0); sfx.bluehen();
      B.el[i].classList.add("zeig"); zeileSetzen(`${M.s} − ${M.w} = ${M.s-M.w}`); say(`${M.s} weniger ${M.w} ist ${M.s-M.w}.`);
      await punkte(M.s-M.w, M.w, {fort:M.w}); await wait(1500);
      B.minus=null; return blumeFertig();
    }
    M.fehler++; B.busy=true; sfx.hm(); fragend();
    B.el[i].classList.add("wackel"); setTimeout(()=>B.el[i].classList.remove("wackel"),500);
    await punkte(M.s-M.w, M.w, {fort:M.w});
    sag(`Schau: ${M.s} weniger ${M.w}. Diese Punkte bleiben.`, `Schau. Von ${M.s} nascht das Einhorn ${M.w}. Diese Punkte bleiben übrig.`);
    B.el[M.rest].classList.add("zeig"); B.busy=false;
  }

  function blumeFertig(){
    save.wiese++;
    if(pruefeAufstieg()) save.stufe++;
    persist();
    wiese($("spielWiese"), {neueBlume:true});
    rundeIdx++;
    if(rundeIdx>=RUNDE && (wieder.length===0 || rundeIdx>=RUNDE+WIEDER_MAX)) return rundenEnde();

  }

  function zeigeScreen(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on", s.id===id)); window.scrollTo(0,0); }

  }

  // ---------- Elternansicht ----------
  function eltern(){
    zeigeScreen("eltern");
    const st=stufe(), v=save.verlauf.filter(e=>e.s===save.stufe), v5=v.filter(e=>e.n===5), letzte=v5.slice(-AUF_N);
    const sek = ms => isFinite(ms) ? (ms/1000).toFixed(1)+" s" : "–";
    const wack=Object.entries(save.fakten).sort((a,b)=>a[1].f-b[1].f || a[0].localeCompare(b[0],undefined,{numeric:true}));
    $("eltern").innerHTML=`<h1>Lernstand Zahlenzauber</h1>
      <p>Stufe ${save.stufe+1} von ${STUFEN.length}: bis ${st.max}${st.minus?" mit Minus":""} · ${v.length} Blüten in dieser Stufe · ${save.runden} Runden · ${save.wiese} Blumen · ${save.einhoerner} Einhörner</p>
      <h2>Aufstieg</h2>
      <p>Letzte ${letzte.length} Blüten (5 Zahlen): ${letzte.filter(e=>e.ok).length} fehlerfrei (nötig ${Math.ceil(AUF_N*AUF_QUOTE)} von ${AUF_N}),
        Tage: ${new Set(letzte.map(e=>e.d)).size} (nötig ${AUF_TAGE}),
        Median jetzt ${sek(median(letzte.filter(e=>e.ok).map(e=>e.ms)))}, am Anfang ${sek(median(v5.slice(0,AUF_N).filter(e=>e.ok).map(e=>e.ms)))} (schnell genug: ≤ ${sek(st.schnell)} oder −${Math.round((1-AUF_FAKTOR)*100)} %).</p>
      <p><button class="btn" id="stufeMinus">Stufe −</button> <button class="btn" id="stufePlus">Stufe +</button></p>
      <h2>Aufgaben (Fach 0 = wackelt, ab Fach ${GELERNT} gelernt)</h2>
      <ul>${wack.map(([k,e])=>`<li><b>${esc(k.replace("-"," − ").replace("+"," + "))}</b> <small>· Fach ${esc(e.f)}${e.t?" seit "+esc(e.t):""}${faellig(k)&&e.f<GELERNT?" · fällig":""} · zuletzt ${e.h.map(x=>x?"✓":"✗").join("")}</small></li>`).join("") || "<li>Noch nichts gespielt.</li>"}</ul>
      <p><a class="btn" href="zahlenzauber.html" style="text-decoration:none;display:inline-block">Zum Spiel</a></p>`;
    $("stufeMinus").onclick=()=>{ save.stufe=Math.max(0,save.stufe-1); persist(); eltern(); };
    $("stufePlus").onclick=()=>{ save.stufe=Math.min(STUFEN.length-1,save.stufe+1); persist(); eltern(); };
  }

  $("weiter").addEventListener("click", weiter);
  $("go").addEventListener("click", startRunde);
  $("nochmal").addEventListener("click", startRunde);
  if(params.has("eltern")) eltern();
  else { wiese($("startWiese"), {gross:true}); }
})();
</script>
</body>
</html>
