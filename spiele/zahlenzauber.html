<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Zahlenzauber</title>
<link rel="stylesheet" href="schrift/schrift.css">
<style>
:root{--nacht:#3B2A6B;--weich:#6B5C96;--paper:#FFFFFF;--bg:#FFE3F1;--rosa:#FF8ACB;--sonne:#FFD95A;--mathe:#F06BB0;--mathe-s:#C2468A;
  --punkt-a:#FF6FB5;--punkt-b:#8C6CF0;--leer:rgba(59,42,107,.10);
  font-size:calc(100vh / 108)}   /* 1rem = 10 px bei 1080 px Höhe */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:"Andika",sans-serif;color:var(--nacht);background:#2B2350;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{position:fixed;inset:0;display:flex}

/* ---------- Bühne ---------- */
.stage{position:relative;flex:1;height:100%;overflow:hidden;
  background:linear-gradient(#BFE8FF 0,#E4F6FF 50%,#BDEB9C 54%,#8ED07A 100%)}
.hinten{position:absolute;inset:0;pointer-events:none;z-index:1}
.hinten .w{position:absolute;transform:translate(-50%,-100%)}
.hinten .neu{animation:spriessen .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes spriessen{from{transform:translate(-50%,-100%) scale(0)}}
.akteur{position:absolute;transform:translate(-50%,-100%);transition:left var(--lauf,1.3s) linear}
.akteur .dreh{transition:transform .25s}
.akteur .dreh.links{transform:scaleX(-1)}
.akteur .schatten{position:absolute;left:20%;right:20%;bottom:1%;height:6%;border-radius:50%;background:rgba(0,0,0,.12)}
#uni{width:42rem;left:26rem;top:103rem;z-index:6}

.blase{position:absolute;left:3rem;top:3rem;width:44rem;min-height:9rem;background:var(--paper);border-radius:3rem;padding:2rem 2.6rem;
  font:400 3.2rem/1.25 "Andika",sans-serif;box-shadow:0 .6rem 0 rgba(59,42,107,.15);z-index:8;display:flex;align-items:center;transition:opacity .3s}
.blase::after{content:"";position:absolute;left:14rem;bottom:-2.4rem;border:1.4rem solid transparent;border-top:1.6rem solid var(--paper);border-bottom:0}
.blase:empty{opacity:0}

/* Blume: Blüte (viewBox -100…100) mit Stiel bis y = 215 */
.blume{position:absolute;left:92rem;top:5rem;width:66rem;transform:translateX(-50%);transform-origin:50% 100%;z-index:5;
  transition:transform .9s cubic-bezier(.3,1.4,.5,1),opacity .6s}
.blume.klein{transform:translateX(-50%) scale(.24);transition:transform .5s ease-in-out}
.blume.weg{transform:translateX(-50%) scale(.24);opacity:0;transition:opacity .3s}
.blume .gegessen{opacity:0;transition:opacity .2s}
.blume.keim{transform:translateX(-50%) scale(0);transition:none}
.blume svg{display:block;width:100%;height:auto;overflow:visible}
.blatt{cursor:pointer}
.blatt .form{transform-box:view-box;transform-origin:0 0;transform:rotate(var(--r)) scale(1);transition:transform .35s,fill .25s}
.blatt .form path{fill:var(--farbe);stroke:#3B2A6B;stroke-width:3.2;transition:fill .25s,stroke-width .2s}
.blatt text{font-family:"Andika",sans-serif;font-weight:400;fill:#3B2A6B;text-anchor:middle;dominant-baseline:central;pointer-events:none;transition:opacity .3s}
.kranz{pointer-events:none}
.blatt.start .form path{fill:var(--sonne);stroke-width:5}
.blatt.partner .form path{fill:var(--rosa);stroke-width:5}
.blatt.start .form,.blatt.partner .form{transform:rotate(var(--r)) scale(1.07)}
.blatt.welk .form{transform:rotate(calc(var(--r) + 9deg)) scale(.86)}
.blatt.welk .form path{fill:#E4DEEC}
.blatt.welk text{opacity:.4}
.blatt.zeig .form path{fill:var(--sonne);animation:leuchten 1s ease-in-out infinite alternate}
.blatt.wackel .form{animation:wackel .45s}
@keyframes leuchten{to{stroke-width:7;stroke:#E39A00}}
@keyframes wackel{25%{transform:rotate(calc(var(--r) - 6deg))}75%{transform:rotate(calc(var(--r) + 6deg))}}
.mitte-zeichen{font:400 62px "Andika",sans-serif;fill:#3B2A6B;text-anchor:middle;dominant-baseline:central;pointer-events:none}

/* Rechenzeile + Punktefeld rechts auf der Bühne */
.rechnen{position:absolute;left:132rem;right:4rem;top:24rem;display:flex;flex-direction:column;align-items:center;gap:3rem;z-index:7}
.rechnung{font:400 8rem/1 "Andika",sans-serif;min-height:9rem;white-space:nowrap;text-shadow:0 .3rem 0 rgba(255,255,255,.7)}
.rechnung .fr{color:var(--mathe)}
/* Montessori-Perlenstäbchen (Farben wie in der Perlenbrücke): 1 rot, 2 grün, 3 rosa, 4 gelb, 5 hellblau, 6 lila, 7 weiß,
   8 braun, 9 dunkelblau, 10 gold. Alle Perlen gleich breit, damit gleich lange Reihen gleich viel bedeuten. */
.feld{display:flex;flex-direction:column;gap:1.6rem;align-items:flex-start;--p:3rem}
.perlreihe{display:flex;gap:calc(var(--p) * .08);align-items:flex-start}
.gruppe{display:flex;flex-direction:column;align-items:center;gap:.6rem}
.gruppe .staebe{display:flex;gap:calc(var(--p) * .08)}
.gruppe .zahl{font:400 calc(var(--p) * .9 + 1rem)/1 "Andika",sans-serif;color:var(--nacht)}
.stab{display:flex;gap:calc(var(--p) * .08);padding:calc(var(--p) * .06);border-radius:99rem;background:rgba(59,42,107,.18)}
.stab b{width:var(--p);height:var(--p);border-radius:50%;background:var(--c);flex:none;
  box-shadow:inset calc(var(--p) * -.1) calc(var(--p) * -.14) 0 rgba(0,0,0,.18),inset calc(var(--p) * .1) calc(var(--p) * .1) 0 rgba(255,255,255,.45);border:1px solid rgba(0,0,0,.15);
  transition:transform .5s,opacity .5s}
.stab b.fort{opacity:.25;transform:translateY(calc(var(--p) * -.9)) scale(.85)}
/* Perlen-Lektion nach dem Lösen: ruhig, mitten auf der Bühne */
.lektion{position:absolute;left:50rem;right:20rem;top:16rem;display:flex;flex-direction:column;align-items:center;gap:4rem;z-index:7;
  opacity:0;transition:opacity .3s;pointer-events:none}
.lektion.on{opacity:1}
.lektion .titel{font:400 9rem/1 "Andika",sans-serif;text-shadow:0 .3rem 0 rgba(255,255,255,.7)}
.lektion .feld{gap:3.4rem}

/* ---------- Schwebende Knöpfe ---------- */
.knoepfe{position:absolute;top:3rem;right:3rem;display:flex;gap:1.6rem;z-index:10}
.rund{width:7rem;height:7rem;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;padding:1.5rem;
  box-shadow:0 .5rem 0 rgba(59,42,107,.15);text-decoration:none;flex:none}
.rund img{width:100%;height:100%}
.rund:active{transform:translateY(.3rem);box-shadow:0 .2rem 0 rgba(59,42,107,.15)}
/* Rundenblumen: fünf kleine Blumen, die sich färben, sobald eine Blume gegessen ist */
.runde{position:absolute;top:3.4rem;right:22rem;display:flex;gap:1rem;align-items:flex-end;z-index:10}
.runde i{width:3.4rem;display:block;filter:grayscale(1) opacity(.35);transition:filter .6s}
.runde i.da{filter:none;animation:spriessen2 .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes spriessen2{from{transform:scale(.3)}}
.hilfe{position:absolute;right:3rem;bottom:3rem;z-index:10;height:8rem;padding:0 3rem;border-radius:99rem;background:rgba(255,255,255,.9);font:400 2.8rem/1 "Andika",sans-serif;display:flex;align-items:center;gap:1.2rem;
  box-shadow:0 .5rem 0 rgba(59,42,107,.15)}
.hilfe img{width:4.4rem;height:4.4rem}
.hilfe:active{transform:translateY(.3rem);box-shadow:0 .2rem 0 rgba(59,42,107,.15)}
.hilfe.aus{visibility:hidden}

/* ---------- Elternansicht ---------- */
.eltern{position:fixed;inset:0;z-index:40;overflow:auto;background:var(--bg);padding:3rem 4rem 4rem;user-select:text;-webkit-user-select:text;touch-action:auto;font-size:2rem;display:none}
.eltern.on{display:block}
.eltern h1{font:700 4rem/1.1 "Andika",sans-serif}.eltern h2{font:700 2.8rem/1.1 "Andika",sans-serif;margin:2.4rem 0 .6rem}.eltern p{margin:1rem 0;font-weight:400;max-width:90ch}
.eltern ul{list-style:none;columns:3}.eltern li{background:var(--paper);border-radius:1rem;padding:.6rem 1.4rem;margin:0 0 .6rem;font-weight:400;break-inside:avoid}
.eltern small{font-weight:400;opacity:.75}
.eltern .knopf{display:inline-block;background:var(--paper);border-radius:1.2rem;padding:1rem 1.8rem;font-weight:400;font-size:2.2rem;text-decoration:none;color:var(--nacht);margin-right:1rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="hinten" id="hinten"></div>
    <div class="blase" id="blase"></div>
    <div class="blume" id="blume"></div>
    <div class="akteur" id="uni"><div class="schatten"></div><div class="dreh" id="unidreh"></div></div>
    <div class="rechnen"><div class="rechnung" id="rechnung"></div><div class="feld" id="feld"></div></div>
    <div class="lektion" id="lektion"><div class="titel" id="ltitel"></div><div class="feld" id="lfeld"></div></div>
    <div class="runde" id="punkte" aria-label="Runde"></div>
    <div class="knoepfe">
      <button class="rund" id="snd" aria-label="Ton"><img id="sndimg" src="symbole/ton-an.svg" alt=""></button>
      <a class="rund" href="index.html" aria-label="Alle Spiele"><img src="symbole/haus.svg" alt=""></a>
    </div>
    <button class="hilfe" id="hilfe"><img src="symbole/hilfe.svg" alt="">Hilfe</button>
  </div>
</div>
<div class="eltern" id="eltern"></div>

<script src="figuren/figuren.js"></script>
<script type="module">
import {lade, speichere, sperreTouch, esc} from "./lernspiel.js";
sperreTouch();
(async function(){
  // ---------- Einstellungen ----------
  // Stufen: max = Zahlenraum, minus = Minus-Blüten kommen dazu, schnell = Median-Zeit (ms) einer fehlerfreien Blüte,
  // ab der die Stufe auch ohne Vergleich mit dem Anfang als „schnell“ gilt.
  const STUFEN = [
    {max:10,  minus:false, schnell:12000},
    {max:20,  minus:false, schnell:16000},
    {max:20,  minus:true,  schnell:18000},
    {max:30,  minus:true,  schnell:20000},
    {max:100, minus:true,  schnell:30000}];
  const UEBERGANG_AB = 20;     // Aufgaben mit Ergebnis über dieser Zahl nur ohne Zehnerübergang der Einer (34 + 25, nicht 38 + 25)
  const RUNDE = 5;             // Blumen je Runde
  const EINSTIEG = 6;          // so viele Blumen je Stufe mit 4 Blättern, danach 5
  const MINUS_NUR = 15;        // in der ersten Minus-Stufe zuerst so viele Blumen nur Minus …
  const P_MINUS = 0.5;         // … danach dieser Anteil Minus-Blumen
  const ABSTAND = [0, 1, 3, 7, 21];   // Wiedervorlage über Tage (Fächer), wie im Wimmelbild
  const GELERNT = 4;
  const ANTEIL_FAELLIG = 0.7;
  const WIEDER_NACH = 2;       // mit Fehler/Hilfe gelöste Aufgabe kommt in der Runde nach so vielen Blumen noch einmal …
  const WIEDER_MAX = 2;        // … höchstens so viele Wiederholungen je Runde
  // Aufstieg: letzte AUF_N Blumen (mit 5 Blättern) der Stufe ≥ AUF_QUOTE ohne Fehler und Hilfe, aus ≥ AUF_TAGE Tagen,
  // und Median-Zeit ≤ AUF_FAKTOR × Median der ersten AUF_N Blumen der Stufe (oder ≤ schnell der Stufe).
  const AUF_N = 10, AUF_QUOTE = 0.8, AUF_TAGE = 2, AUF_FAKTOR = 0.7;
  const PAUSE_MS = 10000;
  const LEKTION_MS = 3000;     // Perlen-Lektion, nur nach Fehler oder Hilfe (Pause nach jeder Runde: PAUSE_MS)
  const RATEN_AB = 3;          // so viele verworfene Paare je Blume: durchprobiert, zählt nicht als gekonnt
  const ANLEITUNG = 3;         // so viele Blumen überhaupt mit ausführlicher Ansage
  const EINHOERNER = [
    ["Luna","#ffffff"],["Regenbogen-Rosi","#FFD6EC"],["Sternchen","#FFF3B0"],["Zuckerwolke","#E8DEFF"],
    ["Blütenfee","#FFE3F1"],["Glitzi","#D6F4FF"],["Lolli","#FFD1DC"],["Mondlicht","#DCD6F7"],
    ["Flatterli","#DDF6E5"],["Erdbeerchen","#FFC9C9"],["Schneeflocke","#EEF7FF"],["Königin Perla","#FFEFD6"]];
  const BLATTFARBEN = ["#FFB3D9","#D6C8FF","#B8E6FF","#FFD0A8","#C8F0C0","#FFC2C2"];
  const BLUMENFARBEN = ["#FF9ECF","#B59CFF","#FFD95A","#8AD1FF","#FFB27F","#FF8A8A","#ffffff"];

  const $ = id => document.getElementById(id);
  const wait = ms => new Promise(r=>setTimeout(r,ms));
  const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
  const median = a => { if(!a.length) return Infinity; const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; };
  const params = new URLSearchParams(location.search);
  const F = window.Figuren;
  const load = src => new Promise(r=>{ const s=document.createElement("script"); s.src=src; s.onload=s.onerror=r; document.head.appendChild(s); });
  await Promise.all(["einhorn","blume"].map(id=>load("figuren/"+id+".js")));

  // ---------- Speichern (lernspiel.js: Tauri-Datei oder localStorage "lernstand-zahlenzauber") ----------
  let save = await lade("zahlenzauber", {fakten:{}, verlauf:[], stufe:0, einhoerner:1, wiese:0, runden:0, anleitung:0, minusAnleitung:0, welkErklaert:0});
  if(!save.fakten || typeof save.fakten!=="object" || Array.isArray(save.fakten)) save.fakten={};
  if(!Array.isArray(save.verlauf)) save.verlauf=[];
  for(const k of ["stufe","einhoerner","wiese","runden","anleitung","minusAnleitung"]) if(!Number.isFinite(save[k])) save[k]=k==="einhoerner"?1:0;
  save.stufe=Math.min(Math.max(0,save.stufe|0), STUFEN.length-1);
  save.einhoerner=Math.min(Math.max(1,save.einhoerner|0), EINHOERNER.length);
  function persist(){ speichere("zahlenzauber", save); }

  // Lernstand je Aufgabe ("3+9", "12-3"): {f: Fach, t: Tag, h: letzte 6 (1/0)}
  const heute = () => new Date().toLocaleDateString("sv");
  const tage = (a,b) => a ? Math.round((Date.parse(b)-Date.parse(a))/864e5) : 999;
  const eintrag = s => save.fakten[s] || {f:0, t:"", h:[]};
  const faellig = s => { const e=eintrag(s); return e.f===0 || tage(e.t, heute()) >= ABSTAND[Math.min(e.f, ABSTAND.length-1)]; };
  function record(s, richtig){
    const e=save.fakten[s]||(save.fakten[s]={f:0,t:"",h:[]});
    e.h.push(richtig?1:0); if(e.h.length>6) e.h.shift();
    if(!richtig){ e.f=0; e.t=heute(); }
    else if(faellig(s)){ e.f=Math.min(e.f+1, GELERNT); e.t=heute(); }
  }

  // ---------- Ton und Stimme (Stimmwahl „einhorn-stimme“ gilt für alle Spiele, wählbar in der Wimmelbild-Elternansicht) ----------
  let sound = true; try{ sound = localStorage.getItem("zahlenzauber-ton")!=="aus"; }catch(e){}
  const showSnd=()=>$("sndimg").src=sound?"symbole/ton-an.svg":"symbole/ton-aus.svg"; showSnd();
  $("snd").addEventListener("click",()=>{ sound=!sound; showSnd(); try{ localStorage.setItem("zahlenzauber-ton",sound?"an":"aus"); }catch(e){} if(!sound) window.speechSynthesis?.cancel(); });
  let actx;
  function tone(f1,f2,dur,type="sine",vol=.15){ if(!sound) return; try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime; o.type=type;
    o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur*.8);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02); }catch(e){} }
  const sfx = {
    tipp: ()=>tone(700,1000,.08,"sine",.08),
    paar: ()=>tone(520,780,.14,"triangle",.1),
    welk: ()=>tone(500,380,.16,"sine",.07),
    hm: ()=>{ tone(330,260,.18,"triangle",.14); setTimeout(()=>tone(300,380,.2,"triangle",.12),170); },
    geloest: ()=>[0,110,220].forEach((d,i)=>setTimeout(()=>tone(660+i*220,900+i*260,.14,"sine",.09),d)),
    happs: ()=>{ tone(600,200,.15,"square",.06); setTimeout(()=>tone(300,700,.12,"sine",.1),140); },
    wachsen: ()=>tone(300,900,.5,"sine",.07)
  };
  const SCHLECHT = /eddy|flo\b|grandma|grandpa|oma|opa|reed|rocko|sandy|shelley|eloquence|albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|kathy|ralph|novelty/i;
  function stimmWert(v){ const n=v.name+" "+v.voiceURI; if(SCHLECHT.test(n)) return -1; let w=0;
    if(/premium/i.test(n)) w+=40; else if(/enhanced|erweitert|verbessert|natural|neural/i.test(n)) w+=25;
    if(/google/i.test(n)) w+=15; if(/de[-_]DE/i.test(v.lang)) w+=5; if(/anna|helena|petra|marlene|katja|hedda/i.test(n)) w+=3; return w; }
  let voice=null;
  function pickVoice(){ const vs=(window.speechSynthesis?.getVoices()||[]).filter(v=>/^de/i.test(v.lang)); let fest=""; try{ fest=localStorage.getItem("einhorn-stimme")||""; }catch(e){}
    if(fest==="system"){ voice=null; return; }
    const i=vs.findIndex((v,k)=>(k+"|"+v.name+"|"+v.voiceURI)===fest);
    voice = i>=0 ? vs[i] : (vs.filter(v=>stimmWert(v)>=0).sort((a,b)=>stimmWert(b)-stimmWert(a))[0] || null); }
  if(window.speechSynthesis){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
  function say(text){ if(!sound||!window.speechSynthesis) return; try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang="de-DE"; if(voice) u.voice=voice; u.rate=.85; u.pitch=1.05; speechSynthesis.speak(u); }catch(e){} }
  // Sprechblase des Einhorns: nur Text. Gesprochen wird im Spiel nichts – einzig die Perlen-Lektion nach dem Lösen.
  function sag(text){ $("blase").textContent=text; }

  // ---------- Wiese im Hintergrund: eine kleine Blume je gelöster Blume, dahinter die Einhörner ----------
  const pr = (i,k) => { const x=Math.sin(i*12.9898+k*78.233)*43758.5453; return x-Math.floor(x); };
  const hinten=$("hinten");
  function zeichneWiese(neu=false){
    hinten.innerHTML="";
    const n=Math.min(save.wiese, 140);
    for(let i=0;i<n;i++){
      const d=document.createElement("div"); d.className="w"+(neu&&i===n-1?" neu":"");
      const y=56+pr(i,2)*42, w=1.6+y*.045;
      d.style.left=(2+pr(i,1)*96)+"%"; d.style.top=y+"%"; d.style.width=w+"rem"; d.style.zIndex=Math.round(y);
      d.innerHTML=F.svgDing("blume").replace('fill="#FF9ECF"', `fill="${BLUMENFARBEN[Math.floor(pr(i,3)*BLUMENFARBEN.length)]}"`);
      hinten.appendChild(d);
    }
  }

  // ---------- Einhorn ----------
  const uni=$("uni"), unidreh=$("unidreh");
  unidreh.innerHTML=F.svgFigur("einhorn");
  const uniSvg=()=>unidreh.querySelector("svg");
  const UNI_HEIM=26;   // rem, Mitte des Einhorns
  async function laufe(x, {lauf=1.3}={}){
    const von=parseFloat(uni.style.left)||UNI_HEIM;
    if(Math.abs(von-x)<.5) return;
    unidreh.classList.toggle("links", x<von);
    uni.style.setProperty("--lauf", lauf+"s");
    F.zustand(uniSvg(),"laeuft"); uni.style.left=x+"rem";
    await wait(lauf*1000); F.zustand(uniSvg(),""); unidreh.classList.remove("links");
  }
  function fragend(){
    const head=uniSvg()?.querySelector(".head"); if(!head) return;
    head.animate([{transform:"rotate(0)"},{transform:"rotate(-16deg)"},{transform:"rotate(-16deg)"},{transform:"rotate(0)"}],{duration:1100,easing:"ease-in-out"});
  }

  // ---------- Aufgaben ----------
  const stufe = () => STUFEN[save.stufe];
  function plusPool(){
    const {max}=stufe(), out=[];
    for(let a=1;a<max;a++) for(let b=a+1;a+b<=max;b++){
      if(a+b>UEBERGANG_AB && (a%10)+(b%10)>=10) continue;
      out.push(a+"+"+b);
    }
    return out;
  }
  const minusPool = () => plusPool().flatMap(k=>{ const [a,b]=k.split("+").map(Number); return [`${a+b}-${b}`, `${a+b}-${a}`]; });
  // Nächste Aufgabe: zuerst fällige (niedriges Fach zuerst), sonst sichere; nichts doppelt in der Runde
  function waehleFakt(pool, schon){
    const frei=pool.filter(k=>!schon.has(k)), liste=frei.length?frei:pool;
    const due=shuffle(liste.filter(faellig)).sort((a,b)=>eintrag(a).f-eintrag(b).f);
    const sicher=shuffle(liste.filter(k=>!faellig(k)));
    if(due.length && (Math.random()<ANTEIL_FAELLIG || !sicher.length)){
      const unten=due.filter(k=>eintrag(k).f===eintrag(due[0]).f); return unten[Math.floor(Math.random()*unten.length)];
    }
    return sicher[0] || due[0];
  }
  const tripelZahlen = fakt => { if(fakt.includes("+")){ const [a,b]=fakt.split("+").map(Number); return [a,b,a+b]; } const [c,b]=fakt.split("-").map(Number); return [c-b,b,c]; };
  function tripel(nums){ const t=[]; for(let i=0;i<nums.length;i++) for(let j=i+1;j<nums.length;j++){ const k=nums.indexOf(nums[i]+nums[j]); if(k>=0) t.push([i,j,k]); } return t; }
  function baueBlume(fakt, n){
    const [a,b,c]=tripelZahlen(fakt), {max}=stufe();
    for(let t=0;t<2000;t++){
      const nums=[a,b,c]; let g=0;
      while(nums.length<n && g++<200){ const x=1+Math.floor(Math.random()*max); if(!nums.includes(x)) nums.push(x); }
      if(nums.length===n && tripel(nums).length===1) return shuffle(nums);
    }
    return n>3 ? baueBlume(fakt, n-1) : shuffle([a,b,c]);
  }
  const inStufe = () => save.verlauf.filter(e=>e.s===save.stufe);
  function istMinusDran(){
    if(!stufe().minus) return false;
    const ersteMinus = STUFEN.findIndex(s=>s.minus);
    if(save.stufe===ersteMinus && inStufe().filter(e=>e.m).length<MINUS_NUR) return true;
    return Math.random()<P_MINUS;
  }
  function pruefeAufstieg(){
    if(save.stufe>=STUFEN.length-1) return false;
    const v=inStufe().filter(e=>e.n===5);
    if(v.length<AUF_N) return false;
    const letzte=v.slice(-AUF_N);
    const quote=letzte.filter(e=>e.ok).length/AUF_N;
    const tageAnz=new Set(letzte.map(e=>e.d)).size;
    const jetzt=median(letzte.filter(e=>e.ok).map(e=>e.ms));
    const anfang=v.length>=2*AUF_N ? median(v.slice(0,AUF_N).filter(e=>e.ok).map(e=>e.ms)) : Infinity;
    return quote>=AUF_QUOTE && tageAnz>=AUF_TAGE && (jetzt<=stufe().schnell || jetzt<=AUF_FAKTOR*anfang);
  }

  // ---------- Montessori-Perlen ----------
  const PERLE = {1:"#E53935",2:"#43A047",3:"#F48FB1",4:"#FDD835",5:"#64B5F6",6:"#9C27B0",7:"#FFFFFF",8:"#8D6E63",9:"#1E3A8A",10:"#F9A825"};
  const zerlege = n => [...Array(Math.floor(n/10)).fill(10), ...(n%10 ? [n%10] : [])];   // 13 → 10er-Stab + 3er-Stab
  function stab(n){ const d=document.createElement("div"); d.className="stab"; d.style.setProperty("--c",PERLE[n]);
    for(let i=0;i<n;i++) d.appendChild(document.createElement("b")); return d; }
  function gruppe(n, zahl=true){
    const g=document.createElement("div"); g.className="gruppe";
    const st=document.createElement("div"); st.className="staebe"; zerlege(n).forEach(k=>st.appendChild(stab(k))); g.appendChild(st);
    if(zahl){ const z=document.createElement("div"); z.className="zahl"; z.textContent=n; g.appendChild(z); }
    return g;
  }
  function reihe(...gruppen){ const r=document.createElement("div"); r.className="perlreihe"; gruppen.forEach(g=>r.appendChild(g)); return r; }
  // Perlengröße so, dass die längste Reihe in die Breite passt
  function perlGroesse(feld, platzEl, n, maxRem){
    const rem=parseFloat(getComputedStyle(document.documentElement).fontSize)||10;
    const breit=(platzEl.clientWidth||460)/rem;
    feld.style.setProperty("--p", Math.min(maxRem, breit*0.9/(n*1.24))+"rem");
  }

  // Rechts neben der Blume (Fehler, Hilfe): oben die Teile, unten das Ganze. Minus (fort): oben das Ganze, die
  // weggenommenen Perlen heben sich ab, unten der Rest.
  async function punkte(x, y, {fort=false, ohneErgebnis=false}={}){
    const feld=$("feld"); feld.innerHTML=""; const s=x+y;
    perlGroesse(feld, document.querySelector(".rechnen"), s, 3);
    if(!fort){ feld.append(reihe(gruppe(x), gruppe(y))); if(!ohneErgebnis) feld.append(reihe(gruppe(s))); return; }
    const oben=reihe(gruppe(s)); feld.append(oben);
    await wait(400);
    [...oben.querySelectorAll("b")].slice(-y).forEach(b=>b.classList.add("fort"));
    if(ohneErgebnis) return;      // Denkhilfe: der Rest bleibt für das Kind
    await wait(400);
    feld.append(reihe(gruppe(x)));
  }

  // Lektion nach dem Lösen (die Pause): „Die 5 besteht aus einer 2 und einer 3“ – Stäbchen gleiten zusammen,
  // darunter wächst das Ganze gleich lang. Über 10 als Zehner + Rest (Zehnerübergang), Minus: Perlen gehen weg.
  async function lektion(x, y, minus){
    const L=$("lektion"), feld=$("lfeld"), s=x+y; feld.innerHTML="";
    const t0=Date.now();
    $("ltitel").textContent = minus ? `${s} − ${y} = ${x}` : `${x} + ${y} = ${s}`;
    L.classList.add("on");
    perlGroesse(feld, L, s, 4.6);
    const zehnUnd = s>10 && s%10 ? ` Das sind ${s<20?"zehn":Math.floor(s/10)*10} und ${s%10}.` : "";
    const glocke = i => tone(520+i*90, 700+i*90, .25, "sine", .05);
    if(!minus){
      const g1=gruppe(x), g2=gruppe(y), oben=reihe(g1,g2); feld.append(oben);
      g1.animate([{transform:"translateX(-24rem)",opacity:0},{transform:"none",opacity:1}],{duration:600,easing:"cubic-bezier(.2,.8,.3,1)",fill:"backwards"});
      g2.animate([{transform:"translateX(24rem)",opacity:0},{transform:"none",opacity:1}],{duration:600,easing:"cubic-bezier(.2,.8,.3,1)",fill:"backwards"});
      await wait(700);
      say(`${x} und ${y} sind zusammen ${s}.${zehnUnd}`);
      const unten=gruppe(s); feld.append(reihe(unten));
      const staebe=[...unten.querySelectorAll(".stab")], zahl=unten.querySelector(".zahl");
      staebe.forEach(st=>st.style.opacity=0); zahl.style.opacity=0;
      for(const [i,st] of staebe.entries()){
        st.style.opacity=1; glocke(i);
        st.animate([{transform:"scaleX(0)"},{transform:"none"}],{duration:300,easing:"ease-out"}).finished.catch(()=>{});
        st.style.transformOrigin="0 50%"; await wait(320);
      }
      zahl.style.transition="opacity .4s"; zahl.style.opacity=1;
    }else{
      const ganz=gruppe(s), oben=reihe(ganz); feld.append(oben);
      ganz.animate([{opacity:0},{opacity:1}],{duration:400,fill:"backwards"});
      await wait(600);
      say(`${s} weniger ${y} sind ${x}.`);
      const perlen=[...oben.querySelectorAll("b")].slice(-y).reverse();
      for(const b of perlen){ b.classList.add("fort"); await wait(Math.max(40, 400/y)); }
      await wait(300);
      const rest=gruppe(x); feld.append(reihe(rest)); glocke(0);
      rest.animate([{transform:"translateY(-3rem)",opacity:0},{transform:"none",opacity:1}],{duration:500,easing:"ease-out",fill:"backwards"});
    }
    await wait(Math.max(800, LEKTION_MS-(Date.now()-t0)));
    L.classList.remove("on"); await wait(350); feld.innerHTML="";
  }
  const leereFeld = () => { $("feld").innerHTML=""; };
  const zeile = html => { $("rechnung").innerHTML=html; };

  // ---------- Blume zeichnen ----------
  const blumeEl=$("blume");
  const BLATT = "M0 -24 C 40 -36, 52 -92, 0 -112 C -52 -92, -40 -36, 0 -24 Z";
  const KRANZ = "M0 -24 C 30 -40, 36 -78, 0 -94 C -36 -78, -30 -40, 0 -24 Z";
  function zeichneBlume(){
    const n=B.nums.length, farbe=BLATTFARBEN[Math.floor(Math.random()*BLATTFARBEN.length)];
    let blaetter="";
    B.nums.forEach((v,i)=>{
      const w=i*360/n;
      blaetter+=`<g class="blatt" data-i="${i}" style="--r:${w}deg;--farbe:${farbe}" role="button" aria-label="${v}">
        <g class="form"><path d="${BLATT}"/><text x="0" y="-70" transform="rotate(${-w} 0 -70)" font-size="${v>=100?33:42}">${v}</text></g></g>`;
    });
    // zweiter Kranz dahinter (nicht antippbar), damit die Blume voll aussieht
    let kranz="";
    for(let i=0;i<n;i++){ const w=(i+.5)*360/n; kranz+=`<path d="${KRANZ}" transform="rotate(${w})" fill="${farbe}" stroke="#3B2A6B" stroke-width="3" style="filter:brightness(.9)"/>`; }
    blumeEl.innerHTML=`<svg viewBox="-116 -116 232 334" aria-label="Blume">
      <path d="M0 30 C -6 90, 8 150, 0 214" fill="none" stroke="#3B2A6B" stroke-width="13" stroke-linecap="round"/>
      <path d="M0 30 C -6 90, 8 150, 0 214" fill="none" stroke="#7CC66E" stroke-width="7" stroke-linecap="round"/>
      <path d="M2 150 C 22 120, 52 116, 66 122 C 56 148, 30 160, 2 150Z" fill="#9EDB8A" stroke="#3B2A6B" stroke-width="3.2"/>
      <path d="M0 178 C -20 152, -50 148, -64 154 C -54 178, -28 188, 0 178Z" fill="#9EDB8A" stroke="#3B2A6B" stroke-width="3.2"/>
      <g class="kranz">${kranz}</g>
      ${blaetter}
      <circle r="31" fill="#FFE58F" stroke="#3B2A6B" stroke-width="3.6"/>
      <circle cx="-9" cy="-11" r="7" fill="#fff" opacity=".6"/>
      <text class="mitte-zeichen" y="2">${B.minus?"−":"+"}</text>
    </svg>`;
    B.el=[...blumeEl.querySelectorAll(".blatt")];
    B.el.forEach((g,i)=>g.addEventListener("click",()=>tipp(i)));
  }
  function zeigeZustand(){
    B.el.forEach((g,i)=>{
      g.classList.toggle("start", i===B.start);
      g.classList.toggle("partner", i===B.partner);
      g.classList.toggle("welk", B.start!=null && i!==B.start && i!==B.partner && B.probiert.has(paar(B.start,i)));
    });
  }
  function wackel(i){ const g=B.el[i]; g.classList.remove("wackel"); void g.getBoundingClientRect(); g.classList.add("wackel"); setTimeout(()=>g.classList.remove("wackel"),500); }

  // ---------- Zustand einer Blume ----------
  // nums: Zahlen der Blätter; loes: [i,j,k] mit nums[i]+nums[j]=nums[k]; start/partner: Indizes oder null;
  // probiert: Paare "i-j", die das Kind schon gedacht hat; fehler: verpasste Lösungs-Paare; hilfe: Stufe 0–3
  let B=null, busy=true, rundeIdx=0, schon=new Set(), wieder=[], rundenFakten=[];
  const paar = (i,j) => i<j ? i+"-"+j : j+"-"+i;
  // „Entscheidendes“ Paar: Plus = die zwei Teile, Minus = das Ganze mit einem Teil. Wer es verlässt, ohne die dritte Zahl
  // anzutippen, hat die Lösung übersehen – das ist der einzige Fehler.
  function entscheidend(i,j){
    const [a,b,c]=B.loes, s=new Set([i,j]);
    if(!B.minus) return s.has(a)&&s.has(b);
    return s.has(c) && (s.has(a)||s.has(b));
  }
  const istLoesung = (i,j,k) => { const s=new Set([i,j,k]); return s.size===3 && B.loes.every(x=>s.has(x)); };
  function paarText(i,j){
    const x=B.nums[i], y=B.nums[j];
    return B.minus ? `${Math.max(x,y)} − ${Math.min(x,y)}` : `${x} + ${y}`;
  }
  const paarWert = (i,j) => B.minus ? Math.abs(B.nums[i]-B.nums[j]) : B.nums[i]+B.nums[j];

  function neueBlume(){
    const minus=istMinusDran();
    let fakt;
    const w=wieder.findIndex(x=>x.ab<=rundeIdx || rundeIdx>=RUNDE);
    if(w>=0){ fakt=wieder[w].fakt; wieder.splice(w,1); }
    else fakt=waehleFakt(minus?minusPool():plusPool(), schon);
    schon.add(fakt);
    const n = inStufe().length<EINSTIEG ? 4 : 5;
    const nums=baueBlume(fakt, n);
    const [ti,tj,tk]=tripel(nums)[0];
    B={fakt, minus:fakt.includes("-"), nums, loes:[ti,tj,tk], start:null, partner:null, probiert:new Set(), fehler:0, hilfe:0, nach:null, t0:0,
       anleitung: save.anleitung<ANLEITUNG, minusNeu: fakt.includes("-") && save.minusAnleitung<1};
    zeichneBlume(); zeigeZustand(); zeile(""); leereFeld();
    $("hilfe").classList.remove("aus");
  }
  function ansageStart(){
    // Nur Neues wird angesagt: die erste Minus-Blume überhaupt
    if(B.minusNeu) sag("In der Mitte steht jetzt Minus.");
    else $("blase").textContent="";
  }

  // ---------- Tippen ----------
  function tipp(i){
    if(busy || !B) return;
    if(B.nach) return nachtippen(i);
    const {start:A, partner:P}=B;
    if(A==null){ B.start=i; sfx.tipp(); zeigeZustand(); nachStart(); return; }
    if(P==null){
      if(i===A){ B.start=null; sfx.tipp(); zeigeZustand(); return; }               // Start loslassen
      if(B.probiert.has(paar(A,i))){ B.start=i; sfx.tipp(); zeigeZustand(); nachStart(); return; }  // schon probiert → neue Idee
      return waehlePartner(i);
    }
    // Start und Partner gewählt: dritte Zahl
    if(i!==A && i!==P && istLoesung(A,P,i)) return geloest();
    if(entscheidend(A,P)) return verpasst(i);
    // Falsche dritte Zahl bei einem anderen Paar: klar benennen (Rechnung in der Blase), Paar welkt, zählt mit (Raten)
    B.probiert.add(paar(A,P)); B.partner=null; sfx.hm(); leereFeld(); sag(`${paarText(A,P)} = ${paarWert(A,P)}`);
    if(i===A){ B.start=null; zeigeZustand(); zeile(""); return; }
    if(i===P){ zeigeZustand(); zeile(""); anleitungWelk(A,P); return; }
    if(B.probiert.has(paar(A,i))){ B.start=i; zeigeZustand(); zeile(""); nachStart(); return; }
    waehlePartner(i);
    anleitungWelk(A,P);
  }
  function nachStart(){
    zeile(""); leereFeld();
  }
  function waehlePartner(i){
    B.partner=i; sfx.paar(); zeigeZustand(); leereFeld();
    zeile(`${paarText(B.start,i)} = <span class="fr">?</span>`);
  }
  function anleitungWelk(A,P){
    if(!save.welkErklaert){ save.welkErklaert=1; persist(); sag(`Die blassen Blätter hast du mit der ${B.nums[A]} schon probiert.`); }
  }

  // Fehler-Leiter beim entscheidenden Paar: 1. nur Signal, 2. Denkhilfe (Probe, ohne Ergebnis), 3. Lösung mit Begründung
  async function verpasst(i){
    const A=B.start, P=B.partner;
    B.fehler++; busy=true; sfx.hm(); fragend(); if(i!==A && i!==P) wackel(i);
    if(B.fehler===1){ sag("Das stimmt nicht. Probier noch mal."); await wait(700); busy=false; return; }
    if(B.fehler===2){
      if(B.minus){ const g=Math.max(B.nums[A],B.nums[P]), t=Math.min(B.nums[A],B.nums[P]); await punkte(g-t, t, {fort:true, ohneErgebnis:true}); sag("Nimm die Perlen weg. Wie viele bleiben?"); }
      else{ await punkte(B.nums[A], B.nums[P], {ohneErgebnis:true}); sag("Leg die Perlen zusammen. Welche Zahl ist es?"); }
      busy=false; return;
    }
    await loesungZeigen();
  }

  // Lösung zeigen und gesprochen begründen; das Kind tippt sie danach selbst nach (zählt nicht als gekonnt)
  async function loesungZeigen(){
    busy=true; $("hilfe").classList.add("aus"); B.loesungGezeigt=true;
    const [a,b,c]=B.loes;
    const folge = B.minus ? [c,b,a] : [a,b,c];
    const text = B.minus ? `${B.nums[c]} − ${B.nums[b]} = ${B.nums[a]}` : `${B.nums[a]} + ${B.nums[b]} = ${B.nums[c]}`;
    const grund = B.minus ? `${B.nums[c]} weniger ${B.nums[b]} sind ${B.nums[a]}.` : `${B.nums[a]} und ${B.nums[b]} sind zusammen ${B.nums[c]}.`;
    B.start=null; B.partner=null; zeigeZustand(); zeile(""); leereFeld();
    sag(`Schau: ${text}. Tipp es nach!`); say(`${grund} Tipp es nach.`);
    for(const i of folge){ B.el[i].classList.add("zeig"); await wait(600); }
    zeile(text);
    await punkte(B.nums[a], B.nums[b], {fort:B.minus});
    await wait(900); B.el.forEach(e=>e.classList.remove("zeig")); zeile(""); leereFeld();
    B.nach={folge, schritt:0}; B.el[folge[0]].classList.add("zeig"); busy=false;
  }

  // ---------- Hilfe-Knopf: 1. Strategie, 2. ein Teil leuchtet, 3. Lösung zum Nachtippen ----------
  $("hilfe").addEventListener("click", ()=>{
    if(busy || !B || B.nach) return;
    sfx.tipp(); B.hilfe++;
    const c=B.loes[2];
    if(B.hilfe===1){
      if(B.minus) sag("Nimm eine große Zahl. Was bleibt, wenn eine kleinere weggeht?");
      else sag("Das Ergebnis ist größer als die zwei Teile.");
    }else if(B.hilfe===2){
      if(B.minus){ B.start=c; B.partner=null; zeigeZustand(); zeile(""); leereFeld(); }
      B.el[c].classList.add("zeig");   // leuchtet, bis die Blume gelöst ist
      sag(B.minus?`Fang bei der ${B.nums[c]} an.`:`Das Ergebnis ist ${B.nums[c]}. Welche zwei passen?`);
    }else loesungZeigen();
  });
  function nachtippen(i){
    const N=B.nach, soll=N.folge[N.schritt];
    if(i!==soll){ wackel(i); return; }
    sfx.tipp(); B.el[i].classList.remove("zeig");
    if(N.schritt===0){ B.start=i; zeigeZustand(); }
    if(N.schritt===1){ B.partner=i; zeigeZustand(); zeile(`${paarText(N.folge[0],i)} = <span class="fr">?</span>`); }
    N.schritt++;
    if(N.schritt>=N.folge.length){ B.nach=null; return geloest(); }
    B.el[N.folge[N.schritt]].classList.add("zeig");
  }

  // ---------- Gelöst: Rechnung, Punkte, Einhorn frisst die Blume, eine neue wächst ----------
  async function geloest(){
    busy=true; $("hilfe").classList.add("aus");
    const [a,b,c]=B.loes, x=B.nums[a], y=B.nums[b];
    const ok=B.fehler===0 && B.hilfe===0 && B.probiert.size<RATEN_AB, ms=Date.now()-B.t0;
    record(B.fakt, ok);
    if(!ok && wieder.length<WIEDER_MAX && !wieder.some(w=>w.fakt===B.fakt) && !rundenFakten.includes(B.fakt+"#w")){ wieder.push({fakt:B.fakt, ab:rundeIdx+1+WIEDER_NACH}); rundenFakten.push(B.fakt+"#w"); }
    save.verlauf.push({d:heute(), s:save.stufe, n:B.nums.length, m:B.minus?1:0, ms, ok:ok?1:0}); if(save.verlauf.length>300) save.verlauf.shift();
    if(B.anleitung) save.anleitung++;
    if(B.minusNeu) save.minusAnleitung++;
    B.start=null; B.partner=null; B.probiert.clear(); zeigeZustand();
    [a,b,c].forEach(i=>B.el[i].classList.add("zeig"));
    const text = B.minus ? `${x+y} − ${B.nums[b]} = ${x}` : `${x} + ${y} = ${x+y}`;
    zeile(text); sag(text);
    sfx.geloest();
    F.hop(uniSvg(), {hoehe:50, dauer:650, mal:1});
    leereFeld();
    await wait(600);
    // Einhorn läuft zur Blume, die Blume neigt sich herunter, das Einhorn frisst sie (zusammen ca. 2 s)
    const lernen = !ok && !B.loesungGezeigt;   // Lektion nur nach Fehler/Hilfe/Raten; nach gezeigter Lösung wäre sie doppelt
    B.el.forEach(e=>e.classList.remove("zeig"));
    blumeEl.classList.add("klein");
    await laufe(70, {lauf:.5});
    F.zustand(uniSvg(),"frisst"); sfx.happs();
    for(const g of shuffle([...B.el, ...blumeEl.querySelectorAll(".kranz path")])){ g.classList.add("gegessen"); await wait(45); }   // Blatt für Blatt wegknabbern
    blumeEl.classList.add("weg");
    await wait(250);
    F.zustand(uniSvg(),"");
    save.wiese++;
    if(pruefeAufstieg()) save.stufe++;
    persist();
    zeichneWiese(true);
    rundeIdx++; zeigePunkte();
    zeile(""); leereFeld(); $("blase").textContent="";
    await laufe(UNI_HEIM, {lauf:.5});
    blumeEl.innerHTML=""; blumeEl.className="blume";
    if(lernen) await lektion(x, y, B.minus);   // Perlen: was sie gerade herausgefunden hat
    if(rundeIdx>=RUNDE && (wieder.length===0 || rundeIdx>=RUNDE+WIEDER_MAX)) return schlafpause();
    await wachse();
  }
  // Neue Blume wächst aus dem Boden
  async function wachse(){
    neueBlume();
    blumeEl.className="blume keim"; void blumeEl.offsetWidth;
    blumeEl.className="blume"; sfx.wachsen();
    await wait(650);
    B.t0=Date.now(); busy=false; ansageStart();
  }
  function zeigePunkte(){ $("punkte").innerHTML=Array.from({length:Math.max(RUNDE, rundeIdx+wieder.length)},(_,i)=>`<i${i<rundeIdx?' class="da"':""}>${F.svgDing("blume").replace('fill="#FF9ECF"', `fill="${BLUMENFARBEN[i%BLUMENFARBEN.length]}"`)}</i>`).join(""); }

  // ---------- Runde und Schlafpause ----------
  async function runde(){
    rundeIdx=0; schon=new Set(); wieder=[]; rundenFakten=[];
    zeigePunkte(); zeichneWiese();
    await wachse();
  }
  async function schlafpause(){
    busy=true; save.runden++; persist();
    $("hilfe").classList.add("aus");
    await laufe(88, {lauf:1.8});
    F.zustand(uniSvg(),"schlaeft");
    sag("Das Einhorn ist satt und schläft ein bisschen.");
    await wait(PAUSE_MS);
    F.zustand(uniSvg(),"");
    $("blase").textContent="";
    await laufe(UNI_HEIM, {lauf:1.8});
    await runde();
  }

  // ---------- Elternansicht (?eltern, aus dem Elternbereich) ----------
  function eltern(){
    const el=$("eltern"); el.classList.add("on");
    const st=stufe(), v=inStufe(), v5=v.filter(e=>e.n===5), letzte=v5.slice(-AUF_N);
    const sek = ms => isFinite(ms) ? (ms/1000).toFixed(1)+" s" : "–";
    const liste=Object.entries(save.fakten).sort((a,b)=>a[1].f-b[1].f || a[0].localeCompare(b[0],undefined,{numeric:true}));
    el.innerHTML=`<h1>Lernstand Zahlenzauber</h1>
      <p>Stufe ${esc(save.stufe+1)} von ${STUFEN.length}: bis ${st.max}${st.minus?" mit Minus":""} · ${v.length} Blumen in dieser Stufe (davon ${v.filter(e=>e.m).length} Minus) · ${esc(save.runden)} Runden · ${esc(save.wiese)} Blumen gesamt</p>
      <h2>Aufstieg in die nächste Stufe</h2>
      <p>Letzte ${letzte.length} Blumen mit 5 Blättern: ${letzte.filter(e=>e.ok).length} ohne Fehler und Hilfe (nötig ${Math.ceil(AUF_N*AUF_QUOTE)} von ${AUF_N}),
        an ${new Set(letzte.map(e=>e.d)).size} Tagen (nötig ${AUF_TAGE}). Zeit (Median) jetzt ${sek(median(letzte.filter(e=>e.ok).map(e=>e.ms)))},
        am Anfang der Stufe ${sek(median(v5.slice(0,AUF_N).filter(e=>e.ok).map(e=>e.ms)))}. Schnell genug: ≤ ${sek(st.schnell)} oder ${Math.round((1-AUF_FAKTOR)*100)} % schneller als am Anfang.</p>
      <p><button class="knopf" id="stufeMinus">Stufe −</button><button class="knopf" id="stufePlus">Stufe +</button><a class="knopf" href="index.html">Zur Übersicht</a></p>
      <h2>Aufgaben (Fach 0 = wackelt, ab Fach ${GELERNT} gelernt)</h2>
      <ul>${liste.map(([k,e])=>`<li>${esc(k.replace("-"," − ").replace("+"," + "))} <small>· Fach ${esc(e.f)}${e.t?" seit "+esc(e.t):""}${faellig(k)&&e.f<GELERNT?" · fällig":""} · ${(Array.isArray(e.h)?e.h:[]).map(x=>x?"richtig":"falsch").join(", ")}</small></li>`).join("") || "<li>Noch nichts gespielt.</li>"}</ul>`;
    $("stufeMinus").onclick=()=>{ save.stufe=Math.max(0,save.stufe-1); persist(); eltern(); };
    $("stufePlus").onclick=()=>{ save.stufe=Math.min(STUFEN.length-1,save.stufe+1); persist(); eltern(); };
  }

  uni.style.left=UNI_HEIM+"rem";
  if(params.has("eltern")) eltern();
  else runde();   // direkt los, ohne Startbildschirm
})();
</script>
</body>
</html>
