<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verwaltung Lernen Spielen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%232f6f8f%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/seite/stil.css">
</head>
<body>
<header class="kopf">
  <h1>Verwaltung</h1>
  <nav class="reiter" role="tablist">
    <button role="tab" data-reiter="spiele" aria-selected="true">Spiele</button>
    <button role="tab" data-reiter="bibliothek">Bibliothek</button>
    <button role="tab" data-reiter="lernweg">Lernweg</button>
    <button role="tab" data-reiter="auftraege">Aufträge <span id="zahl-offen" class="zahl"></span></button>
    <button role="tab" data-reiter="ideen">Ideen <span id="zahl-ideen" class="zahl"></span></button>
    <button role="tab" data-reiter="proben">Proben <span id="zahl-proben" class="zahl"></span></button>
    <button role="tab" data-reiter="kosten">Kosten</button>
  </nav>
  <a class="app-link" href="/spiele/" target="_blank" rel="noopener">App öffnen ↗</a>
  <div id="summe" class="summe"></div>
</header>

<section class="filter" id="filter">
  <label>Fach <select id="f-fach"><option value="">alle</option></select></label>
  <label>Klasse <select id="f-klasse"><option value="">alle</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
  <div class="umschalter" role="group" aria-label="Anzeige">
    <button data-luecken="0" aria-pressed="true">alles</button>
    <button data-luecken="1" aria-pressed="false">nur Lücken</button>
  </div>
  <label class="suche">Suche <input id="f-suche" type="search" placeholder="Name oder Id"></label>
  <button id="alle-auf" class="leise">alles ausklappen</button>
  <button id="alle-zu" class="leise">alles zuklappen</button>
</section>

<main>
  <div id="hinweis"></div>
  <section id="spiele" class="ansicht"></section>
  <section id="bibliothek" class="ansicht" hidden></section>
  <section id="lernweg" class="ansicht" hidden>
    <div class="lw-leiste" id="lw-leiste"></div>
    <div class="lw-flaeche" id="lw-flaeche">
      <svg id="lw-svg" role="img" aria-label="Lernweg: Lernthemen mit ihren Voraussetzungen">
        <defs><marker id="lw-pfeil" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" class="lw-spitze"/></marker></defs>
        <g id="lw-blick"></g>
      </svg>
      <aside id="lw-feld" class="lw-feld" hidden></aside>
    </div>
  </section>
  <section id="auftraege" class="ansicht" hidden></section>
  <section id="ideen" class="ansicht" hidden></section>
  <section id="proben" class="ansicht" hidden></section>
  <section id="kosten" class="ansicht" hidden></section>
</main>

<dialog id="antworten">
  <form method="dialog">
    <h2>Antworten</h2>
    <p id="a-frage" class="leise-text"></p>
    <textarea id="a-text" rows="5" cols="60" maxlength="4000" placeholder="Deine Antwort …"></textarea>
    <p class="leise-text">Kommt als Folgeauftrag in die Warteschlange (ca. 2 €), startet erst mit „Warteschlange abarbeiten“.</p>
    <menu>
      <button value="nein">Abbrechen</button>
      <button value="ja" class="haupt">In die Warteschlange</button>
    </menu>
  </form>
</dialog>
<dialog id="rueckmelden" class="breit">
  <form method="dialog">
    <h2 id="r-titel">Rückmeldung</h2>
    <textarea id="r-text" rows="8" maxlength="4000" placeholder="Was soll anders werden? Ein Punkt je Zeile – so genau wie möglich (wo, wann, was du erwartet hättest)."></textarea>
    <p id="r-wohin" class="leise-text"></p>
    <div id="r-verlauf"></div>
    <menu>
      <button value="nein">Abbrechen</button>
      <button value="ja" class="haupt">Rückmeldung senden</button>
    </menu>
  </form>
</dialog>
<dialog id="bestaetigen">
  <form method="dialog">
    <h2>Auftrag anlegen</h2>
    <p id="b-text"></p>
    <p id="b-schaetzung" class="leise-text"></p>
    <menu>
      <button value="nein">Abbrechen</button>
      <button value="ja" class="haupt">In die Warteschlange</button>
    </menu>
  </form>
</dialog>

<script type="module" src="/seite/app.js"></script>
</body>
</html>
